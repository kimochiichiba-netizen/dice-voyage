<style>
/* ══════════════════════════════════════════════════════════════
   ダイスキングダム — 演出デザインの土台（1k-fx.html / WP0）
   ──────────────────────────────────────────────────────────────
   ・トークン（色・時間・イージング）、共通 keyframe、部品クラス（.fx-*）。
   ・動かしてよいのは transform と opacity だけ。入場 keyframe の 0% で opacity を下げない
     （scale は .85 以上、移動は 40px 以内）。opacity→0 は退場の時だけ。
   ・入場は「画面が変わった時だけ」（9-fx.js の fxEnter が .screen に .fx-in を付ける）。
     作り直しのたびに全部が再入場してガタつく、を止める。
   ══════════════════════════════════════════════════════════════ */
:root{
  /* 金属・木・羊皮紙 */
  --fx-gold-metal:linear-gradient(152deg,#FFF7DC 0%,#F0CE72 14%,#C8952F 30%,#7C5410 46%,#A8752A 58%,#F3D583 76%,#8A6314 90%,#FFF3C8 100%);
  --fx-gold-face:linear-gradient(180deg,var(--dk-g1) 0 8%,var(--dk-g2) 30%,var(--dk-g3) 70%,var(--dk-g4));
  --fx-wood:linear-gradient(180deg,#4A3517,#2A1C08 56%,#1A1004);
  --fx-wood-lite:linear-gradient(180deg,#6E5326,#3E2C11 52%,#271A07);
  --fx-parch:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.5),transparent 58%),linear-gradient(180deg,var(--dk-p1),var(--dk-p2) 46%,var(--dk-p3));
  /* 宝石 */
  --fx-ruby:#C9302C;  --fx-ruby-hi:#FF6A5E;
  --fx-sapph:#2E8BE0; --fx-sapph-hi:#8FD2FF;
  --fx-emer:#5FBF3A;  --fx-emer-hi:#A8E877;
  /* 光 */
  --fx-glow-gold:rgba(255,200,80,.62);
  --fx-glow-sapph:rgba(90,180,255,.58);
  --fx-glow-ruby:rgba(255,90,60,.55);
  /* 文字 */
  --fx-ink:#FFF6E2; --fx-ink-edge:#2A1604; --fx-ink-gold:#FFD44A;
  /* 等級 */
  --fx-rarA:#6FB8F5; --fx-rarS:#B07CE8; --fx-rarSS:#FFD24D;
  /* 時間 */
  --fx-t-press:90ms;  --fx-t-release:220ms; --fx-t-hover:160ms;
  --fx-t-pop:320ms;   --fx-t-modal:420ms;   --fx-t-out:170ms;
  --fx-t-enter:460ms; --fx-t-hero:620ms;    --fx-t-count:800ms;
  --fx-step:45ms;     --fx-step-card:70ms;  --fx-step-hero:90ms;
  /* イージング */
  --fx-out:cubic-bezier(.16,1,.3,1);
  --fx-emph:cubic-bezier(.05,.7,.1,1);
  --fx-in:cubic-bezier(.4,0,1,1);
  --fx-back:cubic-bezier(.34,1.56,.64,1);
  --fx-spring:cubic-bezier(.2,1.5,.4,1);
  --fx-inout:cubic-bezier(.65,0,.35,1);
}

/* ══════════ 共通 keyframes（入場は from だけ書く＝終わりは要素のもともとの transform に戻る） ══════════ */
@keyframes fxRise   {from{transform:translateY(22px) scale(.96)}}
@keyframes fxRiseL  {from{transform:translateX(-34px) scale(.94)}}
@keyframes fxRiseR  {from{transform:translateX(34px) scale(.94)}}
@keyframes fxPop    {0%{transform:scale(.86)}62%{transform:scale(1.05)}82%{transform:scale(.985)}}
@keyframes fxPopBig {0%{transform:scale(1.6)}55%{transform:scale(.94)}}
@keyframes fxBump   {35%{transform:scale(1.22)}}
@keyframes fxSelPop {0%{transform:scale(.94)}60%{transform:scale(1.04)}}
@keyframes fxShine  {0%,72%{transform:translateX(-160%) skewX(-18deg)}92%,100%{transform:translateX(360%) skewX(-18deg)}}
@keyframes fxBreath {0%,100%{opacity:.42}50%{opacity:1}}
@keyframes fxSpin   {to{transform:rotate(360deg)}}
@keyframes fxFloat  {0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fxMote   {0%{transform:translate(0,0) scale(0)}12%{transform:translate(4px,-14px) scale(1)}
                     85%{transform:translate(-6px,-104px) scale(.8)}100%{transform:translate(0,-120px) scale(0)}}
@keyframes fxDrift  {0%,100%{transform:translate(-4%,-2%) scale(1)}50%{transform:translate(5%,3%) scale(1.12)}}
@keyframes fxOut    {to{transform:scale(.92);opacity:0}}
@keyframes fxShake  {0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}
                     60%{transform:translate(-4px,1px)}80%{transform:translate(3px,-1px)}}
@keyframes fxDeal   {from{transform:translateY(40px) rotate(-4deg) scale(.9)}}
@keyframes fxHeroIn {from{transform:translateY(30px) scale(.9)}}
@keyframes fxBarIn  {from{transform:scaleX(.85)}}
@keyframes fxStamp  {0%{transform:scale(2.2) rotate(-18deg)}60%{transform:scale(.92) rotate(-12deg)}100%{transform:scale(1) rotate(-12deg)}}

/* §10 WP0 担当の既存 keyframe を transform だけの形に定義し直す（後勝ち） */
@keyframes toastIn   {from{transform:translateX(-38px)}}
@keyframes toastInR  {from{transform:translateX(38px)}}
@keyframes modalIn   {0%{transform:scale(.86)}60%{transform:scale(1.04)}}
@keyframes dkTabIn   {from{transform:translateX(-30px) scale(.9)}}
@keyframes dkTabInR  {from{transform:translateX(30px) scale(.9)}}
@keyframes dkBodyIn  {from{transform:translateY(26px)}}
@keyframes dkSpark   {0%,100%{transform:scale(0)}40%{transform:scale(1.25)}70%{transform:scale(.7)}}
@keyframes dkQIn     {from{transform:translateX(22px)}}
@keyframes dkScreenIn{from{transform:scale(.985)}}

/* ══════════ 無条件の入場アニメを止める（作り直しのたびに再生していた） ══════════ */
.dk.dkGo,
.screen .dktab,.screen .dktab.on,.screen .dkrb,.screen .dkbody,.screen .dkhome,
.screen .dkq,.screen .dkrk,.screen .dkgood,.screen .dkday,.screen .dkday.now,
.screen.on > .inner,.screen.on > .wrap,.screen.on .tabs,.screen.on .wallet,
.cardgrid .minicard,.pendgrid .pend,#pick .grid .chcard{animation:none!important}

/* 画面が変わった時だけ入場する（[data-fx] の値で動きを選ぶ。--fx-d は JS が入れる遅れ） */
.screen.fx-in [data-fx]:not([data-fx="none"]){
  animation:var(--fx-anim,fxRise) var(--fx-dur,460ms) var(--fx-ease,cubic-bezier(.16,1,.3,1))
            calc(var(--fx-d,0ms) + 40ms) both!important}
[data-fx="riseL"]{--fx-anim:fxRiseL}
[data-fx="riseR"]{--fx-anim:fxRiseR}
[data-fx="pop"]{--fx-anim:fxPop;--fx-dur:320ms}
[data-fx="popBig"]{--fx-anim:fxPopBig;--fx-dur:420ms;--fx-ease:cubic-bezier(.2,1.5,.4,1)}
[data-fx="deal"]{--fx-anim:fxDeal}
[data-fx="hero"]{--fx-anim:fxHeroIn;--fx-dur:620ms;--fx-ease:cubic-bezier(.05,.7,.1,1)}
.screen.fx-in .dkbar i{transform-origin:left center;animation:fxBarIn 720ms var(--fx-out) both}

/* ══════════ トースト（下のボタンを塞がない） ══════════ */
.toast,#toastL,#toastR{pointer-events:none}
.toast{background:linear-gradient(180deg,rgba(40,28,12,.95),rgba(16,10,4,.95));border:2px solid #A9761A;
  box-shadow:0 6px 18px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,220,150,.25);animation:fxToastL 320ms linear both}
#toastR .toast{animation-name:fxToastR}
.toast .ic{animation:fxPop 300ms var(--fx-spring) 80ms both;border-color:#F2C230;
  background:linear-gradient(155deg,#5A4220,#1A1004)}
.toast .tx{overflow:hidden}
.toast .tx b{font-size:20px;color:#FFD44A;overflow:hidden;text-overflow:ellipsis}
.toast .tx i{font-size:16px;color:#F0DCA8;overflow:hidden;text-overflow:ellipsis}
#toastL .toast.out{animation:fxToastOut 170ms var(--fx-in) both}
#toastR .toast.out{animation:fxToastOutR 170ms var(--fx-in) both}
@keyframes fxToastL{0%{transform:translateX(-40px) scale(.92)}70%{transform:translateX(6px) scale(1.01)}100%{transform:none}}
@keyframes fxToastR{0%{transform:translateX(40px) scale(.92)}70%{transform:translateX(-6px) scale(1.01)}100%{transform:none}}
@keyframes fxToastOut{to{transform:translateX(-24px);opacity:0}}
@keyframes fxToastOutR{to{transform:translateX(24px);opacity:0}}

/* ══════════ モーダル（暗幕は放射状・blur なし、スプリング入場、170ms 退場） ══════════ */
#modalWrap .backdrop{-webkit-backdrop-filter:none;backdrop-filter:none;
  background:radial-gradient(80% 70% at 50% 45%,rgba(10,6,2,.45),rgba(4,2,0,.82))}
.modal{animation:fxModalIn var(--fx-t-modal) linear both}
@keyframes fxModalIn{0%{transform:translateY(24px) scale(.86)}55%{transform:translateY(-4px) scale(1.05)}
  78%{transform:scale(.985)}100%{transform:none}}
#modalWrap.fx-closing .modal,#modalWrap.fx-closing .backdrop{animation:fxOut var(--fx-t-out) var(--fx-in) both}
#modalWrap.fx-closing{pointer-events:none}
.modal .dhd,.modal h3{animation:fxRise 360ms var(--fx-out) 60ms both}
.modal .btnrow,.modal .btns{animation:fxRise 360ms var(--fx-out) 140ms both}
.modal .reward .it{animation:fxPop 380ms var(--fx-spring) both}
.modal .reward .it:nth-child(2){animation-delay:.08s}
.modal .reward .it:nth-child(3){animation-delay:.16s}
.modal .reward .it:nth-child(4){animation-delay:.24s}

/* ══════════ ボタン（押した時のスプリング・ツヤ・金枠の光） ══════════ */
.btn:active::before{animation:none}                 /* 1d-polish の width/height 波紋を止める */
.dkbtn,.btn,.dkback,.dkclose,.dkic,.dkplus,.dktab,.dkrb,.dkitem,.dkstabs .s,.dktab2 .t{
  transition:transform var(--fx-t-release) var(--fx-back)}
.dkbtn:active,.btn:active,.dkback:active,.dkclose:active,.dkic:active,.dkplus:active,
.dkrb:active,.dkitem:active,.dkstabs .s:active,.dktab:active{
  transform:translateY(3px) scale(.97);
  transition-duration:var(--fx-t-press);transition-timing-function:var(--fx-out)}
.dkbtn.gy:active,.dkbtn:disabled:active,.btn:disabled:active{transform:none}
.dkbtn.gd{box-shadow:0 5px 0 rgba(0,0,0,.42),inset 0 2px 0 rgba(255,255,255,.45),0 0 14px rgba(255,200,80,.38)}
.dkbtn.gr{box-shadow:0 5px 0 rgba(0,0,0,.42),inset 0 2px 0 rgba(255,255,255,.45),0 0 12px rgba(140,230,90,.3)}
.dkrb::before,.dktab::before{content:"";position:absolute;left:4px;right:4px;top:3px;height:38%;
  border-radius:12px 12px 40% 40%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,240,200,.2),rgba(255,240,200,0))}
.dkitem:hover,.dkrb:hover,.dktab:hover{border-color:#C8952F}
/* 波紋（9-fx.js が押した場所に出す） */
.fx-riphost{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:3}
.fx-rip{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 70%);
  transform:scale(.1);animation:fxRipA 420ms var(--fx-out) forwards}
@keyframes fxRipA{0%{transform:scale(.1);opacity:.5}100%{transform:scale(2.4);opacity:0}}

/* ══════════ 部品：パネル ══════════ */
.fx-panel{position:relative;border-radius:16px;
  background:linear-gradient(180deg,rgba(52,36,16,.95),rgba(20,12,4,.97)) padding-box,var(--fx-gold-metal) border-box;
  border:4px solid transparent;
  box-shadow:0 8px 0 rgba(0,0,0,.35),0 16px 34px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,220,150,.22),inset 0 0 40px rgba(0,0,0,.55)}
.fx-panel::before{content:"";position:absolute;inset:6px;border-radius:10px;pointer-events:none;border:1px solid rgba(196,150,70,.34)}
/* 羊皮紙は fx-panel fx-parch（.parch とぶつけない。WP9#1） */
.fx-panel.fx-parch{background:var(--fx-parch) padding-box,var(--fx-gold-metal) border-box;color:#42300F;
  box-shadow:0 8px 0 rgba(0,0,0,.3),0 16px 34px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.4),inset 0 -10px 24px rgba(150,116,64,.28)}
.fx-panel.fx-parch::before{border-color:rgba(140,106,54,.4)}
.fx-rivets{background-image:
  radial-gradient(circle at 12px 12px,#FFF0BE 0 2px,#8A6314 3px,transparent 4.5px),
  radial-gradient(circle at calc(100% - 12px) 12px,#FFF0BE 0 2px,#8A6314 3px,transparent 4.5px),
  radial-gradient(circle at 12px calc(100% - 12px),#FFF0BE 0 2px,#8A6314 3px,transparent 4.5px),
  radial-gradient(circle at calc(100% - 12px) calc(100% - 12px),#FFF0BE 0 2px,#8A6314 3px,transparent 4.5px)}
.fx-panel .fx-edge,.fx-edge{position:absolute;left:0;right:0;top:-4px;height:4px;overflow:hidden;border-radius:16px 16px 0 0;pointer-events:none}
.fx-edge::after{content:"";position:absolute;top:0;bottom:0;width:30%;
  background:linear-gradient(90deg,transparent,#FFFBE8,transparent);animation:fxShine 5.2s ease-in-out infinite}

/* ══════════ 部品：リボン見出し・金の帯 ══════════ */
.fx-ribbon{position:relative;display:inline-flex;align-items:center;justify-content:center;
  height:58px;padding:0 64px;margin:0 auto;
  background:linear-gradient(180deg,#F0604A 0 10%,#C9302C 45%,#8E1410);
  clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
.fx-ribbon.red{background:linear-gradient(180deg,#F0604A 0 10%,#C9302C 45%,#8E1410)}
.fx-ribbon.gold{background:linear-gradient(180deg,#FFF3C8 0 10%,#F2C230 45%,#A9761A)}
.fx-ribbon.blue{background:linear-gradient(180deg,#8FD2FF 0 10%,#2E8BE0 45%,#0B2C5E)}
.fx-ribbon::before{content:"";position:absolute;left:4%;right:4%;top:5px;height:2px;background:rgba(255,240,200,.55)}
.fx-ribbon > b{position:relative;font-family:var(--pop);font-size:30px;line-height:1;color:var(--fx-ink);
  -webkit-text-stroke:5px #5A1206;paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.fx-ribbon.gold > b{color:#fff;-webkit-text-stroke-color:#7A4A06}
.fx-ribbon.blue > b{-webkit-text-stroke-color:#0B2C5E}
.fx-in .fx-ribbon{animation:fxRibbonIn 380ms var(--fx-spring) both}
.fx-in .fx-ribbon > b{animation:fxPopBig 420ms var(--fx-spring) 90ms both}
@keyframes fxRibbonIn{from{transform:scaleX(.86)}}
.fx-band{position:absolute;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(169,118,26,.95) 14%,#F2C230 50%,rgba(169,118,26,.95) 86%,transparent)}
.fx-band > b{font-family:var(--pop);font-size:34px;color:#fff;-webkit-text-stroke:5px #6B4408;paint-order:stroke fill;
  text-shadow:0 3px 0 rgba(0,0,0,.35)}

/* ══════════ 部品：カード ══════════ */
.fx-card{position:relative;isolation:isolate;border-radius:14px;padding:4px;background:var(--fx-gold-metal);
  box-shadow:0 6px 0 rgba(0,0,0,.4),0 12px 26px rgba(0,0,0,.5);transition:transform var(--fx-t-hover) var(--fx-out)}
.fx-card > .in{position:relative;border-radius:10px;overflow:hidden;background:var(--fx-wood);height:100%}
.fx-card::after{content:"";position:absolute;inset:-3px;border-radius:17px;pointer-events:none;z-index:-1;opacity:0;
  box-shadow:0 0 26px 6px var(--fx-glow-gold);transition:opacity var(--fx-t-hover) var(--fx-out)}
.fx-card:hover{transform:translateY(-6px)}
.fx-card:hover::after,.fx-card.sel::after,.fx-card.on::after{opacity:1}
.fx-card.sel,.fx-card.on{animation:fxSelPop 260ms var(--fx-back)}
.fx-card.sel::before{content:"選択中";position:absolute;left:50%;top:-16px;transform:translateX(-50%);z-index:4;
  padding:3px 14px;border-radius:9px;font-size:16px;font-weight:900;color:#3A2405;white-space:nowrap;
  background:linear-gradient(180deg,#FFF0BE,#E8B23A);border:2px solid #8A6206}
.fx-card .fx-gloss{position:absolute;inset:4px;border-radius:10px;overflow:hidden;pointer-events:none;z-index:2}
.fx-card .fx-gloss::after{content:"";position:absolute;top:-10%;bottom:-10%;width:30%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);animation:fxShine 4.6s ease-in-out infinite}
.fx-card.rA{background:linear-gradient(160deg,#DDF1FF,#6FB8F5 40%,#1B5A9E 70%,#A8DCFF)}
.fx-card.rS{background:linear-gradient(160deg,#F2E2FF,#B07CE8 40%,#5A2A9E 70%,#E0C8FF)}
.fx-card.rSS{background:var(--fx-gold-metal)}
.fx-card.rSS::after{opacity:.75;animation:fxBreath 2.2s var(--fx-inout) infinite}

/* ══════════ 部品：横タブ（金のつまみが滑る） ══════════ */
.fx-seg{position:relative;display:inline-flex;padding:4px;border-radius:14px;background:var(--fx-wood);border:3px solid #7A5A22}
.fx-seg button{position:relative;z-index:1;min-width:92px;height:46px;border:0;background:none;cursor:pointer;
  font-family:var(--pop);font-size:20px;color:#EBD9B2;-webkit-text-stroke:3px var(--fx-ink-edge);paint-order:stroke fill}
.fx-seg button[aria-pressed="true"]{color:#fff}
.fx-seg i.thumb{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:var(--w,92px);border-radius:10px;pointer-events:none;
  background:linear-gradient(180deg,var(--dk-b1) 0 8%,var(--dk-b2) 30%,var(--dk-b3) 72%,var(--dk-b4));
  box-shadow:0 0 14px var(--fx-glow-sapph),inset 0 2px 0 rgba(255,255,255,.45);
  transform:translateX(var(--x,0));transition:transform 240ms var(--fx-back)}

/* ══════════ 部品：主ボタンの光・メダル ══════════ */
.fx-primary{position:relative;isolation:isolate;
  box-shadow:0 5px 0 rgba(0,0,0,.42),inset 0 2px 0 rgba(255,255,255,.45),0 0 20px 4px var(--fx-glow-gold)}
.fx-primary::before{content:"";position:absolute;left:0;top:0;width:100%;height:100%;inset:0;transform:none;
  background:none;border-radius:inherit;z-index:-1;pointer-events:none;
  box-shadow:inset 0 0 22px 6px rgba(255,240,180,.75);animation:fxBreath 2.4s var(--fx-inout) infinite}
.fx-primary.green{box-shadow:0 5px 0 rgba(0,0,0,.42),inset 0 2px 0 rgba(255,255,255,.45),0 0 20px 4px rgba(140,230,90,.55)}
.fx-primary.green::before{box-shadow:inset 0 0 22px 6px rgba(200,255,160,.7)}
.fx-medal{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 35% 30%,#FFF7DC,#F0CE72 40%,#C8952F 70%,#7C5410);
  border:3px solid #5A3A04;box-shadow:0 4px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.6);
  font-size:34px;line-height:1}
/* 絵文字が出ない端末の宝石（fxMedalFix） */
.fx-medal.fx-medal-svg{font-size:0}
.fx-medal.fx-medal-svg > svg{width:62%;height:62%;filter:drop-shadow(0 2px 1px rgba(0,0,0,.45))}

/* ══════════ 部品：数字・的・放射光・閃光・背景の光 ══════════ */
.fx-num{font-family:var(--pop);font-variant-numeric:tabular-nums;color:var(--fx-ink);
  -webkit-text-stroke:4px var(--fx-ink-edge);paint-order:stroke fill;display:inline-block}
.fx-num.gold{color:var(--fx-ink-gold)}
.fx-num.fx-counting{color:#FFF3B0}
.fx-num.fx-up{color:#B8F08A} .fx-num.fx-dn{color:#FF9A8A}
.fx-bump{animation:fxBump 240ms var(--fx-back)}
.fx-hit{animation:fxBump 150ms var(--fx-back)}
.fx-rays{position:absolute;left:50%;top:50%;width:1200px;height:1200px;margin:-600px 0 0 -600px;pointer-events:none;z-index:0;
  background:repeating-conic-gradient(from 0deg,rgba(255,226,140,.34) 0 7deg,rgba(255,226,140,0) 7deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 0,#000 18%,transparent 62%);
  animation:fxSpin 24s linear infinite}
.fx-rays.fast{animation-duration:6s}
.fx-rays.silver{background:repeating-conic-gradient(rgba(220,230,245,.26) 0 7deg,transparent 7deg 18deg)}
.fx-flash{position:absolute;inset:0;background:#FFF8E0;pointer-events:none;z-index:399;opacity:0}
.fx-flash.go{animation:fxFlashA 90ms linear}
@keyframes fxFlashA{0%{opacity:.9}100%{opacity:0}}
#fxCanvas{position:absolute;left:0;top:0;width:1600px;height:900px;z-index:398;pointer-events:none}
.fx-layer{position:absolute;inset:0;z-index:397;pointer-events:none;overflow:hidden}
.fx-amb{position:absolute;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.fx-amb .fx-blob{position:absolute;left:-10%;top:-14%;width:62%;height:70%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,196,96,.22),transparent);animation:fxDrift 18s var(--fx-inout) infinite}
.fx-amb .fx-blob.fx-b2{left:auto;top:auto;right:-12%;bottom:-18%;
  background:radial-gradient(closest-side,rgba(110,180,255,.14),transparent);animation-duration:22s;animation-delay:-7s}
