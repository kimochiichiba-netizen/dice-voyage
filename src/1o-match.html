<style>
/* ══════════════════════════════════════════════════════════════
   ダイスキングダム — 対戦の入口と出口（1o-match.html / WP4）
   ・担当セレクタは #vs #loading #result #order .dkm- だけ。
   ・動かすのは transform と opacity だけ。入場の 0% で opacity を下げない
     （出てくる前の物は visibility で隠し、出る瞬間に transform だけで弾ませる）。
   ・金文字は color＋-webkit-text-stroke＋text-shadow（背景切り抜きは使わない）。
   ══════════════════════════════════════════════════════════════ */
@keyframes dkmFadeOut{to{opacity:0}}
@keyframes dkmPulse{0%,100%{transform:scale(.94)}50%{transform:scale(1.04)}}
@keyframes dkmBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes dkmTw{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes dkmSpark{0%,100%{transform:scale(.2) rotate(0)}45%{transform:scale(1.15) rotate(45deg)}70%{transform:scale(.55) rotate(60deg)}}

/* ══════════ ⑥ 対戦相手を検索中（#vs） ══════════ */
#vs{position:absolute;inset:0;z-index:330;display:none;overflow:hidden;background:transparent;pointer-events:auto;
  font-family:var(--jp)}
#vs.on{display:block}
#vs.dkm-out{animation:dkmFadeOut 90ms var(--fx-in) forwards}
.dkm-vs-veil{position:absolute;inset:0;
  background:radial-gradient(70% 62% at 50% 58%,rgba(6,22,32,.74),rgba(2,7,11,.92) 72%,rgba(0,0,0,.96))}
.dkm-vs-glow{position:absolute;left:50%;top:590px;width:1240px;height:560px;margin:-280px 0 0 -620px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(90,205,255,.26),rgba(90,205,255,0));animation:dkmPulse 2.4s ease-in-out infinite}
.dkm-vs-mapbox{position:absolute;left:50%;top:300px;width:1040px;height:606px;margin-left:-520px;
  animation:dkmMapIn 560ms var(--fx-out) both}
@keyframes dkmMapIn{from{transform:translateY(26px) scale(.94)}}
.dkm-world{display:block;width:100%;height:100%;overflow:visible}
.dkm-grid path{stroke:rgba(120,210,255,.13);stroke-width:1.2;fill:none}
.dkm-world-shine{animation:dkmShineX 2.8s ease-in-out infinite}
@keyframes dkmShineX{from{transform:translateX(0) skewX(-18deg)}to{transform:translateX(1500px) skewX(-18deg)}}
.dkm-arc{fill:none;stroke-width:6;stroke-linecap:round}
.dkm-arc-glow{fill:none;stroke:#FFD24D;stroke-opacity:.3;stroke-width:18;stroke-linecap:round}
.dkm-arcdot{fill:#FFF6C8;stroke:#FFB82E;stroke-width:2}
.dkm-arcdot.head{fill:#FFFFFF;stroke:#FFD24D;stroke-width:4}
.dkm-pin-ring{fill:none;stroke:#FFE27A;stroke-width:3;transform-box:fill-box;transform-origin:center;
  animation:dkmRing 1.4s ease-out infinite}
.dkm-pin-ring.r2{animation-delay:.7s}
@keyframes dkmRing{0%{transform:scale(.5);opacity:.95}100%{transform:scale(2.1);opacity:0}}

.dkm-vs-band{position:absolute;left:0;right:0;top:150px;height:112px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#6B4408 0,#C8952F 7%,#FFE9A0 21%,#F5D36B 42%,#E0AE3A 64%,#A9761A 88%,#5A3A04 100%);
  -webkit-mask:linear-gradient(90deg,transparent 0,#000 11%,#000 89%,transparent 100%);
          mask:linear-gradient(90deg,transparent 0,#000 11%,#000 89%,transparent 100%);
  animation:dkmBandIn 420ms var(--fx-spring) both}
@keyframes dkmBandIn{from{transform:scaleX(.86)}}
.dkm-vs-edge{position:absolute;left:0;right:0;height:5px;overflow:hidden;
  background:linear-gradient(90deg,transparent,#FFF8D8 20%,#FFFFFF 50%,#FFF8D8 80%,transparent)}
.dkm-vs-edge.t{top:-1px} .dkm-vs-edge.b{bottom:-1px}
.dkm-vs-edge u{position:absolute;top:-8px;bottom:-8px;left:0;width:16%;
  background:radial-gradient(closest-side,#FFFFFF,rgba(255,255,255,0));animation:dkmEdgeRun 1.6s linear infinite}
.dkm-vs-edge.b u{animation-delay:-.8s}
@keyframes dkmEdgeRun{from{transform:translateX(-30%)}to{transform:translateX(640%)}}
.dkm-vs-txt{position:absolute;font-family:var(--pop);font-size:54px;line-height:1;color:#FFFFFF;letter-spacing:.04em;
  -webkit-text-stroke:9px #4A2A04;paint-order:stroke fill;text-shadow:0 5px 0 rgba(60,30,0,.5);white-space:nowrap}
.dkm-vs-txt.s2{visibility:hidden}
.dkm-found .dkm-vs-txt.s1{visibility:hidden}
.dkm-found .dkm-vs-txt.s2{visibility:visible;animation:fxPopBig 420ms var(--fx-spring) both}
.dkm-dots i{font-style:normal;display:inline-block;animation:dkmDot 1.1s ease-in-out infinite}
.dkm-dots i:nth-child(2){animation-delay:.18s}
.dkm-dots i:nth-child(3){animation-delay:.36s}
@keyframes dkmDot{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}

.dkm-vs-seats{position:absolute;left:0;right:0;top:772px;display:flex;justify-content:center;gap:22px}
.dkm-vs-seat{position:relative;visibility:hidden;display:flex;align-items:center;gap:12px;height:82px;padding:0 18px 0 16px;
  border-radius:16px;border:3px solid transparent;
  background:linear-gradient(180deg,rgba(52,36,16,.96),rgba(20,12,4,.98)) padding-box,var(--fx-gold-metal) border-box;
  box-shadow:0 6px 0 rgba(0,0,0,.4),0 12px 26px rgba(0,0,0,.55),inset 5px 0 0 var(--c)}
.dkm-vs-seat.in{visibility:visible;animation:dkmSeatIn 420ms var(--fx-spring) both}
@keyframes dkmSeatIn{0%{transform:translateY(26px) scale(.86)}60%{transform:translateY(-4px) scale(1.05)}100%{transform:none}}
.dkm-vs-gem{flex:0 0 auto;width:26px;height:26px;border-radius:6px;transform:rotate(45deg);border:2px solid #FFF3C8;
  background:radial-gradient(circle at 35% 30%,#FFFFFF,var(--c) 45%,#000 140%)}
.dkm-vs-seat b{font-family:var(--pop);font-size:28px;line-height:1;color:#FFF6E2;white-space:nowrap;
  -webkit-text-stroke:4px #2A1604;paint-order:stroke fill}
.dkm-vs-seat em{font-style:normal;font-family:var(--caps);font-size:22px;color:#CFE8FF;
  -webkit-text-stroke:3px #0B1E30;paint-order:stroke fill}
.dkm-vs-in{font-family:var(--pop);font-size:24px;line-height:1;color:#3A2405;padding:7px 12px;border-radius:10px;
  background:linear-gradient(180deg,#FFF3C8,#F2C230 55%,#C8952F);border:2px solid #7A5206}

/* ══════════ ⑦ ローディング（#loading） ══════════ */
#loading.dkm-load{background-color:#02080C!important;font-family:var(--jp);
  --dkm-sky1:#01070E;--dkm-sky2:#062536;--dkm-sky3:#0F5566;--dkm-hz:#3FB0BC;--dkm-w1:#0B4656;--dkm-w2:#010A10;
  --dkm-sil:#02111A;--dkm-sil-hi:#0B3342;--dkm-sil-back:rgba(26,98,116,.55)}
#loading.dkm-load::after{content:none}
.dkm-ld-scene{position:absolute;inset:0;overflow:hidden}
.dkm-ld-scene.world{--dkm-sky2:#062C34;--dkm-sky3:#115E62;--dkm-hz:#58C4AE;--dkm-w1:#0C4A4C;--dkm-sil-back:rgba(34,110,104,.52)}
.dkm-ld-scene.oita{--dkm-sky1:#030814;--dkm-sky2:#0B2238;--dkm-sky3:#51445A;--dkm-hz:#F2A45A;--dkm-w1:#2C3A48;--dkm-w2:#050A12;
  --dkm-sil:#080C14;--dkm-sil-hi:#1B2130;--dkm-sil-back:rgba(92,70,84,.6)}
.dkm-ld-sky{position:absolute;inset:0;
  background:radial-gradient(60% 38% at 50% 69%,rgba(255,255,255,.18),rgba(255,255,255,0) 70%),
             linear-gradient(180deg,var(--dkm-sky1) 0%,var(--dkm-sky2) 36%,var(--dkm-sky3) 60%,var(--dkm-hz) 68.4%,var(--dkm-w1) 68.8%,var(--dkm-w2) 100%)}
.dkm-ld-stars{position:absolute;left:0;top:0;width:1600px;height:900px}
.dkm-tw0{animation:dkmTw 3.2s ease-in-out infinite}
.dkm-tw1{animation:dkmTw 4.1s ease-in-out -1.3s infinite}
.dkm-tw2{animation:dkmTw 2.6s ease-in-out -.7s infinite}
.dkm-ld-moon{position:absolute;left:1236px;top:86px;width:112px;height:112px;border-radius:50%;
  background:radial-gradient(circle at 36% 34%,#FFFEF4,#F2EED6 52%,#CFC8A4 100%);
  box-shadow:0 0 60px 22px rgba(210,238,255,.22),inset -14px -10px 0 rgba(160,150,110,.28)}
.dkm-ld-shoot{position:absolute;width:300px;height:3px;border-radius:3px;transform-origin:right center;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(210,240,255,.75) 72%,#FFFFFF)}
.dkm-ld-shoot.s1{left:150px;top:96px;animation:dkmShoot 4.2s ease-in .3s infinite}
.dkm-ld-shoot.s2{left:760px;top:40px;animation:dkmShoot 5.4s ease-in 1.9s infinite}
.dkm-ld-shoot.s3{left:420px;top:210px;animation:dkmShoot 6.2s ease-in 3.1s infinite}
@keyframes dkmShoot{0%{transform:translate(0,0) rotate(24deg) scaleX(0)}8%{transform:translate(60px,27px) rotate(24deg) scaleX(1)}
  26%{transform:translate(560px,250px) rotate(24deg) scaleX(0)}100%{transform:translate(560px,250px) rotate(24deg) scaleX(0)}}
.dkm-ld-horizon{position:absolute;left:0;right:0;top:318px;height:300px}
.dkm-ld-city{display:block;width:100%;height:100%}
.dkm-lw0{animation:dkmTw 2.2s ease-in-out infinite}
.dkm-lw1{animation:dkmTw 3.4s ease-in-out -1.1s infinite}
.dkm-ld-water{position:absolute;left:0;right:0;top:618px;bottom:0;overflow:hidden}
.dkm-ld-water::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,0) 0 7px,rgba(190,240,255,.07) 7px 9px)}
.dkm-ld-water::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;
  background:linear-gradient(90deg,transparent,rgba(200,245,255,.12),transparent);animation:dkmSweep 7s ease-in-out infinite}
@keyframes dkmSweep{from{transform:translateX(-110%)}to{transform:translateX(440%)}}
.dkm-ld-reflbox{position:absolute;left:0;right:0;top:0;height:300px;opacity:.32;transform:scaleY(-1);
  -webkit-mask:linear-gradient(0deg,#000 0,rgba(0,0,0,.5) 36%,transparent 78%);mask:linear-gradient(0deg,#000 0,rgba(0,0,0,.5) 36%,transparent 78%)}
.dkm-ld-refl{display:block;width:100%;height:100%}
.dkm-ld-glint{position:absolute;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(230,250,255,.85),transparent)}
.dkm-ld-glint.g1{left:560px;top:30px;width:150px;animation:dkmGlint 3.2s ease-in-out infinite}
.dkm-ld-glint.g2{left:880px;top:58px;width:120px;animation:dkmGlint 2.7s ease-in-out -1s infinite}
.dkm-ld-glint.g3{left:640px;top:96px;width:210px;animation:dkmGlint 3.8s ease-in-out -2s infinite}
.dkm-ld-glint.g4{left:300px;top:140px;width:110px;animation:dkmGlint 4.4s ease-in-out -.5s infinite}
@keyframes dkmGlint{0%,100%{transform:translateX(-18px) scaleX(.4)}50%{transform:translateX(18px) scaleX(1)}}
.dkm-ld-dice{position:absolute;left:50%;top:296px;width:300px;height:324px;margin-left:-150px;animation:dkmBob 4.4s ease-in-out infinite}
.dkm-ld-dice .dkm-die{position:relative;display:block;width:100%;height:100%;filter:drop-shadow(0 18px 22px rgba(0,0,0,.5))}
.dkm-ld-halo{position:absolute;left:50%;top:48%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(200,245,255,.34),rgba(200,245,255,0));animation:dkmPulse 3.2s ease-in-out infinite}
.dkm-ld-diceref{position:absolute;left:50%;top:618px;width:300px;height:190px;margin-left:-150px;opacity:.28;overflow:hidden;
  -webkit-mask:linear-gradient(180deg,#000,transparent 85%);mask:linear-gradient(180deg,#000,transparent 85%);
  animation:dkmBobR 4.4s ease-in-out infinite}
.dkm-ld-diceref .dkm-die{display:block;width:100%;height:100%;transform:scaleY(-1)}
@keyframes dkmBobR{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
.dkm-ld-spark{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;
  background:radial-gradient(circle,#FFFFFF 0 8%,rgba(230,250,255,.9) 14%,transparent 40%),
             linear-gradient(90deg,transparent 46%,rgba(240,252,255,.95) 50%,transparent 54%),
             linear-gradient(0deg,transparent 46%,rgba(240,252,255,.95) 50%,transparent 54%);
  animation:dkmSpark 2.8s ease-in-out infinite}
.dkm-ld-spark.k1{left:640px;top:330px}
.dkm-ld-spark.k2{left:975px;top:420px;animation-delay:-1s}
.dkm-ld-spark.k3{left:700px;top:560px;animation-delay:-1.9s}
.dkm-ld-name{position:absolute;left:0;right:0;top:58px;text-align:center;pointer-events:none}
.dkm-ld-name b{display:inline-block;font-family:var(--pop);font-size:84px;line-height:1.05;color:#FFD44A;
  -webkit-text-stroke:11px #3A2405;paint-order:stroke fill;
  text-shadow:0 6px 0 #8A5A08,0 10px 0 #4A2A04,0 18px 26px rgba(0,0,0,.6);animation:fxPopBig 560ms var(--fx-spring) both}
.dkm-ld-name i{display:block;margin-top:10px;font-style:normal;font-family:var(--caps);font-size:26px;letter-spacing:.34em;color:#D8F4FF;
  -webkit-text-stroke:4px rgba(0,20,30,.85);paint-order:stroke fill}
.dkm-ld-tip{position:absolute;left:60px;right:60px;top:712px;display:flex;align-items:center;justify-content:center;gap:16px;
  animation:dkmTipIn 480ms var(--fx-out) 120ms both}
@keyframes dkmTipIn{from{transform:translateY(20px)}}
.dkm-ld-tip em{flex:0 0 auto;font-style:normal;font-family:var(--caps);font-size:22px;line-height:1;color:#FFFFFF;
  padding:7px 12px 6px;border-radius:8px;border:2px solid #FFE0D0;background:linear-gradient(180deg,#FF6A5E,#C9302C);
  box-shadow:0 3px 0 rgba(0,0,0,.45)}
.dkm-ld-tip span{font-family:var(--pop);font-size:31px;line-height:1.2;color:#FFE45C;
  -webkit-text-stroke:6px #2A1604;paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.dkm-ld-foot{position:absolute;left:0;right:0;top:800px;display:flex;flex-direction:column;align-items:center;gap:12px}
.dkm-ld-count{font-family:var(--jp);font-weight:900;font-size:26px;line-height:1;letter-spacing:.04em;color:#FFFFFF;
  -webkit-text-stroke:4px rgba(0,10,16,.85);paint-order:stroke fill}
.dkm-ld-bar{position:relative;width:880px;height:12px;border-radius:7px;background:rgba(2,14,20,.8);
  border:2px solid rgba(160,230,255,.5);box-shadow:0 0 14px rgba(90,200,255,.25)}
.dkm-ld-bar i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:6px;transform-origin:left center;
  background:linear-gradient(90deg,#1B8FD0,#6FE0FF 62%,#FFFFFF);transition:transform 110ms linear}
.dkm-ld-bar b{position:absolute;left:-14px;top:-11px;width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle,#FFFFFF 0 18%,rgba(170,240,255,.85) 40%,rgba(170,240,255,0) 70%);transition:transform 110ms linear}

/* ══════════ ⑧ 盤の上の順番決め（#dkmOrder） ══════════ */
#order{display:none!important}
.dkm-order{position:absolute;inset:0;z-index:300;pointer-events:auto;font-family:var(--jp)}
.dkm-order.out{animation:dkmFadeOut 220ms var(--fx-in) forwards}
.dkm-ord-veil{position:absolute;inset:0;
  background:radial-gradient(60% 58% at 50% 54%,rgba(8,5,2,.72),rgba(8,5,2,.46) 70%,rgba(8,5,2,.12) 100%)}
.dkm-order.spot .dkm-ord-veil{visibility:hidden}
.dkm-spot{position:absolute;left:0;top:0;width:3600px;height:2200px;visibility:hidden;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 0 90px,rgba(255,226,140,.34) 96px,rgba(6,4,2,.22) 106px,rgba(6,4,2,.76) 172px);
  transform:translate(-1000px,-650px);transition:transform 380ms var(--fx-out)}
.dkm-order.spot-on .dkm-spot{visibility:visible}
.dkm-ord-head{position:absolute;left:50%;top:146px;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:6px;
  min-width:640px;padding:16px 48px 18px;border-radius:18px;border:4px solid transparent;
  background:linear-gradient(180deg,rgba(52,36,16,.95),rgba(20,12,4,.97)) padding-box,var(--fx-gold-metal) border-box;
  box-shadow:0 8px 0 rgba(0,0,0,.35),0 18px 36px rgba(0,0,0,.55);animation:dkmHeadIn 420ms var(--fx-spring) both}
@keyframes dkmHeadIn{from{transform:translateX(-50%) scale(.88)}}
.dkm-ord-ttl{font-family:var(--pop);font-size:46px;line-height:1.1;color:#FFD44A;white-space:nowrap;
  -webkit-text-stroke:8px #2A1604;paint-order:stroke fill;text-shadow:0 4px 0 #7A4A06}
.dkm-ord-sub{min-height:32px;font-family:var(--pop);font-size:26px;line-height:1.2;color:#FFF6E2;white-space:nowrap;
  -webkit-text-stroke:5px #2A1604;paint-order:stroke fill}
.dkm-ord-timer{display:block;width:100%;height:8px;margin-top:4px;border-radius:5px;overflow:hidden;visibility:hidden;background:rgba(0,0,0,.55)}
.dkm-order.choosing .dkm-ord-timer{visibility:visible}
.dkm-ord-timer i{display:block;height:100%;transform-origin:left center;background:linear-gradient(90deg,#2E8BE0,#8FD2FF)}
.dkm-ord-timer.run i{animation:dkmTimer 5s linear forwards}
@keyframes dkmTimer{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.dkm-ord-row{position:absolute;left:0;right:0;top:392px;display:flex;justify-content:center;gap:40px}
.dkm-order.cards-out .dkm-ord-row{animation:dkmCardsOut 240ms var(--fx-in) forwards}
@keyframes dkmCardsOut{to{transform:scale(.9);opacity:0}}
.dkm-fslot{position:relative;width:170px;height:240px;
  animation:dkmDeal 460ms var(--fx-out) calc(var(--i) * 90ms) both,dkmFloat 3.4s ease-in-out calc(700ms + var(--i) * 260ms) infinite}
@keyframes dkmDeal{from{transform:translateY(40px) rotate(-5deg) scale(.88)}}
@keyframes dkmFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.dkm-fcard{position:absolute;inset:0;border:0;padding:0;background:none;cursor:pointer;perspective:900px;border-radius:14px;
  font-family:var(--pop);transition:transform 220ms var(--fx-back)}
.dkm-fcard:hover:not(:disabled){transform:translateY(-10px)}
.dkm-fcard:disabled{cursor:default}
.dkm-fcard::before{content:"";position:absolute;inset:-8px;border-radius:20px;pointer-events:none;visibility:hidden;
  box-shadow:0 0 0 4px #8FD2FF,0 0 26px 8px rgba(90,180,255,.7);animation:fxBreath 1.4s var(--fx-inout) infinite}
.dkm-order.choosing .dkm-fcard:not(:disabled)::before{visibility:visible}
.dkm-fc-in{position:absolute;inset:0;border-radius:14px;transform-style:preserve-3d;transition:transform 520ms var(--fx-back)}
.dkm-fcard.flip .dkm-fc-in{transform:rotateY(180deg)}
.dkm-fc-face{position:absolute;inset:0;border-radius:14px;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden;
  box-shadow:0 10px 0 rgba(0,0,0,.35),0 18px 28px rgba(0,0,0,.5)}
.dkm-fc-front{transform:rotateY(180deg)}
.dkm-fc-back > .fx-deco{display:block;width:100%;height:100%}
.dkm-fsvg{display:block;width:100%;height:100%}
.dkm-fc-gloss{position:absolute;top:-20%;bottom:-20%;left:0;width:36%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:fxShine 3.8s ease-in-out infinite}
.dkm-check{position:absolute;left:50%;top:50%;z-index:3;width:132px;height:132px;margin:-66px 0 0 -66px;visibility:hidden;pointer-events:none}
.dkm-fcard.picked .dkm-check{visibility:visible;animation:dkmCheck 360ms var(--fx-spring) both}
.dkm-fcard.flip .dkm-check{visibility:hidden}
@keyframes dkmCheck{0%{transform:scale(1.6) rotate(-10deg)}60%{transform:scale(.92)}100%{transform:none}}
.dkm-owner{position:absolute;left:50%;top:-50px;transform:translateX(-50%);visibility:hidden;white-space:nowrap;padding:6px 14px;border-radius:12px;
  font-family:var(--pop);font-size:22px;line-height:1;color:#FFFFFF;-webkit-text-stroke:4px rgba(0,0,0,.6);paint-order:stroke fill;
  background:var(--c,#555);border:2px solid #FFF3C8;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.dkm-fslot.owned .dkm-owner{visibility:visible;animation:dkmOwnIn 300ms var(--fx-spring) both}
@keyframes dkmOwnIn{from{transform:translateX(-50%) scale(.86)}}
.dkm-fslot.dim .dkm-fcard{filter:brightness(.68) saturate(.7)}
.dkm-fslot.first{z-index:2}
.dkm-fslot.first .dkm-fcard{transform:scale(1.1)}
.dkm-fslot > .fx-rays{width:900px;height:900px;margin:-450px 0 0 -450px;z-index:-1}
.dkm-ff{position:absolute;inset:0;border-radius:14px;border:4px solid #A9761A;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.62),transparent 60%),linear-gradient(180deg,#F7EDD6,#E6D2A8)}
