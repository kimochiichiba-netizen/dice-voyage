<style>
/* ══════════════════════════════════════════════════════════════
   ダイスキングダム — 盤の見た目と演出（1r-board.html / WP7）
   ──────────────────────────────────────────────────────────────
   ・担当セレクタ（§10）：.hud .portrait .rankbadge #plate #ticker #chip #dbl #turnbig #band
     #skillcut #raise #alarm #shake #celebrate #flash .pill #emote* #menu #itembar #legend と .dkb-*
   ・担当 keyframe を transform だけの入場に定義し直す（0% で opacity を下げない）。
   ・金文字は color の単色＋-webkit-text-stroke＋text-shadow（background-clip:text は使わない）。
   ・四隅の HUD は 9h-board.js が作り直す（.hud.dkb-hud）。旧 HUD と旧順位バッジは隠す。
   ══════════════════════════════════════════════════════════════ */

/* ══════════ 担当 keyframe（入場は transform だけ） ══════════ */
@keyframes tickFade{0%{transform:translateY(8px) scale(.96)}10%,100%{transform:none}}
@keyframes pillIn{0%{transform:scale(1.32)}60%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes bandIn{0%{transform:scaleY(.86)}100%{transform:none}}
@keyframes chipPop{0%{transform:scale(1.62) rotate(-8deg)}52%{transform:scale(.92) rotate(2deg)}76%{transform:scale(1.04)}100%{transform:none}}
@keyframes scIn{0%{transform:scaleX(.86)}100%{transform:none}}
@keyframes tbIn{0%{transform:scaleX(.86)}62%{transform:scaleX(1.03)}100%{transform:none}}
@keyframes alarmIn{0%{transform:translate(-50%,-50%) scale(.86)}60%{transform:translate(-50%,-50%) scale(1.06)}
  100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes flash{0%{opacity:0}22%{opacity:.8}100%{opacity:0}}
@keyframes skillReady{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.08)}}
@keyframes inflPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes sirene{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
/* WP7 の自前 keyframe */
@keyframes dkbFlip{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(180deg) scale(1.14)}100%{transform:rotateY(360deg) scale(1)}}
@keyframes dkbSpin{to{transform:rotate(360deg)}}
@keyframes dkbSpinR{to{transform:rotate(-360deg)}}
@keyframes dkbTagIn{0%{transform:translateX(-50%) scale(1.45)}60%{transform:translateX(-50%) scale(.94)}100%{transform:translateX(-50%) scale(1)}}
@keyframes dkbPopIn{0%{transform:scale(1.4)}60%{transform:scale(.94)}100%{transform:none}}
@keyframes dkbOut{to{transform:scale(.9);opacity:0}}
@keyframes dkbBandOut{to{transform:translateY(-14px) scale(.96);opacity:0}}
@keyframes dkbPnlL{0%{transform:translateX(-40px) scale(.94)}70%{transform:translateX(4px)}100%{transform:none}}
@keyframes dkbPnlR{0%{transform:translateX(40px) scale(.94)}70%{transform:translateX(-4px)}100%{transform:none}}
@keyframes dkbPnlOut{to{transform:translateY(-8px) scale(.96);opacity:0}}
@keyframes dkbBubIn{0%{transform:scale(1.4) translateY(-10px)}58%{transform:scale(.94)}100%{transform:none}}
@keyframes dkbRaiseIn{0%{transform:scale(1.7) rotate(-6deg)}55%{transform:scale(.94) rotate(2deg)}100%{transform:scale(1) rotate(-2deg)}}
@keyframes dkbShine{0%,62%{transform:translateX(-140%) skewX(-18deg)}100%{transform:translateX(420%) skewX(-18deg)}}
@keyframes dkbGlow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes dkbBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes dkbWarn{0%,100%{color:#FFB07A}50%{color:#FF4A2A}}

/* ══════════ 盤のまわりを暗くする ══════════ */
.dkb-vignette{position:absolute;inset:0;z-index:30;pointer-events:none;
  background:radial-gradient(125% 100% at 50% 50%,rgba(0,0,0,0) 56%,rgba(10,5,0,.46) 100%)}

/* ══════════ 旧 HUD・旧順位バッジは隠す（新しい HUD は .hud.dkb-hud） ══════════ */
#hudTop,#hudBot,#hudTR,#hudBL,#rTop,#rBot,#rTR,#rBL{display:none!important}
#legend{display:none!important}

/* ══════════ 四隅の HUD ══════════ */
.hud.dkb-hud{position:absolute;z-index:80;display:flex;gap:8px;align-items:flex-start;pointer-events:none;
  transition:none;--pc:#E14A5A;--pcd:#6E1A22}
.dkb-hud.dkb-Top{left:10px;top:8px}
.dkb-hud.dkb-TR{right:10px;top:8px;flex-direction:row-reverse}
.dkb-hud.dkb-BL{left:10px;bottom:8px;align-items:flex-end}
.dkb-hud.dkb-Bot{right:10px;bottom:8px;flex-direction:row-reverse;align-items:flex-end}

.dkb-pwrap{position:relative;flex:0 0 auto;width:112px;height:112px}
.dkb-por{position:absolute;inset:0;border-radius:14px;pointer-events:auto;cursor:pointer;
  background:linear-gradient(152deg,#FFF7DC 0%,#F0CE72 14%,#C8952F 30%,#7C5410 46%,#A8752A 58%,#F3D583 76%,#8A6314 90%,#FFF3C8 100%);
  box-shadow:0 4px 0 rgba(0,0,0,.5),0 10px 22px rgba(0,0,0,.45)}
.dkb-pin{position:absolute;inset:4px;border-radius:10px;overflow:hidden;
  background:radial-gradient(120% 100% at 50% 10%,var(--pc),#140B03 80%)}
.dkb-pin canvas{display:block;width:100%;height:100%}
.dkb-pin::after{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(255,236,180,.35),inset 0 -18px 22px rgba(0,0,0,.35)}
.dkb-rar{position:absolute;left:-7px;top:-9px;z-index:3;padding:1px 8px 2px;border-radius:9px;
  font-family:var(--caps);font-size:18px;line-height:1.1;font-weight:400;color:#fff;
  -webkit-text-stroke:3px #3A1E02;paint-order:stroke fill;
  background:linear-gradient(180deg,#FFE58A,#E09A12);border:2px solid #5A3A04;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.dkb-rar.dkb-rA{background:linear-gradient(180deg,#BFE3FF,#3E8FE0)}
.dkb-rar.dkb-rS{background:linear-gradient(180deg,#E8D2FF,#9A5AE0)}
.dkb-lv{position:absolute;left:-8px;bottom:-8px;z-index:3;min-width:38px;height:38px;padding:0 4px;border-radius:19px;
  display:grid;place-items:center;font-family:var(--pop);font-size:18px;font-weight:400;color:#fff;
  -webkit-text-stroke:3px #0E1A30;paint-order:stroke fill;
  background:radial-gradient(circle at 34% 28%,#5C7EB8,#1B2E4E 72%);border:2px solid #E0AE33;box-shadow:0 2px 0 rgba(0,0,0,.5)}
.dkb-TR .dkb-lv,.dkb-Bot .dkb-lv{left:auto;right:-8px}
.dkb-ab{position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);z-index:3;padding:2px 12px 3px;border-radius:10px;
  font-size:16px;font-weight:900;color:#fff;-webkit-text-stroke:3px #1A4A14;paint-order:stroke fill;white-space:nowrap;
  background:linear-gradient(180deg,#9BEF7E,#46B83A 55%,#2A7E22);border:2px solid #1F5A1C;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.dkb-turn{display:none;position:absolute;left:50%;top:-20px;transform:translateX(-50%);z-index:4;padding:1px 12px 2px;border-radius:9px;
  font-style:normal;font-size:16px;font-weight:900;color:#3A2405;white-space:nowrap;
  background:linear-gradient(180deg,#FFF6C8,#F2C230 60%,#C88A12);border:2px solid #6B4408;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.dkb-hud.dkb-myturn .dkb-turn{display:block;animation:dkbBobC 1.2s ease-in-out infinite}
@keyframes dkbBobC{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
/* 下の2席は、肖像の下の能力ボタンがステージの外へ出ないように持ち上げる */
.dkb-BL .dkb-pwrap,.dkb-Bot .dkb-pwrap{margin-bottom:20px}
.dkb-hud.dkb-myturn .dkb-por{box-shadow:0 4px 0 rgba(0,0,0,.5),0 0 0 3px #FFF1B0,0 0 26px 6px rgba(255,210,80,.72)}
.dkb-hud.dkb-myturn .dkb-pwrap::before{content:"";position:absolute;inset:-10px;border-radius:20px;pointer-events:none;
  box-shadow:0 0 22px 8px rgba(255,214,90,.55);animation:dkbGlow 1.4s ease-in-out infinite}

/* 自分の席の能力ボタン（#skillBtn をここへ移す） */
#skillBtn.dkb-skill{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);z-index:5;pointer-events:auto;
  min-width:108px;height:38px;padding:0 12px;border-radius:12px;border:2px solid #1F5A1C;cursor:pointer;
  font-family:var(--jp);font-weight:900;font-size:20px;line-height:1;color:#fff;
  -webkit-text-stroke:3px #1A4A14;paint-order:stroke fill;white-space:nowrap;
  background:linear-gradient(180deg,#9BEF7E,#46B83A 55%,#2A7E22);
  box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.5)}
#skillBtn.dkb-skill:disabled{filter:grayscale(1) brightness(.72);cursor:default}
#skillBtn.dkb-skill.ready{animation:skillReady .8s ease-in-out infinite alternate}
#skillBtn.dkb-skill:active{transform:translateX(-50%) translateY(2px)}

.dkb-col{display:flex;flex-direction:column;gap:3px;width:252px;padding-top:2px}
.dkb-BL .dkb-col,.dkb-Bot .dkb-col{flex-direction:column-reverse;padding:0 0 2px}
.dkb-TR .dkb-col,.dkb-Bot .dkb-col{align-items:flex-end}
.dkb-name{max-width:100%;height:32px;display:flex;align-items:center;padding:0 14px;border-radius:16px;
  background:linear-gradient(90deg,var(--pc),var(--pcd));border:2px solid rgba(255,236,190,.6);
  box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.35)}
.dkb-nm{max-width:222px;font-size:22px;font-weight:900;line-height:1.1;color:#fff;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 6px rgba(0,0,0,.5)}
.dkb-row{display:flex;align-items:center;gap:8px;height:34px;max-width:100%;padding:0 10px 0 6px;border-radius:9px;
  background:linear-gradient(180deg,rgba(28,18,7,.86),rgba(8,5,2,.9));border:1px solid rgba(201,149,47,.62);
  box-shadow:inset 0 1px 0 rgba(255,226,160,.14)}
.dkb-TR .dkb-row,.dkb-Bot .dkb-row{flex-direction:row-reverse;padding:0 6px 0 10px}
.dkb-rc{height:42px}
.dkb-k{flex:0 0 auto;font-size:16px;font-weight:900;line-height:1.2;color:#EBD8A8;padding:1px 7px;border-radius:5px;
  background:rgba(122,86,30,.55);white-space:nowrap}
.dkb-asset{font-family:var(--pop);font-size:24px;font-weight:400;line-height:1;color:#FFB4A4;white-space:nowrap;
  -webkit-text-stroke:3px #3A0E10;paint-order:stroke fill}
.dkb-cash{font-family:var(--pop);font-size:30px;font-weight:400;line-height:1;color:#FFFFFF;white-space:nowrap;
  -webkit-text-stroke:4px #1A1206;paint-order:stroke fill}
.dkb-Bot .dkb-cash{color:#FFE27A}
.dkb-hud.dkb-long .dkb-cash{font-size:25px}
.dkb-hud.dkb-long .dkb-asset{font-size:21px}
.dkb-gauge{display:flex;align-items:center;gap:7px;height:22px}
.dkb-TR .dkb-gauge,.dkb-Bot .dkb-gauge{flex-direction:row-reverse}
.dkb-gbar{position:relative;flex:0 0 auto;width:140px;height:12px;border-radius:6px;overflow:hidden;
  background:#1A1006;border:1px solid #7A5A22}
.dkb-gbar i{position:absolute;inset:0;transform-origin:left center;transform:scaleX(0);
  background:linear-gradient(90deg,#E08A1A,#F2C230 55%,#FFF7D2);box-shadow:0 0 10px rgba(242,194,48,.9)}
.dkb-gbar::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.5) 0 1px,transparent 1px 12.5%)}
.dkb-gtx{font-size:16px;font-weight:900;line-height:1.1;color:#FFE9B5;white-space:nowrap;text-shadow:0 1px 2px #000,0 0 4px #000}
.dkb-jam{font-size:16px;font-weight:900;line-height:1.2;color:#D8E6F4;white-space:nowrap;text-shadow:0 1px 2px #000,0 0 4px #000}
.dkb-jam b{font-family:var(--pop);font-size:18px;font-weight:400;color:#FFD24D}

.dkb-rank{flex:0 0 auto;width:78px;height:78px;border-radius:50%;display:flex;align-items:baseline;justify-content:center;
  padding-top:18px;line-height:1;font-family:var(--pop);color:#fff;-webkit-text-stroke:3px rgba(0,0,0,.62);paint-order:stroke fill;
  background:radial-gradient(circle at 36% 26%,rgba(255,255,255,.42),rgba(255,255,255,0) 38%),
             radial-gradient(circle at 50% 62%,var(--pc),var(--pcd) 80%);
  border:4px solid #F2C230;box-shadow:0 4px 0 rgba(0,0,0,.5),inset 0 0 14px rgba(0,0,0,.55),0 0 16px rgba(242,194,48,.38)}
.dkb-rank b{font-size:34px;font-weight:400}
.dkb-rank small{font-size:17px}
.dkb-rank.dkb-flip{animation:dkbFlip .62s cubic-bezier(.2,1.2,.4,1)}
.dkb-hud.dkb-out .dkb-col,.dkb-hud.dkb-out .dkb-pwrap{opacity:.62;filter:grayscale(.8)}

/* ══════════ 中央プレート（時間・制限ターン／場の総額） ══════════ */
#plate{min-width:300px;overflow:hidden}
#plate .hd{display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 16px 3px;font-size:17px;line-height:1.2;
  background:linear-gradient(180deg,#8A6848,#5E432B);color:#EFDCA8}
#plate .hd .dkb-pk{font-size:16px;font-weight:900;color:#E8D0A0}
#plate .timer{font-family:var(--pop);font-size:19px;color:#FFE9A8;letter-spacing:.02em;margin-right:10px}
#plate .timer.warn{animation:dkbWarn .8s steps(2) infinite}
#plate .hd em{font-family:var(--pop);font-size:19px;color:#fff;font-style:normal}
#plate .bd{position:relative;overflow:hidden;font-size:34px;line-height:1.15;padding:3px 22px 6px;color:#1A1208}
#plate .bd::after{content:"";position:absolute;top:0;bottom:0;left:0;width:26%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:dkbShine 5.6s ease-in-out infinite}
#plate .infl{display:none;font-family:var(--pop);font-size:16px;padding:1px 10px;border-radius:999px;
  background:linear-gradient(90deg,#C0261A,#F0602A);color:#FFE9B5;box-shadow:0 0 12px rgba(255,90,40,.75);
  animation:inflPulse 1.1s ease-in-out infinite}
#plate .infl.on{display:inline-block}

/* ══════════ 上の告知テロップ（黒帯・金縁・黄文字） ══════════ */
#ticker{left:50%;top:10px;bottom:auto;width:560px;height:48px;transform:translateX(-50%);z-index:82;border-radius:10px;
  background:linear-gradient(180deg,rgba(24,15,4,.94),rgba(6,3,0,.94));
  border:2px solid #C9952F;box-shadow:0 4px 12px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,226,150,.25)}
#stage #ticker{border-top:2px solid #E0B040;border-bottom:2px solid #8A6314}
#ticker::before{background:linear-gradient(90deg,rgba(6,3,0,.95),transparent)}
#ticker::after{background:linear-gradient(270deg,rgba(6,3,0,.95),transparent)}
#ticker b{font-size:20px;font-weight:900;color:#FFE14A;-webkit-text-stroke:0;text-shadow:0 2px 0 rgba(0,0,0,.6);
  animation:tickFade 5.2s cubic-bezier(.16,1,.3,1) infinite}

/* ══════════ 出目（白い丸＋黒の極太数字／インパクトは金の太陽） ══════════ */
/* 勝利の文字（canvas）の上にプレートを重ねない */
#stage.dkb-cel #plate{visibility:hidden}
#chip{left:800px;top:406px;width:166px;height:166px;margin:-83px 0 0 -83px;transform:none;z-index:62;display:none;
  background:none;box-shadow:none;border-radius:50%;font-size:0;color:transparent;pointer-events:none}
#chip.dkb-on{display:block;animation:chipPop .5s cubic-bezier(.2,1.5,.4,1) both}
#chip.dkb-out{animation:dkbOut .2s cubic-bezier(.4,0,1,1) forwards}
#chip .dkb-rays{display:none;position:absolute;left:50%;top:50%;width:470px;height:470px;margin:-235px 0 0 -235px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,236,120,.62) 0 8deg,rgba(255,236,120,0) 8deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 0,#000 22%,transparent 64%);mask:radial-gradient(circle,#000 0,#000 22%,transparent 64%);
  animation:dkbSpin 7s linear infinite}
#chip .dkb-rays2{display:none;position:absolute;left:50%;top:50%;width:380px;height:380px;margin:-190px 0 0 -190px;border-radius:50%;
  background:repeating-conic-gradient(from 9deg,rgba(180,255,120,.4) 0 5deg,rgba(180,255,120,0) 5deg 24deg);
  -webkit-mask:radial-gradient(circle,#000 0,#000 25%,transparent 66%);mask:radial-gradient(circle,#000 0,#000 25%,transparent 66%);
  animation:dkbSpinR 11s linear infinite}
#chip .dkb-disc{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 38% 30%,#FFFFFF 0,#F3F6FA 46%,#D4DCE6 80%,#AFBCCB 100%);
  border:5px solid #FFFFFF;
  box-shadow:0 10px 0 rgba(0,0,0,.28),0 18px 34px rgba(0,0,0,.5),inset 0 -12px 18px rgba(70,90,120,.28),inset 0 8px 12px rgba(255,255,255,.95)}
#chip .dkb-disc::after{content:"";position:absolute;left:18%;top:9%;width:52%;height:26%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0))}
#chip .dkb-num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--caps);font-size:112px;
  font-weight:400;line-height:1;color:#15110B;letter-spacing:-.04em;padding-top:4px;
  text-shadow:0 3px 0 rgba(255,255,255,.8)}
#chip.dkb-two .dkb-num{font-size:88px}
#chip.dkb-gold .dkb-rays,#chip.dkb-gold .dkb-rays2{display:block}
#chip.dkb-gold .dkb-disc{border-color:#FFF4B0;
  background:radial-gradient(circle at 38% 30%,#FFFDE0 0,#FFE85E 36%,#F5B81E 70%,#B87408 100%);
  box-shadow:0 10px 0 rgba(90,50,0,.35),0 0 50px 18px rgba(255,214,70,.7),0 0 110px 40px rgba(255,190,40,.35),
             inset 0 -12px 18px rgba(140,70,0,.35),inset 0 8px 12px rgba(255,255,230,.95)}
#chip.dkb-gold .dkb-num{color:#2A1602;text-shadow:0 3px 0 rgba(255,246,190,.9)}

/* ダブル札（出目の上） */
#dbl{left:800px;top:310px;transform:translateX(-50%);z-index:63;display:none;padding:5px 22px 7px 18px;border-radius:12px;
  font-family:var(--pop);font-size:28px;line-height:1;color:#fff;-webkit-text-stroke:5px #7A2E00;paint-order:stroke fill;
  background:linear-gradient(180deg,#FFD35A,#FF9A1A 55%,#E0620A);border:3px solid #FFF3C8;
  box-shadow:0 5px 0 rgba(0,0,0,.4),0 0 22px rgba(255,170,40,.65);white-space:nowrap;pointer-events:none}
#dbl.dkb-on{display:block;animation:dkbTagIn .42s cubic-bezier(.2,1.5,.4,1) .06s both}
#dbl.dkb-out{display:block;animation:dkbOut .2s cubic-bezier(.4,0,1,1) forwards}

/* ゲージインパクト（黒いリボン＋金メダル「カード効果」） */
.dkb-imp{position:absolute;left:800px;top:500px;z-index:63;display:none;align-items:center;transform:translateX(-50%);pointer-events:none}
.dkb-imp.dkb-on{display:flex;animation:dkbTagIn .44s cubic-bezier(.2,1.5,.4,1) .12s both}
.dkb-imp.dkb-out{display:flex;animation:dkbOut .2s cubic-bezier(.4,0,1,1) forwards}
.dkb-imp b{position:relative;display:block;margin-left:-22px;padding:8px 30px 9px 34px;font-size:22px;font-weight:900;line-height:1;
  color:#fff;white-space:nowrap;letter-spacing:.04em;text-shadow:0 2px 0 #000;
  background:linear-gradient(180deg,#2A2A2A,#050505);border-top:2px solid #E0B040;border-bottom:2px solid #8A6314;
  clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%)}
.dkb-imp i{position:relative;z-index:2;flex:0 0 auto;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;
  font-style:normal;font-size:16px;font-weight:900;line-height:1.05;text-align:center;color:#3A2405;
  background:radial-gradient(circle at 35% 28%,#FFF7DC,#F0CE72 42%,#C8952F 72%,#7C5410);
  border:3px solid #5A3A04;box-shadow:0 4px 0 rgba(0,0,0,.4),0 0 16px rgba(255,210,80,.7),inset 0 2px 0 rgba(255,255,255,.6)}

/* ダブルの吹き出し */
.dkb-dmsg{position:absolute;left:800px;top:616px;z-index:63;display:none;transform:translateX(-50%);pointer-events:none;
  padding:10px 28px 12px;border-radius:16px;text-align:center;white-space:nowrap;
  background:linear-gradient(180deg,rgba(40,44,58,.94),rgba(12,14,22,.94));border:2px solid rgba(200,214,240,.8);
  box-shadow:0 8px 20px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.2)}
.dkb-dmsg::before{content:"";position:absolute;left:50%;top:-14px;margin-left:-12px;border:12px solid transparent;border-top:0;
  border-bottom:14px solid rgba(200,214,240,.8)}

/* ══════════ お金の帯（黒地・金枠・金の数字。HUD の上にせり出す） ══════════ */
.pill.dkb-band{display:none;position:absolute;z-index:95;align-items:center;gap:12px;height:64px;padding:0 20px 0 9px;

.dkb-band.dkb-dn .dkb-bnum{color:#EAF4FF;-webkit-text-stroke-color:#0C1E38}
.dkb-bTop{left:126px;top:44px}
.dkb-bTR{right:126px;top:44px}
.dkb-bBL{left:126px;bottom:48px}
.dkb-bBot{right:126px;bottom:48px}

/* ══════════ 発動パネル（HUD の横から滑り込む） ══════════ */

.dkb-pic{position:relative;flex:0 0 auto;width:54px;height:54px;border-radius:11px;display:grid;place-items:center;

.dkb-pnl.dkb-miss .dkb-pic::after{content:"▲";position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;

.dkb-ptx{min-width:0}

/* ══════════ 通行料の吹き出し（払う駒の頭上。割引は青） ══════════ */
