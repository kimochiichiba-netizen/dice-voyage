<style>
/* ══════════════════════════════════════════════════════════════
   ダイスキングダム — 盤の見た目・HUD・対戦中の通知・エモート（1r-board.html / v9 WP7 → v10 WP14）
   ──────────────────────────────────────────────────────────────
   ・担当セレクタ（§10）：.hud .portrait .rankbadge #plate #ticker #chip #dbl #turnbig #band
     #skillcut #raise #alarm #shake #celebrate #flash .pill #emote* #menu #itembar #legend と .dkb-*
   ・担当 keyframe を transform だけの入場に定義し直す（0% で opacity を下げない）。
   ・金文字は color の単色＋-webkit-text-stroke＋text-shadow（background-clip:text は使わない）。
   ・四隅の HUD は 9h-board.js が作り直す（.hud.dkb-hud）。旧 HUD と旧順位バッジは隠す。
   ・v10：HUD は「総資産」「マーブル」、魔力ゲージなし、揺らすは .dkb-shake の時だけ。対戦中の通知は
     暗い帯（#band）と HUD の角のパネル（.dkb-pnl）の2種類。スマホ（html.fx-mob）では常時アニメを足さない。
   ══════════════════════════════════════════════════════════════ */

/* ══════════ 担当 keyframe（入場は transform だけ） ══════════ */
@keyframes tickFade{from{transform:translateY(8px) scale(.96)}to{transform:none}}
@keyframes pillIn{0%{transform:scale(1.32)}60%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes bandIn{0%{transform:scaleY(.86)}100%{transform:none}}
@keyframes chipPop{0%{transform:scale(1.62) rotate(-8deg)}52%{transform:scale(.92) rotate(2deg)}76%{transform:scale(1.04)}100%{transform:none}}
@keyframes scIn{0%{transform:scaleX(.86)}100%{transform:none}}
@keyframes tbIn{0%{transform:scaleX(.86)}62%{transform:scaleX(1.03)}100%{transform:none}}
@keyframes alarmIn{0%{transform:translate(-50%,-50%) scale(.86)}60%{transform:translate(-50%,-50%) scale(1.06)}
  100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes flash{0%{opacity:0}22%{opacity:.8}100%{opacity:0}}
@keyframes skillReady{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.08)}}
@keyframes inflPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes sirene{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
/* WP7 の自前 keyframe */
@keyframes dkbFlip{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(180deg) scale(1.14)}100%{transform:rotateY(360deg) scale(1)}}
@keyframes dkbSpin{to{transform:rotate(360deg)}}
@keyframes dkbSpinR{to{transform:rotate(-360deg)}}
@keyframes dkbTagIn{0%{transform:translateX(-50%) scale(1.45)}60%{transform:translateX(-50%) scale(.94)}100%{transform:translateX(-50%) scale(1)}}
@keyframes dkbPopIn{0%{transform:scale(1.4)}60%{transform:scale(.94)}100%{transform:none}}
@keyframes dkbOut{to{transform:scale(.9);opacity:0}}
@keyframes dkbBandOut{to{transform:translateY(-14px) scale(.96);opacity:0}}
@keyframes dkbPnlL{0%{transform:translateX(-40px) scale(.94)}70%{transform:translateX(4px)}100%{transform:none}}
@keyframes dkbPnlR{0%{transform:translateX(40px) scale(.94)}70%{transform:translateX(-4px)}100%{transform:none}}
@keyframes dkbPnlOut{to{transform:translateY(-8px) scale(.96);opacity:0}}
@keyframes dkbBubIn{0%{transform:scale(1.4) translateY(-10px)}58%{transform:scale(.94)}100%{transform:none}}
@keyframes dkbRaiseIn{0%{transform:scale(1.7) rotate(-6deg)}55%{transform:scale(.94) rotate(2deg)}100%{transform:scale(1) rotate(-2deg)}}
@keyframes dkbShine{0%,62%{transform:translateX(-140%) skewX(-18deg)}100%{transform:translateX(420%) skewX(-18deg)}}
@keyframes dkbBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes dkbWarn{0%,100%{color:#FFB07A}50%{color:#FF4A2A}}

/* ══════════ 盤のまわりを暗くする ══════════ */
.dkb-vignette{position:absolute;inset:0;z-index:30;pointer-events:none;
  background:radial-gradient(125% 100% at 50% 50%,rgba(0,0,0,0) 56%,rgba(10,5,0,.46) 100%)}

/* ══════════ 旧 HUD・旧順位バッジは隠す（新しい HUD は .hud.dkb-hud） ══════════ */
#hudTop,#hudBot,#hudTR,#hudBL,#rTop,#rBot,#rTR,#rBL{display:none!important}
#legend{display:none!important}

/* ══════════ 四隅の HUD ══════════ */
.hud.dkb-hud{position:absolute;z-index:80;display:flex;gap:8px;align-items:flex-start;pointer-events:none;
  transition:none;--pc:#E14A5A;--pcd:#6E1A22}
.dkb-hud.dkb-Top{left:10px;top:8px}
.dkb-hud.dkb-TR{right:10px;top:8px;flex-direction:row-reverse}
.dkb-hud.dkb-BL{left:10px;bottom:8px;align-items:flex-end}
.dkb-hud.dkb-Bot{right:10px;bottom:8px;flex-direction:row-reverse;align-items:flex-end}

.dkb-pwrap{position:relative;flex:0 0 auto;width:112px;height:112px}
.dkb-por{position:absolute;inset:0;border-radius:14px;pointer-events:auto;cursor:pointer;
  background:linear-gradient(152deg,#FFF7DC 0%,#F0CE72 14%,#C8952F 30%,#7C5410 46%,#A8752A 58%,#F3D583 76%,#8A6314 90%,#FFF3C8 100%);
  box-shadow:0 4px 0 rgba(0,0,0,.5),0 10px 22px rgba(0,0,0,.45)}
.dkb-pin{position:absolute;inset:4px;border-radius:10px;overflow:hidden;
  background:radial-gradient(120% 100% at 50% 10%,var(--pc),#140B03 80%)}
.dkb-pin canvas{display:block;width:100%;height:100%}
.dkb-pin::after{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(255,236,180,.35),inset 0 -18px 22px rgba(0,0,0,.35)}
.dkb-rar{position:absolute;left:-7px;top:-9px;z-index:3;padding:1px 8px 2px;border-radius:9px;
  font-family:var(--caps);font-size:18px;line-height:1.1;font-weight:400;color:#fff;
  -webkit-text-stroke:3px #3A1E02;paint-order:stroke fill;
  background:linear-gradient(180deg,#FFE58A,#E09A12);border:2px solid #5A3A04;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.dkb-rar.dkb-rA{background:linear-gradient(180deg,#BFE3FF,#3E8FE0)}
.dkb-rar.dkb-rS{background:linear-gradient(180deg,#E8D2FF,#9A5AE0)}
.dkb-lv{position:absolute;left:-8px;bottom:-8px;z-index:3;min-width:38px;height:38px;padding:0 4px;border-radius:19px;
  display:grid;place-items:center;font-family:var(--pop);font-size:18px;font-weight:400;color:#fff;
  -webkit-text-stroke:3px #0E1A30;paint-order:stroke fill;
  background:radial-gradient(circle at 34% 28%,#5C7EB8,#1B2E4E 72%);border:2px solid #E0AE33;box-shadow:0 2px 0 rgba(0,0,0,.5)}
.dkb-TR .dkb-lv,.dkb-Bot .dkb-lv{left:auto;right:-8px}
.dkb-ab{position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);z-index:3;padding:2px 12px 3px;border-radius:10px;
  font-size:16px;font-weight:900;color:#fff;-webkit-text-stroke:3px #1A4A14;paint-order:stroke fill;white-space:nowrap;
  background:linear-gradient(180deg,#9BEF7E,#46B83A 55%,#2A7E22);border:2px solid #1F5A1C;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.dkb-turn{display:none;position:absolute;left:50%;top:-20px;transform:translateX(-50%);z-index:4;padding:1px 12px 2px;border-radius:9px;
  font-style:normal;font-size:16px;font-weight:900;color:#3A2405;white-space:nowrap;
  background:linear-gradient(180deg,#FFF6C8,#F2C230 60%,#C88A12);border:2px solid #6B4408;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.dkb-hud.dkb-myturn .dkb-turn{display:block;animation:dkbBobC 1.2s ease-in-out infinite}
@keyframes dkbBobC{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
/* 下の2席は、肖像の下の能力ボタンがステージの外へ出ないように持ち上げる */
.dkb-BL .dkb-pwrap,.dkb-Bot .dkb-pwrap{margin-bottom:20px}
.dkb-hud.dkb-myturn .dkb-por{box-shadow:0 4px 0 rgba(0,0,0,.5),0 0 0 3px #FFF1B0,0 0 26px 6px rgba(255,210,80,.72)}
/* 手番の光は止まった輪にする（となりで「あなたの番」の札が揺れているので、光まで脈打たせない。
   盤の常時アニメを1画面8個までに収めるため。肖像の .dkb-por 側にも金の光がある） */
.dkb-hud.dkb-myturn .dkb-pwrap::before{content:"";position:absolute;inset:-10px;border-radius:20px;pointer-events:none;
  box-shadow:0 0 24px 9px rgba(255,214,90,.62)}

/* 自分の席の「能力」札（#skillBtn は DOM の約束。押すと能力の説明を開くだけで盤は変わらない。J33・J47） */
#skillBtn.dkb-skill{position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);z-index:5;pointer-events:auto;
  min-width:0;height:auto;padding:1px 13px 3px;border-radius:10px;border:2px solid #1F5A1C;cursor:pointer;
  font-family:var(--jp);font-weight:900;font-size:20px;line-height:1.1;color:#fff;
  -webkit-text-stroke:3px #1A4A14;paint-order:stroke fill;white-space:nowrap;
  background:linear-gradient(180deg,#9BEF7E,#46B83A 55%,#2A7E22);
  box-shadow:0 2px 0 rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.45);filter:none;animation:none}
#skillBtn.dkb-skill:disabled{filter:none;cursor:pointer}
#skillBtn.dkb-skill:active{transform:translateX(-50%) translateY(2px)}
/* 自動プレイ中の［自動］（自分の札は押すと手動に戻る） */
.dkb-auto{display:none;position:absolute;right:-10px;top:-12px;z-index:6;pointer-events:auto;padding:1px 10px 2px;border-radius:10px;
  font-family:var(--jp);font-size:20px;font-weight:900;line-height:1.15;color:#fff;cursor:default;white-space:nowrap;
  -webkit-text-stroke:3px #0B2E66;paint-order:stroke fill;
  background:linear-gradient(180deg,#8FD0FF,#2F86E8 60%,#1A5CB8);border:2px solid #FFFFFF;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.dkb-hud.dkb-isauto .dkb-auto{display:block}
.dkb-hud.dkb-Bot.dkb-isauto .dkb-auto{pointer-events:auto;cursor:pointer}
.dkb-TR .dkb-auto,.dkb-Bot .dkb-auto{right:auto;left:-10px}

.dkb-col{display:flex;flex-direction:column;gap:3px;width:252px;padding-top:2px}
.dkb-BL .dkb-col,.dkb-Bot .dkb-col{flex-direction:column-reverse;padding:0 0 2px}
.dkb-TR .dkb-col,.dkb-Bot .dkb-col{align-items:flex-end}
.dkb-name{max-width:100%;height:32px;display:flex;align-items:center;gap:6px;padding:0 6px 0 14px;border-radius:16px;
  background:linear-gradient(90deg,var(--pc),var(--pcd));border:2px solid rgba(255,236,190,.6);
  box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.35)}
.dkb-TR .dkb-name,.dkb-Bot .dkb-name{flex-direction:row-reverse;padding:0 14px 0 6px}
.dkb-nm{min-width:0;max-width:190px;font-size:22px;font-weight:900;line-height:1.1;color:#fff;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 6px rgba(0,0,0,.5)}
/* 名札の枠（C24：dkFrameOf。銅・銀・金、ほかは金） */
.dkb-hud[data-frame] .dkb-name{border-color:#F2C230;box-shadow:0 3px 0 rgba(0,0,0,.4),0 0 0 2px rgba(60,36,4,.55),0 0 10px rgba(255,214,90,.55),inset 0 2px 0 rgba(255,255,255,.35)}
.dkb-hud[data-frame*="bronze"] .dkb-name{border-color:#D08A4A}
.dkb-hud[data-frame*="silver"] .dkb-name{border-color:#E4ECF6;box-shadow:0 3px 0 rgba(0,0,0,.4),0 0 0 2px rgba(40,50,64,.55),0 0 10px rgba(220,235,255,.55),inset 0 2px 0 rgba(255,255,255,.35)}
/* チーム戦の札（Red Team／Blue Team） */
.dkb-tm{display:none;padding:1px 10px;border-radius:8px;font-family:var(--caps);font-size:16px;line-height:1.3;color:#fff;white-space:nowrap;
  background:linear-gradient(180deg,#FF6A5A,#C0261A);border:1px solid rgba(255,255,255,.7);letter-spacing:.02em;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.dkb-col > .dkb-tm{align-self:flex-start}
.dkb-TR .dkb-col > .dkb-tm,.dkb-Bot .dkb-col > .dkb-tm{align-self:flex-end}
.dkb-hud.dkb-team .dkb-tm{display:block}
.dkb-hud.dkb-tblue .dkb-tm{background:linear-gradient(180deg,#6AB4FF,#1E64C8)}
/* 👍 の数（相手の札は押すといいね） */
.dkb-lk{flex:0 0 auto;margin-left:auto;display:flex;align-items:center;gap:2px;height:26px;padding:0 8px;border-radius:13px;
  border:1px solid rgba(255,236,190,.55);background:rgba(0,0,0,.35);color:#fff;cursor:default;pointer-events:auto;
  font-family:var(--pop);font-size:20px;line-height:1}
.dkb-TR .dkb-lk,.dkb-Bot .dkb-lk{margin-left:0;margin-right:auto}
.dkb-lk i{font-style:normal;font-size:20px}
.dkb-lk b{font-weight:400;font-size:20px}
.dkb-hud.dkb-lkon .dkb-lk{cursor:pointer}
.dkb-hud.dkb-lkon .dkb-lk:active{transform:scale(.94)}
.dkb-row{display:flex;align-items:center;gap:8px;height:34px;max-width:100%;padding:0 10px 0 6px;border-radius:9px;
  background:linear-gradient(180deg,rgba(28,18,7,.86),rgba(8,5,2,.9));border:1px solid rgba(201,149,47,.62);
  box-shadow:inset 0 1px 0 rgba(255,226,160,.14)}
.dkb-TR .dkb-row,.dkb-Bot .dkb-row{flex-direction:row-reverse;padding:0 6px 0 10px}
.dkb-rc{height:42px}
.dkb-k{flex:0 0 auto;font-size:16px;font-weight:900;line-height:1.2;color:#EBD8A8;padding:1px 7px;border-radius:5px;
  background:rgba(122,86,30,.55);white-space:nowrap}
.dkb-asset{font-family:var(--pop);font-size:24px;font-weight:400;line-height:1;color:#FFB4A4;white-space:nowrap;
  -webkit-text-stroke:3px #3A0E10;paint-order:stroke fill}
.dkb-cash{font-family:var(--pop);font-size:30px;font-weight:400;line-height:1;color:#FFFFFF;white-space:nowrap;
  -webkit-text-stroke:4px #1A1206;paint-order:stroke fill}
.dkb-Bot .dkb-cash{color:#FFE27A}
.dkb-hud.dkb-long .dkb-cash{font-size:25px}
.dkb-hud.dkb-long .dkb-asset{font-size:21px}
/* 「邪魔できる回数」は揺らす（当作ルール）の時だけ（J45）。魔力ゲージは出さない（J33） */
.dkb-jam{display:none;font-size:16px;font-weight:900;line-height:1.2;color:#D8E6F4;white-space:nowrap;text-shadow:0 1px 2px #000,0 0 4px #000}
.dkb-hud.dkb-shake .dkb-jam{display:block}
.dkb-jam b{font-family:var(--pop);font-size:18px;font-weight:400;color:#FFD24D}

.dkb-rank{flex:0 0 auto;width:78px;height:78px;border-radius:50%;display:flex;align-items:baseline;justify-content:center;
  padding-top:18px;line-height:1;font-family:var(--pop);color:#fff;-webkit-text-stroke:3px rgba(0,0,0,.62);paint-order:stroke fill;
  background:radial-gradient(circle at 36% 26%,rgba(255,255,255,.42),rgba(255,255,255,0) 38%),
             radial-gradient(circle at 50% 62%,var(--pc),var(--pcd) 80%);
  border:4px solid #F2C230;box-shadow:0 4px 0 rgba(0,0,0,.5),inset 0 0 14px rgba(0,0,0,.55),0 0 16px rgba(242,194,48,.38)}
.dkb-rank b{font-size:34px;font-weight:400}
.dkb-rank small{font-size:17px}
.dkb-rank.dkb-flip{animation:dkbFlip .62s cubic-bezier(.2,1.2,.4,1)}
.dkb-hud.dkb-out .dkb-col,.dkb-hud.dkb-out .dkb-pwrap{opacity:.62;filter:grayscale(.8)}

/* ══════════ 中央プレート（時間・制限ターン／場の総額） ══════════ */
/* 大きなぼかしの影を置かない（1秒ごとに変わる時計と同じ層を重くしない。H10） */
/* 少し上に置き、ゲージの「ゲージインパクト！」と×ダブルの札にかからないようにする（GO-3・WP7#3） */
#plate{top:238px;min-width:300px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 0 0 3px #F7E7DB}
/* 四隅の鋲（本家の羊皮紙プレートの金具）。静止した背景なので層は増えない＝iPhone の画素は増えない */
#plate::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:
    radial-gradient(circle at 8px 8px,#FFF4D2 0 1.5px,#DCAC42 2.6px,#7A5518 3.9px,transparent 4.3px),
    radial-gradient(circle at calc(100% - 8px) 8px,#FFF4D2 0 1.5px,#DCAC42 2.6px,#7A5518 3.9px,transparent 4.3px),
    radial-gradient(circle at 8px calc(100% - 8px),#FFF4D2 0 1.5px,#DCAC42 2.6px,#7A5518 3.9px,transparent 4.3px),
    radial-gradient(circle at calc(100% - 8px) calc(100% - 8px),#FFF4D2 0 1.5px,#DCAC42 2.6px,#7A5518 3.9px,transparent 4.3px)}
#plate .hd{display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 16px 3px;font-size:17px;line-height:1.2;
  background:linear-gradient(180deg,#8A6848,#5E432B);color:#EFDCA8}
#plate .hd .dkb-pk{font-size:16px;font-weight:900;color:#E8D0A0}
/* 秒の文字は小さな箱に閉じ込める（contain:paint。WP10 の tickClock が書く） */
#plate .timer{display:inline-block;min-width:3.1em;text-align:center;contain:layout paint;
  font-family:var(--pop);font-size:19px;color:#FFE9A8;letter-spacing:.02em;margin-right:10px}
#plate .timer.warn{animation:dkbWarn .8s steps(2) infinite}
#plate .hd em{font-family:var(--pop);font-size:19px;color:#fff;font-style:normal}
#plate .bd{position:relative;overflow:hidden;font-size:34px;line-height:1.15;padding:3px 22px 6px;color:#1A1208}
#plate .bd::after{content:"";position:absolute;top:0;bottom:0;left:0;width:26%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:dkbShine 5.6s ease-in-out infinite}
#plate .infl{display:none;font-family:var(--pop);font-size:16px;padding:1px 10px;border-radius:999px;
  background:linear-gradient(90deg,#C0261A,#F0602A);color:#FFE9B5;box-shadow:0 0 12px rgba(255,90,40,.75);
  animation:inflPulse 1.1s ease-in-out infinite}
#plate .infl.on{display:inline-block}

/* ══════════ 上の告知テロップ（黒帯・金縁・黄文字） ══════════ */
#ticker{left:50%;top:10px;bottom:auto;width:560px;height:48px;transform:translateX(-50%);z-index:82;border-radius:10px;
  background:linear-gradient(180deg,rgba(24,15,4,.94),rgba(6,3,0,.94));
  border:2px solid #C9952F;box-shadow:0 4px 12px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,226,150,.25)}
#stage #ticker{border-top:2px solid #E0B040;border-bottom:2px solid #8A6314}
#ticker::before{background:linear-gradient(90deg,rgba(6,3,0,.95),transparent)}
#ticker::after{background:linear-gradient(270deg,rgba(6,3,0,.95),transparent)}
/* 文字が変わった時だけ1回入場させる（4-game.js が 5.2秒ごとに文を差し替え、news() は dkbReplay で出し直す）。
   ずっと繰り返すと、見た目は同じなのに常時アニメを1個使い続けてしまう */
#ticker b{font-size:20px;font-weight:900;color:#FFE14A;-webkit-text-stroke:0;text-shadow:0 2px 0 rgba(0,0,0,.6);
  animation:tickFade .52s cubic-bezier(.16,1,.3,1)}

/* ══════════ 出目（白い丸＋黒の極太数字／インパクトは金の太陽） ══════════ */
/* 勝利の文字（canvas）の上にプレートを重ねない */
#stage.dkb-cel #plate{visibility:hidden}
#chip{left:800px;top:406px;width:166px;height:166px;margin:-83px 0 0 -83px;transform:none;z-index:62;display:none;
  background:none;box-shadow:none;border-radius:50%;font-size:0;color:transparent;pointer-events:none}
#chip.dkb-on{display:block;animation:chipPop .5s cubic-bezier(.2,1.5,.4,1) both}
#chip.dkb-out{animation:dkbOut .2s cubic-bezier(.4,0,1,1) forwards}
#chip .dkb-rays{display:none;position:absolute;left:50%;top:50%;width:470px;height:470px;margin:-235px 0 0 -235px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,236,120,.62) 0 8deg,rgba(255,236,120,0) 8deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 0,#000 22%,transparent 64%);mask:radial-gradient(circle,#000 0,#000 22%,transparent 64%);
  animation:dkbSpin 7s linear infinite}
#chip .dkb-rays2{display:none;position:absolute;left:50%;top:50%;width:380px;height:380px;margin:-190px 0 0 -190px;border-radius:50%;
  background:repeating-conic-gradient(from 9deg,rgba(180,255,120,.4) 0 5deg,rgba(180,255,120,0) 5deg 24deg);
  -webkit-mask:radial-gradient(circle,#000 0,#000 25%,transparent 66%);mask:radial-gradient(circle,#000 0,#000 25%,transparent 66%);
  animation:dkbSpinR 11s linear infinite}
/* ふだんは白銀の札（ダブルだけ金。J48） */
#chip .dkb-disc{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 38% 30%,#FFFFFF 0,#EEF2F7 38%,#C9D2DD 72%,#98A6B7 100%);
  border:5px solid #F4F7FB;
  box-shadow:0 0 0 3px rgba(120,136,156,.55),0 10px 0 rgba(0,0,0,.28),0 18px 34px rgba(0,0,0,.5),
             inset 0 -14px 20px rgba(60,78,104,.32),inset 0 8px 12px rgba(255,255,255,.95)}
#chip .dkb-disc::after{content:"";position:absolute;left:18%;top:9%;width:52%;height:26%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0))}
#chip .dkb-num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--caps);font-size:112px;
  font-weight:400;line-height:1;color:#15110B;letter-spacing:-.04em;padding-top:4px;
  text-shadow:0 3px 0 rgba(255,255,255,.8)}
#chip.dkb-two .dkb-num{font-size:88px}
#chip.dkb-gold .dkb-rays,#chip.dkb-gold .dkb-rays2{display:block}
#chip.dkb-gold .dkb-disc{border-color:#FFF4B0;
  background:radial-gradient(circle at 38% 30%,#FFFDE0 0,#FFE85E 36%,#F5B81E 70%,#B87408 100%);
  box-shadow:0 10px 0 rgba(90,50,0,.35),0 0 50px 18px rgba(255,214,70,.7),0 0 110px 40px rgba(255,190,40,.35),
             inset 0 -12px 18px rgba(140,70,0,.35),inset 0 8px 12px rgba(255,255,230,.95)}
#chip.dkb-gold .dkb-num{color:#2A1602;text-shadow:0 3px 0 rgba(255,246,190,.9)}

/* ダブル札（出目の上） */
#dbl{left:800px;top:314px;transform:translateX(-50%);z-index:63;display:none;padding:5px 22px 7px 18px;border-radius:12px;
  font-family:var(--pop);font-size:28px;line-height:1;color:#fff;-webkit-text-stroke:5px #7A2E00;paint-order:stroke fill;
  background:linear-gradient(180deg,#FFD35A,#FF9A1A 55%,#E0620A);border:3px solid #FFF3C8;
  box-shadow:0 5px 0 rgba(0,0,0,.4),0 0 22px rgba(255,170,40,.65);white-space:nowrap;pointer-events:none}
#dbl.dkb-on{display:block;animation:dkbTagIn .42s cubic-bezier(.2,1.5,.4,1) .06s both}
#dbl.dkb-out{display:block;animation:dkbOut .2s cubic-bezier(.4,0,1,1) forwards}

/* ゲージインパクト（黒いリボン＋金メダル「カード効果」） */
.dkb-imp{position:absolute;left:800px;top:500px;z-index:63;display:none;align-items:center;transform:translateX(-50%);pointer-events:none}
.dkb-imp.dkb-on{display:flex;animation:dkbTagIn .44s cubic-bezier(.2,1.5,.4,1) .12s both}
.dkb-imp.dkb-out{display:flex;animation:dkbOut .2s cubic-bezier(.4,0,1,1) forwards}
.dkb-imp b{position:relative;display:block;margin-left:-22px;padding:8px 30px 9px 34px;font-size:22px;font-weight:900;line-height:1;
  color:#fff;white-space:nowrap;letter-spacing:.04em;text-shadow:0 2px 0 #000;
  background:linear-gradient(180deg,#2A2A2A,#050505);border-top:2px solid #E0B040;border-bottom:2px solid #8A6314;
  clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%)}
.dkb-imp i{position:relative;z-index:2;flex:0 0 auto;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;
  font-style:normal;font-size:16px;font-weight:900;line-height:1.05;text-align:center;color:#3A2405;
  background:radial-gradient(circle at 35% 28%,#FFF7DC,#F0CE72 42%,#C8952F 72%,#7C5410);
  border:3px solid #5A3A04;box-shadow:0 4px 0 rgba(0,0,0,.4),0 0 16px rgba(255,210,80,.7),inset 0 2px 0 rgba(255,255,255,.6)}

/* ══════════ 盤の上の小さな札（駒やマスに付いて動く。左上 0,0 に置き transform で運ぶ） ══════════ */
.dkb-busy,.dkb-tinfo,.dkb-sal,.dkb-mono{position:absolute;left:0;top:0;width:0;height:0;display:none;pointer-events:none}
.dkb-busy.on,.dkb-tinfo.on,.dkb-sal.on,.dkb-mono.on{display:block}
/* 他の人が選ぶ間の札（暗い角丸・白字・3つの点。J34） */
.dkb-busy{z-index:96}
.dkb-bin2{position:absolute;left:0;bottom:0;translate:-50% 0;min-width:190px;padding:9px 22px 8px;border-radius:12px;text-align:center;
  white-space:nowrap;background:rgba(20,30,44,.88);border:2px solid rgba(190,210,235,.75);box-shadow:0 6px 16px rgba(0,0,0,.5);
  animation:dkbPopIn .3s cubic-bezier(.2,1.5,.4,1) both}
.dkb-bin2::after{content:"";position:absolute;left:50%;bottom:-13px;margin-left:-10px;border:10px solid transparent;border-bottom:0;
  border-top:12px solid rgba(190,210,235,.75)}
.dkb-bt{display:block;font-size:20px;font-weight:900;line-height:1.3;color:#FFFFFF;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.dkb-dots{position:relative;display:flex;justify-content:center;gap:9px;margin-top:5px}
.dkb-dots b{width:11px;height:11px;border-radius:50%;background:#FFFFFF;opacity:.3}
/* 光る点は1個だけを3つの点の上へ順に跳ばす（点ごとに光らせると常時アニメが3個になるため。見た目は同じ。J34）。
   3つの点は 11px＋すき間 9px＝横 51px。左端は中央から 25.5px 左、跳ぶ先は 0→20→40px */
.dkb-dots::after{content:"";position:absolute;left:50%;top:0;margin-left:-25.5px;width:11px;height:11px;border-radius:50%;
  background:#FFFFFF;animation:dkbDotRun 1.05s steps(3) infinite}
@keyframes dkbDotRun{from{transform:translateX(0)}to{transform:translateX(60px)}}
/* マスの情報（押したマス。J59・社長のご要望②：サイコロを振る前でも見られる。［閉じる］か外のタップで閉じる） */
.dkb-tinfo{z-index:97}
/* 入場は押したマスの側（下の矢印の根元）から開く。中心から広げるとステージの外へふくらむ */
.dkb-tin{position:absolute;left:0;bottom:0;translate:-50% 0;width:372px;padding:9px 14px 11px;border-radius:14px;pointer-events:auto;
  transform-origin:50% 100%;
  background:linear-gradient(180deg,rgba(40,30,16,.97),rgba(12,8,3,.98));border:2px solid #C9952F;
  box-shadow:0 10px 24px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,226,150,.25);animation:dkbPopIn .26s cubic-bezier(.2,1.5,.4,1) both}
.dkb-tibelow .dkb-tin{transform-origin:50% 0}
.dkb-tin::after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-11px;border:11px solid transparent;border-bottom:0;
  border-top:13px solid #C9952F}
/* 上に入らないマス（盤の上のふち）は下へ回す＝矢印も上向きにする */
.dkb-tibelow .dkb-tin{bottom:auto;top:0}
.dkb-tibelow .dkb-tin::after{bottom:auto;top:-14px;border-top:0;border-bottom:13px solid #C9952F}
.dkb-tihd{display:flex;flex-direction:column;align-items:center;gap:2px}
.dkb-tnm{display:block;max-width:100%;font-size:22px;font-weight:900;line-height:1.25;color:#FFD44A;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkb-tgr{display:flex;align-items:center;gap:5px;font-style:normal;font-size:16px;font-weight:700;color:#E8DCC0;white-space:nowrap}
.dkb-tgr u{width:15px;height:15px;border-radius:5px;text-decoration:none;border:1px solid rgba(0,0,0,.45)}
.dkb-tgr i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.5)}
.dkb-tgr i.dkb-tgme{box-shadow:0 0 0 2px #FFD44A}
.dkb-tdist{display:block;font-size:16px;font-weight:700;color:#E8DCC0;text-align:center;margin:1px 0 6px}
.dkb-tdist em{font-style:normal;font-family:var(--pop);font-size:20px;color:#FFFFFF;margin:0 2px}
.dkb-tin p{display:flex;justify-content:space-between;align-items:baseline;gap:18px;padding:3px 2px;border-top:1px solid rgba(201,149,47,.35);
  white-space:nowrap}
.dkb-tin p span{font-size:16px;font-weight:900;color:#EBD8A8}
.dkb-tin p b{min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:var(--pop);font-size:19px;font-weight:400;color:#FFFFFF}
/* 段ごとの「建設／通行料」の表（本家のマスの情報） */
.dkb-tlvs{margin-top:7px;padding-top:3px;border-top:2px solid rgba(201,149,47,.55)}
.dkb-tlvs p{display:grid;grid-template-columns:1fr 96px 96px;gap:6px;padding:2px 4px;border-top:0;border-radius:6px}
.dkb-tlvs p span{overflow:hidden;text-overflow:ellipsis;font-size:16px;font-weight:900;color:#EBD8A8}
.dkb-tlvs p u{font-family:var(--pop);font-size:17px;font-weight:400;color:#D8C8A8;text-align:right;text-decoration:none}
.dkb-tlvs p b{font-family:var(--pop);font-size:17px;font-weight:400;color:#FFFFFF;text-align:right}
.dkb-tlvh span,.dkb-tlvh u,.dkb-tlvh b{font-family:var(--jp)!important;font-size:16px!important;font-weight:900!important;color:#C9A44A!important}
.dkb-tlv.on{background:rgba(242,194,48,.2);box-shadow:inset 0 0 0 1px rgba(242,194,48,.5)}
.dkb-tlv.on span,.dkb-tlv.on b{color:#FFE9A8}
.dkb-thelp{display:block;margin-top:7px;font-size:16px;font-weight:700;line-height:1.4;color:#D8C8A8;white-space:normal}
.dkb-tbtns{display:flex;justify-content:center;margin-top:9px}
.dkb-tin .btn.dkb-tclose{min-width:160px;width:auto;height:auto;padding:5px 20px 7px;font-size:22px}
/* 給料の青い丸札（スタートの近く。J06） */
.dkb-sal{z-index:92}
.dkb-sal b{position:absolute;left:0;bottom:0;translate:-50% 0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:118px;height:118px;border-radius:50%;text-align:center;white-space:nowrap;
  background:radial-gradient(circle at 36% 28%,#BFE6FF,#3E9BF0 48%,#1A5CB8 100%);border:4px solid #FFFFFF;
  box-shadow:0 6px 0 rgba(0,0,0,.3),0 0 18px rgba(90,170,255,.6);animation:dkbPopIn .36s cubic-bezier(.2,1.6,.4,1) both}
.dkb-sal small{font-size:18px;font-weight:900;line-height:1.1;color:#FFFFFF;-webkit-text-stroke:3px #0B2E66;paint-order:stroke fill}
.dkb-sal span{font-family:var(--pop);font-size:26px;line-height:1.1;color:#FFFFFF;-webkit-text-stroke:4px #0B2E66;paint-order:stroke fill}
/* カラー独占（駒の上の水色の字。J50） */
.dkb-mono{z-index:93}
.dkb-mono b{position:absolute;left:0;bottom:0;translate:-50% 0;white-space:nowrap;font-family:var(--pop);font-size:44px;font-weight:400;
  line-height:1;color:#8FEAFF;-webkit-text-stroke:7px #0A3A5A;paint-order:stroke fill;
  text-shadow:0 4px 0 #062538,0 0 20px rgba(120,230,255,.75);transform-origin:50% 100%;
  animation:dkbRaiseIn .5s cubic-bezier(.2,1.6,.4,1) both}

/* ══════════ お金の帯（黒地・金枠・金の数字。HUD の上にせり出す） ══════════ */
.pill.dkb-band{display:none;position:absolute;z-index:95;align-items:center;gap:12px;height:64px;padding:0 20px 0 9px;
  border-radius:14px;pointer-events:none;transform-origin:center;
  background:linear-gradient(180deg,rgba(36,26,10,.97),rgba(6,4,1,.97)) padding-box,
             linear-gradient(152deg,#FFF7DC,#C8952F 30%,#7C5410 46%,#F3D583 76%,#8A6314) border-box;
  border:3px solid transparent;box-shadow:0 8px 18px rgba(0,0,0,.6),0 0 18px rgba(255,200,80,.25)}
.pill.dkb-band.on{display:flex;animation:pillIn .38s cubic-bezier(.2,1.5,.4,1) both}
.pill.dkb-band.dkb-fade{animation:dkbBandOut .3s cubic-bezier(.4,0,1,1) forwards}
.dkb-band .dkb-bar{flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  font-style:normal;font-size:22px;line-height:1;color:#fff;border:2px solid rgba(255,255,255,.75)}
.dkb-band.dkb-up .dkb-bar{background:radial-gradient(circle at 35% 30%,#FFE0A0,#F08A12 70%);box-shadow:0 0 14px rgba(255,160,40,.85)}
.dkb-band.dkb-dn .dkb-bar{background:radial-gradient(circle at 35% 30%,#B8E0FF,#1E74D8 70%);box-shadow:0 0 14px rgba(80,160,255,.85)}
.dkb-bnum{font-family:var(--pop);font-size:40px;font-weight:400;line-height:1;letter-spacing:.01em;white-space:nowrap;
  color:#FFE27A;-webkit-text-stroke:5px #2A1604;paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.45)}
.dkb-band.dkb-dn .dkb-bnum{color:#EAF4FF;-webkit-text-stroke-color:#0C1E38}
/* 帯の上の小さな ▲80万／▼17万（帯の中に置くので寸法を読まない） */
.dkb-ftag{position:absolute;right:12px;top:-30px;font-style:normal;font-family:var(--pop);font-size:24px;line-height:1;white-space:nowrap;
  pointer-events:none;-webkit-text-stroke:4px #1A1206;paint-order:stroke fill;animation:dkbFtag .95s cubic-bezier(.2,.8,.3,1) forwards}
.dkb-ftag.up{color:#FFDD7A}
.dkb-ftag.dn{color:#BFE2FF}
@keyframes dkbFtag{0%{transform:translateY(10px) scale(.8)}20%{transform:none}100%{transform:translateY(-22px);opacity:0}}
.dkb-bTop{left:126px;top:44px}
.dkb-bTR{right:126px;top:44px}
.dkb-bBL{left:126px;bottom:48px}
.dkb-bBot{right:126px;bottom:48px}

/* ══════════ 発動パネル（HUD の横から滑り込む） ══════════ */
.dkb-pbox{position:absolute;z-index:94;display:flex;flex-direction:column;gap:8px;width:440px;pointer-events:none}
.dkb-pTop{left:10px;top:160px}
.dkb-pTR{right:10px;top:160px;align-items:flex-end}
.dkb-pBL{left:10px;bottom:160px;flex-direction:column-reverse}
.dkb-pBot{right:10px;bottom:160px;flex-direction:column-reverse;align-items:flex-end}
.dkb-pnl{display:flex;align-items:center;gap:12px;max-width:440px;min-height:68px;padding:7px 18px 7px 8px;border-radius:14px;
  background:linear-gradient(180deg,rgba(26,20,14,.88),rgba(6,4,2,.9));border:2px solid rgba(214,166,64,.88);
  box-shadow:0 6px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,230,170,.25);animation:dkbPnlL .36s cubic-bezier(.2,1.4,.4,1) both}
.dkb-pTR .dkb-pnl,.dkb-pBot .dkb-pnl{animation-name:dkbPnlR}
.dkb-pnl.out{animation:dkbPnlOut .2s cubic-bezier(.4,0,1,1) forwards}
.dkb-pic{position:relative;flex:0 0 auto;width:54px;height:54px;border-radius:11px;display:grid;place-items:center;
  font-style:normal;font-size:30px;line-height:1;
  background:radial-gradient(circle at 35% 30%,#6A4E22,#1A1004);border:2px solid #F2C230;box-shadow:inset 0 0 10px rgba(0,0,0,.6)}
.dkb-pic small{position:absolute;right:-8px;top:-9px;padding:0 5px;border-radius:7px;font-family:var(--caps);font-size:16px;line-height:1.15;
  color:#fff;-webkit-text-stroke:2px #3A1E02;paint-order:stroke fill;background:linear-gradient(180deg,#FFE58A,#E09A12);border:1px solid #5A3A04}
.dkb-pnl.dkb-miss .dkb-pic::after{content:"▲";position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center;font-size:14px;color:#fff;background:linear-gradient(180deg,#FF9AD8,#E0409A);border:2px solid #fff}
.dkb-ptx{min-width:0}
.dkb-ptx b{display:block;font-size:20px;font-weight:900;line-height:1.25;color:#FFD44A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkb-ptx span{display:block;font-size:16px;font-weight:700;line-height:1.3;color:#F4ECDC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ══════════ 通行料の吹き出し（払う駒の頭上。割引は青） ══════════ */
.dkb-bub,#stage #raise{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;will-change:transform}
.dkb-bub{z-index:93;display:none}
.dkb-bub.on{display:block}
.dkb-bin{position:absolute;left:0;bottom:13px;translate:-50% 0;min-width:156px;padding:5px 18px 7px;border-radius:18px;
  text-align:center;white-space:nowrap;transform-origin:50% 120%;
  background:linear-gradient(180deg,#FF7456,#DB2A1E 58%,#A8120E);border:3px solid #FFFFFF;
  box-shadow:0 6px 14px rgba(0,0,0,.5);animation:dkbBubIn .4s cubic-bezier(.2,1.6,.4,1) both}
.dkb-bin::after{content:"";position:absolute;left:50%;bottom:-16px;margin-left:-11px;border:11px solid transparent;
  border-bottom:0;border-top:13px solid #FFFFFF}
.dkb-bin span{display:block;font-size:16px;font-weight:900;line-height:1.15;color:#FFEDE6}
.dkb-bin b{display:block;font-family:var(--pop);font-size:30px;font-weight:400;line-height:1.05;color:#fff;
  -webkit-text-stroke:4px #6A0806;paint-order:stroke fill}
.dkb-bub.dkb-blue .dkb-bin{background:linear-gradient(180deg,#78CCFF,#1E74D8 58%,#0F4CA0)}
.dkb-bub.dkb-blue .dkb-bin b{-webkit-text-stroke-color:#082A5E}

/* ══════════ 通行料値上げ！（そのマスの上に出す） ══════════ */
#stage #raise{z-index:92;display:none;right:auto;background:none;-webkit-background-clip:border-box;background-clip:border-box;
  color:#FFE04A;-webkit-text-stroke:0;filter:none;animation:none;font-size:0}
#stage #raise.on{display:block;animation:none}
#raise > b{position:absolute;left:0;bottom:0;translate:-50% 0;white-space:nowrap;font-family:var(--pop);font-size:46px;
  font-weight:400;line-height:1;color:#FFE04A;-webkit-text-stroke:8px #7A1600;paint-order:stroke fill;
  text-shadow:0 5px 0 #3A0800,0 0 22px rgba(255,170,40,.75);transform-origin:50% 100%;
  animation:dkbRaiseIn .5s cubic-bezier(.2,1.6,.4,1) both}
/* ランドマーク（青い大きな字。C13・J09） */
#stage #raise.dkb-blue > b{color:#A8DCFF;-webkit-text-stroke-color:#0B2E66;text-shadow:0 5px 0 #061A3A,0 0 22px rgba(90,170,255,.8)}

/* 手番の大見出し（#turnbig）は本家に無いので出さない（J46。9h の turnBig は何もしない） */

/* ══════════ 暗い帯（対戦中の通知の帯。暗い半透明の角丸＋白字。1本だけ。J36・J48） ══════════ */
#stage #band{left:50%;top:612px;width:auto;height:auto;min-width:520px;max-width:1000px;min-height:0;padding:12px 40px 13px;gap:2px;
  transform:translateX(-50%);border-radius:14px;text-align:center;
  background:rgba(22,28,40,.86);border:2px solid rgba(196,212,236,.78);
  box-shadow:0 8px 22px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.18)}
#band::before,#band::after{content:none}
#band.on{display:flex;animation:dkbBandIn .28s cubic-bezier(.2,1.4,.4,1) both}
#band b{font-size:30px;font-weight:900;line-height:1.25;letter-spacing:.02em;color:#FFFFFF;-webkit-text-stroke:0;
  text-shadow:0 2px 3px rgba(0,0,0,.7)}
#band i{font-size:22px;font-weight:700;line-height:1.35;color:#E6ECF6}
@keyframes dkbBandIn{0%{transform:translateX(-50%) scale(.9)}60%{transform:translateX(-50%) scale(1.03)}100%{transform:translateX(-50%) scale(1)}}

/* ══════════ 能力・アイテム・THIS WEEK のカットイン（金文字は単色） ══════════ */
#skillcut .band{position:relative;animation:scIn .42s cubic-bezier(.16,1,.3,1) both;
  background:linear-gradient(90deg,rgba(6,4,2,0),rgba(8,6,3,.93) 16%,rgba(8,6,3,.93) 84%,rgba(6,4,2,0))}
#skillcut .band::before,#skillcut .band::after{content:"";position:absolute;left:12%;right:12%;height:2px;
  background:linear-gradient(90deg,transparent,#C9952F 18%,#FFF0B8 50%,#C9952F 82%,transparent)}
#skillcut .band::before{top:6px}#skillcut .band::after{bottom:6px}
#skillcut .t1{font-family:var(--caps);font-size:20px;color:#8FE0F0;letter-spacing:.22em}
#skillcut .t2{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#FFD44A;

/* ══════════ リーチ（緑の！＋暗い帯＋FORTUNE!） ══════════ */
.dkb-reach{position:absolute;left:0;right:0;top:318px;z-index:96;display:none;flex-direction:column;align-items:center;pointer-events:none}

  background:radial-gradient(circle at 35% 28%,#D8FFB8,#62C83A 55%,#2A7E1A);border:4px solid #FFFFFF;
  box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 30px rgba(120,230,80,.75);animation:dkbPopIn .42s cubic-bezier(.2,1.6,.4,1) both}
.dkb-rband{position:relative;margin-top:-14px;width:100%;padding:20px 0 16px;text-align:center;
  background:linear-gradient(90deg,rgba(4,8,2,0),rgba(6,10,4,.9) 16%,rgba(6,10,4,.9) 84%,rgba(4,8,2,0));
  animation:bandIn .36s cubic-bezier(.2,1.4,.4,1) .08s both}
.dkb-rband::before,.dkb-rband::after{content:"";position:absolute;left:12%;right:12%;height:2px;
  background:linear-gradient(90deg,transparent,#8FD84A 22%,#E8FFC8 50%,#8FD84A 78%,transparent)}
.dkb-rband::before{top:6px}.dkb-rband::after{bottom:6px}
.dkb-rband span{display:block;font-size:20px;font-weight:900;color:#E8F4D8;text-shadow:0 2px 0 #000}
.dkb-rband b{display:block;font-size:48px;font-weight:900;line-height:1.15;color:#FFFFFF;
  -webkit-text-stroke:6px #12301A;paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.45)}
.dkb-rband em{display:block;font-style:normal;font-family:var(--caps);font-size:40px;line-height:1.1;letter-spacing:.14em;
  color:#B8F04A;-webkit-text-stroke:5px #123A10;paint-order:stroke fill;text-shadow:0 0 22px rgba(160,240,80,.7);
  animation:dkbPopIn .4s cubic-bezier(.2,1.6,.4,1) .22s both}
/* 相手のリーチ：赤い「！」の星形と WARNING（J49） */
.dkb-reach.dkb-warn .dkb-rbang{-webkit-text-stroke-color:#5A0808;border-radius:0;border:0;width:112px;height:112px;
  background:radial-gradient(circle at 40% 32%,#FFB0A0,#F0402A 55%,#A8120E);
  clip-path:polygon(50% 0,61% 27%,90% 18%,76% 45%,100% 62%,70% 68%,68% 98%,50% 78%,32% 98%,30% 68%,0 62%,24% 45%,10% 18%,39% 27%);
  box-shadow:none;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35))}
.dkb-reach.dkb-warn .dkb-rband{background:linear-gradient(90deg,rgba(10,2,2,0),rgba(22,4,4,.9) 16%,rgba(22,4,4,.9) 84%,rgba(10,2,2,0))}
.dkb-reach.dkb-warn .dkb-rband::before,.dkb-reach.dkb-warn .dkb-rband::after{
  background:linear-gradient(90deg,transparent,#F06A4A 22%,#FFD8C8 50%,#F06A4A 78%,transparent)}
.dkb-reach.dkb-warn .dkb-rband b{-webkit-text-stroke-color:#3A0A08}
