<style>
/* ══════════════════════════════════════════════════════════════
   ダイスキングダム — カード・サイコロ画面（1m-cards.html / WP2）
   ・セレクタは #cards / #dice / .dkc- だけ。動かすのは transform と opacity だけ。
   ・入場 keyframe は from だけ（0% で opacity を下げない）。
   ══════════════════════════════════════════════════════════════ */

/* ══════ 等級の色（放射グラデ＋multiply で白地をなじませる） ══════ */
#cards .dkc-rA,#cards .dkc-aA,#dice .dkc-rA,.dkc-modal .dkc-rA,.dkc-modal .dkc-aA{
  --dkc-rg:radial-gradient(ellipse 85% 75% at 50% 38%,#F6FCFF 0%,#C4E3FF 34%,#6AA8E6 76%,#2B5C9A 100%);--dkc-rc:#6FB8F5}
#cards .dkc-rS,#cards .dkc-aS,#dice .dkc-rS,.dkc-modal .dkc-rS,.dkc-modal .dkc-aS{
  --dkc-rg:radial-gradient(ellipse 85% 75% at 50% 38%,#FDF7FF 0%,#E2CBFF 34%,#A273E6 76%,#4A2388 100%);--dkc-rc:#B98AF0}
#cards .dkc-rSS,#cards .dkc-aSS,#dice .dkc-rSS,.dkc-modal .dkc-rSS,.dkc-modal .dkc-aSS{
  --dkc-rg:radial-gradient(ellipse 85% 75% at 50% 38%,#FFFDF0 0%,#FFE7A6 34%,#EAAE34 76%,#80520A 100%);--dkc-rc:#FFD24D}
#cards .dkc-rX{--dkc-rg:radial-gradient(circle at 50% 45%,#3A2A14,#140C04);--dkc-rc:#7A5A22}

/* ══════ 画面の器 ══════ */
#cards .dkc-body,#dice .dkc-body{gap:14px}
#cards .dkc-main,#dice .dkc-main{gap:14px}
#cards .dklogo.dktext b{font-size:56px;letter-spacing:.12em;color:#FFD44A;-webkit-text-stroke:6px #2A1604;paint-order:stroke fill;
  text-shadow:0 3px 0 #C98A12,0 6px 0 #6B4408,0 10px 14px rgba(0,0,0,.55)}
#cards .dktab .ic .dkc-svg,#dice .dktab .ic .dkc-svg{width:52px;height:52px;display:block}
#cards .dktab .tx,#dice .dktab .tx{font-size:21px}
#cards .dktab.on .dkc-svg,#dice .dktab.on .dkc-svg{animation:dkcIconBob 2.4s ease-in-out infinite}
@keyframes dkcIconBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-4deg)}}
/* タブを変えた時だけ、中身がすっと上がる（作り直しのたびには動かさない） */
#cards .dkc-swap > *,#dice .dkc-swap > *{animation:dkcSwap .38s cubic-bezier(.16,1,.3,1) both}
#cards .dkc-swap > *:nth-child(2),#dice .dkc-swap > *:nth-child(2){animation-delay:.05s}
#cards .dkc-swap > *:nth-child(3),#dice .dkc-swap > *:nth-child(3){animation-delay:.1s}
@keyframes dkcSwap{from{transform:translateY(18px) scale(.985)}}
#cards.dkc-busy .dkc-body,#dice.dkc-busy .dkc-body{pointer-events:none}

/* 小さな道具 */
#cards .dkc-svg,#dice .dkc-svg,.dkc-modal .dkc-svg{width:1em;height:1em;display:inline-block;vertical-align:-.14em;overflow:visible}
#cards .dkc-ico,#dice .dkc-ico,.dkc-modal .dkc-ico{display:inline-block;width:.95em;height:.95em;vertical-align:-.12em;margin-right:.18em;flex:0 0 auto}
#cards .dkc-rar,#dice .dkc-rar,.dkc-modal .dkc-rar{display:inline-block;font-family:var(--caps);font-weight:900;line-height:1;
  font-size:34px;color:#FFD44A;-webkit-text-stroke:4px #2A1604;paint-order:stroke fill;text-shadow:0 2px 0 #C98A12,0 4px 0 rgba(40,24,4,.5)}
#cards .dkc-rar.dkc-gS,#dice .dkc-rar.dkc-gS,.dkc-modal .dkc-rar.dkc-gS{color:#E6CCFF;text-shadow:0 2px 0 #7A4AB8,0 4px 0 rgba(30,10,50,.5)}
#cards .dkc-rar.dkc-gA,#dice .dkc-rar.dkc-gA,.dkc-modal .dkc-rar.dkc-gA{color:#CDEBFF;text-shadow:0 2px 0 #2E6FB8,0 4px 0 rgba(10,30,60,.5)}
#cards .dkc-rar.sm,#dice .dkc-rar.sm{font-size:20px;-webkit-text-stroke-width:3px;margin-right:6px}

/* ══════ ステージ（主役の置き場） ══════ */
#cards .dkc-stage,#dice .dkc-stage{display:flex;align-items:center;justify-content:center;isolation:isolate;
  background:radial-gradient(ellipse 60% 55% at 50% 58%,rgba(255,196,96,.2),rgba(255,196,96,0) 70%),
             radial-gradient(ellipse 90% 80% at 50% 50%,rgba(20,12,4,0),rgba(10,6,2,.45))}
#cards .dkc-stage > .fx-rays,#dice .dkc-stage > .fx-rays{opacity:.55;z-index:0}
#cards .dkc-stage > .fx-rays.dkc-hot{opacity:.95}
#cards .dkc-floor{position:absolute;left:18%;right:18%;bottom:5%;height:70px;border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,214,120,.45),rgba(255,180,60,.12) 60%,transparent)}

/* ══════ 大きいカード ══════ */
#cards .dkc-big,.dkc-modal .dkc-big{position:relative;z-index:2;width:330px;height:486px;flex:0 0 auto}
#cards .dkc-stage > .dkc-big{animation:dkcFloat 6s ease-in-out infinite}
@keyframes dkcFloat{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-12px) rotate(.4deg)}}
#cards .dkc-big > .in,.dkc-modal .dkc-big > .in{display:flex;flex-direction:column}
#cards .dkc-bighd,.dkc-modal .dkc-bighd{height:52px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:linear-gradient(180deg,#2E1E0A,#120B04);border-bottom:2px solid rgba(255,214,110,.45)}
#cards .dkc-bignm,.dkc-modal .dkc-bignm{margin-left:auto;font-family:var(--pop);font-size:21px;color:#FFE9B5;white-space:nowrap;
  -webkit-text-stroke:3px #241604;paint-order:stroke fill;overflow:hidden;text-overflow:ellipsis}
#cards .dkc-art,.dkc-modal .dkc-art{flex:1;min-height:0;position:relative;
  background-color:#E8D9B8;background-repeat:no-repeat,no-repeat;
  background-size:cover,100% 100%;background-position:50% 86%,center;background-blend-mode:multiply,normal;
  box-shadow:inset 0 0 26px rgba(40,20,0,.35)}
#cards .dkc-art::after,.dkc-modal .dkc-art::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 30%,rgba(0,0,0,0) 70%,rgba(20,10,0,.3))}
#cards .dkc-ph,.dkc-modal .dkc-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--pop);font-size:120px;color:rgba(80,50,10,.35)}
#cards .dkc-lvhex{position:absolute;right:10px;bottom:10px;z-index:2;width:74px;height:82px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1;
  background:linear-gradient(180deg,#9FD4FA,#2E8BE0 52%,#14559E);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))}
#cards .dkc-lvhex i{font-style:normal;font-family:var(--caps);font-size:16px;color:#E6F6FF;-webkit-text-stroke:2px #0C2A52;paint-order:stroke fill}
#cards .dkc-lvhex b{font-family:var(--pop);font-size:32px;color:#fff;-webkit-text-stroke:4px #0C2A52;paint-order:stroke fill}
#cards .dkc-bigft,.dkc-modal .dkc-bigft{height:46px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:900;color:#F0DCA8;letter-spacing:.06em;background:linear-gradient(180deg,#4A3517,#241708)}
#cards .dkc-big.dkc-sseen .dkc-art,.dkc-modal .dkc-big.dkc-sseen .dkc-art{filter:grayscale(1) brightness(.92)}
#cards .dkc-big.dkc-mid{width:252px;height:372px}
#cards .dkc-big.dkc-sm,.dkc-modal .dkc-big.dkc-sm{width:196px;height:288px}
#cards .dkc-big.dkc-sm .dkc-bighd,.dkc-modal .dkc-big.dkc-sm .dkc-bighd{height:42px;padding:0 10px}
#cards .dkc-big.dkc-sm .dkc-rar,.dkc-modal .dkc-big.dkc-sm .dkc-rar{font-size:26px}
#cards .dkc-big.dkc-sm .dkc-bignm,.dkc-modal .dkc-big.dkc-sm .dkc-bignm{font-size:17px}
#cards .dkc-big.dkc-sm .dkc-bigft,.dkc-modal .dkc-big.dkc-sm .dkc-bigft{height:34px;font-size:16px}
#cards .dkc-big.dkc-sm .dkc-lvhex{width:52px;height:58px}
#cards .dkc-big.dkc-sm .dkc-lvhex b{font-size:22px}
/* 封をされたカード（未発見）・裏面 */
#cards .dkc-seal,#cards .dkc-back{border-radius:16px;padding:5px;
  background:linear-gradient(152deg,#8A7250,#4A3517 40%,#2A1C08 70%,#6E5326)}
#cards .dkc-sealin,#cards .dkc-backin{height:100%;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:radial-gradient(circle at 50% 42%,#3A2A14,#140C04 70%);border:2px solid rgba(255,214,110,.25);position:relative;overflow:hidden}
#cards .dkc-sealin b{font-family:var(--pop);font-size:30px;color:#8A7250;letter-spacing:.2em}
#cards .dkc-sealq{display:block;width:96px;height:96px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 38% 30%,#6E5326,#2A1C08 70%);border:3px solid #7A5A22;box-shadow:inset 0 0 18px rgba(0,0,0,.7)}
#cards .dkc-sealq::before{content:"";position:absolute;left:50%;top:50%;width:34px;height:48px;margin:-28px 0 0 -17px;
  border:7px solid #B8955A;border-bottom:none;border-left:none;border-radius:0 22px 0 0;transform:skewX(-6deg)}
#cards .dkc-sealq::after{content:"";position:absolute;left:50%;bottom:16px;width:11px;height:11px;margin-left:-6px;border-radius:50%;background:#B8955A}
#cards .dkc-back.dkc-bS{background:linear-gradient(160deg,#F2E2FF,#B07CE8 40%,#5A2A9E 70%,#E0C8FF)}
#cards .dkc-back.dkc-bSS{background:var(--fx-gold-metal)}
#cards .dkc-back.dkc-bA{background:linear-gradient(160deg,#DDF1FF,#6FB8F5 40%,#1B5A9E 70%,#A8DCFF)}
#cards .dkc-backin b{font-family:var(--caps);font-size:52px;color:#FFD44A;-webkit-text-stroke:5px #2A1604;paint-order:stroke fill}
#cards .dkc-backin::after{content:"";position:absolute;top:-10%;bottom:-10%;width:30%;left:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:fxShine 3.6s ease-in-out infinite}

/* ══════ 右の詳細パネル ══════ */
#cards .dkc-det,#dice .dkc-det{gap:9px;min-height:0}
#cards .dkc-det .hd .nm,#dice .dkc-det .hd .nm{font-size:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cards .dkc-det .hd .lv small,#dice .dkc-det .hd .lv small{font-size:16px;opacity:.75}
#cards .dkc-det .hd .lv.dkc-lvq,#dice .dkc-det .hd .lv.dkc-lvq{background:linear-gradient(180deg,#D8D0C4,#8C8276);border-color:#4A443C;color:#2A241C}
#cards .dkc-exprow{display:flex;align-items:center;gap:10px}
#cards .dkc-expl{font-family:var(--caps);font-size:18px;color:#F0DCA8;width:48px}
#cards .dkc-exprow .dkbar{flex:1;height:20px}
#cards .dkc-exprow b{font-family:var(--pop);font-size:19px;color:#FFE9B5;min-width:108px;text-align:right}
#cards .dkc-ef .ic .dkc-svg{width:40px;height:40px}
#cards .dkc-ef p,#dice .dkc-ef p{font-size:16px;line-height:1.45}
#cards .dkc-line{font-size:16px;margin:0}
#cards .dkc-stats,#dice .dkc-dbars{display:flex;flex-direction:column;gap:6px}
#cards .dkc-st,#dice .dkc-st{gap:10px}
#cards .dkc-st .dkbar{height:20px}
#cards .dkc-st .l,#dice .dkc-st .l{width:170px}
#cards .dkc-det .btns,#dice .dkc-det .btns{margin-top:auto}
#cards .dkc-bt,#dice .dkc-bt{height:66px;font-size:27px;flex:1}
#cards .dkc-bt2,#dice .dkc-bt2,.dkc-modal .dkc-bt2{height:52px;font-size:21px;padding:0 18px;flex:0 0 auto}
#cards .dkc-why,#dice .dkc-why{font-size:17px;line-height:1.4;font-weight:900;color:#FF9E8C;text-align:center;
  padding:6px 10px;border-radius:9px;background:rgba(90,10,8,.35);border:1px solid rgba(255,120,100,.35)}

/* ══════ 下の帯（横スクロール・端に続きのフェード） ══════ */
#cards .dkc-bottom,#dice .dkc-bottom{height:190px}
#cards .dkc-cnt,#dice .dkc-cnt{font-size:16px;line-height:1.35}
#cards .dkc-cnt b,#dice .dkc-cnt b{font-size:24px}
#cards .dkc-strip,#dice .dkc-strip{position:relative;flex:1;min-width:0;align-self:stretch;display:flex;align-items:center}
#cards .dkc-row,#dice .dkc-row{flex:1;min-width:0;padding:16px 14px 10px;gap:12px;scroll-behavior:auto;
  scrollbar-width:thin;scrollbar-color:#C8952F #241708}
#cards .dkc-row::-webkit-scrollbar,#dice .dkc-row::-webkit-scrollbar{height:8px}
#cards .dkc-row::-webkit-scrollbar-thumb,#dice .dkc-row::-webkit-scrollbar-thumb{background:linear-gradient(90deg,#C8952F,#7C5410);border-radius:6px}
#cards .dkc-fade,#dice .dkc-fade{position:absolute;top:8px;bottom:8px;width:84px;z-index:3;pointer-events:none;opacity:0;
  transition:opacity .25s ease}
#cards .dkc-fl,#dice .dkc-fl{left:0;background:linear-gradient(90deg,rgba(26,16,5,.96),rgba(26,16,5,0))}
#cards .dkc-fr,#dice .dkc-fr{right:0;background:linear-gradient(270deg,rgba(26,16,5,.96),rgba(26,16,5,0))}
#cards .dkc-fade::after,#dice .dkc-fade::after{content:"";position:absolute;top:50%;width:20px;height:20px;margin-top:-12px;
  border:solid #FFD44A;border-width:0 6px 6px 0;filter:drop-shadow(0 2px 2px rgba(0,0,0,.7))}
#cards .dkc-fl::after,#dice .dkc-fl::after{left:18px;transform:rotate(135deg)}
#cards .dkc-fr::after,#dice .dkc-fr::after{right:18px;transform:rotate(-45deg);animation:dkcNudge 1.4s ease-in-out infinite}
@keyframes dkcNudge{0%,100%{transform:translateX(0) rotate(-45deg)}50%{transform:translateX(6px) rotate(-45deg)}}
#cards .dkc-strip.dkc-mL .dkc-fl,#cards .dkc-strip.dkc-mR .dkc-fr,
#dice .dkc-strip.dkc-mL .dkc-fl,#dice .dkc-strip.dkc-mR .dkc-fr{opacity:1}

/* ── 小さいカード（帯・図鑑・アルバム） ── */
#cards .dkc-item,#dice .dkc-item{flex:0 0 auto;width:142px;position:relative;border-radius:14px;cursor:pointer;
  padding:6px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:linear-gradient(180deg,#4C381A,#2A1C08 60%,#1A1004);border:3px solid var(--dkc-rc,#7A5A22);
  box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 2px 0 rgba(255,220,150,.18);
  transition:transform .18s cubic-bezier(.16,1,.3,1),filter .16s}
#cards .dkc-item:hover,#dice .dkc-item:hover{transform:translateY(-5px);filter:brightness(1.12)}
#cards .dkc-item:active,#dice .dkc-item:active{transform:translateY(2px) scale(.97)}
#cards .dkc-item.on,#dice .dkc-item.on{border-color:#FFE9A8;transform:translateY(-6px);
  box-shadow:0 4px 0 rgba(0,0,0,.45),0 0 0 3px rgba(255,214,110,.55),0 0 24px 6px rgba(255,200,80,.55);
  animation:fxSelPop 260ms cubic-bezier(.34,1.56,.64,1)}
#cards .dkc-item.dkc-dim,#dice .dkc-item.dkc-dim{filter:grayscale(.7) brightness(.66)}
#cards .dkc-item.dkc-dim:hover,#dice .dkc-item.dkc-dim:hover{filter:grayscale(.5) brightness(.8)}
#cards .dkc-face,.dkc-modal .dkc-face{position:relative;display:block;width:124px;height:96px;border-radius:10px;overflow:hidden;
  background-color:#E8D9B8;background-repeat:no-repeat,no-repeat;background-size:178% auto,100% 100%;
  background-position:50% 30%,center;background-blend-mode:multiply,normal;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),inset 0 -14px 18px rgba(20,10,0,.35)}
#cards .dkc-sunseen .dkc-face,#cards .dkc-rX .dkc-face,.dkc-modal .dkc-sunseen .dkc-face{background:radial-gradient(circle at 50% 42%,#3A2A14,#140C04 75%);display:flex;align-items:center;justify-content:center}
#cards .dkc-face .dkc-sealq,.dkc-modal .dkc-face .dkc-sealq{width:58px;height:58px;transform:scale(.62)}
#cards .dkc-sseen .dkc-face{filter:grayscale(1) brightness(.85)}
#cards .dkc-irar{position:absolute;left:4px;top:3px;font-family:var(--caps);font-size:17px;line-height:1;color:#FFD44A;
  -webkit-text-stroke:3px #2A1604;paint-order:stroke fill}
#cards .dkc-rS .dkc-irar{color:#E6CCFF} #cards .dkc-rA .dkc-irar{color:#CDEBFF}
#cards .dkc-dup{position:absolute;right:4px;bottom:3px;font-family:var(--pop);font-size:18px;line-height:1;color:#fff;
  -webkit-text-stroke:3px #241604;paint-order:stroke fill}
#cards .dkc-ilv,#dice .dkc-ilv{font-family:var(--pop);font-size:19px;line-height:1.1;color:#FFEDBC;-webkit-text-stroke:3px #241604;paint-order:stroke fill;
  display:flex;align-items:center;gap:4px}
#cards .dkc-ilv em,#dice .dkc-ilv em{font-style:normal;font-family:var(--caps);font-size:16px;color:#3A2405;-webkit-text-stroke:0;
  padding:1px 5px;border-radius:6px;background:linear-gradient(180deg,#FFF0BE,#E8B23A)}
#cards .dkc-ilv.dkc-miss,#dice .dkc-ilv.dkc-miss{color:#C9B894;font-size:17px}
#cards .dkc-inm,#dice .dkc-inm{font-size:16px;line-height:1.25;color:#EBD9B2;text-align:center;max-width:128px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cards .dkc-eq,#dice .dkc-eq{position:absolute;left:50%;top:-13px;transform:translateX(-50%);z-index:4;white-space:nowrap;
  font-size:16px;font-weight:900;color:#3A2405;padding:1px 10px;border-radius:8px;
  background:linear-gradient(180deg,#FFF0BE,#E8B23A);border:2px solid #8A6206;box-shadow:0 2px 3px rgba(0,0,0,.5)}
#cards .dkc-pk{position:absolute;right:-8px;top:-10px;z-index:5;width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-family:var(--pop);font-size:22px;color:#fff;
  background:linear-gradient(180deg,#8FD2FF,#2E8BE0 55%,#0B2C5E);border:2px solid #FFF1D0;box-shadow:0 2px 5px rgba(0,0,0,.5);
  animation:fxPop 300ms cubic-bezier(.2,1.5,.4,1) both}
#cards .dkc-why2{position:absolute;left:9px;right:9px;top:54px;z-index:3;padding:3px 4px;border-radius:7px;
  font-size:16px;line-height:1.2;font-weight:900;color:#FFE4DA;text-align:center;background:rgba(40,8,6,.78)}

/* ══════ 強化 ══════ */
#cards .dkc-upst{gap:34px}
#cards .dkc-upcard{position:relative;z-index:2;animation:dkcFloat 6s ease-in-out infinite}
#cards .dkc-upinfo{position:relative;z-index:2;width:360px;display:flex;flex-direction:column;gap:12px}
#cards .dkc-lvto{display:flex;align-items:center;gap:14px;font-family:var(--pop);font-size:30px;color:#FFE9B5;
  -webkit-text-stroke:4px #241604;paint-order:stroke fill}
#cards .dkc-lvto b{font-size:48px;color:#fff}
#cards .dkc-lvto .dkc-lvnx b{color:#B8F08A}
#cards .dkc-arw{width:0;height:0;border:16px solid transparent;border-left:24px solid #FFD44A;border-right:0;
  filter:drop-shadow(0 2px 0 #7A4A06);animation:dkcNudge2 1.2s ease-in-out infinite}
@keyframes dkcNudge2{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
#cards .dkc-expbar{position:relative;height:24px;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#2A2118,#453A2E);
  border:2px solid #2A2118;box-shadow:inset 0 3px 6px rgba(0,0,0,.6)}
#cards .dkc-expbar i{position:absolute;left:0;top:0;bottom:0;border-radius:10px;
  background:linear-gradient(180deg,#FFEDB0 0 26%,#F2C230 52%,#C08A0E);box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
#cards .dkc-expbar em{position:absolute;top:0;bottom:0;border-radius:0 10px 10px 0;
  background:repeating-linear-gradient(-45deg,rgba(184,240,138,.95) 0 8px,rgba(120,210,80,.95) 8px 16px);animation:dkcPulse 1.1s ease-in-out infinite}
@keyframes dkcPulse{0%,100%{opacity:.55}50%{opacity:1}}
#cards .dkc-exptx{font-family:var(--pop);font-size:18px;color:#F0DCA8;text-align:right}
