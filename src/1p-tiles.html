<style>
/* ══════════════════════════════════════════════════════════════
   ダイスキングダム — 盤のマスとお金のポップアップ（1p-tiles.html / WP5）
   ──────────────────────────────────────────────────────────────
   ・担当セレクタ：.deed .bcard .buildgrid .sums .parch .deedcard .mg* と .dkr-*。
   ・動かすのは transform と opacity だけ。入場は 0% で opacity を下げない（退場だけ opacity→0）。
   ・金文字は color＋-webkit-text-stroke＋paint-order（30px 未満の漢字に background-clip:text を使わない）。
   ══════════════════════════════════════════════════════════════ */

/* ══════════ 共通：ボタン・封蝋 ══════════ */
.dkr-btn{position:relative;border:0;cursor:pointer;border-radius:16px;height:66px;min-width:180px;padding:0 28px;
  font-family:var(--pop);font-size:25px;line-height:1;color:#fff;-webkit-text-stroke:5px rgba(48,18,4,.8);paint-order:stroke fill;
  box-shadow:0 6px 0 rgba(0,0,0,.42),0 10px 18px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.55);
  transition:transform 220ms var(--fx-back)}
.dkr-btn::before{content:"";position:absolute;left:5px;right:5px;top:4px;height:44%;border-radius:12px 12px 40% 40%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0))}
.dkr-btn:active{transform:translateY(3px) scale(.97);transition-duration:90ms}
.dkr-btn:disabled{filter:grayscale(.85) brightness(.82);cursor:default;transform:none}
.dkr-btn.dkr-gray{background:linear-gradient(180deg,#C8D2DE 0,#8D9BB0 50%,#5E6C84)}
.dkr-btn.dkr-red{background:linear-gradient(180deg,#FF9C80 0,#E8482F 42%,#A61E12)}
.dkr-btn.dkr-goldbtn{background:linear-gradient(180deg,#FFF6D2 0,#F7D56A 26%,#E3A83A 62%,#A9761A);-webkit-text-stroke-color:#6B3F06}

.dkr-wax{position:absolute;width:78px;height:78px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 36% 30%,#FF9A8A 0,#DC3B2E 30%,#A1170F 64%,#660B06);
  box-shadow:0 6px 12px rgba(0,0,0,.45),inset 0 -5px 9px rgba(0,0,0,.38),inset 0 3px 6px rgba(255,210,196,.5)}
.dkr-wax::before{content:"";position:absolute;inset:-6px;z-index:-1;border-radius:44% 56% 50% 50% / 56% 44% 57% 43%;
  background:radial-gradient(circle at 40% 35%,#E24A3C,#8A120C 70%)}
.dkr-wax > b{position:absolute;inset:15px;border-radius:50%;border:2px solid rgba(255,196,180,.6);
  box-shadow:inset 0 2px 3px rgba(0,0,0,.35)}
.dkr-wax > b::after{content:"";position:absolute;left:50%;top:50%;width:28px;height:20px;margin:-11px 0 0 -14px;
  background:linear-gradient(180deg,#7A0E08,#4A0604);clip-path:polygon(0 100%,0 18%,24% 56%,50% 0,76% 56%,100% 18%,100% 100%)}

/* ══════════ 建設ポップアップ（本家 s10/r4c0） ══════════ */
.deed.dkr-build{position:relative;width:840px;border:0;border-radius:26px;padding:6px;overflow:visible;color:#4A3214;
  background:var(--fx-gold-metal);
  box-shadow:0 30px 70px rgba(0,0,0,.72),0 0 0 2px rgba(60,36,6,.65),inset 0 2px 0 rgba(255,255,255,.5)}
.deed.dkr-build .dhd{position:relative;display:flex;align-items:center;justify-content:center;gap:0;height:84px;padding:0 96px;
  border-radius:20px 20px 0 0;border-bottom:3px solid #7A2A46;overflow:hidden;
  background:linear-gradient(180deg,#FFC2D8 0,#F286B0 28%,#D65A86 66%,#A93864);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -8px 14px rgba(80,10,40,.32)}
.deed.dkr-build .dhd::after{content:"";position:absolute;top:0;bottom:0;left:0;width:22%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-160%) skewX(-18deg);
  animation:fxShine 5.4s ease-in-out 1s infinite}
.dkr-build.dkr-lm .dhd{background:linear-gradient(180deg,#C8EEFF 0,#6CC0F4 30%,#2F7FD0 70%,#174E96);border-bottom-color:#0B2C5E}
.dkr-build.dkr-sky .dhd{background:linear-gradient(180deg,#D8F4FF 0,#8FD8F8 32%,#46A9DA 72%,#2479A8);border-bottom-color:#12506E}
.dkr-build.dkr-pink .dhd{background:linear-gradient(180deg,#FFD8E7 0,#F6A9C9 32%,#E06C98 72%,#AF3D68)}
.dkr-ttl{display:flex;flex-direction:column;align-items:center;line-height:1;min-width:0}
.deed.dkr-build .dkr-ttl b{display:block;max-width:560px;font-family:var(--pop);font-size:38px;font-weight:400;color:#fff;letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 6px;
  -webkit-text-stroke:7px #7A1E46;paint-order:stroke fill;text-shadow:0 3px 0 rgba(60,8,30,.45)}
.dkr-build.dkr-lm .dkr-ttl b{-webkit-text-stroke-color:#0B2C5E}
.dkr-build.dkr-sky .dkr-ttl b{-webkit-text-stroke-color:#0F4A68}
.dkr-ttl em{font-style:normal;font-size:18px;font-weight:900;color:#FFF6FA;letter-spacing:.14em;margin-top:2px;
  text-shadow:0 1px 2px rgba(40,6,20,.6)}
.deed.dkr-build .dhd span.dkr-medal{position:absolute;left:16px;top:50%;width:64px;height:64px;margin:-32px 0 0;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFF7DC,#F0CE72 40%,#C8952F 70%,#7C5410);border:3px solid #5A3A04;
  box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.6);font-size:0}
.dkr-medal > i{position:absolute;inset:9px;border-radius:50%;border:2px solid rgba(255,255,255,.7);
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.9) 0 10%,rgba(255,255,255,0) 36%),
             radial-gradient(circle at 62% 76%,rgba(0,0,0,.38),rgba(0,0,0,0) 62%),var(--dkr-g,#79CDBD)}
.dkr-medal::after{content:"";position:absolute;inset:4px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,255,255,.55) 78%,transparent 86%);animation:fxSpin 4.8s linear infinite}
.dkr-x{position:absolute;right:16px;top:50%;width:58px;height:58px;margin-top:-29px;border-radius:15px;border:3px solid #5A1206;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
  background:linear-gradient(180deg,#FF9C80,#DC3F28 55%,#8E1410);color:#fff;font-size:28px;font-weight:900;line-height:1;
  box-shadow:0 4px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.55);transition:transform 220ms var(--fx-back)}
.dkr-x:active{transform:scale(.92)}
.deed.dkr-build .dbd{position:relative;border-radius:0 0 20px 20px;padding:18px 22px 14px;
  background:repeating-linear-gradient(52deg,rgba(90,60,20,.035) 0 2px,transparent 2px 7px),var(--fx-parch);
  box-shadow:inset 0 12px 18px rgba(120,80,30,.16)}
.dkr-build .buildgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.dkr-build .buildgrid.dkr-n1{grid-template-columns:300px;justify-content:center}

.dkr-build .bcard{position:relative;height:218px;padding:0;margin:0;border:4px solid #C8952F;border-radius:18px;overflow:hidden;cursor:pointer;
  text-align:center;outline:none;
  background:radial-gradient(90% 70% at 50% 42%,#FFFFFF 0,rgba(255,255,255,0) 70%),linear-gradient(180deg,#F1FAFF 0,#D3ECFA 55%,#B9DDF1);
  box-shadow:0 6px 0 rgba(90,60,20,.36),inset 0 0 0 2px rgba(255,255,255,.75);
  transition:transform 180ms var(--fx-out),box-shadow 180ms var(--fx-out),border-color 180ms;
  animation:dkrDeal 440ms var(--fx-spring) both}
.dkr-build .bcard:nth-child(2){animation-delay:60ms}
.dkr-build .bcard:nth-child(3){animation-delay:120ms}
.dkr-build .bcard:nth-child(4){animation-delay:180ms}
@keyframes dkrDeal{from{transform:translateY(30px) scale(.9) rotate(-2deg)}}
.dkr-build .bcard:hover{transform:translateY(-5px)}
.dkr-build.dkr-lm .bcard,.dkr-build.dkr-tp .bcard{height:250px}
.dkr-cap{position:relative;height:42px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#FFD886 0,#F7A83E 48%,#D9771C);border-bottom:2px solid #9A5410;
  font-family:var(--pop);font-size:21px;color:#fff;-webkit-text-stroke:4px #7A3E08;paint-order:stroke fill;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55)}
.dkr-build.dkr-lm .dkr-cap{background:linear-gradient(180deg,#A8E6FF,#48A4E6 52%,#1656A8);border-bottom-color:#0B2C5E;-webkit-text-stroke-color:#0B2C5E}
.dkr-build.dkr-sky .dkr-cap{background:linear-gradient(180deg,#C8F0FF,#6CC8F2 52%,#2C8CC0);border-bottom-color:#12506E;-webkit-text-stroke-color:#0F4A68}
.dkr-build.dkr-pink .dkr-cap{background:linear-gradient(180deg,#FFD0E2,#F28AB4 52%,#C24C7E);border-bottom-color:#7A2A46;-webkit-text-stroke-color:#6A1A3E}
.dkr-build .dkr-art{position:absolute;left:6px;right:6px;top:46px;bottom:46px}
.dkr-build .dkr-art canvas{display:block;width:100%;height:100%}
.dkr-build .bcard .pr{position:absolute;right:8px;bottom:8px;margin:0;min-width:92px;height:34px;padding:0 12px;border-radius:11px;
  display:flex;align-items:center;justify-content:flex-end;font-family:var(--pop);font-size:21px;color:#7A4508;
  background:linear-gradient(180deg,#FFFCEE,#F2E2B8);border:2px solid #C8952F;box-shadow:0 2px 0 rgba(90,60,20,.25)}
.dkr-chk{position:absolute;left:8px;bottom:8px;width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid #D9CCB0;
  box-shadow:0 2px 0 rgba(0,0,0,.2)}
.dkr-chk::after{content:"";position:absolute;left:11px;top:4px;width:10px;height:19px;border:solid #D4CCBC;border-width:0 6px 6px 0;
  transform:rotate(40deg)}
.dkr-build .bcard.sel{border-color:#FFE27A;transform:translateY(-4px);
  box-shadow:0 6px 0 rgba(90,60,20,.36),0 0 0 3px #E8A11A,0 0 24px 8px rgba(255,196,80,.62),inset 0 0 0 2px rgba(255,255,255,.8)}
.dkr-build .bcard.sel .dkr-chk{border-color:#B81E12;background:radial-gradient(circle at 40% 35%,#FFFFFF,#FFE7E2)}
.dkr-build .bcard.sel .dkr-chk::after{border-color:#E0301C;animation:dkrChk 300ms var(--fx-spring)}
@keyframes dkrChk{from{transform:rotate(40deg) scale(1.7)}}
.dkr-build .bcard.own{cursor:default;border-color:#5FA95E;background:linear-gradient(180deg,#F2FFF0,#D2F0CC 60%,#B4E0AC)}
.dkr-build .bcard.own .dkr-cap{background:linear-gradient(180deg,#C4F59A,#62C23E 52%,#2F7A1E);border-bottom-color:#1E4A10;-webkit-text-stroke-color:#1E4A10}
.dkr-build .bcard.own .pr{color:#2F7A1E;border-color:#5FA95E}
.dkr-build .bcard.own .dkr-chk{border-color:#2F7A1E}
.dkr-build .bcard.own .dkr-chk::after{border-color:#3E9A2A}
.dkr-build .bcard.dis{opacity:1;filter:none;pointer-events:auto;cursor:default}
.dkr-build .bcard.dis .dkr-art,.dkr-build .bcard.dis .dkr-cap,.dkr-build .bcard.dis .pr{filter:grayscale(1) brightness(.78)}
.dkr-lock{position:absolute;left:0;right:0;top:50%;margin-top:-20px;height:40px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(90deg,rgba(24,14,6,0),rgba(24,14,6,.86) 14%,rgba(24,14,6,.86) 86%,rgba(24,14,6,0));
  color:#FFE08A;font-size:18px;font-weight:900;letter-spacing:.04em}

.deed.dkr-build .sums{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:16px;padding:0;border:0;font-size:20px}
.dkr-row{display:grid;grid-template-columns:220px 64px 240px;align-items:center;width:560px;height:44px;border-radius:12px;
  font-weight:900;color:#5A3A14;font-size:21px}
.dkr-row > span{text-align:right}
.dkr-row > i{justify-self:center;width:34px;height:14px;
  background:linear-gradient(90deg,#B98A3E 0 62%,transparent 62%),linear-gradient(90deg,transparent 60%,#B98A3E 60%);
  clip-path:polygon(0 35%,62% 35%,62% 0,100% 50%,62% 100%,62% 65%,0 65%)}
.dkr-row > b{font-family:var(--pop);font-weight:400;font-size:25px;color:#6B3A08;text-align:left;font-variant-numeric:tabular-nums}
.dkr-row.dkr-disc{background:linear-gradient(90deg,rgba(255,236,150,0),#FFEC96 12%,#FFE27A 88%,rgba(255,236,150,0))}
.dkr-row.dkr-disc > b{color:#C0261A}
.dkr-row.dkr-toll > b{color:#1E6FB8;font-size:27px}
.dkr-buy{position:relative;display:flex;align-items:center;justify-content:center;gap:16px;width:480px;height:86px;margin:4px 0;
  border:3px solid #9A4A06;border-radius:22px;cursor:pointer;padding:0 20px;
  background:linear-gradient(180deg,#FFEA9A 0,#FFC63E 34%,#F59A1A 72%,#D66E16);
  box-shadow:0 7px 0 #7A3A06,0 14px 26px rgba(0,0,0,.34),inset 0 3px 0 rgba(255,255,255,.7),0 0 28px 6px rgba(255,190,70,.42);
  transition:transform 220ms var(--fx-back)}
.dkr-buy::before{content:"";position:absolute;left:6px;right:6px;top:4px;height:42%;border-radius:18px 18px 40% 40%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,0));animation:fxBreath 2.4s var(--fx-inout) infinite}
.dkr-buy:active{transform:translateY(4px) scale(.98);transition-duration:90ms}
.dkr-buy:disabled{cursor:default;transform:none;filter:grayscale(.9) brightness(.86)}
.dkr-buy:disabled::before{animation:none}
.dkr-bl{position:relative;display:inline-flex;align-items:center;height:50px;padding:0 18px;border-radius:13px;overflow:hidden;
  background:linear-gradient(180deg,#C46A1E,#8A3E08);box-shadow:inset 0 2px 0 rgba(255,220,170,.4);
  font-family:var(--pop);font-size:26px;color:#FFF3D6}
.dkr-bl::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-160%) skewX(-18deg);
  animation:fxShine 3.2s ease-in-out infinite}
.dkr-bill{position:relative;width:54px;height:32px;border-radius:5px;transform:rotate(-8deg);
  background:radial-gradient(circle at 50% 50%,#6FB866 0 7px,transparent 8px),linear-gradient(135deg,#F2FAEE,#B3DDA9);
  border:2px solid #3E7A36;box-shadow:5px 4px 0 -1px #D8EED0,5px 4px 0 1px #3E7A36}
.deed.dkr-build .dkr-buy em{font-style:normal;font-family:var(--pop);font-size:40px;line-height:1;color:#fff;
  -webkit-text-stroke:7px #8A3E08;paint-order:stroke fill;text-shadow:0 3px 0 rgba(90,30,0,.3);font-variant-numeric:tabular-nums}
.dkr-build.dkr-poor .dkr-buy em{color:#FFD6CC}
.dkr-build .dkr-note{margin:8px 0 0;text-align:center;font-size:17px;font-weight:700;color:#6B5230;line-height:1.5}

/* ══════════ 権利証（自動で消える） ══════════ */
.dkr-deedfx,.dkr-sealfx{position:absolute;inset:0;z-index:336;display:flex;align-items:center;justify-content:center;pointer-events:none}
.deedcard.dkr-auto{width:360px;animation:dkrDeedIn 520ms var(--fx-spring) both;transform:rotate(-6deg)}
@keyframes dkrDeedIn{0%{transform:translate(40px,34px) rotate(-18deg) scale(.86)}60%{transform:rotate(-4deg) scale(1.05)}100%{transform:rotate(-6deg)}}
.dkr-out .deedcard.dkr-auto,.dkr-out > .parch,.dkr-cpucard.dkr-out{animation:dkrLeave 300ms var(--fx-in) both}
@keyframes dkrLeave{to{transform:translateY(-40px) rotate(-3deg) scale(.9);opacity:0}}
.deedcard.dkr-auto .cap{background:linear-gradient(90deg,var(--dkr-g,#79CDBD),rgba(40,30,20,.85));font-size:17px;padding:10px 16px}
.deedcard.dkr-auto h4{font-size:30px;padding:12px 10px 2px;color:#3A2410}
.dkr-dart{height:120px;margin:0 16px;border-radius:12px;background:linear-gradient(180deg,#EEF8FF,#CFE6F4);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),inset 0 -6px 12px rgba(40,80,120,.18)}
.dkr-dart canvas{display:block;width:100%;height:100%}
.deedcard.dkr-auto .rows{padding:8px 18px 16px;font-size:17px}
.deedcard.dkr-auto .rows b{font-size:19px}
.deedcard .seal.dkr-wax{right:-20px;top:-24px;left:auto;bottom:auto;width:84px;height:84px;display:block;border:0;font-size:0;
  transform:rotate(-12deg);animation:fxStamp 420ms var(--fx-out) 260ms both}

/* ══════════ 買収証書（確認）と成立の封蝋 ══════════ */
.parch.dkr-pc{position:relative;width:620px;padding:36px 44px 30px;border-radius:10px;clip-path:none;text-align:center;color:#3B2A16;
  background:radial-gradient(120% 90% at 18% 8%,rgba(255,255,255,.62),transparent 58%),
             radial-gradient(90% 70% at 92% 100%,rgba(150,100,40,.26),transparent 70%),
             repeating-linear-gradient(-38deg,rgba(90,60,20,.04) 0 1px,transparent 1px 6px),
             linear-gradient(#F7E9C9,#E6CFA0);
  box-shadow:0 26px 64px rgba(0,0,0,.72),inset 0 0 0 3px rgba(255,255,255,.35),inset 0 0 0 9px rgba(150,110,50,.18),inset 0 0 60px rgba(150,110,60,.32)}
.parch.dkr-pc::before{content:"";position:absolute;inset:14px;border:2px solid rgba(140,100,50,.45);border-radius:6px;pointer-events:none}
.dkr-ribbon{position:absolute;left:38px;top:-12px;width:36px;height:116px;pointer-events:none;
  background:linear-gradient(90deg,#7E120C,#E4432E 50%,#7E120C);clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);
  box-shadow:0 4px 8px rgba(0,0,0,.3)}
.parch.dkr-pc h3{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:34px;letter-spacing:.3em;text-indent:.3em;
  border-bottom:2px solid #9E7A44;padding-bottom:10px;margin:0 60px}
.dkr-pcart{height:118px;margin:14px auto 0;width:260px;border-radius:12px;
  background:radial-gradient(80% 90% at 50% 40%,rgba(255,255,255,.7),rgba(255,255,255,0))}
.dkr-pcart canvas{display:block;width:100%;height:100%}
.parch.dkr-pc .amt{font-family:var(--pop);font-size:40px;color:#8E2A12;margin:4px 0 0;
  -webkit-text-stroke:0;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.parch.dkr-pc p{font-size:18px;line-height:1.8;margin-top:6px}
.dkr-price{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px;flex-wrap:wrap}
.dkr-price span{font-size:19px;font-weight:900;color:#6B4A20}
.dkr-price b{font-family:var(--pop);font-weight:400;font-size:36px;color:#B2261A}
.dkr-price s{font-family:var(--pop);font-size:22px;color:#8A7A60}
.dkr-half{font-style:normal;font-size:17px;font-weight:900;color:#fff;padding:4px 12px;border-radius:10px;
  background:linear-gradient(180deg,#B07CE8,#6A3AB0)}
.parch.dkr-pc .sign{margin-top:6px;font-size:22px}
.dkr-pcbtn{display:flex;justify-content:center;gap:22px;margin-top:14px}
.dkr-pcseal{right:24px;top:20px;transform:rotate(-14deg)}
.dkr-sealfx .parch.dkr-mini{width:500px;padding:28px 34px 30px;animation:dkrDeedIn 460ms var(--fx-spring) both}
.dkr-sealfx .parch.dkr-mini p{font-size:19px}
.dkr-stamp{right:18px;top:16px;width:92px;height:92px;transform:rotate(-12deg);animation:fxStamp 420ms var(--fx-out) 380ms both}
.dkr-stamp::before{background:radial-gradient(circle at 40% 35%,var(--dkr-o,#E24A3C),#5A0C08 80%)}

/* ══════════ フォーチュンカード（めくれるカード） ══════════ */
.dkr-fort{display:flex;flex-direction:column;align-items:center;gap:24px}
.dkr-fwrap{position:relative;width:380px;height:520px;perspective:1400px;animation:dkrCardIn 520ms var(--fx-spring) both}
@keyframes dkrCardIn{from{transform:translateY(34px) scale(.88)}}
.dkr-frays{position:absolute;left:50%;top:50%;width:820px;height:820px;margin:-410px 0 0 -410px;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,226,140,.42) 0 7deg,rgba(255,226,140,0) 7deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 64%);mask:radial-gradient(circle,#000 18%,transparent 64%);
  animation:fxSpin 16s linear infinite}
.dkr-fcard{position:absolute;inset:0;transform-style:preserve-3d;animation:dkrFlip 820ms cubic-bezier(.2,.9,.25,1.1) 200ms both}
@keyframes dkrFlip{0%{transform:rotateY(180deg)}62%{transform:rotateY(-14deg) scale(1.04)}100%{transform:rotateY(0)}}
.dkr-fback,.dkr-ffront{position:absolute;inset:0;border-radius:24px;overflow:hidden;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 22px 50px rgba(0,0,0,.6)}
.dkr-fback{transform:rotateY(180deg);border:6px solid #FFF2F7;

/* ══════════ 売却画面（お金が足りない人間） ══════════ */
.dkr-sell{position:relative;width:820px;border-radius:26px;padding:6px;background:var(--fx-gold-metal);color:#4A3214;
  box-shadow:0 30px 70px rgba(0,0,0,.72),0 0 0 2px rgba(60,36,6,.65)}

.dkr-shd span{font-size:19px;font-weight:900;color:#FFE6DE}
.dkr-need,.dkr-slist,.dkr-sfoot,.dkr-sell .dkr-note{background:var(--fx-parch)}
.dkr-need{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px 20px 10px}
.dkr-need > div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px;border-radius:14px;

.dkr-slist{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;padding:6px 20px 8px}
.dkr-srow{position:relative;display:grid;grid-template-columns:34px 1fr 140px 170px 42px;align-items:center;gap:10px;flex:0 0 auto;

.dkr-srow:active{transform:scale(.985)}
.dkr-srow.on{border-color:#E4432E;background:linear-gradient(180deg,#FFF4EF,#FFD8CC);box-shadow:0 0 0 3px rgba(228,67,46,.22)}

.dkr-sw{width:30px;height:30px;border-radius:9px;background:var(--dkr-g,#79CDBD);border:2px solid rgba(0,0,0,.25);

.dkr-snm{font-size:22px;font-weight:900;color:#3A2A14;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkr-slv{font-size:18px;font-weight:700;color:#6B5230}
.dkr-sv{font-family:var(--pop);font-weight:400;font-size:24px;color:#8A3E08;text-align:right}
.dkr-sck{position:relative;width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid #D9CCB0}
.dkr-srow.on .dkr-sck{border-color:#B81E12}
.dkr-srow.on .dkr-sck::after{content:"";position:absolute;left:10px;top:3px;width:8px;height:16px;border:solid #E0301C;
  border-width:0 5px 5px 0;transform:rotate(40deg)}
.dkr-sfoot{display:flex;align-items:center;gap:16px;padding:12px 20px 8px}
.dkr-ssum{flex:1;display:flex;align-items:baseline;gap:12px}
.dkr-ssum span{font-size:19px;font-weight:900;color:#6B5230}
.dkr-ssum b{font-family:var(--pop);font-weight:400;font-size:32px;color:#4A3214}
.dkr-sell.dkr-ok .dkr-ssum b{color:#2F7A1E}
.dkr-sell .dkr-note{margin:0;padding:0 20px 16px;border-radius:0 0 20px 20px;font-size:17px;font-weight:700;color:#6B5230;line-height:1.5}

/* ══════════ ボーナスゲーム「悪夢の洞窟脱出」（王宮のパネル） ══════════ */
.mg.dkr-mg{width:1120px;max-width:none;padding:16px 20px 18px;border-radius:32px;clip-path:none;border:8px solid transparent;

.dkr-mg .mgcap{margin:4px 0 0;padding:6px 0;border-radius:11px;text-align:center;font-size:18px;font-weight:900;color:#5B2B3E;

.dkr-mg .mgstage{position:relative;height:344px;min-height:0;border-radius:18px;overflow:hidden;border:4px solid #E8C060;padding:0;
  background:#160A1C;box-shadow:inset 0 0 0 2px rgba(0,0,0,.5),0 0 18px rgba(255,160,210,.25)}

             radial-gradient(34% 44% at 91% 22%,rgba(255,170,80,.34),transparent 72%);

@keyframes dkrFlicker{0%{opacity:1}23%{opacity:.78}41%{opacity:.95}64%{opacity:.7}82%{opacity:.9}}
.dkr-mg .mgart{position:absolute;inset:0;font-size:0;line-height:0}
.dkr-mg .mgart canvas{display:block;width:100%;height:100%}
.dkr-mg .mground{position:absolute;left:12px;top:12px;z-index:3;display:flex;flex-direction:column;gap:8px}
