<style>
/* ══════════════════════════════════════════════════════════════
   ダイスキングダム — サイコロUI・マス選び・無人島の選択・持ち時間のリング（1q-turn.html / v9 WP6 → v10 WP13a）
   ──────────────────────────────────────────────────────────────
   さわるセレクタ：#diceui #gauge #push #odd #even .oddeven #pickeye .dkt-*
   動かすのは transform と opacity だけ。入場は el.animate()（9g-turn.js の dktEnter。終わったら残らない）。
   位置は 1600×900 のステージ座標（盤の中心は x=808）。本家 s6/f05・f07 の並び：
   上に弧のゲージ、左右に青い丸の［奇数］［偶数］、その下の真ん中に金縁のピンクの［押す］。
   ══════════════════════════════════════════════════════════════ */

/* ── ゲージ（canvas）と説明の札 ── */
#gauge{left:528px;top:290px;width:560px;height:214px;transform:none;z-index:1}
#diceui .dkt-cap{position:absolute;left:808px;top:446px;transform:translateX(-50%);z-index:2;
  padding:5px 18px 6px;border-radius:999px;white-space:nowrap;pointer-events:none;
  font-family:var(--jp);font-weight:900;font-size:20px;line-height:1.2;color:#F6E6C0;
  background:linear-gradient(180deg,rgba(44,28,8,.9),rgba(16,10,3,.92));
  border:2px solid rgba(242,194,48,.78);box-shadow:0 4px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,230,160,.25)}
#diceui .dkt-cap:empty{display:none}
#diceui .dkt-cap b{font-family:var(--pop);font-weight:400;color:#FFD44A}
#diceui .dkt-cap .dkt-dot{display:inline-block;width:6px;height:6px;margin:0 10px 3px;border-radius:50%;
  background:#C8952F;vertical-align:middle}
#diceui.dkt-hit .dkt-cap{border-color:#FFE27A;box-shadow:0 0 18px 4px rgba(255,210,80,.6),inset 0 1px 0 rgba(255,230,160,.3)}

/* ── ［押す］：金縁のピンクの楕円 ── */
#diceui #push{left:696px;top:561px;width:224px;height:134px;transform:none;z-index:3;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0 0 4px;
  border:8px solid transparent;border-radius:50%;
  background:
    radial-gradient(60% 42% at 50% 20%,rgba(255,255,255,.62),rgba(255,255,255,0) 70%) padding-box,
    radial-gradient(90% 90% at 50% 38%,#FFA6DA 0%,#F4499F 44%,#B51660 78%,#780A3A 100%) padding-box,
    linear-gradient(162deg,#FFF7D6 0%,#F4D06A 16%,#B8801E 38%,#FFE69C 56%,#8A5A0C 78%,#F7DC8A 100%) border-box;
  box-shadow:0 10px 0 #5C0A2F,0 20px 30px rgba(0,0,0,.55),inset 0 -14px 22px rgba(90,0,40,.5),inset 0 4px 0 rgba(255,255,255,.3);
  color:#fff;-webkit-text-stroke:0;
  animation:dktPushIdle 1.5s var(--fx-inout) infinite;transition:transform 140ms var(--fx-back)}
#diceui #push::before{content:"";position:absolute;inset:-8px;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,255,255,.6),rgba(255,160,220,.28) 62%,rgba(255,160,220,0));
  opacity:0;transition:opacity 160ms}
#diceui #push:hover{filter:brightness(1.06)}
#push .dkt-pl{display:block;font-family:var(--pop);font-weight:400;font-style:normal;font-size:46px;line-height:1;color:#fff;
  -webkit-text-stroke:7px #6E0A36;paint-order:stroke fill;text-shadow:0 4px 0 rgba(80,0,32,.55);pointer-events:none}
#push .dkt-ps{display:block;font-family:var(--jp);font-weight:900;font-style:normal;font-size:20px;line-height:1;color:#FFE6F3;
  -webkit-text-stroke:3.5px #6E0A36;paint-order:stroke fill;pointer-events:none}
/* 奇数／偶数のモード：上に「N個残り」、下に大きく「偶数」（本家 v6 t0030） */
#push.dkt-mode .dkt-pl{color:#FFF3B8}
#push.dkt-mode .dkt-ps{order:-1;color:#FFF3B8}
@keyframes dktPushIdle{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes dktCharge{from{opacity:.55}to{opacity:1}}

/* 後光（押すの後ろで呼吸する輪） */
#diceui .dkt-halo{position:absolute;left:662px;top:531px;width:292px;height:194px;border-radius:50%;pointer-events:none;z-index:2;
  background:radial-gradient(closest-side,rgba(255,120,200,0) 60%,rgba(255,150,215,.58) 75%,rgba(255,214,120,.34) 87%,rgba(255,214,120,0) 100%);
  animation:dktHalo 1.5s var(--fx-inout) infinite}
@keyframes dktHalo{0%,100%{transform:scale(.95);opacity:.55}50%{transform:scale(1.07);opacity:1}}
#diceui:has(#push.dkt-hold) .dkt-halo{animation-duration:.42s;
  background:radial-gradient(closest-side,rgba(255,220,120,0) 58%,rgba(255,232,150,.8) 74%,rgba(255,170,220,.45) 88%,rgba(255,170,220,0) 100%)}

/* ── ［奇数］［偶数］：青い丸（押すとモード。もう一度押すと解除） ── */
#diceui .oddeven{top:474px;width:108px;height:108px;padding:0;border-radius:50%;z-index:3;
  display:flex;align-items:center;justify-content:center;
  border:5px solid transparent;
  background:
    radial-gradient(70% 48% at 50% 22%,rgba(255,255,255,.55),rgba(255,255,255,0) 72%) padding-box,
    radial-gradient(90% 90% at 50% 40%,#86CEFF 0%,#2E8BE0 48%,#134E9E 82%,#0B2C5E 100%) padding-box,
    linear-gradient(160deg,#F0F8FF 0%,#9CC0E6 26%,#2B4A74 56%,#C9DDF2 82%,#5C7CA6 100%) border-box;
  box-shadow:0 7px 0 #0A2548,0 13px 20px rgba(0,0,0,.5),inset 0 -9px 14px rgba(0,20,60,.5);
  font-family:var(--pop);font-weight:400;font-size:28px;line-height:1;color:#fff;
  -webkit-text-stroke:5px #0B2C5E;paint-order:stroke fill;
  transition:transform var(--fx-t-release) var(--fx-back)}
#diceui #odd{left:574px;right:auto}
#diceui #even{left:934px;right:auto}
#diceui .oddeven:hover{transform:translateY(-3px)}
#diceui .oddeven:active{transform:scale(.92)}
#diceui .oddeven.dkt-on{transform:translateY(-4px);
  background:
    radial-gradient(70% 48% at 50% 22%,rgba(255,255,255,.6),rgba(255,255,255,0) 72%) padding-box,
    radial-gradient(90% 90% at 50% 40%,#9EDCFF 0%,#3A9AF0 48%,#1656A8 82%,#0B2C5E 100%) padding-box,
    linear-gradient(160deg,#FFF7D6 0%,#F4D06A 20%,#B8801E 42%,#FFE69C 62%,#8A5A0C 84%,#F7DC8A 100%) border-box;
  box-shadow:0 7px 0 #0A2548,0 0 0 3px rgba(255,236,150,.85),0 13px 20px rgba(0,0,0,.5),inset 0 -9px 14px rgba(0,20,60,.45)}
#diceui .oddeven.dkt-on::before{content:"";position:absolute;inset:-12px;border-radius:50%;pointer-events:none;
  box-shadow:0 0 24px 8px rgba(255,214,90,.8);animation:fxBreath 1.1s var(--fx-inout) infinite}
/* 使えない時は不透明な灰色（下の盤の数字が透けない） */
#diceui .oddeven.dim{opacity:1;filter:grayscale(.9) brightness(.62)}
/* 使い切った後：押すと追加購入（本家「追加購入可能」） */
#diceui .oddeven.dkt-buy{pointer-events:auto;cursor:pointer;filter:grayscale(.75) brightness(.78)}
#diceui .oddeven u{position:absolute;right:-8px;top:-8px;min-width:36px;height:36px;padding:0 8px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;text-decoration:none;
  font-family:var(--pop);font-weight:400;font-size:20px;line-height:1;color:#3A2405;-webkit-text-stroke:0;
  background:linear-gradient(180deg,#FFF3C8,#F2C230 55%,#C8952F);border:2px solid #6B4408;box-shadow:0 2px 0 rgba(0,0,0,.4)}
/* 「奇数・偶数アイテムすべて使用」「追加購入可能」の小さな札（ボタンの外側） */
#diceui .dkt-oetag{position:absolute;top:510px;display:none;white-space:nowrap;padding:6px 12px 7px;border-radius:10px;pointer-events:none;
  font-family:var(--jp);font-weight:900;font-size:18px;line-height:1.28;color:#F2E8D6;
  background:linear-gradient(180deg,rgba(40,28,10,.9),rgba(16,10,3,.9));border:1px solid rgba(242,194,48,.5);
  box-shadow:0 4px 10px rgba(0,0,0,.4)}
#diceui .dkt-oeA{right:1040px;text-align:right}
#diceui .dkt-oeB{left:1056px;color:#A8E4FF;border-color:rgba(140,210,255,.6)}
#diceui.dkt-oe0 .dkt-oetag:not(:empty){display:block}

/* 押している間・押した瞬間 */
#diceui #push:active,#diceui #push.dkt-hold{transform:scale(.95);animation:none;
  box-shadow:0 4px 0 #5C0A2F,0 8px 16px rgba(0,0,0,.5),inset 0 -8px 18px rgba(90,0,40,.5),inset 0 4px 0 rgba(255,255,255,.3)}
#diceui #push.dkt-hold::before{opacity:1;animation:dktCharge .3s linear infinite alternate}

/* CPU・自動プレイの手番：ボタンは隠してゲージだけ動かす ／ マス選びの間は隠す */
#diceui.dkt-watch #push,#diceui.dkt-watch .oddeven,#diceui.dkt-watch .dkt-halo,#diceui.dkt-watch .dkt-oetag{visibility:hidden}
#stage.dkt-picking #diceui{visibility:hidden}

/* ══════════ 手番の持ち時間のリング（G12。回るのは2枚の半円だけ＝transform） ══════════ */
.dkt-ring{position:absolute;width:80px;height:80px;border-radius:50%;pointer-events:none;z-index:6;
  background:radial-gradient(closest-side,#20150a 0 62%,transparent 63%),linear-gradient(160deg,#FFF3C0 0%,#F2C230 45%,#C8821A 100%);
  box-shadow:0 0 0 3px rgba(40,24,4,.9),0 6px 14px rgba(0,0,0,.5)}
.dkt-rg{position:absolute;top:0;width:50%;height:100%;overflow:hidden;font-style:normal}
.dkt-rg-r{right:0}
.dkt-rg-l{left:0}
.dkt-rg > i{position:absolute;top:0;width:200%;height:100%;border-radius:50%;
  animation:dktRg calc(var(--rg,30000ms) / 2) linear forwards}
.dkt-rg-r > i{right:0;background:linear-gradient(90deg,rgba(22,13,4,.94) 50%,transparent 50%)}
.dkt-rg-l > i{left:0;background:linear-gradient(90deg,transparent 50%,rgba(22,13,4,.94) 50%);animation-delay:calc(var(--rg,30000ms) / 2)}
@keyframes dktRg{from{transform:rotate(0deg)}to{transform:rotate(180deg)}}
.dkt-ring b{position:absolute;inset:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 42% 30%,#5A3E14,#1A1005 72%);
  font-family:var(--pop);font-weight:400;font-size:28px;line-height:1;color:#FFE7A8;-webkit-text-stroke:0}
.dkt-ring.dkt-late b{color:#FF8E7E}
.dkt-ring.dkt-late{animation:dktRingLate .5s var(--fx-inout) infinite alternate}
@keyframes dktRingLate{to{transform:scale(1.08)}}
#diceui .dkt-ring{left:946px;top:598px}
.dkt-mod > .dkt-ring{left:auto;right:26px;top:-36px}

/* ══════════ マス選びの案内パネル（湖の中に収める） ══════════ */
.dkt-pick{position:absolute;left:513px;top:356px;width:590px;z-index:310;display:none;pointer-events:auto;
  padding:34px 22px 16px;border-radius:18px;text-align:center;color:#FFF6E2;
  background:
    radial-gradient(120% 80% at 50% 0%,rgba(255,214,120,.18),rgba(255,214,120,0) 60%) padding-box,
    linear-gradient(180deg,rgba(56,38,16,.96),rgba(18,11,4,.97)) padding-box,
    var(--fx-gold-metal) border-box;
  border:4px solid transparent;
  box-shadow:0 8px 0 rgba(0,0,0,.35),0 18px 36px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,220,150,.22)}
.dkt-pick::before{content:"";position:absolute;inset:6px;border-radius:12px;pointer-events:none;border:1px solid rgba(196,150,70,.34)}
.dkt-pick.dkt-on{display:block}
.dkt-pick.dkt-out{animation:dktPickOut 170ms var(--fx-in) both}
@keyframes dktPickOut{to{transform:scale(.94);opacity:0}}
.dkt-pk-tag{position:absolute;left:50%;top:-26px;transform:translateX(-50%);height:52px;padding:0 56px;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#F0604A 0 10%,#C9302C 45%,#8E1410);
  clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%)}
.dkt-pk-tag b{font-family:var(--pop);font-weight:400;font-size:26px;line-height:1;color:#FFF6E2;
  -webkit-text-stroke:5px #5A1206;paint-order:stroke fill}
.dkt-pk-msg{font-family:var(--pop);font-weight:400;font-size:27px;line-height:1.25;color:#FFF6E2;
  -webkit-text-stroke:5px #2A1604;paint-order:stroke fill}
.dkt-pk-note{margin-top:8px;font-size:18px;font-weight:700;line-height:1.35;color:#E9D6A8}
.dkt-pick.dkt-bad .dkt-pk-note{color:#FFB0A2}
.dkt-pk-foot{display:flex;align-items:center;gap:12px;margin-top:14px}
.dkt-pk-bar{flex:1;height:12px;border-radius:6px;overflow:hidden;background:#140C04;border:2px solid #7A5A22;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.dkt-pk-bar i{display:block;height:100%;transform-origin:0 50%;
  background:linear-gradient(90deg,#FF6A5E,#F2C230 35%,#FFF3C8);animation:dktBar linear both}
@keyframes dktBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.dkt-pk-sec{font-size:18px;font-weight:700;color:#E9D6A8;white-space:nowrap}
.dkt-pk-sec b{font-family:var(--pop);font-weight:400;font-size:24px;color:#FFD44A}
.dkt-pick.dkt-late .dkt-pk-sec b{color:#FF8A7A}
.dkt-pk-x{position:relative;height:48px;padding:0 20px;border-radius:12px;cursor:pointer;white-space:nowrap;
  font-family:var(--pop);font-weight:400;font-size:20px;line-height:1;color:#F3E6C8;
  -webkit-text-stroke:3.5px #2A1604;paint-order:stroke fill;
  background:linear-gradient(180deg,#6E5326,#3E2C11 52%,#271A07);border:2px solid #A98446;box-shadow:0 4px 0 rgba(0,0,0,.45);
  transition:transform var(--fx-t-release) var(--fx-back)}
.dkt-pk-x:hover{filter:brightness(1.12)}
.dkt-pk-x:active{transform:translateY(3px) scale(.96)}

/* ══════════ 選択の画面（モーダルの中身）共通 ══════════ */
.dkt-mod{position:relative;width:790px;max-width:94%;padding:48px 28px 24px;border-radius:20px;text-align:center;color:#FFF6E2;
  background:
    radial-gradient(120% 70% at 50% 0%,rgba(255,214,120,.16),rgba(255,214,120,0) 60%) padding-box,
    linear-gradient(180deg,rgba(60,42,18,.97),rgba(20,12,4,.98)) padding-box,
    var(--fx-gold-metal) border-box;
  border:5px solid transparent;
  box-shadow:0 10px 0 rgba(0,0,0,.35),0 22px 44px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,220,150,.22)}
.dkt-mod::before{content:"";position:absolute;inset:7px;border-radius:13px;pointer-events:none;border:1px solid rgba(196,150,70,.35)}
.dkt-rib{position:absolute;left:50%;top:-30px;transform:translateX(-50%);height:60px;padding:0 70px;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#F0604A 0 10%,#C9302C 45%,#8E1410);
  clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%)}
.dkt-rib.dkt-blue{background:linear-gradient(180deg,#8FD2FF 0 10%,#2E8BE0 45%,#0B2C5E)}
.dkt-rib b{font-family:var(--pop);font-weight:400;font-size:30px;line-height:1;color:#FFF6E2;
  -webkit-text-stroke:5px #5A1206;paint-order:stroke fill}
.dkt-rib.dkt-blue b{-webkit-text-stroke-color:#0B2C5E}
.dkt-lead{margin:4px 0 18px;font-size:22px;font-weight:700;line-height:1.4;color:#F0DCA8}
.dkt-lead em{font-style:normal;font-family:var(--pop);font-weight:400;color:#9FE3FF}
.dkt-foot{margin-top:16px;font-size:20px;font-weight:700;line-height:1.35;color:#CDB78A}
.dkt-ic{width:84px;height:84px;flex:0 0 auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.dkt-gem{display:inline-block;width:34px;height:30px;margin-right:6px;vertical-align:-3px}

/* ══════════ 無人島を脱出（本家 v7 t1000：羊皮紙の台に3段の選択肢） ══════════ */
.dkt-mod.dkt-jail{width:880px;padding:50px 26px 20px;color:#3A2405;
  background:
    radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.55),rgba(255,255,255,0) 60%) padding-box,
    linear-gradient(180deg,#F8EACB,#EAD29E) padding-box,
    var(--fx-gold-metal) border-box}
.dkt-jail::before{border-color:rgba(138,90,12,.35)}
.dkt-rows{display:flex;flex-direction:column;gap:12px}
.dkt-row{position:relative;display:flex;align-items:center;gap:20px;min-height:112px;padding:10px 24px 10px 12px;border-radius:14px;
  text-align:left;cursor:pointer;color:#3A2405;font:inherit;
  border:3px solid transparent;
  background:linear-gradient(180deg,#FFFBF0,#F4E4BE) padding-box,linear-gradient(160deg,#C79A45,#8A5A0C 55%,#E2BE6E) border-box;
  box-shadow:0 5px 0 rgba(90,58,10,.5),0 10px 18px rgba(60,36,6,.28);
  transition:transform var(--fx-t-release) var(--fx-back);animation:dktDeal 420ms var(--fx-spring) both}
.dkt-row:nth-child(2){animation-delay:60ms}
.dkt-row:nth-child(3){animation-delay:120ms}
@keyframes dktDeal{from{transform:translateY(22px) scale(.94)}}
.dkt-row:hover{transform:translateY(-3px)}
.dkt-row:active{transform:translateY(2px) scale(.985)}
.dkt-row.dkt-gold{background:linear-gradient(180deg,#FFF7DA,#F7DB92) padding-box,linear-gradient(160deg,#FFF3C0,#C8952F 45%,#8A5A0C 70%,#F3D583) border-box}
.dkt-row.dkt-blue{background:linear-gradient(180deg,#F2FAFF,#CFE7FA) padding-box,linear-gradient(160deg,#E8F4FF,#5C8EC4 45%,#27466E 70%,#BFD8F2) border-box}
.dkt-row.dkt-off{cursor:default;filter:grayscale(.75) brightness(.9);animation:none}
.dkt-row.dkt-off:hover,.dkt-row.dkt-off:active{transform:none}
.dkt-rico{flex:0 0 136px;height:92px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:radial-gradient(80% 60% at 50% 25%,rgba(255,255,255,.55),rgba(255,255,255,0) 70%),linear-gradient(180deg,#F5CF74,#C98A2A);
  border:2px solid #8A5A0C;box-shadow:inset 0 -6px 10px rgba(110,64,6,.35),0 2px 0 rgba(0,0,0,.25)}
.dkt-row.dkt-blue .dkt-rico{background:radial-gradient(80% 60% at 50% 25%,rgba(255,255,255,.6),rgba(255,255,255,0) 70%),linear-gradient(180deg,#8FD0FF,#2E7FCB);border-color:#0B2C5E}
.dkt-rico .dkt-ic{width:58px;height:58px}
.dkt-rico em{font-style:normal;font-family:var(--jp);font-weight:900;font-size:20px;line-height:1;color:#fff;
  -webkit-text-stroke:3.5px #5A3A04;paint-order:stroke fill;white-space:nowrap}
.dkt-row.dkt-blue .dkt-rico em{-webkit-text-stroke-color:#0B2C5E}
.dkt-rtx{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.dkt-rtx b{font-family:var(--pop);font-weight:400;font-size:30px;line-height:1.15;color:#3A2405}
.dkt-rtx > small{font-size:20px;font-weight:700;line-height:1.3;color:#6B4A1A}
.dkt-rtx > small.dkt-short{color:#B2311C}
.dkt-fee2{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px}
.dkt-fee2 strong{font-family:var(--pop);font-weight:400;font-size:34px;line-height:1;color:#B2411C;
  -webkit-text-stroke:0;text-shadow:0 2px 0 rgba(255,255,255,.7)}
.dkt-fee2 small{padding:5px 14px 6px;border-radius:999px;font-size:20px;font-weight:900;line-height:1.1;white-space:nowrap;
  color:#FFE7A8;background:linear-gradient(180deg,#4A3312,#241806);box-shadow:inset 0 1px 0 rgba(255,220,150,.25)}
.dkt-fee2 small i{font-style:normal;color:#FFD44A}
.dkt-jail .dkt-foot{margin-top:14px;color:#5A3A10}

/* ══════════ 奇数・偶数アイテムの追加購入 ══════════ */
.dkt-mod.dkt-oebuy{width:660px}
.dkt-oepk{display:flex;align-items:center;justify-content:center;gap:16px;margin:0 auto 16px;padding:12px 22px;max-width:460px;border-radius:14px;
  background:rgba(0,0,0,.3);border:2px solid rgba(143,210,255,.5)}
