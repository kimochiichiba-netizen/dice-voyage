<style>
/* ══════════════════════════════════════════════════════════════
   ダイスキングダム — ペンダント＆キューブ（1l-pend.html / WP1）
   ・書くのは #pend #gacha .pullcard .orb と .dkp- で始まる物だけ。
   ・動かすのは transform と opacity だけ。入場は 0% で中身を消さない。
   ・横長スマホ（高さ560px未満）は最後の @media で文字と押せる範囲を大きくする。
   ══════════════════════════════════════════════════════════════ */
.dkp-scr,.dkp-modal{
  --dkp-rimA:linear-gradient(160deg,#EEF6FF 0%,#9DBCE0 34%,#3E5E82 62%,#B9D2EE 100%);
  --dkp-rimS:linear-gradient(160deg,#F8EAFF 0%,#C59CEE 34%,#5A2F92 62%,#E2CCFF 100%);
  --dkp-rimSS:linear-gradient(152deg,#FFF7DC 0%,#F0CE72 14%,#C8952F 30%,#7C5410 46%,#A8752A 58%,#F3D583 76%,#8A6314 90%,#FFF3C8 100%);
  --dkp-cellA:linear-gradient(180deg,#34404C 0%,#1C2430 60%,#10151C 100%);
  --dkp-cellS:linear-gradient(180deg,#3E2C4C 0%,#24182E 60%,#150E1C 100%);
  --dkp-cellSS:linear-gradient(180deg,#5A4212 0%,#2E2006 62%,#1C1203 100%)}

/* ── 共通：タブ・ロゴ・本文 ── */
#pend .dktab .tx,#gacha .dktab .tx{font-size:20px}
#pend .dktab .ic,#gacha .dktab .ic{width:60px;height:58px;display:flex;align-items:center;justify-content:center}
#pend .dktab .ic svg,#gacha .dktab .ic svg{width:58px;height:58px;display:block;overflow:visible}
#pend .dktab .nw,#gacha .dktab .nw{font-size:20px;min-width:32px;height:32px;border-radius:16px;line-height:1}
#gacha .dklogo.dktext b{font-size:46px}
#gacha .dklogo.dktext i{font-size:16px;letter-spacing:.3em}
#pend .dkp-body,#gacha .dkp-body{gap:16px;align-items:stretch}
#pend.dkp-busy .dkhd,#pend.dkp-busy .dktabs,#pend.dkp-busy .dkp-body,
#gacha.dkp-busy .dkhd,#gacha.dkp-busy .dktabs,#gacha.dkp-busy .dkp-lane{pointer-events:none}
#pend .dkp-body > .fx-panel,#gacha .dkp-body > .fx-panel{display:flex;flex-direction:column;gap:12px;
  padding:14px 18px 16px;min-width:0;min-height:0}
#pend .dkp-tabin > .fx-panel{animation:dkpTabIn 380ms cubic-bezier(.16,1,.3,1) both}
#pend .dkp-tabin > .fx-panel + .fx-panel{animation-delay:60ms}
@keyframes dkpTabIn{from{transform:translateY(18px) scale(.975)}}

/* 見出し */
.dkp-ttl{font-family:var(--pop);font-size:26px;line-height:1.15;color:#FFE9B5;letter-spacing:.04em;white-space:nowrap;
  -webkit-text-stroke:4px #241604;paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.dkp-ph{display:flex;align-items:center;gap:12px;min-height:54px;flex:0 0 auto;padding:0 2px 8px;
  border-bottom:1px solid rgba(196,150,70,.38)}
.dkp-note{font-size:16px;color:#D9C29A;line-height:1.3}
.dkp-sub{display:flex;align-items:center;gap:12px;margin:0;flex:0 0 auto;min-height:32px;font-family:var(--pop);font-size:20px;
  line-height:1.2;color:#F4DFAE;-webkit-text-stroke:3px #1E1204;paint-order:stroke fill;white-space:nowrap;font-weight:400}
.dkp-sub::after{content:"";flex:1;height:2px;border-radius:1px;order:5;
  background:linear-gradient(90deg,#C8952F,rgba(200,149,47,0))}
.dkp-hint{margin:0;font-size:16px;line-height:1.45;color:#D9C29A}
.dkp-hint.big{font-size:20px;line-height:1.6;color:#EBD9B2;text-align:center;margin:auto 0}
.dkp-warn{margin:0;padding:8px 12px;border-radius:10px;font-size:16px;line-height:1.4;font-weight:900;color:#FFD2C8;
  background:linear-gradient(180deg,rgba(201,48,44,.36),rgba(120,16,10,.36));border:1px solid rgba(255,120,100,.55)}
.dkp-warn::before{content:"！";display:inline-grid;place-items:center;width:24px;height:24px;margin-right:8px;border-radius:50%;
  background:#C9302C;color:#fff;font-size:16px;vertical-align:-3px}
.dkp-warn.sm{padding:5px 10px}
.dkp-ci{display:inline-block;width:26px;height:26px;margin:0 4px 0 6px;vertical-align:-4px;flex:0 0 auto}

/* ── ペンダントの絵 ── */
.dkp-medal{position:relative;display:inline-block;flex:0 0 auto;width:var(--ms,96px);height:calc(var(--ms,96px) * 1.0833);
  line-height:0;vertical-align:middle}
.dkp-medal > svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;
  filter:drop-shadow(0 4px 3px rgba(0,0,0,.55))}
.dkp-medal .dkp-plus{position:absolute;right:-4%;bottom:-3%;z-index:2;padding:3px 8px 4px;border-radius:9px;line-height:1;
  font-family:var(--pop);font-size:18px;font-weight:400;color:#FFFFFF;white-space:nowrap;
  -webkit-text-stroke:3px #0C2A52;paint-order:stroke fill;
  background:linear-gradient(180deg,#8FD2FF,#2E8BE0 55%,#14559E);border:2px solid #E4F2FF;box-shadow:0 2px 3px rgba(0,0,0,.55)}
.dkp-medal .dkp-plus.mx{background:linear-gradient(180deg,#FFF3C8,#F2C230 55%,#A9761A);border-color:#FFF8E0;
  -webkit-text-stroke-color:#5A3A04}
.dkp-medal .dkp-rt{position:absolute;left:-6%;top:-4%;z-index:2;font-family:var(--caps);font-size:20px;font-style:normal;
  line-height:1;color:#FFD44A;white-space:nowrap;-webkit-text-stroke:4px #3A2405;paint-order:stroke fill;text-shadow:0 2px 0 #C98A12}
.dkp-medal .dkp-rt.rS{color:#EBD0FF;text-shadow:0 2px 0 #7A4AB8}
.dkp-medal .dkp-rt.rA{color:#DCEEFF;text-shadow:0 2px 0 #3E6FA8}
.dkp-medal.dkp-unseen > svg{filter:brightness(0) drop-shadow(0 0 5px rgba(255,220,150,.3))}
.dkp-medal.dkp-seen > svg{filter:grayscale(1) brightness(.78) drop-shadow(0 4px 3px rgba(0,0,0,.5))}
.dkp-float{animation:dkpFloat 5.2s ease-in-out infinite}
@keyframes dkpFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* 等級の札 */
.dkp-rtag{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-width:50px;height:34px;padding:0 8px;
  border-radius:9px;font-family:var(--caps);font-size:22px;font-style:normal;line-height:1;color:#FFFFFF;
  -webkit-text-stroke:4px rgba(20,10,2,.8);paint-order:stroke fill;border:2px solid rgba(255,255,255,.75);
  box-shadow:0 2px 0 rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.4)}
.dkp-rtag.sm{min-width:40px;height:28px;padding:0 6px;font-size:18px;border-radius:7px;-webkit-text-stroke-width:3px}
.dkp-rtag.rA{background:linear-gradient(180deg,#A8D4FF,#3E86D0 55%,#1F4E8C)}
.dkp-rtag.rS{background:linear-gradient(180deg,#E6C6FF,#9A5ED8 55%,#57288E)}
.dkp-rtag.rSS{background:linear-gradient(180deg,#FFF3C8,#F2C230 50%,#B07A0E);color:#FFFBEA;-webkit-text-stroke-color:#5A3404}

/* ── 一覧のマス ── */
.dkp-cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;
  border-radius:14px;border:3px solid transparent;padding:10px 4px 8px;
  background:var(--dkp-cellA) padding-box,var(--dkp-rimA) border-box;
  box-shadow:0 5px 0 rgba(0,0,0,.42),inset 0 2px 0 rgba(255,230,170,.16);
  transition:transform 160ms cubic-bezier(.16,1,.3,1)}
.dkp-cell.rS{background:var(--dkp-cellS) padding-box,var(--dkp-rimS) border-box}
.dkp-cell.rSS{background:var(--dkp-cellSS) padding-box,var(--dkp-rimSS) border-box}
.dkp-cell::after{content:"";position:absolute;inset:-5px;border-radius:18px;pointer-events:none;opacity:0;z-index:-1;
  box-shadow:0 0 22px 6px rgba(255,200,80,.66);transition:opacity 160ms}
.dkp-cell:hover{transform:translateY(-4px)}
.dkp-cell.on::after{opacity:1}
.dkp-cell.on{animation:fxSelPop 260ms cubic-bezier(.34,1.56,.64,1)}
.dkp-cell.on::before{content:"";position:absolute;inset:-3px;border-radius:15px;border:3px solid #FFF0BE;pointer-events:none}
.dkp-gl{position:absolute;inset:0;border-radius:11px;overflow:hidden;pointer-events:none}
.dkp-gl::after{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:34%;
  background:linear-gradient(90deg,transparent,rgba(255,244,210,.32),transparent);
  transform:translateX(-160%) skewX(-18deg);animation:fxShine 4.8s ease-in-out infinite}
.dkp-cnm{position:relative;font-family:var(--pop);font-size:18px;font-weight:400;line-height:1.15;color:#FFEFD0;white-space:nowrap;
  -webkit-text-stroke:3px #1E1204;paint-order:stroke fill}
.dkp-dup{position:absolute;right:5px;top:5px;z-index:3;padding:2px 7px;border-radius:9px;font-family:var(--pop);font-size:16px;
  line-height:1.15;color:#FFFFFF;-webkit-text-stroke:3px #3A2405;paint-order:stroke fill;
  background:rgba(20,12,4,.82);border:1px solid #C8952F}
.dkp-eqtag{position:absolute;left:50%;top:-13px;transform:translateX(-50%);z-index:4;padding:2px 10px;border-radius:9px;
  white-space:nowrap;font-size:16px;font-weight:900;line-height:1.2;color:#3A2405;
  background:linear-gradient(180deg,#FFF0BE,#E8B23A);border:2px solid #8A6206;box-shadow:0 2px 4px rgba(0,0,0,.45)}

/* ── ペンダント：装備スロット（左） ── */
#pend .dkp-eqp{flex:0 0 560px}
.dkp-crest{width:46px;height:46px;flex:0 0 auto}
.dkp-crest svg{width:100%;height:100%;display:block}
.dkp-cnt{margin-left:auto;font-size:18px;color:#D9C29A;white-space:nowrap}
.dkp-cnt b{font-family:var(--pop);font-size:28px;font-weight:400;color:#FFE9B5;-webkit-text-stroke:4px #241604;paint-order:stroke fill}
.dkp-slots{display:flex;flex-direction:column;gap:10px;flex:0 0 auto}
.dkp-slot{position:relative;display:flex;align-items:center;gap:14px;height:140px;padding:10px 14px 10px 18px;border-radius:14px;
  cursor:pointer;border:2px solid rgba(200,149,47,.6);
  background:radial-gradient(90% 120% at 12% 50%,rgba(255,210,120,.13),transparent 60%),linear-gradient(180deg,#3E2C12,#1E1408);
  box-shadow:inset 0 1px 0 rgba(255,230,170,.25),0 4px 0 rgba(0,0,0,.35);transition:transform 160ms cubic-bezier(.16,1,.3,1)}
.dkp-slot:hover{transform:translateX(4px)}
.dkp-slot.rSS{border-color:#E8B23A}
.dkp-slot.on{border-color:#FFF0BE;box-shadow:inset 0 1px 0 rgba(255,230,170,.3),0 4px 0 rgba(0,0,0,.35),0 0 0 2px rgba(255,210,110,.45)}
.dkp-slot.dkp-empty{cursor:default;border:2px dashed rgba(200,149,47,.5);
  background:repeating-linear-gradient(135deg,rgba(255,236,190,.035) 0 12px,transparent 12px 24px),linear-gradient(180deg,#2A1D0B,#160E05)}
.dkp-slot.dkp-empty:hover{transform:none}
.dkp-slot.dkp-pop{animation:fxSelPop 320ms cubic-bezier(.34,1.56,.64,1)}
.dkp-sno{position:absolute;left:-2px;top:-2px;width:30px;height:30px;border-radius:12px 0 12px 0;display:grid;place-items:center;
  font-family:var(--pop);font-size:18px;line-height:1;color:#FFE9B5;background:linear-gradient(180deg,#8A6A2A,#3A2A0E);
  border-right:1px solid rgba(255,220,150,.4);border-bottom:1px solid rgba(255,220,150,.4)}
.dkp-hole{position:relative;width:92px;height:92px;flex:0 0 auto;border-radius:50%;
  background:radial-gradient(circle at 50% 45%,rgba(0,0,0,.55),rgba(0,0,0,.2) 70%);border:3px dashed rgba(255,220,150,.35)}
.dkp-hole i::before,.dkp-hole i::after{content:"";position:absolute;left:50%;top:50%;width:30px;height:5px;margin:-2.5px 0 0 -15px;
  border-radius:3px;background:rgba(255,220,150,.45)}
.dkp-hole i::after{transform:rotate(90deg)}
.dkp-si{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dkp-snr{display:flex;align-items:center;gap:8px;min-width:0}
.dkp-snm{min-width:0;font-family:var(--pop);font-size:22px;font-weight:400;line-height:1.2;color:#FFE9B5;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;-webkit-text-stroke:3px #241604;paint-order:stroke fill}
.dkp-slot.dkp-empty .dkp-snm{color:#BFA475}
.dkp-sds{margin:0;font-size:16px;line-height:1.35;color:#E8D5AE;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden}
.dkp-sp{display:flex;align-items:center;gap:8px;font-size:16px;color:#D9C29A;white-space:nowrap}
.dkp-sp i{font-style:normal;padding:1px 8px;border-radius:8px;background:rgba(255,236,190,.1);border:1px solid rgba(200,149,47,.4)}
.dkp-sp b{font-family:var(--pop);font-size:22px;font-weight:400;color:#B8F08A;-webkit-text-stroke:3px #14300A;paint-order:stroke fill}
.dkp-off.dkbtn{flex:0 0 auto;height:56px;padding:0 18px;font-size:22px;color:#FFF3E8;-webkit-text-stroke:4px rgba(70,10,4,.85);
  background:linear-gradient(180deg,#F29A84 0 8%,#D0543C 34%,#9E2A18 74%,#6E1608);border:3px solid #4A0E04}
#pend .dkp-eqp > .dkp-warn,#pend .dkp-eqp > .dkp-hint{margin-top:auto}

/* ── ペンダント：所持品（右） ── */
#pend .dkp-inv{flex:1 1 auto}
.dkp-seg.fx-seg{--x:calc(var(--si,0) * 100px)}
.dkp-seg.fx-seg button{min-width:100px;width:100px;height:46px;font-size:20px}
.dkp-seg.fx-seg i.thumb{width:100px}
.dkp-own{margin-left:auto;font-size:18px;color:#D9C29A;white-space:nowrap}
.dkp-own b{font-family:var(--pop);font-size:26px;font-weight:400;color:#FFE9B5;-webkit-text-stroke:4px #241604;paint-order:stroke fill}
.dkp-mini.dkbtn{height:50px;padding:0 18px;font-size:20px;flex:0 0 auto}
.dkp-grid{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:140px;gap:16px 12px;padding:12px 2px 0;flex:0 0 auto}
.dkp-det{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;gap:14px;padding:10px 18px 10px 8px;
  border-radius:14px;overflow:hidden;
  background:radial-gradient(60% 110% at 17% 55%,rgba(255,200,90,.2),transparent 62%),linear-gradient(180deg,rgba(20,12,4,.7),rgba(8,5,2,.85));
  border:2px solid rgba(200,149,47,.55);box-shadow:inset 0 0 34px rgba(0,0,0,.65)}
.dkp-det.rSS{background:radial-gradient(60% 110% at 17% 55%,rgba(255,214,110,.32),transparent 62%),linear-gradient(180deg,rgba(26,16,4,.7),rgba(8,5,2,.85))}
.dkp-det.rS{background:radial-gradient(60% 110% at 17% 55%,rgba(190,130,255,.24),transparent 62%),linear-gradient(180deg,rgba(20,12,4,.7),rgba(8,5,2,.85))}
.dkp-show{position:relative;width:220px;align-self:stretch;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.dkp-show > .dkp-medal{position:relative;z-index:2}
#pend .dkp-halo,#gacha .dkp-halo{width:320px;height:320px;margin:-160px 0 0 -160px}
.dkp-ped{position:absolute;left:50%;bottom:6%;width:170px;height:40px;margin-left:-85px;border-radius:50%;pointer-events:none;z-index:1;
  background:radial-gradient(closest-side,rgba(255,220,140,.55),rgba(255,190,80,.18) 60%,transparent);animation:fxBreath 2.8s ease-in-out infinite}
.dkp-dinfo{position:relative;z-index:2;flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.dkp-dhd{display:flex;align-items:center;gap:10px;min-width:0}
.dkp-dnm{min-width:0;font-family:var(--pop);font-size:28px;font-weight:400;line-height:1.2;color:#FFF0CE;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;-webkit-text-stroke:4px #241604;paint-order:stroke fill}
.dkp-dds{margin:0;font-size:18px;line-height:1.45;color:#EBD9B2}
.dkp-drate{display:flex;align-items:center;gap:10px}
.dkp-dl{flex:0 0 auto;font-size:16px;color:#D9C29A;white-space:nowrap}
.dkp-drate b{flex:0 0 auto;min-width:64px;text-align:right;font-family:var(--pop);font-size:24px;font-weight:400;color:#B8F08A;
  -webkit-text-stroke:4px #14300A;paint-order:stroke fill}
.dkp-bar{position:relative;flex:1;height:22px;border-radius:11px;background:linear-gradient(180deg,#2A2118,#453A2E);
  border:2px solid #1E1810;box-shadow:inset 0 3px 6px rgba(0,0,0,.6);overflow:hidden}
.dkp-bar > i{position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);border-radius:9px;overflow:hidden;
  background:linear-gradient(180deg,#B6F08A 0 26%,#61C238 52%,#3A8C1C);box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.dkp-bar > i::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.45),transparent);animation:dkpBarFlow 2.4s linear infinite}
@keyframes dkpBarFlow{from{transform:translateX(-120%)}to{transform:translateX(260%)}}
.dkp-bar > em{position:absolute;top:0;bottom:0;left:var(--x,100%);width:4px;margin-left:-2px;background:#FFE9B5;
  box-shadow:0 0 6px #FFD24D}
.dkp-dmax{margin:0;font-size:16px;line-height:1.35;color:#D9C29A}
.dkp-dmax b{font-family:var(--pop);font-size:20px;font-weight:400;color:#FFE9B5}
.dkp-dbtns{display:flex;gap:10px;margin-top:4px}
.dkp-dbtns .dkbtn{flex:1 1 0;min-width:0;height:60px;padding:0 8px;font-size:22px;white-space:nowrap}
.dkp-dbtns .dkbtn[data-dkp-act="goup"]{flex-grow:.9}
.dkp-dbtns .dkp-sell.dkbtn{flex-grow:1.35}
.dkp-sell.dkbtn{color:#FFF8E6;-webkit-text-stroke:4px rgba(40,24,6,.85);
  background:linear-gradient(180deg,#B89A6C 0 8%,#8A6A3E 34%,#5E4422 74%,#3E2A12);border:3px solid #2E1E08}
.dkp-sell.dkbtn .dkp-ci{width:22px;height:22px;margin:0 2px 0 4px}
.dkp-wood.dkbtn{color:#FFF1D6;-webkit-text-stroke:4px rgba(30,18,4,.9);
  background:linear-gradient(180deg,#8A6A38 0 8%,#5E4420 34%,#3E2A10 74%,#241806);border:3px solid #C8952F}

/* 空っぽの時 */
.dkp-inv.dkp-none{align-items:center;justify-content:center;gap:10px}
.dkp-hero{position:relative;width:100%;height:400px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.dkp-hero.sm{height:300px}
.dkp-hero .dkp-halo{z-index:0}
.dkp-heroimg{position:relative;z-index:1;width:420px;height:410px;background:center/contain no-repeat;animation:dkpFloat 6s ease-in-out infinite;
  -webkit-mask:radial-gradient(ellipse 44% 50% at 46% 50%,#000 60%,transparent 100%);mask:radial-gradient(ellipse 44% 50% at 46% 50%,#000 60%,transparent 100%)}
.dkp-hero.sm .dkp-heroimg{width:330px;height:300px}
.dkp-heromed{position:relative;z-index:1}
.dkp-nonetx{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:640px}
.dkp-nonetx p{margin:0;font-size:18px;line-height:1.6;color:#EBD9B2}
.dkp-big.dkbtn{height:70px;padding:0 44px;font-size:28px}

/* ── 強化タブ ── */
#pend .dkp-forge{flex:0 0 560px;align-items:center}
.dkp-forge .dkp-ph{align-self:stretch}
.dkp-fnm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.dkp-altar{position:relative;width:100%;height:262px;flex:1 1 262px;max-height:330px;display:flex;align-items:center;justify-content:center}
.dkp-altar > .dkp-medal{position:relative;z-index:2}
.dkp-altar .dkp-ped{bottom:2%;width:250px;height:54px;margin-left:-125px}
.dkp-crack{position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-92px 0 0 -85px;z-index:3;pointer-events:none;opacity:0;
  filter:drop-shadow(0 0 3px rgba(0,0,0,.9))}
.dkp-crack svg{width:100%;height:100%;display:block}
.dkp-okfl{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;z-index:1;
  pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,244,200,.95),rgba(255,210,100,.5) 40%,transparent 68%)}
.dkp-altar.dkp-ng > .dkp-medal > svg{filter:grayscale(.85) brightness(.7) drop-shadow(0 4px 3px rgba(0,0,0,.55))}
.dkp-lvrow{display:flex;align-items:center;justify-content:center;gap:18px;flex:0 0 auto;height:58px}

/* 共通の背景の光（fxAmbient の丸）は止まった絵に、金の粒（.fx-motes）だけ動かす。
   ボタンの光の筋（dkBtnShine）は全部止め、息づかい（fxBreath）は主ボタン1つだけ残す。
   ＝図鑑のように「受け取る」が並ぶ画面でも、常時アニメがボタンの数だけ増えない（H9・WP0#4）。 */
#pend > .fx-amb > .fx-blob,#gacha > .fx-amb > .fx-blob,#cube > .fx-amb > .fx-blob,
#pend .dkbtn::after,#gacha .dkbtn::after,#cube .dkbtn::after,.dkp-modal .dkbtn::after,

/* ══════════════════════════════════════════════════════════════
   属性（社長のご要望 2026-09-12）：16種のペンダントを「宝石の色・紋・発動の光と音」で見分ける。
   等級は枠（A＝銀・S＝金銀・S+＝金）、属性は宝石と紋と発動の色。
   ここで足すのは止まった絵と一度きりの演出だけ（常時アニメは1つも増やさない）。
   ══════════════════════════════════════════════════════════════ */
.dkp-medal::after{content:"";position:absolute;left:50%;top:55%;width:116%;height:116%;margin:0;transform:translate(-50%,-50%);
  border-radius:50%;pointer-events:none;z-index:-1;opacity:.3;
  background:radial-gradient(closest-side,var(--e2,#F2C230),transparent 72%)}
.dkp-elc{position:relative;display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;height:30px;padding:0 11px 0 3px;border-radius:15px;
  white-space:nowrap;background:linear-gradient(180deg,var(--e2,#8A72E2),var(--e3,#2A1B66));border:2px solid var(--e1,#ECE6FF);
  box-shadow:0 2px 0 rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.dkp-elc .dkp-eli{width:22px;height:22px;flex:0 0 auto;line-height:0}
.dkp-elc .dkp-eli svg{width:100%;height:100%;display:block;overflow:visible}
.dkp-elc b{font-family:var(--pop);font-size:18px;font-weight:400;line-height:1;color:#FFFDF4;
  -webkit-text-stroke:3px rgba(20,10,2,.75);paint-order:stroke fill}

.dkp-elc.big .dkp-eli{width:30px;height:30px}

.dkp-elc.bk .dkp-eli{width:19px;height:19px}
.dkp-elc.bk b{font-size:16px}
.dkp-elrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dkp-elds{flex:1 1 0;min-width:0;font-size:16px;line-height:1.35;color:#D9C29A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dkp-elfx{position:absolute;left:0;top:0;width:230px;height:230px;z-index:6;pointer-events:none;opacity:0;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(closest-side,var(--e1) 0,var(--e2) 42%,transparent 74%)}
.dkp-f-crack{background:conic-gradient(from 0deg,var(--e1) 0 5deg,transparent 5deg 40deg,var(--e2) 40deg 46deg,transparent 46deg 85deg,
  var(--e1) 85deg 90deg,transparent 90deg 130deg,var(--e2) 130deg 136deg,transparent 136deg 175deg,var(--e1) 175deg 180deg,
  transparent 180deg 220deg,var(--e2) 220deg 226deg,transparent 226deg 265deg,var(--e1) 265deg 270deg,transparent 270deg 310deg,
  var(--e2) 310deg 316deg,transparent 316deg 360deg),radial-gradient(closest-side,var(--e1),transparent 46%)}
.dkp-f-chime{background:repeating-conic-gradient(from 0deg,var(--e1) 0 2deg,transparent 2deg 15deg),
  radial-gradient(closest-side,var(--e1) 0,var(--e2) 34%,transparent 62%)}
.dkp-f-whoosh{border-radius:50%;background:conic-gradient(from 200deg,transparent 0 110deg,var(--e2) 190deg,var(--e1) 250deg,transparent 320deg),

.dkp-f-thud{background:radial-gradient(closest-side,transparent 42%,var(--e1) 52%,var(--e2) 64%,transparent 76%)}

  repeating-conic-gradient(from 22deg,var(--e1) 0 1.6deg,transparent 1.6deg 22deg)}
.dkp-f-soft{background:radial-gradient(22% 22% at 50% 18%,var(--e1),transparent 70%),
  radial-gradient(22% 22% at 80% 42%,var(--e1),transparent 70%),radial-gradient(22% 22% at 68% 82%,var(--e1),transparent 70%),
  radial-gradient(22% 22% at 32% 82%,var(--e1),transparent 70%),radial-gradient(22% 22% at 20% 42%,var(--e1),transparent 70%),

.dkp-f-low{background:radial-gradient(closest-side,var(--e3) 0,var(--e3) 34%,var(--e2) 52%,var(--e1) 60%,transparent 72%)}

  var(--e2) 110deg,var(--e1) 128deg,transparent 160deg,var(--e2) 210deg,var(--e1) 232deg,transparent 268deg,
  var(--e2) 306deg,var(--e1) 330deg,var(--e2) 360deg),radial-gradient(closest-side,#FFFFFF 0,var(--e1) 30%,transparent 62%)}
/* 等級・キューブの種類ごとの閃光（一度きり） */
.dkp-gfl{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;
  background:radial-gradient(60% 60% at 50% 50%,var(--gc,#FFD24D),transparent 72%)}
/* 図鑑：16種が1画面に収まる並び */

/* ══════════════════════════════════════════════════════════════
   お手本（ca751494）に寄せる（社長のご要望 2026-09-12「安っぽいのでエフェクトを」）
   ・器は共通スキン（1w-skin.html の .sk-／8b-skin.js の dkskApply）が当てる。
   ・常時アニメは増やさない：光の輪は既にある .fx-halo を1つ使い回し、
     きらめきは dkskSpark が「1画面8個」の残りを見て自分で数を減らす。
   ・動かすのは transform と opacity だけ。彫り枠・艶・面取りは全部「止まった絵」。
   ══════════════════════════════════════════════════════════════ */

/* ── 宝石の写真（切り出した6種を16属性へ色替えで割り当て）──
   URL は :root の変数に1回だけ入れてある（dkpGemVars）。メダルごとに data URI を
   書くと図鑑16個で DOM が数百KB になるため。 */
.dkp-medal > .dkp-gem{position:absolute;left:21.7%;top:29.2%;width:56.7%;height:52.3%;z-index:1;pointer-events:none;
  background:var(--dkp-gm,none) center/cover no-repeat;filter:var(--gf,none);
  clip-path:polygon(23.5% 0,76.5% 0,100% 23.5%,100% 76.5%,76.5% 100%,23.5% 100%,0 76.5%,0 23.5%)}
.dkp-medal > svg:last-of-type{z-index:2}
.dkp-gi-blue{--dkp-gm:var(--dkp-gm-blue)}
.dkp-gi-green{--dkp-gm:var(--dkp-gm-green)}
.dkp-gi-red{--dkp-gm:var(--dkp-gm-red)}
.dkp-gi-moon{--dkp-gm:var(--dkp-gm-moon)}
.dkp-gi-sakura{--dkp-gm:var(--dkp-gm-sakura)}
.dkp-gi-sun{--dkp-gm:var(--dkp-gm-sun)}
.dkp-medal.dkp-unseen > .dkp-gem{filter:brightness(0)}
.dkp-medal.dkp-seen > .dkp-gem{filter:grayscale(1) brightness(.7)}

/* ── ペンダントタブ：上（中央＋右）と下の帯 ── */
#pend .dkp-body.dkp-t-pend{flex-direction:column;gap:14px}
.dkp-ptop{flex:1 1 auto;min-height:0;display:flex;gap:16px}
#pend .dkp-tabin > .dkp-ptop,#pend .dkp-tabin > .dkp-shelf{animation:dkpTabIn 380ms cubic-bezier(.16,1,.3,1) both}
#pend .dkp-tabin > .dkp-shelf{animation-delay:60ms}
#pend .dkp-ptop > .fx-panel{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:12px;padding:14px 18px 16px}

/* 中央の台（主役の宝石・ビロードの座・装備の枠・装着中のカードの丸窓） */
.dkp-stage{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:8px}
.dkp-hero2{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}

/* 主役が大きいので、座布団は「下に敷く」のではなく「後ろに広げる」（実測：主役の絵が
   台の高さをすべて使うため、下に置くと完全に隠れる。左右にはみ出させると座って見える） */
.dkp-cush.img{width:600px;height:190px;margin-left:-300px;top:calc(50% + 22px);bottom:auto;
  border-radius:0;box-shadow:none;
  background:var(--sk-cush,none) center bottom/contain no-repeat;
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.55))}
.dkp-cush.img::after{display:none}
/* 主役の宝石の発光（止まった絵。常時アニメは増やさない） */
.dkp-hero2::before{content:"";position:absolute;left:50%;top:44%;width:640px;height:640px;margin:-320px 0 0 -320px;
  pointer-events:none;z-index:0;border-radius:50%;
  background:radial-gradient(closest-side,rgba(150,226,255,.4),rgba(110,196,255,.14) 44%,transparent 72%),
             radial-gradient(closest-side,rgba(255,228,152,.34),transparent 58%)}
/* 回る光の輪はお手本と同じく主役より大きく */

/* 縦書きのキャッチ（お手本の「運命を／その胸に。」） */
.dkp-catch{position:absolute;left:6px;top:6%;z-index:2;pointer-events:none;
  writing-mode:vertical-rl;font-family:var(--pop);font-size:34px;line-height:1.5;letter-spacing:.1em;
  color:#FFF6E2;-webkit-text-stroke:5px rgba(28,17,3,.8);paint-order:stroke fill;
  text-shadow:0 0 18px rgba(255,214,120,.5)}
.dkp-cush{position:absolute;left:50%;bottom:3%;width:372px;height:96px;margin-left:-186px;z-index:1;pointer-events:none;
  border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,232,170,.5),rgba(255,196,90,.12) 56%,transparent 78%),
             radial-gradient(closest-side at 50% 42%,#2E8478,#155450 62%,#092E2C);
  box-shadow:0 10px 26px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,240,190,.42)}
.dkp-cush::after{content:"";position:absolute;left:5%;right:5%;top:32%;height:3px;border-radius:2px;

/* ══════════ お手本と見比べての直し（1回目） ══════════ */
/* 帯が横いっぱいに伸びていなかった（縦に並べた器では、幅を自分で伸ばす） */
.dkp-ptop,.dkp-shelf{align-self:stretch;width:100%}
/* 羊皮紙：紙目の絵は縞に見えてしまうので、なめらかな地のままにする */
.dkp-info{--sk-paper:none}
/* リボンの名前は折り返さない */
.dkp-irb{white-space:nowrap;padding:5px 28px;min-height:50px}
/* 等級バッジはお手本のように大きく・読みやすく */
.dkp-ihd .sk-badge{width:106px;height:110px}
.dkp-ihd .sk-badge > b{font-size:46px}
.dkp-ihd .sk-badge.s2 > b{font-size:38px}
/* 効果の説明は2行まで（1行だと「…」で切れていた） */
.dkp-efft p{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 主役のまわりの光の輪。動きは今ある1つのままで、色だけお手本の青金にする */
.dkp-hero2 .dkp-halo{
  background:
    conic-gradient(from 0deg,transparent 0 6%,rgba(150,226,255,.55) 13%,transparent 24% 50%,
                   rgba(255,232,164,.5) 60%,transparent 72% 100%),
    radial-gradient(circle,transparent 40%,rgba(255,214,110,.3) 44%,rgba(255,214,110,0) 52%);
  -webkit-mask:radial-gradient(closest-side,transparent 52%,#000 60%,#000 90%,transparent 100%);
          mask:radial-gradient(closest-side,transparent 52%,#000 60%,#000 90%,transparent 100%)}
/* 装備の枠：名前と［解除］が重ならないように */
.dkp-sk{justify-content:space-between}
/* 書き割りの飾り（旗・燭台・天球儀）。本文より後ろに敷き、指は受けない */
.dkp-deco{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.dkp-deco > i{position:absolute;display:block;background:center/contain no-repeat}
.dkp-deco .d-ban,.dkp-deco .d-ban2{background-image:var(--dkp-ban)}
.dkp-deco .d-cnd{background-image:var(--dkp-cnd)}
.dkp-deco .d-glb{background-image:var(--dkp-glb)}
/* 左のタブの裏だと見えないので、中央の台（地が透ける所）の後ろに置く */
.dkp-deco .d-ban{left:250px;top:58px;width:104px;height:234px;opacity:.5}
.dkp-deco .d-ban2{left:800px;top:48px;width:104px;height:234px;transform:scaleX(-1);opacity:.38}
.dkp-deco .d-cnd{left:2px;bottom:-6px;width:176px;height:154px;opacity:.55}
.dkp-deco .d-glb{left:742px;top:296px;width:130px;height:180px;opacity:.38}
html.fx-mob .dkp-deco .d-ban2,html.fx-mob .dkp-deco .d-glb{display:none}

/* ══════════ お手本と見比べての直し（2回目） ══════════ */
/* 主役の宝石：紋と面取りの影が濃くて石が濁っていた。大きい時は紋を薄く・石を明るく */
.dkp-hero2 .dkp-medal > svg:last-of-type g{opacity:.26}
.dkp-hero2 .dkp-gem{filter:var(--gf) brightness(1.16) saturate(1.22)}
.dkp-hero2 .dkp-medal > svg:last-of-type path[fill^="rgba(0,0,0"]{opacity:.45}
/* 装備の枠：名前が「+7」の札に隠れていた */
.dkp-sk .dkp-medal{margin-bottom:2px}
.dkp-skn{position:relative;z-index:3}
/* 下の帯：「着用中」の札と等級の飾り文字がぶつかっていた */
.dkp-cell.dkp-sh{padding-top:14px}
/* 「着用中」は本文なので 16px を下回らない（下回ると smoke の font に出る） */
.dkp-cell.dkp-sh .dkp-eqtag{top:-2px;left:auto;right:4px;transform:none;font-size:17px;padding:1px 8px}
.dkp-cell.dkp-sh .dkp-dup{right:4px;top:22px}
.dkp-cell.dkp-sh .dkp-medal .dkp-rt{left:-2%;top:-8%}
/* 強化・合成の帯が画面の外へ 1.7px はみ出していた。
   金の彫り枠で中身の幅が減ったのに、帯の最大幅（756/792px）が元のままだったため。
   入れ物いっぱいに合わせ、あふれたぶんは今までどおり横スクロールで見せる。 */
#pend .dkp-sw{align-self:stretch;min-width:0;max-width:100%}
#pend .dkp-strip{max-width:100%}

/* 横長スマホの詰め直し（文字が大きいぶん、名前の行と能力バーの場所を広げる） */
@media (max-height:560px){
  #pend .dkp-info{padding:12px 18px 14px}
  #pend .dkp-ids{font-size:20px}
  #pend .dkp-bars .sk-barrow .nm{min-width:96px}
  #pend .dkp-bars .sk-barrow .vl{min-width:72px}
  #pend .dkp-shelf{flex:0 0 208px}
  #pend .dkp-cell.dkp-sh{height:142px;padding-top:18px}
  #pend .dkp-cell.dkp-sh .dkp-cnm{font-size:22px}
  /* 強化・合成の帯：6つ目のマスの右端が画面の外へ 1.7px 出ていた。
     マスと隙間を少し詰めて、見えているマスが必ず画面の内側で終わるようにする。 */
  #pend .dkp-cell.dkp-sm{flex:0 0 110px}
  #pend .dkp-strip{gap:10px}
}
/* 小さいマスでは「+7」の札をマスの内側に収める（外に 4% はみ出していた） */
.dkp-cell.dkp-sm .dkp-medal .dkp-plus{right:0;bottom:0}

/* ══════════════════════════════════════════════════════════════
   お手本と見比べての直し（3回目・絵の密度を上げる）
   ① 主役を「鎖つき雫型の大きな宝石」に（丸メダルは装備枠・所持帯・図鑑の小さい表示に残す）
   ② 回る光の輪を3重（実体は dkskHalo が入れる .sk-halo。スマホでは 1w-skin.html が止める）
   ③ 右の羊皮紙は角飾りつきの太い彫り枠（.sk-frame2）・能力バーは太く（.sk-bar2）
   ④ キューブ：暗い空き箱をやめ、宝箱とキューブの絵・紙の透かしで空白を埋める
   足すのは止まった絵だけ。常時アニメは 輪3＋粒3＝6 で「1画面8個」に収める。
   ══════════════════════════════════════════════════════════════ */

/* ── 主役の置き場を作る：下の段を少しずつ詰める ── */
#pend .dkp-stage{gap:6px}
#pend .dkp-sk{height:136px;padding:6px 4px 5px}
#pend .dkp-sk .dkp-hole{width:58px;height:58px}
#pend .dkp-sk .dkp-off.dkbtn{height:36px;font-size:20px;padding:0 13px}
#pend .dkp-eqhint{min-height:18px}
#pend .dkp-shelf{flex:0 0 176px}
#pend .dkp-cell.dkp-sh{height:118px}

/* ── ① 鎖つき雫型の主役（高さ500px・画面幅の約24%）。絵が無い時は今までの丸メダル ── */
#pend .dkp-hero2 > .dkp-drop{position:absolute;left:50%;top:50%;z-index:2;pointer-events:none;
  width:380px;height:500px;translate:-50% -58%;
  background:var(--dkp-drop,none) center 31%/cover no-repeat;
  filter:drop-shadow(0 18px 26px rgba(0,0,0,.62))}
/* 石の所だけ丸く切り抜いて属性の色へ回す（金の枠と鎖はマスクの外＝金のまま） */
#pend .dkp-drop > .dkp-dtint{position:absolute;inset:0;pointer-events:none;
  background:var(--dkp-drop,none) center 31%/cover no-repeat;filter:var(--dkp-df,none);
  -webkit-mask:radial-gradient(24% 23% at 50% 66%,#000 56%,transparent 100%);
          mask:radial-gradient(24% 23% at 50% 66%,#000 56%,transparent 100%)}
#pend .dkp-drop.dkp-ddim{filter:grayscale(.72) brightness(.66)}
/* 主役の後ろの発光と、ビロードの座布団を石の高さに合わせる */
#pend .dkp-hero2::before{top:60%;width:600px;height:600px;margin:-300px 0 0 -300px}
#pend .dkp-cush.img{width:520px;height:190px;margin-left:-260px;left:50%;top:auto;bottom:-30px}

/* ── ② 回る光の輪を3重（器だけ置き、輪そのものは dkskHalo が入れる）── */
#pend .dkp-hr{position:absolute;left:50%;top:60%;z-index:1;pointer-events:none;translate:-50% -50%}
#pend .dkp-hr1{width:310px;height:310px}
#pend .dkp-hr2{width:436px;height:436px}
#pend .dkp-hr3{width:566px;height:566px}
/* 輪の色は装備中の宝石の色（--e1/--e2 は主役の属性。速さと向きを変えて3重に見せる） */
#pend .dkp-hr > .sk-halo{width:100%;opacity:.5;
  background:conic-gradient(from 0deg,transparent 0 6%,var(--e1,#DDF6FF) 13%,transparent 24% 52%,
             var(--e2,#F4D169) 61%,transparent 71% 100%)}
#pend .dkp-hr2 > .sk-halo{animation-duration:27s;animation-direction:reverse;opacity:.36}
#pend .dkp-hr3 > .sk-halo{animation-duration:35s;opacity:.26}
/* きらめきの粒も宝石の色に寄せる */
#pend .dkp-hero2 > .sk-spark{width:14px;height:14px;z-index:3;
  background:radial-gradient(circle,#FFFDF2 0 24%,var(--e1,#FFE898) 48%,transparent 74%)}

/* ── ③ 右の羊皮紙：角飾りつきの太い彫り枠＋太い能力バー ── */
#pend .dkp-info.sk-frame2{--sk-fw:12px;--sk-fw2:30px;padding:15px 20px 17px}
#pend .dkp-bars{gap:12px}
#pend .dkp-bars .sk-barrow .nm{min-width:172px;display:flex;align-items:center;gap:9px}
.dkp-bic{width:36px;height:34px;flex:0 0 auto;display:inline-block;
  background:center/contain no-repeat;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}

/* ── ガチャの3レーン：太い枠は2通り試して両方だめだったので元の細い縁のままにする ──
      ・frame-thick（.sk-frame2）＝3枚並べると枠が縦の柱に見え、隣のレーンとぶつかる
      ・.sk-orn＝枠が内側へ9px食い込み、「10%お得」の札と1回ボタンが重なって covered 9件
      ガチャは dkskApply に frame:false を渡していて .sk-frame が付かない作りなので、
      枠を太くするには器の作りごと変える必要がある（T1の範囲を越えるので申し送り） */

/* ── ④ キューブ：宝箱とキューブの絵を主役に・空白は紙の透かしで埋める ── */
#cube .dkp-cbody{gap:26px}
#cube .dkp-cstage.sk-frame2,#cube .dkp-cshelf.sk-frame2{--sk-fw2:28px;isolation:isolate}
#cube .dkp-cwm{position:absolute;left:16px;right:16px;top:16px;bottom:16px;z-index:-1;pointer-events:none;
  opacity:.17;border-radius:12px;
  -webkit-mask:radial-gradient(closest-side,#000 34%,transparent 94%);
          mask:radial-gradient(closest-side,#000 34%,transparent 94%)}
#cube .dkp-cchest{width:524px;height:386px;margin-left:-262px;bottom:0}
#cube .dkp-cbig{width:250px;height:250px}
#cube .dkp-cbimg{display:block;width:100%;height:100%;background:center/contain no-repeat}
#cube .dkp-kb-wood .dkp-cbimg{filter:hue-rotate(78deg) saturate(.5) brightness(.88)}
#cube .dkp-kb-silver .dkp-cbimg{filter:saturate(.16) brightness(1.16)}
#cube .dkp-kb-gold .dkp-cbimg{filter:hue-rotate(-92deg) saturate(1.35) brightness(1.06)}
#cube .dkp-kb-dia .dkp-cbimg{filter:hue-rotate(-56deg) saturate(.92) brightness(1.14)}
/* 空き枠：暗い箱 → 羊皮紙の受け皿（紙の透かしつき）にキューブの絵を薄く敷く */
#cube .dkp-cslot.dkp-cempty{border:3px solid rgba(206,160,64,.9);
  background:var(--sk-crest,none) center/cover no-repeat,linear-gradient(180deg,#F6EBD3,#DBC8A2);
  background-blend-mode:multiply,normal;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.72),inset 0 -9px 15px rgba(150,116,58,.22),
             0 5px 0 rgba(92,58,10,.5),0 9px 16px rgba(40,24,4,.42)}
#cube .dkp-cempty .dkp-cico{width:96px;height:96px;opacity:.6}
#cube .dkp-cghost{display:block;width:100%;height:100%;background:center/contain no-repeat}
#cube .dkp-cempty b{color:#6B4F22;-webkit-text-stroke:3px rgba(255,250,232,.92)}

/* ── スマホ：主役を小さく・紙の透かしは薄いまま（動く層は増やさない）── */
@media (max-aspect-ratio:1/1){
  #pend .dkp-hero2 > .dkp-drop{width:270px;height:352px}
  #pend .dkp-hr1{width:224px;height:224px}
  #pend .dkp-hr2{width:310px;height:310px}
  #pend .dkp-hr3{width:398px;height:398px}
  #pend .dkp-cush.img{width:376px;height:138px;margin-left:-188px}
  #cube .dkp-cchest{width:380px;height:280px;margin-left:-190px}
  #cube .dkp-cbig{width:186px;height:186px}
}
html.fx-mob .dkp-drop > .dkp-dtint{filter:none}

/* ══════════ お手本と見比べての直し（4回目・1回撮って気づいた分） ══════════ */
/* ① 石の色替えが下半分にしか届いていなかった（丸窓が小さく・中心が上すぎた） */
#pend .dkp-drop > .dkp-dtint{
  -webkit-mask:radial-gradient(29% 27% at 50% 68%,#000 74%,transparent 100%);
          mask:radial-gradient(29% 27% at 50% 68%,#000 74%,transparent 100%)}
/* ② ビロードの座布団が主役の後ろに沈んでいた。主役の足元へ置き直して明るくする */
#pend .dkp-cush.img{left:50%;top:calc(50% + 118px);bottom:auto;width:560px;height:205px;
  margin:0;translate:-50% -50%;
  background:var(--sk-cush,none) center/contain no-repeat;
  filter:brightness(1.12) saturate(1.08) drop-shadow(0 14px 20px rgba(0,0,0,.6))}
/* ③ 回る光の輪がお手本より薄かった */
#pend .dkp-hr > .sk-halo{opacity:.62}
#pend .dkp-hr2 > .sk-halo{opacity:.46}
#pend .dkp-hr3 > .sk-halo{opacity:.34}
/* ④ 所持ペンダントの帯：持っている数が少ないと右が素の板になるので紙の透かしを敷く */
#pend .dkp-shelf{position:relative;isolation:isolate}
.dkp-swm{position:absolute;left:250px;right:196px;top:14px;bottom:14px;z-index:-1;pointer-events:none;
  opacity:.22;border-radius:12px;
  -webkit-mask:radial-gradient(closest-side,#000 28%,transparent 92%);
          mask:radial-gradient(closest-side,#000 28%,transparent 92%)}

/* ⑤ キューブ：紙の透かしが暗くて見えなかった・空き枠の絵が小さかった */
#cube .dkp-cwm{opacity:.34}
#cube .dkp-cempty .dkp-cico{width:146px;height:146px;opacity:.56}
#cube .dkp-cslot b{margin-top:5px}
/* 8つ目のマスが空いていたので、紙の透かしの飾り皿を置く（押せない・数には入らない）。
   地が無いと灰色のしみに見えたので、金の封蝋の地に紋を重ねる */
#cube .dkp-cseal{display:block;border-radius:16px;opacity:.62;pointer-events:none;
  background:var(--sk-crest,none) center/cover no-repeat,
             radial-gradient(circle at 50% 42%,#F6DFA4,#C79A3C 54%,#7A5410);
  background-blend-mode:multiply,normal;
  -webkit-mask:radial-gradient(closest-side,#000 48%,transparent 94%);
          mask:radial-gradient(closest-side,#000 48%,transparent 94%)}
/* 紙の透かしはパネルの地に沈んで見えなかった。宝箱の後ろ（台座の中）へ移して濃くする */
/* 中央だけを残すマスクだと、ちょうど宝箱の裏に隠れて見えなかった。
   マスクをやめて台座いっぱいに広げ、空いている上と左右へ紋が出るようにする */
#cube .dkp-cped > .dkp-cwm{left:-8px;right:-8px;top:-34px;bottom:-6px;z-index:0;opacity:.3;
  background-size:auto 116%;background-position:center 18%;
  -webkit-mask:none;mask:none}

/* ══════════ お手本と見比べての直し（5回目・2回撮って気づいた分） ══════════ */
/* ① 座布団が主役の絵の裏に完全に隠れていた（主役の絵は地ごと切り出してあるため、
      重なった所は透けない）。主役より左右へ大きくはみ出させ、足元の高さに置く */
/* 絵（deco-cushion）だけに頼ると、素材が読めていない時に「背景なし」で完全に消える
   （.dkp-cush.img は地を var(--sk-cush,none) に差し替え、box-shadow も消すため）。
   ビロードの地をCSSで下に敷き、絵はその上に重ねる＝どちらでも必ず座布団が見える */
#pend .dkp-cush.img{left:50%;top:calc(50% + 101px);bottom:auto;width:640px;height:200px;
  margin:0;translate:-50% -50%;border-radius:50% / 40%;
  background:var(--sk-cush,none) center/contain no-repeat,
             radial-gradient(closest-side at 50% 50%,#3AAE99,#176A64 56%,#06302E 100%);
  box-shadow:0 18px 32px rgba(0,0,0,.62),inset 0 4px 0 rgba(255,242,196,.4);
  filter:brightness(1.1) saturate(1.1)}
/* 座布団の金の縁取り（お手本の縁の飾り線） */
#pend .dkp-cush.img::after{display:block;content:"";position:absolute;left:7%;right:7%;top:26%;height:3px;
  border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,232,160,.85),transparent)}
/* ② 石の色替えが上から4分の1に届かず、てっぺんだけ青いままだった */
#pend .dkp-drop > .dkp-dtint{
  -webkit-mask:radial-gradient(30% 30% at 50% 65%,#000 78%,transparent 100%);
          mask:radial-gradient(30% 30% at 50% 65%,#000 78%,transparent 100%)}
/* ③ 回る光の輪がまだ薄く、お手本のように石をまたぐ弧に見えなかった */
#pend .dkp-hr > .sk-halo{opacity:.8;
  background:conic-gradient(from 0deg,transparent 0 5%,var(--e1,#DDF6FF) 12%,transparent 23% 51%,
             var(--e2,#F4D169) 60%,transparent 72% 100%)}
#pend .dkp-hr2 > .sk-halo{opacity:.58}
#pend .dkp-hr3 > .sk-halo{opacity:.42}
/* ④ 帯の紙の透かしが地に沈んで出ていなかった（z-index:-1 は器の地より後ろに回る）。
      透かしを 0 に上げ、中身の側を 1 に持ち上げて重なりを正す */
.dkp-swm{z-index:0}
#pend .dkp-shelf > .dkp-shl,#pend .dkp-shelf > .dkp-sw,#pend .dkp-shelf > .dkp-mini{position:relative;z-index:1}
