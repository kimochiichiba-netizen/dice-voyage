<style>
/* ══════════════════════════════════════════════════════════════
   ダイスキングダム — ペンダント＆キューブ（1l-pend.html / WP1）
   ・書くのは #pend #gacha .pullcard .orb と .dkp- で始まる物だけ。
   ・動かすのは transform と opacity だけ。入場は 0% で中身を消さない。
   ・横長スマホ（高さ560px未満）は最後の @media で文字と押せる範囲を大きくする。
   ══════════════════════════════════════════════════════════════ */
.dkp-scr,.dkp-modal{
  --dkp-rimA:linear-gradient(160deg,#EEF6FF 0%,#9DBCE0 34%,#3E5E82 62%,#B9D2EE 100%);
  --dkp-rimS:linear-gradient(160deg,#F8EAFF 0%,#C59CEE 34%,#5A2F92 62%,#E2CCFF 100%);
  --dkp-rimSS:linear-gradient(152deg,#FFF7DC 0%,#F0CE72 14%,#C8952F 30%,#7C5410 46%,#A8752A 58%,#F3D583 76%,#8A6314 90%,#FFF3C8 100%);
  --dkp-cellA:linear-gradient(180deg,#34404C 0%,#1C2430 60%,#10151C 100%);
  --dkp-cellS:linear-gradient(180deg,#3E2C4C 0%,#24182E 60%,#150E1C 100%);
  --dkp-cellSS:linear-gradient(180deg,#5A4212 0%,#2E2006 62%,#1C1203 100%)}

/* ── 共通：タブ・ロゴ・本文 ── */
#pend .dktab .tx,#gacha .dktab .tx{font-size:20px}
#pend .dktab .ic,#gacha .dktab .ic{width:60px;height:58px;display:flex;align-items:center;justify-content:center}
#pend .dktab .ic svg,#gacha .dktab .ic svg{width:58px;height:58px;display:block;overflow:visible}
#pend .dktab .nw,#gacha .dktab .nw{font-size:20px;min-width:32px;height:32px;border-radius:16px;line-height:1}
#gacha .dklogo.dktext b{font-size:46px}
#gacha .dklogo.dktext i{font-size:16px;letter-spacing:.3em}
#pend .dkp-body,#gacha .dkp-body{gap:16px;align-items:stretch}
#pend.dkp-busy .dkhd,#pend.dkp-busy .dktabs,#pend.dkp-busy .dkp-body,
#gacha.dkp-busy .dkhd,#gacha.dkp-busy .dktabs,#gacha.dkp-busy .dkp-lane{pointer-events:none}
#pend .dkp-body > .fx-panel,#gacha .dkp-body > .fx-panel{display:flex;flex-direction:column;gap:12px;
  padding:14px 18px 16px;min-width:0;min-height:0}
#pend .dkp-tabin > .fx-panel{animation:dkpTabIn 380ms cubic-bezier(.16,1,.3,1) both}
#pend .dkp-tabin > .fx-panel + .fx-panel{animation-delay:60ms}
@keyframes dkpTabIn{from{transform:translateY(18px) scale(.975)}}

/* 見出し */
.dkp-ttl{font-family:var(--pop);font-size:26px;line-height:1.15;color:#FFE9B5;letter-spacing:.04em;white-space:nowrap;
  -webkit-text-stroke:4px #241604;paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.dkp-ph{display:flex;align-items:center;gap:12px;min-height:54px;flex:0 0 auto;padding:0 2px 8px;
  border-bottom:1px solid rgba(196,150,70,.38)}
.dkp-note{font-size:16px;color:#D9C29A;line-height:1.3}
.dkp-sub{display:flex;align-items:center;gap:12px;margin:0;flex:0 0 auto;min-height:32px;font-family:var(--pop);font-size:20px;
  line-height:1.2;color:#F4DFAE;-webkit-text-stroke:3px #1E1204;paint-order:stroke fill;white-space:nowrap;font-weight:400}
.dkp-sub::after{content:"";flex:1;height:2px;border-radius:1px;order:5;
  background:linear-gradient(90deg,#C8952F,rgba(200,149,47,0))}
.dkp-hint{margin:0;font-size:16px;line-height:1.45;color:#D9C29A}
.dkp-hint.big{font-size:20px;line-height:1.6;color:#EBD9B2;text-align:center;margin:auto 0}
.dkp-warn{margin:0;padding:8px 12px;border-radius:10px;font-size:16px;line-height:1.4;font-weight:900;color:#FFD2C8;
  background:linear-gradient(180deg,rgba(201,48,44,.36),rgba(120,16,10,.36));border:1px solid rgba(255,120,100,.55)}
.dkp-warn::before{content:"！";display:inline-grid;place-items:center;width:24px;height:24px;margin-right:8px;border-radius:50%;
  background:#C9302C;color:#fff;font-size:16px;vertical-align:-3px}
.dkp-warn.sm{padding:5px 10px}
.dkp-ci{display:inline-block;width:26px;height:26px;margin:0 4px 0 6px;vertical-align:-4px;flex:0 0 auto}

/* ── ペンダントの絵 ── */
.dkp-medal{position:relative;display:inline-block;flex:0 0 auto;width:var(--ms,96px);height:calc(var(--ms,96px) * 1.0833);
  line-height:0;vertical-align:middle}
.dkp-medal > svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;
  filter:drop-shadow(0 4px 3px rgba(0,0,0,.55))}
.dkp-medal .dkp-plus{position:absolute;right:-4%;bottom:-3%;z-index:2;padding:3px 8px 4px;border-radius:9px;line-height:1;
  font-family:var(--pop);font-size:18px;font-weight:400;color:#FFFFFF;white-space:nowrap;
  -webkit-text-stroke:3px #0C2A52;paint-order:stroke fill;
  background:linear-gradient(180deg,#8FD2FF,#2E8BE0 55%,#14559E);border:2px solid #E4F2FF;box-shadow:0 2px 3px rgba(0,0,0,.55)}
.dkp-medal .dkp-plus.mx{background:linear-gradient(180deg,#FFF3C8,#F2C230 55%,#A9761A);border-color:#FFF8E0;
  -webkit-text-stroke-color:#5A3A04}
.dkp-medal .dkp-rt{position:absolute;left:-6%;top:-4%;z-index:2;font-family:var(--caps);font-size:20px;font-style:normal;
  line-height:1;color:#FFD44A;white-space:nowrap;-webkit-text-stroke:4px #3A2405;paint-order:stroke fill;text-shadow:0 2px 0 #C98A12}
.dkp-medal .dkp-rt.rS{color:#EBD0FF;text-shadow:0 2px 0 #7A4AB8}
.dkp-medal .dkp-rt.rA{color:#DCEEFF;text-shadow:0 2px 0 #3E6FA8}
.dkp-medal.dkp-unseen > svg{filter:brightness(0) drop-shadow(0 0 5px rgba(255,220,150,.3))}
.dkp-medal.dkp-seen > svg{filter:grayscale(1) brightness(.78) drop-shadow(0 4px 3px rgba(0,0,0,.5))}
.dkp-float{animation:dkpFloat 5.2s ease-in-out infinite}
@keyframes dkpFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* 等級の札 */
.dkp-rtag{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-width:50px;height:34px;padding:0 8px;
  border-radius:9px;font-family:var(--caps);font-size:22px;font-style:normal;line-height:1;color:#FFFFFF;
  -webkit-text-stroke:4px rgba(20,10,2,.8);paint-order:stroke fill;border:2px solid rgba(255,255,255,.75);
  box-shadow:0 2px 0 rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.4)}
.dkp-rtag.sm{min-width:40px;height:28px;padding:0 6px;font-size:18px;border-radius:7px;-webkit-text-stroke-width:3px}
.dkp-rtag.rA{background:linear-gradient(180deg,#A8D4FF,#3E86D0 55%,#1F4E8C)}
.dkp-rtag.rS{background:linear-gradient(180deg,#E6C6FF,#9A5ED8 55%,#57288E)}
.dkp-rtag.rSS{background:linear-gradient(180deg,#FFF3C8,#F2C230 50%,#B07A0E);color:#FFFBEA;-webkit-text-stroke-color:#5A3404}

/* ── 一覧のマス ── */
.dkp-cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;
  border-radius:14px;border:3px solid transparent;padding:10px 4px 8px;
  background:var(--dkp-cellA) padding-box,var(--dkp-rimA) border-box;
  box-shadow:0 5px 0 rgba(0,0,0,.42),inset 0 2px 0 rgba(255,230,170,.16);
  transition:transform 160ms cubic-bezier(.16,1,.3,1)}
.dkp-cell.rS{background:var(--dkp-cellS) padding-box,var(--dkp-rimS) border-box}
.dkp-cell.rSS{background:var(--dkp-cellSS) padding-box,var(--dkp-rimSS) border-box}
.dkp-cell::after{content:"";position:absolute;inset:-5px;border-radius:18px;pointer-events:none;opacity:0;z-index:-1;
  box-shadow:0 0 22px 6px rgba(255,200,80,.66);transition:opacity 160ms}
.dkp-cell:hover{transform:translateY(-4px)}
.dkp-cell.on::after{opacity:1}
.dkp-cell.on{animation:fxSelPop 260ms cubic-bezier(.34,1.56,.64,1)}
.dkp-cell.on::before{content:"";position:absolute;inset:-3px;border-radius:15px;border:3px solid #FFF0BE;pointer-events:none}
.dkp-gl{position:absolute;inset:0;border-radius:11px;overflow:hidden;pointer-events:none}
.dkp-gl::after{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:34%;
  background:linear-gradient(90deg,transparent,rgba(255,244,210,.32),transparent);
  transform:translateX(-160%) skewX(-18deg);animation:fxShine 4.8s ease-in-out infinite}
.dkp-cnm{position:relative;font-family:var(--pop);font-size:18px;font-weight:400;line-height:1.15;color:#FFEFD0;white-space:nowrap;
  -webkit-text-stroke:3px #1E1204;paint-order:stroke fill}
.dkp-dup{position:absolute;right:5px;top:5px;z-index:3;padding:2px 7px;border-radius:9px;font-family:var(--pop);font-size:16px;
  line-height:1.15;color:#FFFFFF;-webkit-text-stroke:3px #3A2405;paint-order:stroke fill;
  background:rgba(20,12,4,.82);border:1px solid #C8952F}
.dkp-eqtag{position:absolute;left:50%;top:-13px;transform:translateX(-50%);z-index:4;padding:2px 10px;border-radius:9px;
  white-space:nowrap;font-size:16px;font-weight:900;line-height:1.2;color:#3A2405;
  background:linear-gradient(180deg,#FFF0BE,#E8B23A);border:2px solid #8A6206;box-shadow:0 2px 4px rgba(0,0,0,.45)}

/* ── ペンダント：装備スロット（左） ── */
#pend .dkp-eqp{flex:0 0 560px}
.dkp-crest{width:46px;height:46px;flex:0 0 auto}
.dkp-crest svg{width:100%;height:100%;display:block}
.dkp-cnt{margin-left:auto;font-size:18px;color:#D9C29A;white-space:nowrap}
.dkp-cnt b{font-family:var(--pop);font-size:28px;font-weight:400;color:#FFE9B5;-webkit-text-stroke:4px #241604;paint-order:stroke fill}
.dkp-slots{display:flex;flex-direction:column;gap:10px;flex:0 0 auto}
.dkp-slot{position:relative;display:flex;align-items:center;gap:14px;height:140px;padding:10px 14px 10px 18px;border-radius:14px;
  cursor:pointer;border:2px solid rgba(200,149,47,.6);
  background:radial-gradient(90% 120% at 12% 50%,rgba(255,210,120,.13),transparent 60%),linear-gradient(180deg,#3E2C12,#1E1408);
  box-shadow:inset 0 1px 0 rgba(255,230,170,.25),0 4px 0 rgba(0,0,0,.35);transition:transform 160ms cubic-bezier(.16,1,.3,1)}
.dkp-slot:hover{transform:translateX(4px)}
.dkp-slot.rSS{border-color:#E8B23A}
.dkp-slot.on{border-color:#FFF0BE;box-shadow:inset 0 1px 0 rgba(255,230,170,.3),0 4px 0 rgba(0,0,0,.35),0 0 0 2px rgba(255,210,110,.45)}
.dkp-slot.dkp-empty{cursor:default;border:2px dashed rgba(200,149,47,.5);
  background:repeating-linear-gradient(135deg,rgba(255,236,190,.035) 0 12px,transparent 12px 24px),linear-gradient(180deg,#2A1D0B,#160E05)}
.dkp-slot.dkp-empty:hover{transform:none}
.dkp-slot.dkp-pop{animation:fxSelPop 320ms cubic-bezier(.34,1.56,.64,1)}
.dkp-sno{position:absolute;left:-2px;top:-2px;width:30px;height:30px;border-radius:12px 0 12px 0;display:grid;place-items:center;
  font-family:var(--pop);font-size:18px;line-height:1;color:#FFE9B5;background:linear-gradient(180deg,#8A6A2A,#3A2A0E);
  border-right:1px solid rgba(255,220,150,.4);border-bottom:1px solid rgba(255,220,150,.4)}
.dkp-hole{position:relative;width:92px;height:92px;flex:0 0 auto;border-radius:50%;
  background:radial-gradient(circle at 50% 45%,rgba(0,0,0,.55),rgba(0,0,0,.2) 70%);border:3px dashed rgba(255,220,150,.35)}
.dkp-hole i::before,.dkp-hole i::after{content:"";position:absolute;left:50%;top:50%;width:30px;height:5px;margin:-2.5px 0 0 -15px;
  border-radius:3px;background:rgba(255,220,150,.45)}
.dkp-hole i::after{transform:rotate(90deg)}
.dkp-si{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dkp-snr{display:flex;align-items:center;gap:8px;min-width:0}
.dkp-snm{min-width:0;font-family:var(--pop);font-size:22px;font-weight:400;line-height:1.2;color:#FFE9B5;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;-webkit-text-stroke:3px #241604;paint-order:stroke fill}
.dkp-slot.dkp-empty .dkp-snm{color:#BFA475}
.dkp-sds{margin:0;font-size:16px;line-height:1.35;color:#E8D5AE;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden}
.dkp-sp{display:flex;align-items:center;gap:8px;font-size:16px;color:#D9C29A;white-space:nowrap}
.dkp-sp i{font-style:normal;padding:1px 8px;border-radius:8px;background:rgba(255,236,190,.1);border:1px solid rgba(200,149,47,.4)}
.dkp-sp b{font-family:var(--pop);font-size:22px;font-weight:400;color:#B8F08A;-webkit-text-stroke:3px #14300A;paint-order:stroke fill}
.dkp-off.dkbtn{flex:0 0 auto;height:56px;padding:0 18px;font-size:22px;color:#FFF3E8;-webkit-text-stroke:4px rgba(70,10,4,.85);
  background:linear-gradient(180deg,#F29A84 0 8%,#D0543C 34%,#9E2A18 74%,#6E1608);border:3px solid #4A0E04}
#pend .dkp-eqp > .dkp-warn,#pend .dkp-eqp > .dkp-hint{margin-top:auto}

/* ── ペンダント：所持品（右） ── */
#pend .dkp-inv{flex:1 1 auto}
.dkp-seg.fx-seg{--x:calc(var(--si,0) * 100px)}
.dkp-seg.fx-seg button{min-width:100px;width:100px;height:46px;font-size:20px}
.dkp-seg.fx-seg i.thumb{width:100px}
.dkp-own{margin-left:auto;font-size:18px;color:#D9C29A;white-space:nowrap}
.dkp-own b{font-family:var(--pop);font-size:26px;font-weight:400;color:#FFE9B5;-webkit-text-stroke:4px #241604;paint-order:stroke fill}
.dkp-mini.dkbtn{height:50px;padding:0 18px;font-size:20px;flex:0 0 auto}
.dkp-grid{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:140px;gap:16px 12px;padding:12px 2px 0;flex:0 0 auto}
.dkp-det{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;gap:14px;padding:10px 18px 10px 8px;
  border-radius:14px;overflow:hidden;
  background:radial-gradient(60% 110% at 17% 55%,rgba(255,200,90,.2),transparent 62%),linear-gradient(180deg,rgba(20,12,4,.7),rgba(8,5,2,.85));
  border:2px solid rgba(200,149,47,.55);box-shadow:inset 0 0 34px rgba(0,0,0,.65)}
.dkp-det.rSS{background:radial-gradient(60% 110% at 17% 55%,rgba(255,214,110,.32),transparent 62%),linear-gradient(180deg,rgba(26,16,4,.7),rgba(8,5,2,.85))}
.dkp-det.rS{background:radial-gradient(60% 110% at 17% 55%,rgba(190,130,255,.24),transparent 62%),linear-gradient(180deg,rgba(20,12,4,.7),rgba(8,5,2,.85))}
.dkp-show{position:relative;width:220px;align-self:stretch;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.dkp-show > .dkp-medal{position:relative;z-index:2}
#pend .dkp-halo,#gacha .dkp-halo{width:320px;height:320px;margin:-160px 0 0 -160px}
.dkp-ped{position:absolute;left:50%;bottom:6%;width:170px;height:40px;margin-left:-85px;border-radius:50%;pointer-events:none;z-index:1;
  background:radial-gradient(closest-side,rgba(255,220,140,.55),rgba(255,190,80,.18) 60%,transparent);animation:fxBreath 2.8s ease-in-out infinite}
.dkp-dinfo{position:relative;z-index:2;flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.dkp-dhd{display:flex;align-items:center;gap:10px;min-width:0}
.dkp-dnm{min-width:0;font-family:var(--pop);font-size:28px;font-weight:400;line-height:1.2;color:#FFF0CE;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;-webkit-text-stroke:4px #241604;paint-order:stroke fill}
.dkp-dds{margin:0;font-size:18px;line-height:1.45;color:#EBD9B2}
.dkp-drate{display:flex;align-items:center;gap:10px}
.dkp-dl{flex:0 0 auto;font-size:16px;color:#D9C29A;white-space:nowrap}
.dkp-drate b{flex:0 0 auto;min-width:64px;text-align:right;font-family:var(--pop);font-size:24px;font-weight:400;color:#B8F08A;
  -webkit-text-stroke:4px #14300A;paint-order:stroke fill}
.dkp-bar{position:relative;flex:1;height:22px;border-radius:11px;background:linear-gradient(180deg,#2A2118,#453A2E);
  border:2px solid #1E1810;box-shadow:inset 0 3px 6px rgba(0,0,0,.6);overflow:hidden}
.dkp-bar > i{position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);border-radius:9px;overflow:hidden;
  background:linear-gradient(180deg,#B6F08A 0 26%,#61C238 52%,#3A8C1C);box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.dkp-bar > i::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.45),transparent);animation:dkpBarFlow 2.4s linear infinite}
@keyframes dkpBarFlow{from{transform:translateX(-120%)}to{transform:translateX(260%)}}
.dkp-bar > em{position:absolute;top:0;bottom:0;left:var(--x,100%);width:4px;margin-left:-2px;background:#FFE9B5;
  box-shadow:0 0 6px #FFD24D}
.dkp-dmax{margin:0;font-size:16px;line-height:1.35;color:#D9C29A}
.dkp-dmax b{font-family:var(--pop);font-size:20px;font-weight:400;color:#FFE9B5}
.dkp-dbtns{display:flex;gap:10px;margin-top:4px}
.dkp-dbtns .dkbtn{flex:1 1 0;min-width:0;height:60px;padding:0 8px;font-size:22px;white-space:nowrap}
.dkp-dbtns .dkbtn[data-dkp-act="goup"]{flex-grow:.9}
.dkp-dbtns .dkp-sell.dkbtn{flex-grow:1.35}
.dkp-sell.dkbtn{color:#FFF8E6;-webkit-text-stroke:4px rgba(40,24,6,.85);
  background:linear-gradient(180deg,#B89A6C 0 8%,#8A6A3E 34%,#5E4422 74%,#3E2A12);border:3px solid #2E1E08}
.dkp-sell.dkbtn .dkp-ci{width:22px;height:22px;margin:0 2px 0 4px}
.dkp-wood.dkbtn{color:#FFF1D6;-webkit-text-stroke:4px rgba(30,18,4,.9);
  background:linear-gradient(180deg,#8A6A38 0 8%,#5E4420 34%,#3E2A10 74%,#241806);border:3px solid #C8952F}

/* 空っぽの時 */
.dkp-inv.dkp-none{align-items:center;justify-content:center;gap:10px}
.dkp-hero{position:relative;width:100%;height:400px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.dkp-hero.sm{height:300px}
.dkp-hero .dkp-halo{z-index:0}
.dkp-heroimg{position:relative;z-index:1;width:420px;height:410px;background:center/contain no-repeat;animation:dkpFloat 6s ease-in-out infinite;
  -webkit-mask:radial-gradient(ellipse 44% 50% at 46% 50%,#000 60%,transparent 100%);mask:radial-gradient(ellipse 44% 50% at 46% 50%,#000 60%,transparent 100%)}
.dkp-hero.sm .dkp-heroimg{width:330px;height:300px}
.dkp-heromed{position:relative;z-index:1}
.dkp-nonetx{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:640px}
.dkp-nonetx p{margin:0;font-size:18px;line-height:1.6;color:#EBD9B2}
.dkp-big.dkbtn{height:70px;padding:0 44px;font-size:28px}

/* ── 強化タブ ── */
#pend .dkp-forge{flex:0 0 560px;align-items:center}
.dkp-forge .dkp-ph{align-self:stretch}
.dkp-fnm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.dkp-altar{position:relative;width:100%;height:262px;flex:1 1 262px;max-height:330px;display:flex;align-items:center;justify-content:center}
.dkp-altar > .dkp-medal{position:relative;z-index:2}
.dkp-altar .dkp-ped{bottom:2%;width:250px;height:54px;margin-left:-125px}
.dkp-crack{position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-92px 0 0 -85px;z-index:3;pointer-events:none;opacity:0;
  filter:drop-shadow(0 0 3px rgba(0,0,0,.9))}
.dkp-crack svg{width:100%;height:100%;display:block}
.dkp-okfl{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;z-index:1;
  pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,244,200,.95),rgba(255,210,100,.5) 40%,transparent 68%)}
.dkp-altar.dkp-ok .dkp-okfl{animation:dkpOkFl 620ms cubic-bezier(.4,0,1,1) forwards}
@keyframes dkpOkFl{0%{opacity:1;transform:scale(.6)}100%{opacity:0;transform:scale(1.35)}}
.dkp-altar.dkp-ok > .dkp-medal{animation:fxBump 320ms cubic-bezier(.34,1.56,.64,1)}
