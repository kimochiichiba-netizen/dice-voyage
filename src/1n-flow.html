<style>
/* ══════════════════════════════════════════════════════════════
   対戦前フロー（1n-flow.html / WP3）
   クラス選択 #dkclass → マップ選択 #setup → ゲームルーム #room
   ・セレクタは #dkclass #setup #room .rm-* .dkf-* だけ
   ・動かすのは transform と opacity だけ（光る板は opacity の呼吸）
   ・入場の keyframe は 0% で opacity を下げない
   ══════════════════════════════════════════════════════════════ */

/* ══════════ 共通：上の帯・金文字・札 ══════════ */
.dkf-scr .dkf-ico{display:block;width:100%;height:100%}
.dkf-scr .dkf-top{position:absolute;left:0;right:0;top:0;height:92px;z-index:6;
  background:linear-gradient(180deg,#6A4E26 0,#44311A 30%,#2A1C0A 72%,#170E04);
  border-bottom:3px solid #C8952F;
  box-shadow:0 6px 18px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,226,150,.28),inset 0 -8px 16px rgba(0,0,0,.35)}
.dkf-scr .dkf-top::after{content:"";position:absolute;left:0;bottom:-3px;width:30%;height:3px;pointer-events:none;
  background:linear-gradient(90deg,transparent,#FFF3C8 50%,transparent);
  transform:translateX(-100%);animation:dkfLine 5.5s ease-in-out infinite}
@keyframes dkfLine{0%{transform:translateX(-100%)}100%{transform:translateX(434%)}}
.dkf-scr .dkf-top .dkback{left:18px;top:14px}
.dkf-scr .dkf-ttl{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;
  gap:18px;white-space:nowrap;pointer-events:none}
.dkf-scr .dkf-ttl b{font-family:var(--pop);font-size:44px;line-height:1;color:#FFD44A;letter-spacing:.04em;
  -webkit-text-stroke:8px #3A2405;paint-order:stroke fill;
  text-shadow:0 4px 0 rgba(0,0,0,.45),0 0 22px rgba(255,200,80,.35)}
.dkf-scr .dkf-plate{display:inline-block;font-family:var(--pop);font-size:28px;line-height:1;color:#4A3210;
  padding:9px 18px 10px;border-radius:12px;white-space:nowrap;
  background:linear-gradient(180deg,#FFF9E6,#F4E2AE 55%,#D9BE7A);border:3px solid #7A5206;
  box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 2px 0 #fff}
.dkf-scr .dkf-home{position:absolute;right:18px;top:14px;width:78px;height:62px;border-radius:14px;cursor:pointer;
  display:grid;place-items:center;color:#F5D36B;
  background:linear-gradient(180deg,#6E5326,#3E2C11 52%,#271A07);border:3px solid var(--dk-g4);
  box-shadow:0 4px 0 rgba(0,0,0,.5),inset 0 2px 0 rgba(255,226,150,.35),inset 0 -6px 10px rgba(0,0,0,.5);
  transition:transform var(--fx-t-release) var(--fx-back)}
.dkf-scr .dkf-home .dkf-ico{width:38px;height:38px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.dkf-scr .dkf-home:active{transform:translateY(3px) scale(.97)}
/* 背景を少し締める（宮殿の絵の上に暗いビネット） */
#dkclass.dkf-scr::after,#setup.dkf-scr::after,#room.dkf-scr::after{
  background:radial-gradient(90% 70% at 50% 52%,rgba(255,196,96,.14),transparent 60%),
             radial-gradient(130% 110% at 50% 50%,transparent 45%,rgba(0,0,0,.55) 100%)}
/* 金貨・ダイヤの小さな印 */
.dkf-scr .dkf-coin,.dkf-mod .dkf-coin{display:inline-block;flex:0 0 auto;width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 38% 28%,#FFF6C8,#F2C74F 42%,#C8930F 74%,#8A6206);
  border:2px solid #7A5406;box-shadow:0 2px 3px rgba(0,0,0,.35)}
.dkf-scr .dkf-gemic{display:inline-block;flex:0 0 auto;width:26px;height:22px;
  background:linear-gradient(180deg,#EAF8FF,#6FC6F5 44%,#1E7FD0);clip-path:polygon(24% 4%,76% 4%,98% 38%,50% 98%,2% 38%)}
/* 光沢の走査（カードの上） */
.dkf-scr .dkf-pp-gloss,.dkf-scr .dkf-mc-gloss,.dkf-scr .dkf-shine{position:absolute;inset:0;overflow:hidden;
  pointer-events:none;border-radius:inherit;z-index:3}
.dkf-scr .dkf-pp-gloss::after,.dkf-scr .dkf-mc-gloss::after,.dkf-scr .dkf-shine::after{content:"";position:absolute;
  top:-10%;bottom:-10%;left:0;width:26%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);
  transform:translateX(-160%) skewX(-18deg);animation:fxShine 4.8s ease-in-out infinite}
.dkf-scr .dkf-mc-gloss::after{animation-duration:2.6s}

/* ══════════════════════════════════════════════════════════════
   ③ クラス選択
   ══════════════════════════════════════════════════════════════ */
#dkclass .dkf-sub{position:absolute;left:0;right:0;top:108px;height:78px;z-index:5}
#dkclass .dkf-olbtn{position:absolute;left:28px;top:0;width:340px;height:78px;border-radius:16px;cursor:pointer;
  display:flex;align-items:center;gap:14px;padding:0 18px;
  background:linear-gradient(180deg,#FF8A70 0,#E8452E 38%,#B0220F 82%,#7E1206);border:3px solid #FFD9A8;
  box-shadow:0 5px 0 rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.45),0 0 18px rgba(255,90,60,.35);
  transition:transform var(--fx-t-release) var(--fx-back)}
#dkclass .dkf-olbtn:active{transform:translateY(3px) scale(.98)}
#dkclass .dkf-olbtn-ic{flex:0 0 auto;width:50px;height:50px;color:#FFF6E2;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
#dkclass .dkf-olbtn-tx b{display:block;font-family:var(--pop);font-size:27px;line-height:1.05;color:#fff;
  -webkit-text-stroke:5px #6A1206;paint-order:stroke fill}
#dkclass .dkf-olbtn-tx small{display:block;margin-top:4px;font-size:17px;font-weight:900;color:#FFE3D0}
#dkclass .dkf-lvbox{position:absolute;right:28px;top:0;width:600px;height:78px;border-radius:16px;
  display:flex;align-items:center;gap:16px;padding:0 18px 0 10px;
  background:linear-gradient(180deg,rgba(44,30,12,.94),rgba(16,10,4,.96));border:3px solid var(--dk-g4);
  box-shadow:0 5px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,220,150,.22)}
#dkclass .dkf-lvbox-lv{position:relative;flex:0 0 auto;width:62px;height:62px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  background:radial-gradient(circle at 35% 30%,#8FD2FF,#2E8BE0 50%,#0B2C5E);border:3px solid #F5D36B;
  box-shadow:0 0 14px rgba(90,180,255,.5)}
#dkclass .dkf-lvbox-lv small{font-family:var(--caps);font-size:16px;color:#EAF6FF}
#dkclass .dkf-lvbox-lv b{font-family:var(--pop);font-size:28px;color:#fff;-webkit-text-stroke:4px #0B2C5E;paint-order:stroke fill}
#dkclass .dkf-lvbox-tx{flex:1;min-width:0}
#dkclass .dkf-lvbox-tx b{display:block;font-size:21px;font-weight:900;color:#FFE9B5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dkclass .dkf-lvbar{display:block;height:14px;margin-top:8px;border-radius:7px;overflow:hidden;
  background:#1A1004;border:2px solid #6B4E28}
#dkclass .dkf-lvbar i{display:block;height:100%;transform-origin:left center;
  background:linear-gradient(90deg,#3A8C1C,#5FBF3A 50%,#A8E877)}

#dkclass .dkf-passes{position:absolute;left:0;right:0;top:212px;height:596px;z-index:4;
  display:flex;justify-content:center;align-items:flex-start;gap:30px;padding-top:14px}
#dkclass .dkf-pass{position:relative;flex:0 0 342px;height:568px;cursor:pointer;
  filter:drop-shadow(0 9px 0 rgba(0,0,0,.35)) drop-shadow(0 18px 22px rgba(0,0,0,.45));
  transition:transform 220ms var(--fx-out)}
#dkclass .dkf-pass:hover{transform:translateY(-10px)}
#dkclass .dkf-pass:active{transform:translateY(-2px) scale(.98)}
#dkclass .dkf-pass-body{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:#FFFDF6;
  -webkit-mask:radial-gradient(circle 17px at 0 420px,#0000 96%,#000) left/51% 100% no-repeat,
               radial-gradient(circle 17px at 100% 420px,#0000 96%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 17px at 0 420px,#0000 96%,#000) left/51% 100% no-repeat,
       radial-gradient(circle 17px at 100% 420px,#0000 96%,#000) right/51% 100% no-repeat}
#dkclass .dkf-pp{position:absolute;left:0;right:0;top:0;height:420px;overflow:hidden;background:var(--dkf-pg)}
#dkclass .dkf-t-eco  .dkf-pp{--dkf-pg:linear-gradient(168deg,#D8FAB0 0%,#86DC5E 26%,#43AE3C 60%,#1C6E26 100%)}
#dkclass .dkf-t-biz  .dkf-pp{--dkf-pg:linear-gradient(168deg,#D4EEFF 0%,#6EBDF6 26%,#2A7FD6 60%,#0C3C8A 100%)}
#dkclass .dkf-t-first .dkf-pp{--dkf-pg:linear-gradient(168deg,#FFF4B8 0%,#FFCB3E 26%,#F2901C 60%,#B24A0C 100%)}
#dkclass .dkf-t-dia  .dkf-pp{--dkf-pg:linear-gradient(168deg,#FFD6F2 0%,#EC74C8 26%,#B0359E 60%,#561070 100%)}
#dkclass .dkf-pp-glow{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(80% 50% at 24% 8%,rgba(255,255,255,.6),transparent 62%),
             radial-gradient(60% 40% at 90% 100%,rgba(255,255,255,.18),transparent 70%)}
#dkclass .dkf-pp-sky{position:absolute;left:0;right:0;bottom:0;height:176px;color:rgba(255,255,255,.26)}
#dkclass .dkf-sky{display:block;width:100%;height:100%}
#dkclass .dkf-pp-hd{position:absolute;left:0;right:0;top:0;height:72px;display:flex;align-items:center;
  justify-content:space-between;padding:0 20px 0 24px;
  background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.08));border-bottom:2px solid rgba(255,255,255,.5)}
#dkclass .dkf-pp-hd b{font-family:var(--pop);font-size:31px;line-height:1;color:#fff;
  -webkit-text-stroke:6px var(--dkf-ink,#333);paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.2)}
#dkclass .dkf-t-eco{--dkf-ink:#1C6E26} #dkclass .dkf-t-biz{--dkf-ink:#0C3C8A}
#dkclass .dkf-t-first{--dkf-ink:#A8420A} #dkclass .dkf-t-dia{--dkf-ink:#5A1270}
#dkclass .dkf-lock{--dkf-ink:#3A3A3A}
#dkclass .dkf-pp-amt b{-webkit-text-stroke-color:var(--dkf-ink,#333)}
#dkclass .dkf-pp-plane{width:48px;height:48px;color:#fff;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));
  animation:dkfPlane 3.4s ease-in-out infinite}
@keyframes dkfPlane{0%,100%{transform:translate(0,0) rotate(-10deg)}50%{transform:translate(5px,-6px) rotate(-4deg)}}
#dkclass .dkf-pp-en{position:absolute;left:0;right:0;top:94px;text-align:center;pointer-events:none;
  font-family:"Brush Script MT","Segoe Script",Georgia,serif;font-style:italic;font-size:38px;color:rgba(255,255,255,.55);
  transform:rotate(-6deg)}
#dkclass .dkf-pp-amt{position:absolute;left:0;right:0;top:152px;text-align:center}
#dkclass .dkf-pp-amt b{display:inline-block;font-family:var(--pop);font-size:70px;line-height:1;color:#fff;
  -webkit-text-stroke:9px rgba(24,24,24,.5);paint-order:stroke fill;text-shadow:0 6px 0 rgba(0,0,0,.28);
  transform:skewX(-10deg)}
#dkclass .dkf-pp-amt small{display:block;margin-top:12px;font-size:22px;font-weight:900;color:#fff;
  -webkit-text-stroke:4px rgba(0,0,0,.3);paint-order:stroke fill}
#dkclass .dkf-pp-play{position:absolute;left:50%;top:300px;transform:translateX(-50%);padding:8px 26px;border-radius:999px;
  font-size:22px;font-weight:900;color:#fff;white-space:nowrap;background:rgba(0,0,0,.2);border:2px solid rgba(255,255,255,.6)}
#dkclass .dkf-pb{position:absolute;left:0;right:0;bottom:0;height:148px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;background:linear-gradient(180deg,#FFFFFF,#F3EEE2)}
#dkclass .dkf-pb::before{content:"";position:absolute;left:24px;right:24px;top:0;border-top:3px dashed rgba(120,100,70,.35)}
#dkclass .dkf-pb-rw{display:flex;align-items:center;gap:10px;font-family:var(--pop);font-size:30px;line-height:1;color:#4A3210}
#dkclass .dkf-pb-rw .dkf-coin{width:32px;height:32px}
#dkclass .dkf-pb-lv{font-size:20px;font-weight:900;color:#6B5A3C;padding:5px 18px;border-radius:999px;
  background:rgba(120,100,70,.12)}
#dkclass .dkf-t-eco  .dkf-pb-rw{color:#1C6E26}
#dkclass .dkf-t-biz  .dkf-pb-rw{color:#0C3C8A}
#dkclass .dkf-t-first .dkf-pb-rw{color:#A8420A}
#dkclass .dkf-t-dia  .dkf-pb-rw{color:#6A1680}
/* 前回のクラス：金の縁が呼吸する */
#dkclass .dkf-cur::before{content:"";position:absolute;inset:-9px;border-radius:32px;pointer-events:none;
  border:4px solid #FFE27A;box-shadow:0 0 26px 6px rgba(255,210,90,.6),inset 0 0 12px rgba(255,230,150,.5);
  animation:fxBreath 2.4s var(--fx-inout) infinite}
#dkclass .dkf-pass-tag{position:absolute;left:50%;top:-18px;transform:translateX(-50%);z-index:4;white-space:nowrap;
  padding:4px 20px;border-radius:10px;font-size:20px;font-weight:900;color:#3A2405;
  background:linear-gradient(180deg,#FFF0BE,#E8B23A);border:2px solid #8A6206;box-shadow:0 3px 0 rgba(0,0,0,.35)}
/* 未解放：灰色＋金の南京錠 */
#dkclass .dkf-lock .dkf-pass-body{filter:grayscale(1) brightness(.6) contrast(.9)}
#dkclass .dkf-lock:hover{transform:none}
#dkclass .dkf-lock .dkf-pp-play{visibility:hidden}
#dkclass .dkf-pass-lock{position:absolute;left:24px;right:24px;top:302px;height:112px;z-index:2;border-radius:20px;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(180deg,rgba(20,14,6,.78),rgba(8,5,2,.86));border:2px solid rgba(245,211,107,.7);
  box-shadow:0 6px 16px rgba(0,0,0,.45)}
#dkclass .dkf-pass-lock .dkf-lockic{position:absolute;left:50%;top:-44px;margin-left:-38px;width:76px;height:76px}
#dkclass .dkf-pass-lock b{margin-top:18px}
#dkclass .dkf-lockic{width:104px;height:104px;color:#F5D36B;filter:drop-shadow(0 5px 0 rgba(0,0,0,.55)) drop-shadow(0 0 12px rgba(255,210,90,.45))}
#dkclass .dkf-pass-lock b{font-family:var(--pop);font-size:34px;line-height:1;color:#fff;
  -webkit-text-stroke:7px #2A1604;paint-order:stroke fill}
#dkclass .dkf-pass-lock small{font-size:20px;font-weight:900;color:#F0DCA8;-webkit-text-stroke:4px #2A1604;paint-order:stroke fill}

/* ══════════════════════════════════════════════════════════════
   ④ マップ選択
   ══════════════════════════════════════════════════════════════ */
#setup .dkf-ticker{position:absolute;left:250px;right:250px;top:104px;height:54px;z-index:5;
  display:flex;align-items:center;gap:12px;padding:0 22px 0 14px;border-radius:27px;overflow:hidden;
  background:linear-gradient(90deg,rgba(24,14,4,.4),rgba(24,14,4,.92) 8%,rgba(24,14,4,.92) 92%,rgba(24,14,4,.4));
  border:2px solid rgba(200,149,47,.85);box-shadow:0 4px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,226,150,.25)}
#setup .dkf-tk-ic{flex:0 0 auto;width:36px;height:36px;color:#F5D36B;transform-origin:30% 60%;
  animation:dkfRing 2.8s ease-in-out infinite}
@keyframes dkfRing{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-12deg)}84%{transform:rotate(10deg)}92%{transform:rotate(-6deg)}}
#setup .dkf-tk-box{flex:1;min-width:0;overflow:hidden}
#setup .dkf-tk-tx{display:block;font-size:21px;font-weight:900;line-height:1.3;color:#FFE9B5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#setup .dkf-tk-tx.dkf-tk-in{animation:dkfTkIn 420ms var(--fx-out)}
@keyframes dkfTkIn{from{transform:translateY(26px)}}

#setup .dkf-stagebox{position:absolute;left:0;right:0;top:170px;height:486px;z-index:4}
#setup .dkf-stagebox > .fx-rays{opacity:.75;top:44%}
#setup .dkf-carousel{position:absolute;left:0;right:0;top:0;bottom:34px;perspective:1600px;touch-action:pan-y}
#setup .dkf-mcard{position:absolute;left:50%;top:8px;width:600px;height:430px;margin-left:-300px;cursor:pointer;
  z-index:1;transform-origin:50% 60%;transition:transform 480ms var(--fx-out)}
#setup .dkf-mcard.dkf-p0{z-index:3;transform:none}
#setup .dkf-mcard.dkf-pl{transform:translateX(-520px) translateY(34px) scale(.72) rotateY(16deg)}
#setup .dkf-mcard.dkf-pr{transform:translateX(520px) translateY(34px) scale(.72) rotateY(-16deg)}
#setup .dkf-mcard.dkf-ph{transform:translateY(50px) scale(.5);visibility:hidden}
#setup .dkf-mcard.dkf-land{animation:dkfLand 480ms var(--fx-back)}
@keyframes dkfLand{0%{transform:scale(.94)}60%{transform:scale(1.035)}100%{transform:none}}
#setup .dkf-mc-fr{position:absolute;inset:0;border-radius:24px;padding:6px;background:var(--fx-gold-metal);
  box-shadow:0 10px 0 rgba(0,0,0,.35),0 24px 44px rgba(0,0,0,.6)}
#setup .dkf-mcard.dkf-p0 .dkf-mc-fr{box-shadow:0 10px 0 rgba(0,0,0,.35),0 24px 44px rgba(0,0,0,.6),0 0 34px 8px rgba(255,210,90,.5)}
#setup .dkf-mc-in{position:relative;height:100%;border-radius:18px;overflow:hidden;
  background:radial-gradient(90% 70% at 50% 34%,rgba(255,255,255,.4),transparent 62%),
             linear-gradient(180deg,var(--dkf-l0) 0%,var(--dkf-l1) 46%,var(--dkf-l2) 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),inset 0 -60px 60px rgba(0,0,0,.35)}
#setup .dkf-mcv{position:absolute;left:20px;top:8px;width:560px;height:332px}
#setup .dkf-mc-emb{position:absolute;left:16px;top:14px;width:60px;height:60px;border-radius:50%;
  display:grid;place-items:center;padding:11px;color:#fff;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.5),rgba(0,0,0,.28));
  border:3px solid rgba(255,255,255,.85);box-shadow:0 3px 8px rgba(0,0,0,.35)}
#setup .dkf-mc-emb svg{display:block;width:100%;height:100%}
#setup .dkf-cn{position:absolute;z-index:2;padding:4px 12px 5px;border-radius:12px;white-space:nowrap;
  font-size:17px;font-weight:900;line-height:1.15;color:#fff;
  background:rgba(22,14,6,.74);border:2px solid rgba(255,226,140,.9);box-shadow:0 2px 5px rgba(0,0,0,.45)}
#setup .dkf-cn0{left:50%;top:262px;transform:translateX(-50%)}
#setup .dkf-cn1{left:12px;top:152px}
#setup .dkf-cn2{left:calc(50% + 34px);top:8px}
#setup .dkf-cn3{right:12px;top:152px}
#setup .dkf-cn0::before{content:"";display:inline-block;width:12px;height:12px;margin-right:6px;border-radius:50%;
  background:#FFD44A;box-shadow:0 0 8px #FFD44A;vertical-align:1px}
#setup .dkf-mc-nm{position:absolute;left:0;right:0;bottom:44px;text-align:center;z-index:2}
#setup .dkf-mc-nm b{font-family:var(--pop);font-size:52px;line-height:1;color:#fff;letter-spacing:.03em;
  -webkit-text-stroke:10px #1E1A2A;paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.35)}
#setup .dkf-mc-nm i{display:block;margin-top:4px;font-family:var(--caps);font-style:normal;font-size:18px;
  letter-spacing:.32em;text-indent:.32em;color:#FFF6DA;-webkit-text-stroke:3px rgba(0,0,0,.5);paint-order:stroke fill}
#setup .dkf-mc-hot{position:absolute;left:20px;right:20px;bottom:8px;height:34px;z-index:2;
  display:flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap}
#setup .dkf-mc-hot em{font-style:normal;font-size:16px;font-weight:900;color:#5A3A04;padding:3px 10px;border-radius:8px;
  background:linear-gradient(180deg,#FFF0BE,#E8B23A);border:1px solid #8A6206}
#setup .dkf-mc-hot span{font-size:18px;font-weight:900;color:#fff;-webkit-text-stroke:4px rgba(0,0,0,.55);paint-order:stroke fill}
#setup .dkf-mc-shade{position:absolute;inset:0;border-radius:24px;background:rgba(10,6,2,.66);opacity:0;

#setup .dkf-mcard:not(.dkf-p0) .dkf-cn,#setup .dkf-mcard:not(.dkf-p0) .dkf-mc-hot{visibility:hidden}
