<style>
/* ══════════════════════════════════════════════════════════════
   ダイスキングダム — メタ画面（ホーム／カード／ガチャ／ペンダント）
   本家ロビーに合わせた「木目＋羊皮紙＋金」の暖色。上部タブで行き来する。
   ══════════════════════════════════════════════════════════════ */
:root{
  --wood:#3B2A18; --wood-d:#241708; --wood-l:#5E452A;
  --parch:#F6E9CC; --parch-d:#E4D0A6; --ink:#3E2C15;
  --brz:#8B5A2B; --brz-d:#5A3618;
  --org:#F5A623; --org-d:#DE7A0C;
  --rose:#D8467E;
}

/* ── 共通の背景 ─────────────────────────────────────── */
.meta{background:
    radial-gradient(120% 90% at 50% -10%, #6B4E28 0%, #34240F 46%, #150D04 100%)}
.meta::before{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;
  background:repeating-linear-gradient(96deg,rgba(0,0,0,.5) 0 2px,transparent 2px 9px)}

/* ── 上部タブ ───────────────────────────────────────── */
.tabs{position:absolute;left:0;right:0;top:0;height:64px;z-index:8;display:flex;align-items:flex-end;
  gap:5px;padding:0 18px;
  background:linear-gradient(180deg,#4A3418,#2A1C0A);
  border-bottom:3px solid var(--org)}
.tab{position:relative;min-width:134px;padding:9px 20px 10px;border-radius:12px 12px 0 0;cursor:pointer;
  text-align:center;font-family:var(--pop);font-size:18px;color:#C9A96E;
  background:linear-gradient(#4E3A1E,#2E200C);border:2px solid #6B4E28;border-bottom:none;
  transition:transform .12s,color .12s}
.tab:hover{transform:translateY(-3px)}
.tab.on{color:#3E2C15;background:linear-gradient(#FFE9A8,#F2C230);border-color:#8A6314;
  box-shadow:0 -3px 12px rgba(242,194,48,.45)}
.tab .ic{font-size:16px;margin-right:5px}
.tabs .back{margin-left:auto;align-self:center;margin-bottom:8px}

/* ── 通貨バー ───────────────────────────────────────── */
.wallet{position:absolute;left:0;right:0;bottom:0;height:56px;z-index:8;display:flex;align-items:center;
  gap:10px;padding:0 18px;
  background:linear-gradient(180deg,#4A3418,#201506);border-top:3px solid var(--org)}
.wallet .cur{display:flex;align-items:center;gap:7px;padding:5px 14px 6px;border-radius:11px;
  background:linear-gradient(#F6E9CC,#DCC39A);border:2px solid var(--brz-d)}
.wallet .cur span{font-size:19px}
.wallet .cur b{font-family:var(--pop);font-size:17px;color:#3E2C15}
.wallet .lvl{margin-left:auto;display:flex;align-items:center;gap:9px;color:#F0DCA8}
.wallet .xp{width:190px;height:13px;border-radius:7px;background:#231705;border:2px solid #6B4E28;
  overflow:hidden}
.wallet .xp i{display:block;height:100%;background:linear-gradient(90deg,#F5A623,#FFE9A8)}

/* ── 羊皮紙パネル ───────────────────────────────────── */
.pan{border-radius:16px;padding:4px;
  background:linear-gradient(160deg,#C79A57,#8B5A2B 45%,#5A3618 66%,#C79A57);
  box-shadow:0 12px 30px rgba(0,0,0,.6)}
.pan > .in{background:linear-gradient(#F8EED6,#E7D3AC);border-radius:12px;color:var(--ink);
  padding:14px 16px;position:relative}
.pan > .in::before,.pan > .in::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#9A7C4A,#4A3418)}
.pan > .in::before{left:7px;top:7px}
.pan > .in::after{right:7px;top:7px}
.pan h3{font-family:var(--pop);font-size:20px;color:#7A4A12;margin-bottom:8px}

/* ── 見出し ─────────────────────────────────────────── */
.metahd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.metahd h2{font-family:var(--pop);font-size:30px;
  background:linear-gradient(#FFF6D8,#F2C230 55%,#B87F12);-webkit-background-clip:text;
  background-clip:text;color:transparent;-webkit-text-stroke:4px #3A2405;paint-order:stroke fill}
.metahd .sp{margin-left:auto;display:flex;gap:10px}
.metahd .note{font-size:13px;color:#E0C795}

/* ── 画面の器 ───────────────────────────────────────── */
#home .inner,#cards .inner,#gacha .inner,#pend .inner{position:relative;margin:auto;
  width:1400px;max-width:96%;padding:72px 0 62px}

/* ══════════ ホーム ══════════ */
#home .hero{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:stretch}
#home .heroPic{border-radius:18px;padding:5px;position:relative;
  background:linear-gradient(160deg,#FFE9A8,#D3A22C 40%,#8A6314 62%,#FFF0BE);
  box-shadow:0 14px 34px rgba(0,0,0,.6)}
#home .heroPic canvas{display:block;width:100%;height:430px;border-radius:14px;
  background:radial-gradient(115% 90% at 50% 18%,#7A5F35,#2A1C0A)}
#home .heroPic .rk{position:absolute;left:-7px;top:-9px;font-family:var(--caps);font-size:15px;
  padding:3px 13px 4px;border-radius:9px;border:2px solid #5A3618;color:#3A2A10;
  background:linear-gradient(#FFF0BE,#E0A11A);box-shadow:0 3px 0 rgba(0,0,0,.5)}
#home .heroInfo h1{font-family:var(--pop);font-size:58px;line-height:1.05;
  background:linear-gradient(#FFF6D8,#F2C230 52%,#B87F12);-webkit-background-clip:text;
  background-clip:text;color:transparent;-webkit-text-stroke:4.5px #3A2405;paint-order:stroke fill;
  filter:drop-shadow(0 5px 0 rgba(0,0,0,.4))}
#home .heroInfo .cap{font-family:var(--caps);font-size:14px;letter-spacing:.4em;color:#F0C878;
  text-indent:.4em;margin-top:1px}
#home .heroInfo .who{margin-top:9px;font-size:15px;color:#F3E3C2}
#home .heroInfo .who b{color:#FFE9A8}
#home .heroInfo .stats{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:1px 20px}
#home .modes{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:14px;margin-top:22px}
.modebtn{border-radius:16px;padding:16px 14px 15px;cursor:pointer;text-align:center;position:relative;
  border:3px solid #6B4E28;background:linear-gradient(#5E4526,#31210D);
  transition:transform .14s,border-color .14s,box-shadow .14s}
.modebtn:hover{transform:translateY(-5px);border-color:var(--org);box-shadow:0 10px 22px rgba(0,0,0,.5)}
.modebtn .ic{font-size:38px;line-height:1}
.modebtn .nm{font-family:var(--pop);font-size:21px;color:#FFE9B5;margin-top:5px}
.modebtn .ds{font-size:12px;color:#D9C09A;margin-top:3px;line-height:1.55}
.modebtn.big{background:linear-gradient(#F5A623,#C25E06);border-color:#FFE9A8}
.modebtn.big .nm{color:#FFFDF0;-webkit-text-stroke:3px #8A3E02;paint-order:stroke fill;font-size:25px}
.modebtn.big .ds{color:#FFEFD0}
.modebtn .badge{position:absolute;right:8px;top:8px;font-size:10.5px;font-weight:900;padding:2px 8px;
  border-radius:8px;background:var(--rose);color:#fff;border:2px solid #7A1440}

/* 今週のイベント帯 */
.weekbar{display:flex;align-items:center;gap:14px;margin-top:14px;padding:10px 16px;border-radius:14px;
  border:3px solid var(--org);
  background:linear-gradient(90deg,rgba(245,166,35,.22),rgba(58,36,5,.85))}
.weekbar .ic{font-size:32px}
.weekbar b{display:block;font-size:16px;color:#FFE9B5}
.weekbar i{display:block;font-style:normal;font-size:12.5px;color:#E7D3AC;margin-top:1px}
.weekbar .feat{text-align:center;padding:5px 13px;border-radius:10px;
  background:linear-gradient(#F6E9CC,#DCC39A);border:2px solid var(--brz-d)}
.weekbar .feat b{font-size:11px;color:#7A4A12}
.weekbar .feat i{font-size:15px;font-weight:900;color:#B2411C}

/* ══════════ カード ══════════ */
.cardwrap{display:grid;grid-template-columns:352px 1fr;gap:18px;align-items:start}
.cardgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-height:474px;overflow-y:auto;
  padding:5px;border-radius:14px;background:rgba(20,12,4,.42);border:2px solid #6B4E28}
.minicard{border-radius:12px;padding:3px;cursor:pointer;position:relative;transition:transform .14s;
  background:linear-gradient(160deg,#B49A72,#4A3418)}
.minicard.rA{background:linear-gradient(160deg,#9FC4E8,#33526F)}
.minicard.rS{background:linear-gradient(160deg,#E0BCF4,#5A3A78)}
.minicard.rSS{background:linear-gradient(160deg,#FFF6D8,#F2C230 42%,#8A6314)}
.minicard:hover{transform:translateY(-4px)}
.minicard.sel{box-shadow:0 0 0 3px #FFF0BE,0 10px 24px rgba(0,0,0,.6)}
.minicard.locked{filter:grayscale(1) brightness(.4)}
.minicard canvas{display:block;width:100%;height:112px;border-radius:9px 9px 0 0;
  background:radial-gradient(115% 90% at 50% 16%,#7A5F35,#241708)}
.minicard .b{background:#2A1C0A;border-radius:0 0 9px 9px;padding:4px 5px 5px;text-align:center}
.minicard .b .n{font-size:11.5px;font-weight:900;color:#F3E3C2;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.minicard .b .l{font-family:var(--pop);font-size:11px;color:#FFD24D}
.minicard .rr{position:absolute;left:-3px;top:-4px;font-family:var(--caps);font-size:10px;
  padding:1px 6px 2px;border-radius:6px;border:2px solid #4A3206;color:#3A2A10;
  background:linear-gradient(#FFF0BE,#E0A11A)}
.minicard .eq{position:absolute;right:-3px;top:-4px;font-size:10px;font-weight:900;padding:1px 6px 2px;
  border-radius:6px;background:var(--rose);color:#fff;border:2px solid #7A1440}

.cardDetail{border-radius:18px;padding:5px;
  background:linear-gradient(160deg,#FFE9A8,#D3A22C 40%,#8A6314 62%,#FFF0BE);
  box-shadow:0 14px 34px rgba(0,0,0,.6)}
.cardDetail .in{background:linear-gradient(#F8EED6,#E7D3AC);border-radius:13px;padding:12px;color:var(--ink)}
.cardDetail canvas{display:block;width:100%;height:250px;border-radius:11px;
  background:radial-gradient(115% 90% at 50% 16%,#7A5F35,#241708)}
.cardDetail h3{font-family:var(--pop);font-size:25px;color:#7A4A12;text-align:center;margin-top:7px}
.cardDetail .role{text-align:center;font-size:12px;color:#8A6A3C}
.cardDetail .skill{margin-top:8px;background:rgba(255,255,255,.62);border:2px solid #C9A961;
  border-radius:10px;padding:8px 10px;font-size:12.4px;line-height:1.6;color:#4A3418}
.cardDetail .skill b{color:#B2411C;display:block;margin-bottom:2px}

/* ── ステータス行（羊皮紙の上） ─────────────────────── */
.strow{display:flex;align-items:center;gap:6px;margin:2px 0}
.strow .l{flex:0 0 96px;font-size:11px;color:#7A5F35}
.strow .bar{flex:1;height:9px;border-radius:5px;background:#CDB68B;overflow:hidden;display:block;
  border:1px solid #A88B56}
.strow .bar i{display:block;height:100%;background:linear-gradient(90deg,#E07010,#F5A623)}
.strow .v{flex:0 0 46px;text-align:right;font-family:var(--pop);font-size:12px;color:#7A4A12}
.strow .v em{font-style:normal;color:#2F7A38;font-size:10px}
/* 暗い背景の上（ホーム）で使うとき */
.dark-st .strow .l{color:#D9C09A}
.dark-st .strow .bar{background:#231705;border-color:#6B4E28}
.dark-st .strow .v{color:#FFE9B5}

/* ══════════ ガチャ ══════════ */
#gacha .stage{position:relative;height:322px;border-radius:18px;overflow:hidden;
  background:radial-gradient(95% 100% at 50% 16%,#8A6A2A,#2A1C0A 72%);
  border:3px solid #8A6314;display:grid;place-items:center}
#gacha .orb{width:168px;height:168px;border-radius:50%;
  background:radial-gradient(circle at 34% 26%,#FFF9DC,#F2C230 44%,#8A6314);
  box-shadow:0 0 64px rgba(242,194,48,.85),inset 0 -14px 26px rgba(0,0,0,.35);
  animation:orbFloat 2.6s ease-in-out infinite alternate}
@keyframes orbFloat{from{transform:translateY(-8px) scale(1)}to{transform:translateY(8px) scale(1.04)}}
#gacha .pulls{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px}
.pullcard{border-radius:12px;padding:3px;background:linear-gradient(160deg,#9FC4E8,#33526F);
  animation:pullIn .45s cubic-bezier(.2,1.5,.4,1) both}
.pullcard.rS{background:linear-gradient(160deg,#E0BCF4,#5A3A78)}
.pullcard.rSS{background:linear-gradient(160deg,#FFF6D8,#F2C230 42%,#8A6314);
  box-shadow:0 0 26px rgba(255,214,80,.8)}
@keyframes pullIn{from{transform:scale(.45) rotate(-10deg)}to{transform:none}}
.pullcard canvas{display:block;width:100%;height:126px;border-radius:9px 9px 0 0;
  background:radial-gradient(115% 90% at 50% 16%,#7A5F35,#241708)}
.pullcard .b{background:#2A1C0A;border-radius:0 0 9px 9px;padding:5px;text-align:center;font-size:12px;
  font-weight:900;color:#F3E3C2}
.pullcard .b i{display:block;font-style:normal;font-family:var(--pop);font-size:11px;color:#FFD24D}
#gacha .rates{margin-top:11px;font-size:12.5px;color:#E0C795;text-align:center;line-height:1.8}
#gacha .btns{display:flex;gap:14px;justify-content:center;margin-top:14px}

/* ══════════ ペンダント ══════════ */
.pendwrap{display:grid;grid-template-columns:344px 1fr;gap:18px;align-items:start}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.slot{aspect-ratio:1/1;border-radius:14px;border:3px dashed #8A6A3C;display:grid;place-items:center;
  background:rgba(20,12,4,.5);cursor:pointer;font-size:40px;position:relative;transition:border-color .14s}
.slot.on{border-style:solid;border-color:var(--org);
  background:linear-gradient(160deg,#5E4526,#2A1C0A)}
.slot .nm{position:absolute;left:0;right:0;bottom:5px;font-size:10.5px;font-weight:900;color:#F0DCA8;
  text-align:center}
.pendgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.pend{border-radius:12px;padding:10px 7px 11px;text-align:center;cursor:pointer;position:relative;
  border:2px solid #6B4E28;background:linear-gradient(#5E4526,#31210D);transition:transform .14s}
.pend:hover{transform:translateY(-4px)}
.pend.eq{border-color:var(--org);box-shadow:0 0 0 2px rgba(245,166,35,.35)}
.pend.no{opacity:.3;filter:grayscale(1)}
.pend .ic{font-size:34px;line-height:1}
.pend .nm{font-size:11.5px;font-weight:900;color:#F3E3C2;margin-top:4px}
.pend .ef{font-size:10.5px;color:#FFD24D;margin-top:2px}

/* ══════════ キャラ選択（対戦前） ══════════ */
#pick{background:radial-gradient(120% 90% at 50% -6%,#6B4E28 0%,#34240F 48%,#150D04 100%)}
#pick .inner{position:relative;margin:auto;width:1400px;max-width:96%;text-align:center}
#pick h2{font-family:var(--pop);font-size:32px;
  background:linear-gradient(#FFF6D8,#F2C230 55%,#B87F12);-webkit-background-clip:text;
  background-clip:text;color:transparent;-webkit-text-stroke:4px #3A2405;paint-order:stroke fill}
#pick .who{margin-top:4px;font-size:15px;color:#E7D3AC}
/* キャラが増えるとカードが2段になり、2段目がステージ（900px）の外へ落ちて
   選べなくなっていた（実測：6枚目が下へ216pxはみ出し）。
   器の高さを画面内に収め、あふれるぶんは中だけ縦にスクロールさせる。 */
#pick .inner{display:flex;flex-direction:column;max-height:94%}
#pick .grid{display:grid;gap:14px;margin-top:16px;
  flex:1 1 auto;min-height:0;align-content:start;
  overflow-y:auto;overflow-x:hidden;padding:2px 6px 8px 2px;
  scrollbar-width:thin;-webkit-overflow-scrolling:touch}
/* 6枚以上のときは1枚を小さくして、2段でも画面に収める */
#pick .grid.many canvas{height:150px}
#pick .grid.many .ab{min-height:0;font-size:11px;line-height:1.45}
#pick .grid.many .stw{display:none}
#pick .grid.many .nm{font-size:16px}
.chcard{border-radius:16px;padding:4px;cursor:pointer;position:relative;
  background:linear-gradient(160deg,#C79A57,#5A3618);
  transition:transform .16s,box-shadow .16s}
.chcard:hover{transform:translateY(-7px);box-shadow:0 14px 30px rgba(0,0,0,.6)}
.chcard.sel{background:linear-gradient(160deg,#FFF0BE,#D3A22C 45%,#8A6314)}
.chcard.taken{opacity:.3;pointer-events:none;filter:grayscale(.85)}
.chcard .body{background:linear-gradient(#F8EED6,#E7D3AC);border-radius:12px;overflow:hidden;
  color:var(--ink)}
.chcard canvas{display:block;width:100%;height:212px;
  background:radial-gradient(115% 90% at 50% 16%,#7A5F35,#241708)}
.chcard .nm{font-family:var(--pop);font-size:19px;padding:7px 8px 1px;color:#7A4A12}
.chcard .role{font-size:11.5px;color:#8A6A3C;padding:0 8px 6px}
.chcard .ab{margin:0 8px 8px;background:rgba(255,255,255,.62);border:2px solid #C9A961;border-radius:9px;
  padding:7px 8px;font-size:11.8px;line-height:1.55;color:#4A3418;text-align:left;min-height:66px}
.chcard .ab b{color:#B2411C;display:block;font-size:12.2px;margin-bottom:2px}
.chcard .tag{position:absolute;right:7px;top:7px;font-size:11px;font-weight:900;padding:2px 9px;
  border-radius:8px;background:linear-gradient(#FFF0BE,#E0A11A);color:#3A2A10;border:2px solid #5A3618}
.chcard .stw{margin:0 8px 9px}

/* ══════════ ローディング ══════════ */
#loading{background:radial-gradient(120% 90% at 50% 10%,#5E4526,#150D04)}
#loading .inner{position:relative;margin:auto;text-align:center;width:760px;max-width:92%}
#loading .art{font-size:74px;line-height:1}
#loading .bar{height:17px;border-radius:9px;background:#231705;border:3px solid #8A6314;
  overflow:hidden;margin-top:18px;position:relative}
#loading .bar i{display:block;height:100%;width:0%;
  background:linear-gradient(90deg,#E07010,#F5A623 55%,#FFF6D8);
  box-shadow:0 0 14px rgba(245,166,35,.9);transition:width .18s linear}
#loading .pct{margin-top:6px;font-family:var(--pop);font-size:17px;color:#FFE9B5}
#loading .tip{margin-top:20px;background:linear-gradient(#F8EED6,#E7D3AC);border:3px solid #8B5A2B;
  border-radius:12px;padding:13px 18px;font-size:14.5px;line-height:1.8;color:var(--ink);text-align:left}
#loading .tip b{color:#B2411C;display:block;margin-bottom:3px;font-size:12px;letter-spacing:.12em}

/* ══════════ VS 画面 ══════════ */
#vs{position:absolute;inset:0;z-index:210;display:none;flex-direction:column;
  background:radial-gradient(100% 90% at 50% 40%,#4A3418,#0C0703)}
#vs.on{display:flex}
#vs .row{flex:1;display:flex;align-items:center;justify-content:center;gap:36px;position:relative}
#vs .side{width:300px;text-align:center;animation:vsIn .5s cubic-bezier(.2,1.3,.35,1) both}
#vs .side.r{animation-name:vsInR}
@keyframes vsIn{from{transform:translateX(-140px)}to{transform:none}}
@keyframes vsInR{from{transform:translateX(140px)}to{transform:none}}
#vs .side canvas{display:block;width:100%;height:290px}
#vs .side .nm{font-family:var(--pop);font-size:26px;color:#FFE9B5;margin-top:2px}
#vs .side .rl{font-size:12.5px;color:#D9C09A}
#vs .vsmark{font-family:var(--caps);font-size:82px;line-height:1;
  background:linear-gradient(#FFF6D8,#F2C230 50%,#C0261A);-webkit-background-clip:text;
  background-clip:text;color:transparent;-webkit-text-stroke:8px #3A1004;paint-order:stroke fill;
  animation:vsPop .6s cubic-bezier(.2,1.6,.4,1) .25s both}
@keyframes vsPop{from{transform:scale(2.4) rotate(-14deg)}to{transform:none}}
#vs .tip{padding:14px 24px 26px;text-align:center;font-size:14.5px;color:#E7D3AC;line-height:1.75}
#vs .tip b{color:#FFD24D;display:block;font-size:12px;letter-spacing:.14em;margin-bottom:3px}

/* ══════════ 報酬 ══════════ */
.reward{width:520px;text-align:center;border-radius:18px;padding:5px;
  background:linear-gradient(160deg,#FFE9A8,#D3A22C 40%,#8A6314 62%,#FFF0BE);
  box-shadow:0 24px 60px rgba(0,0,0,.75)}
.reward .in{background:linear-gradient(#F8EED6,#E7D3AC);border-radius:13px;padding:20px;color:var(--ink)}
.reward h3{font-family:var(--pop);font-size:29px;color:#B2411C}
.reward .items{display:flex;gap:13px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.reward .it{min-width:118px;padding:11px 13px;border-radius:12px;border:2px solid #C9A961;
  background:rgba(255,255,255,.6)}
.reward .it .ic{font-size:31px}
.reward .it .v{font-family:var(--pop);font-size:21px;color:#7A4A12;margin-top:2px}
.reward .it .l{font-size:11px;color:#8A6A3C}

/* ══════════ タイトル（暖色に合わせ直す） ══════════ */
#title{background:radial-gradient(120% 100% at 50% 8%,#6B4E28 0%,#34240F 46%,#0E0803 100%)}
#title .sub{color:#F0C878}
#title .lead{color:#E7D3AC}
#title .credit{color:#9A7C4A}

/* ── ホーム右カラム：ランキング（本家ロビーの主役） ─────────── */
#home .hero3{grid-template-columns:296px 1fr 400px}
.rankpane{border-radius:16px;padding:4px;
  background:linear-gradient(160deg,#C79A57,#8B5A2B 45%,#5A3618 66%,#C79A57);
  box-shadow:0 12px 30px rgba(0,0,0,.6);display:flex;flex-direction:column;height:100%}
.rankpane .rtab{display:flex;gap:4px;padding:4px 4px 0}
.rankpane .rtab span{flex:1;text-align:center;font-size:12.5px;font-weight:900;padding:6px 0 7px;
  border-radius:9px 9px 0 0;color:#C9A96E;background:linear-gradient(#4E3A1E,#2E200C);
  border:2px solid #6B4E28;border-bottom:none;cursor:pointer}
.rankpane .rtab span.on{color:#3E2C15;background:linear-gradient(#FFE9A8,#F2C230);border-color:#8A6314}
.rankpane .rlist{flex:1;background:linear-gradient(#F8EED6,#E7D3AC);border-radius:0 0 12px 12px;
  padding:6px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.rrow{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:8px;
  background:rgba(255,255,255,.55);border:1px solid #CBB68E;font-size:12.5px;color:#3E2C15}
.rrow.me{background:linear-gradient(90deg,#FFEFAE,#F7DE96);border-color:#B2411C;font-weight:900;
  box-shadow:0 0 0 2px rgba(178,65,28,.28)}
.rrow .rk{flex:0 0 26px;text-align:center;font-family:var(--pop);font-size:14px;color:#7A4A12}
.rrow .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rrow .as{font-family:var(--pop);font-size:12.5px;color:#B2411C;font-variant-numeric:tabular-nums}
.rrow .lk{flex:0 0 56px;text-align:right;font-size:11px;color:#8A6A3C}
.mileage{display:flex;align-items:center;gap:8px;padding:7px 10px;margin-top:5px;border-radius:10px;
  background:linear-gradient(90deg,rgba(93,180,90,.32),rgba(28,44,20,.7));border:2px solid #4C9B47}
.mileage b{font-size:12px;color:#CFF0C4}
.mileage .bar{flex:1;height:11px;border-radius:6px;background:#12200E;border:1px solid #3D7A38;
  overflow:hidden;display:block}
.mileage .bar i{display:block;height:100%;background:linear-gradient(90deg,#5DB45A,#B8F0A8)}
.mileage .n{font-family:var(--pop);font-size:12px;color:#CFF0C4}
.rfoot{font-size:11.5px;color:#E0C795;text-align:center;padding:6px 4px 2px}
.rfoot b{color:#FFD24D}

/* ── ペンダント（等級つき） ─────────────────────────── */
.pend{padding-top:16px}
.pend .pr,.slot .pr{position:absolute;left:-3px;top:-4px;font-family:var(--caps);font-size:10px;
  padding:1px 7px 2px;border-radius:6px;border:2px solid #4A3206;color:#3A2A10;
  background:linear-gradient(#FFF0BE,#E0A11A);z-index:2}
.pend.rS .pr,.slot.rS .pr{background:linear-gradient(#EFD8FF,#9A6BD0);border-color:#4A2A6B}
.pend.rSS .pr,.slot.rSS .pr{background:linear-gradient(#FFF6D8,#F2C230);border-color:#6B4A08;
  box-shadow:0 0 10px rgba(255,214,80,.8)}
.pend.rSS{border-color:#F2C230;box-shadow:0 0 0 2px rgba(242,194,48,.28)}
.pend.rS{border-color:#9A6BD0}
.pend .pp,.slot .pp{font-family:var(--pop);font-size:12px;color:#FFD24D;margin-top:1px}
.pend .ef{font-size:10px;color:#D9C09A;line-height:1.5;margin-top:3px;min-height:44px}
.slot{padding-top:14px;font-size:34px}
.slot .pp{position:absolute;right:6px;top:6px;font-size:11px}

/* ── 左右の縦アイコンレール（本家は画面の外周を額縁に使う） ── */
.tabs{display:none}
.rail{position:absolute;top:4%;bottom:9%;width:96px;z-index:9;display:flex;flex-direction:column;
  justify-content:center;gap:8px;padding:8px 6px;
  background:linear-gradient(180deg,rgba(58,40,18,.94),rgba(24,16,6,.94))}
.rail.left{left:0;border-right:3px solid var(--org);border-radius:0 14px 14px 0}
.rail.right{right:0;border-left:3px solid var(--org);border-radius:14px 0 0 14px}
.rail .rb{position:relative;border-radius:12px;padding:8px 4px 7px;text-align:center;cursor:pointer;
  background:linear-gradient(#4E3A1E,#2A1C0A);border:2px solid #6B4E28;
  transition:transform .12s,border-color .12s,background .12s}
.rail .rb:hover{transform:translateX(3px);border-color:var(--org)}
.rail.right .rb:hover{transform:translateX(-3px)}
.rail .rb.on{background:linear-gradient(#FFE9A8,#F2C230);border-color:#8A6314}
.rail .rb.on .tx,.rail .rb.on .ic{color:#3E2C15}
.rail .rb .ic{display:block;font-size:26px;line-height:1}
.rail .rb .tx{display:block;font-size:11px;font-weight:900;color:#E0C795;margin-top:3px}
.rail .rb .n{position:absolute;right:-4px;top:-5px;width:20px;height:20px;border-radius:50%;
  background:#D8467E;color:#fff;font-size:12px;font-weight:900;line-height:20px;
  border:2px solid #7A1440;animation:railPing 1s ease-in-out infinite alternate}
@keyframes railPing{from{transform:scale(1)}to{transform:scale(1.18)}}
/* レールぶん中身を内側へ寄せる */
#home .inner,#cards .inner,#gacha .inner,#pend .inner,#daily .inner,#quest .inner,#news .inner{
  width:calc(100% - 220px);max-width:1290px;padding:30px 0 66px}

/* ── ガチャ3レーン ─────────────────────────────────── */
#gacha .stage{height:250px}
.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:13px}
.lane{border-radius:15px;padding:11px 12px 12px;text-align:center;
  border:3px solid #6B4E28;background:linear-gradient(#4E3A1E,#241708)}
.lane.l-special{border-color:#9A6BD0;background:linear-gradient(#43305C,#1B1028)}
.lane.l-premium{border-color:#F2C230;background:linear-gradient(#6B4E12,#2A1C05);
  box-shadow:0 0 22px rgba(242,194,48,.28)}
.lane .lh{font-family:var(--pop);font-size:21px;color:#FFE9B5}
.lane .ld{font-size:11.5px;color:#D9C09A;margin-top:2px}
.lane .lrate{font-size:11px;color:#9FB6CC;margin-top:5px;font-variant-numeric:tabular-nums}
.lane .lbtns{display:flex;gap:8px;justify-content:center;margin-top:9px}
.lane .lbtns .btn{font-size:14px;padding:8px 12px;flex:1}
.lane .lfree{margin-top:7px;font-size:12px;font-weight:900;color:#FFD24D;
  font-variant-numeric:tabular-nums}

/* ── 出席簿 ─────────────────────────────────────────── */
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.dcell{border-radius:13px;padding:12px 6px 13px;text-align:center;position:relative;
  border:3px solid #6B4E28;background:linear-gradient(#4E3A1E,#241708)}
.dcell.got{opacity:.45;filter:grayscale(.7)}
.dcell.now{border-color:var(--org);box-shadow:0 0 0 3px rgba(245,166,35,.32);
  animation:dNow .9s ease-in-out infinite alternate}
@keyframes dNow{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.dcell .dd{font-size:11.5px;color:#D9C09A}
.dcell .di{font-size:38px;line-height:1.1;margin:4px 0 2px}
.dcell .dn{font-size:11.5px;font-weight:900;color:#FFE9B5}
.dcell .dchk{position:absolute;left:0;right:0;top:44%;font-size:12px;font-weight:900;color:#7DE08A;
  background:rgba(6,14,26,.72);padding:3px 0}

/* ── ミッション ─────────────────────────────────────── */
.qlist{display:flex;flex-direction:column;gap:9px}
.qrow{display:flex;align-items:center;gap:12px;padding:11px 15px;border-radius:12px;
  border:2px solid #6B4E28;background:linear-gradient(#4E3A1E,#241708)}
.qrow.ready{border-color:var(--org);box-shadow:0 0 0 2px rgba(245,166,35,.3)}
.qrow.done{opacity:.45}
.qrow .qn{flex:0 0 260px;font-size:14px;font-weight:900;color:#F3E3C2}
.qrow .qb{flex:1;height:12px;border-radius:7px;background:#231705;border:1px solid #6B4E28;
  overflow:hidden;display:block}
.qrow .qb i{display:block;height:100%;background:linear-gradient(90deg,#E07010,#F5A623)}
.qrow .qc{flex:0 0 74px;text-align:right;font-family:var(--pop);font-size:13px;color:#FFE9B5}
.qrow .qr{flex:0 0 88px;text-align:right;font-family:var(--pop);font-size:15px;color:#FFD24D}
.qrow .qbtn{flex:0 0 120px;font-size:14px;padding:8px 0}

/* ══════════ 試合前の待機部屋 ══════════
   本家は左に自分の装備、右に部屋の顔ぶれとアイテム売り場という見開き。
   ここで「今日はこの装備で行く」と決める時間が、次の試合の期待になる。 */
#room{padding:0}
.roomwrap{position:absolute;inset:0;display:flex;flex-direction:column}
.roomhd{flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:12px 22px 10px;border-bottom:2px solid rgba(211,162,44,.42);
  background:linear-gradient(180deg,rgba(46,32,10,.94),rgba(24,16,5,.86))}
.roomhd h2{margin:0;font-family:var(--pop);font-size:23px;color:#FFE9B5;letter-spacing:.04em;
  text-shadow:0 2px 0 rgba(0,0,0,.5)}
.roomhd .mp{font-size:13px;color:#CBB27A}
.roomhd .sp{flex:1}
.roombd{flex:1;display:grid;grid-template-columns:452px 1fr;gap:0;min-height:0}
.roomL{border-right:2px solid rgba(211,162,44,.34);padding:14px 18px;overflow:auto;
  background:linear-gradient(180deg,rgba(30,21,8,.55),rgba(12,8,3,.5))}
.roomR{padding:14px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.rsec{font-family:var(--pop);font-size:13px;color:#D3A22C;letter-spacing:.1em;margin:0 0 7px;
  display:flex;align-items:center;gap:8px}
.rsec:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(211,162,44,.55),transparent)}

/* 左：自分の装備 */
.meBox{display:flex;gap:13px;align-items:flex-start}
.meBox canvas{flex:0 0 auto;width:132px;height:187px;border-radius:12px;
  border:2px solid rgba(211,162,44,.5);background:rgba(6,12,22,.6)}
.meInfo{flex:1;min-width:0}
.meInfo .nm{font-family:var(--pop);font-size:19px;color:#FFE9B5;line-height:1.2}
.meInfo .rl{font-size:12px;color:#CBB27A;margin-bottom:5px}
.meInfo .lvtag{display:inline-block;font-family:var(--pop);font-size:11px;padding:2px 9px;
  border-radius:999px;background:linear-gradient(90deg,#8A5B12,#D3A22C);color:#2A1B04}
.meInfo .sk{margin-top:7px;font-size:11.5px;line-height:1.5;color:#E4D6B4;
  border-left:3px solid #D3A22C;padding-left:8px}
.slotrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.pslot{aspect-ratio:1/1;border-radius:12px;border:2px dashed rgba(211,162,44,.45);
  background:rgba(8,14,24,.55);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;cursor:pointer;transition:.14s}
.pslot:hover{border-color:#FFD24D;background:rgba(30,22,8,.7);transform:translateY(-2px)}
.pslot.on{border-style:solid;border-color:#FFD24D;
  background:linear-gradient(180deg,rgba(58,40,12,.9),rgba(22,15,4,.9))}
.pslot .ic{font-size:24px;line-height:1}
.pslot .nm{font-size:9.5px;color:#E4D6B4;text-align:center;line-height:1.25;padding:0 3px}
.pslot .em{font-size:10px;color:#7C6A45}
.dicerow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.dcard{border-radius:11px;border:2px solid rgba(211,162,44,.3);background:rgba(8,14,24,.6);
  padding:8px 3px 7px;text-align:center;cursor:pointer;transition:.14s;opacity:.55}
.dcard.have{opacity:1}
.dcard.have:hover{transform:translateY(-2px);border-color:#FFD24D}
.dcard.on{border-color:#FFD24D;background:linear-gradient(180deg,rgba(58,40,12,.92),rgba(20,14,4,.92));
  box-shadow:0 0 0 2px rgba(255,210,77,.28)}
.dcard .ic{font-size:23px;line-height:1.1}
.dcard .nm{font-size:10px;color:#E4D6B4;line-height:1.25;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard .rr{font-family:var(--pop);font-size:9px;color:#FFD24D}
.dds{margin-top:7px;font-size:11.5px;color:#CBB27A;min-height:2.6em;line-height:1.35}

/* 右：部屋の4スロット
   ※ #room を付けて待機部屋だけに効かせる。付けないと設定画面の
     「② プレイヤー」（同じ .seats / .seat を使っている）まで4列グリッドになり、
     名前の入力欄と種類の選択欄が横に63pxはみ出して名前が読めなくなる（実測で確認）。 */
#room .seats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
#room .seat{border-radius:14px;border:2px solid rgba(211,162,44,.34);overflow:hidden;
  background:linear-gradient(180deg,rgba(20,30,46,.9),rgba(8,13,22,.9));
  display:flex;flex-direction:column;align-items:center;padding:9px 6px 8px;gap:4px}
#room .seat.me{border-color:#FFD24D;box-shadow:0 0 0 2px rgba(255,210,77,.25)}
#room .seat canvas{width:96px;height:136px;border-radius:9px;background:rgba(4,9,16,.55)}
#room .seat .nm{font-family:var(--pop);font-size:14px;color:#FFE9B5;line-height:1.2;text-align:center}
.seat .cd{font-size:10.5px;color:#8FA9C4;text-align:center;line-height:1.25}
.seat .st{font-family:var(--pop);font-size:10px;padding:2px 10px;border-radius:999px;
  background:rgba(60,200,120,.2);border:1px solid rgba(90,230,150,.5);color:#8FF0BC}
.seat .st.cpu{background:rgba(120,140,180,.16);border-color:rgba(150,175,210,.45);color:#B6C8DE}

/* 右：アイテム売り場 */
.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sitem{border-radius:12px;border:2px solid rgba(211,162,44,.3);padding:9px 8px 8px;
  background:linear-gradient(180deg,rgba(30,22,9,.8),rgba(14,10,4,.8));cursor:pointer;transition:.14s;
  display:flex;flex-direction:column;gap:3px}
.sitem:hover{transform:translateY(-2px);border-color:#FFD24D}
.sitem.no{opacity:.42;cursor:not-allowed;transform:none}
.sitem .t{display:flex;align-items:center;gap:6px}
.sitem .t .ic{font-size:19px}
.sitem .t b{font-size:12px;color:#FFE9B5}
.sitem .d{font-size:10.5px;color:#A79470;line-height:1.35;min-height:2.7em}
.sitem .p{font-family:var(--pop);font-size:12px;color:#FFD24D;text-align:right}
.bagrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:38px;
  padding:7px 11px;border-radius:11px;background:rgba(8,14,24,.55);
  border:1px dashed rgba(211,162,44,.4)}
.bagrow .lb{font-size:11px;color:#8FA9C4}
.bagchip{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
  background:linear-gradient(90deg,#6B4E12,#3A2A08);border:1px solid rgba(211,162,44,.6);
  font-size:11.5px;color:#FFE9B5;cursor:pointer}
.bagchip:hover{background:linear-gradient(90deg,#8A5B12,#4A3609)}
.roomft{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 22px 12px;
  border-top:2px solid rgba(211,162,44,.42);background:linear-gradient(0deg,rgba(46,32,10,.94),rgba(24,16,5,.7))}
.roomft .hint{flex:1;font-size:11.5px;color:#A79470}


/* 部屋のマップ選択 */
.maprow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mcard{position:relative;border-radius:13px;border:2px solid rgba(211,162,44,.3);cursor:pointer;
  padding:13px 12px 12px;transition:.15s;overflow:hidden;
  background:linear-gradient(140deg,rgba(24,38,58,.92),rgba(8,14,24,.92));
  display:flex;flex-direction:column;gap:2px}
.mcard:hover{transform:translateY(-2px);border-color:#FFD24D}
.mcard.on{border-color:#FFD24D;box-shadow:0 0 0 2px rgba(255,210,77,.26);
  background:linear-gradient(140deg,rgba(58,44,14,.94),rgba(20,14,4,.94))}
.mcard .em{position:absolute;right:8px;top:6px;font-size:34px;opacity:.28}
.mcard b{font-family:var(--pop);font-size:15px;color:#FFE9B5}
.mcard i{font-style:normal;font-size:10px;letter-spacing:.12em;color:#8FA9C4}


/* ══════════════════════════════════════════════════════════════
   KR SKIN — 모두의마블「내아이템」画面の実測トレース
   採寸元: ゲーム帯 1301×742px（16:9）／左上(0%,0%)〜右下(100%,100%)
   1c-meta.html の <style> の一番最後に貼る（既存の暖色トークンより後勝ち）
   ══════════════════════════════════════════════════════════════ */
:root{
  /* ── 背景（縦グラデ・実測サンプル） ─────────────────── */
  --kr-bg1:#B9B8F7;  --kr-bg2:#B7B2F1;  --kr-bg3:#A19BD7;
  --kr-bg4:#8280B6;  --kr-bg5:#52527B;  --kr-bg6:#474772;
  --kr-bg7:#353960;
  --kr-vignette:#7C86C4;              /* 左右端の落ち込み */
  --kr-avg:#8E84AA;                   /* 画面平均色 */

  /* ── 面（パネル・ボタン） ───────────────────────────── */
  --kr-panel:#4C4D79;                 /* 右パネルの地（暗紫の半透明） */
  --kr-panel-top:#6F6692;
  --kr-rail:#A79EE8;                  /* 左レールの地（明るい藤） */
  --kr-rail-line:#8880BC;             /* レールの縁ハイライト */
  --kr-btn:#A290B8;                   /* ボタン面 */
  --kr-btn-hi:#CFC4DE;                /* ボタン上端ハイライト */
  --kr-btn-line:#5B4E74;              /* ボタン縁 */
  --kr-pill:#7F7EB2;                  /* 通貨カプセルの地 */
  --kr-pill-line:#4E4B77;
  --kr-slot:#23233F;                  /* 1154/1200 の暗い窪み */

  /* ── 紫の主役色（カード枠・星） ─────────────────────── */
  --kr-vio-hi:#9B2BE8;   --kr-vio:#7514C0;   --kr-vio-dk:#3C0854;
  --kr-vio-glow:#E4D0FC;
  --kr-star1:#C9A6F5;  --kr-star2:#7B3FD4;  --kr-star3:#4A1090;

  /* ── アクセント ─────────────────────────────────────── */
  --kr-sel:#A6E85C;      /* 選択中カードの黄緑枠 */
  --kr-gold:#EEEE7A;     /* 1154 の数字 */
  --kr-cream:#EBD9B2;    /* 戻る「＜」 */
  --kr-red:#D9331F;      /* NEW / 赤丸バッジ */
  --kr-cyan:#DDF5FE;     /* ダイヤ */
  --kr-coin:#F2E98C;     /* 金貨 */
  --kr-blue:#69A0E5;     /* 青い石カプセル */
  --kr-magenta:#BA83D0;  /* 星カプセル */
  --kr-ink:#F2F1FC;      /* 白文字 */
  --kr-ink-sh:#3A3660;   /* 白文字の縁取り */
  --kr-name:rgba(14,12,28,.62); /* カード名の暗帯 */
}

/* ══════ 画面の器 ══════ */
#cards.meta.kr{background:
   radial-gradient(120% 62% at 50% 0%, rgba(255,255,255,.20), transparent 60%),
   linear-gradient(90deg, var(--kr-vignette) 0%, transparent 9%, transparent 91%, var(--kr-vignette) 100%),
   linear-gradient(180deg,
     var(--kr-bg1) 0%,  var(--kr-bg2) 22%, var(--kr-bg3) 38%,
     var(--kr-bg4) 49%, var(--kr-bg5) 59%, var(--kr-bg6) 76%, var(--kr-bg7) 100%)}
#cards.kr::before{display:none}
#cards.kr .rail,#cards.kr .tabs,#cards.kr .wallet{display:none}

.kr-wrap{position:absolute;inset:0;display:grid;
  grid-template-columns:9.4% 1fr 31.7%;   /* 実測 122px / 767px / 412px */
  grid-template-rows:8.4% minmax(0,1fr);  /* 上部バー 62px。行が中身で伸びないようにする */
  font-family:var(--pop),system-ui,sans-serif}

/* ══════ B. 上部バー ══════ */
.kr-top{grid-column:1/4;grid-row:1;display:flex;align-items:center;padding:0 0 0 1.6%}
.kr-back{font-size:26.1px;line-height:1;color:var(--kr-cream);cursor:pointer;
  text-shadow:0 2.25px 2.7px rgba(30,20,50,.45);padding:0 5.4px}
.kr-title{font-size:30.6px;color:var(--kr-ink);letter-spacing:.02em;margin-left:1.6%;
  -webkit-text-stroke:4.95px var(--kr-ink-sh);paint-order:stroke fill;
  text-shadow:0 2.7px 4.5px rgba(40,30,70,.5)}
.kr-cur{margin-left:auto;display:flex;align-items:center;gap:15.3px}
.kr-pill{position:relative;display:flex;align-items:center;height:49.5px;padding:0 14.4px 0 39.6px;
  border-radius:999px;background:var(--kr-pill);border:1.98px solid var(--kr-pill-line);
  box-shadow:inset 0 2.7px 4.5px rgba(255,255,255,.18), 0 2.25px 3.6px rgba(20,14,40,.3)}
.kr-pill.blue{background:linear-gradient(90deg,var(--kr-blue) 0%,var(--kr-blue) 62%,var(--kr-pill) 100%)}
.kr-pill.star{background:linear-gradient(90deg,var(--kr-magenta) 0%,var(--kr-magenta) 58%,var(--kr-pill) 100%)}
.kr-pill b{font-size:20.7px;color:#FFFFFF;font-variant-numeric:tabular-nums;
  -webkit-text-stroke:3.6px rgba(38,28,66,.75);paint-order:stroke fill}
.kr-pill .ic{position:absolute;left:-5.4px;top:50%;transform:translateY(-50%);
  font-size:30.6px;line-height:1;filter:drop-shadow(0 2.25px 2.7px rgba(20,14,40,.45))}
.kr-sys{display:flex;align-items:center;gap:12.6px;margin-left:12.6px;padding-right:.4%}
.kr-sys i{position:relative;font-style:normal;font-size:28.8px;line-height:1;color:#F0F1F8;cursor:pointer;
  filter:drop-shadow(0 2.7px 3.15px rgba(20,14,40,.5))}
.kr-sys i em{position:absolute;right:-3.6px;top:-3.6px;width:15.3px;height:15.3px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#FF7A63,var(--kr-red));
  border:1.8px solid #6B1005}

/* ══════ C. 左の縦カラム ══════ */
.kr-left{grid-column:1;grid-row:2;padding:5.4px 0 10.8px .6%;display:flex;flex-direction:column;gap:9.9px;
  min-height:0;overflow-y:auto;scrollbar-width:thin}
.kr-lhd{font-size:18px;color:#FFFFFF;-webkit-text-stroke:3.6px rgba(46,36,80,.8);paint-order:stroke fill;
  margin:0 0 1.8px 2.7px;white-space:nowrap}
.kr-lhd em{font-style:normal;color:#DEA0FA;-webkit-text-stroke:3.6px #6A2A9E;margin-right:4.5px}
.kr-lgroup{position:relative;border-radius:14.4px;padding:8.1px 7.2px;display:flex;flex-direction:column;
  gap:10.8px;background:linear-gradient(180deg,rgba(190,185,250,.42),rgba(150,142,225,.26));
  border:1.8px solid rgba(206,200,255,.5)}
.kr-lgroup .kr-next{position:absolute;right:-13.5px;top:50%;transform:translateY(-50%);
  border-style:solid;border-width:11.7px 0 11.7px 13.5px;
  border-color:transparent transparent transparent #FFFFFF;
  filter:drop-shadow(0 0 7.2px rgba(255,255,255,.75))}
.kr-thumb{position:relative;aspect-ratio:88/74;border-radius:9.9px;overflow:hidden;cursor:pointer;
  border:3.15px solid #6C3FB8;background:#2C1E52;
  box-shadow:0 3.6px 6.3px rgba(24,14,48,.45), inset 0 0 0 1.8px rgba(214,190,255,.5)}
.kr-thumb.gold{border-color:#C9A03A;background:#7A5F18;
  box-shadow:0 3.6px 6.3px rgba(24,14,48,.45), inset 0 0 0 1.8px rgba(255,232,160,.6)}
.kr-thumb.on{border-color:#C9A6F5;box-shadow:0 0 0 3.15px rgba(255,255,255,.85),0 4.5px 9px rgba(24,14,48,.5)}
.kr-thumb canvas{display:block;width:100%;height:100%}
.kr-thumb .rr{position:absolute;left:1.8px;top:0.9px;font-size:13.5px;color:#E8A8FF;
  -webkit-text-stroke:3.15px #FFFFFF;paint-order:stroke fill}
.kr-thumb .lv{position:absolute;right:2.7px;top:0.9px;font-size:14.4px;color:#FFE9A8;
  -webkit-text-stroke:3.15px #4A2A05;paint-order:stroke fill}
.kr-thumb .pl{position:absolute;left:2.7px;bottom:0.9px;font-size:12.6px;color:#FFFFFF;
  -webkit-text-stroke:2.7px #3A2A05;paint-order:stroke fill}

/* ══════ D. 中央の大きなカード ══════ */
/* ステータスを左、カードを右に並べる。縦積みだと画面から落ちる */
.kr-stage{grid-column:2;grid-row:2;position:relative;display:flex;flex-direction:row;
  align-items:center;justify-content:center;gap:2.5%;padding:7.2px 1.4%;min-height:0;overflow:hidden}
.kr-card{position:relative;flex:0 0 auto;height:68%;aspect-ratio:350/463;  /* 実測 350×463px */
  border-radius:19.8px;padding:8.1px 8.1px 18.9px;                /* 下枠だけ厚い＝台座 */
  background:linear-gradient(180deg,var(--kr-vio-hi),var(--kr-vio) 45%,#5D0FA0 100%);
  box-shadow:0 0 0 3.15px var(--kr-vio-dk), 0 0 49.5px 12.6px rgba(228,208,252,.55),
             0 14.4px 27px rgba(24,10,48,.55)}
.kr-card::before{content:"";position:absolute;inset:3.15px;border-radius:17.1px;
  border:1.98px solid rgba(238,214,255,.55);pointer-events:none}
.kr-card .art{position:relative;width:100%;height:100%;border-radius:12.6px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 16%,#3C5C86,#141034)}
.kr-card .art canvas{display:block;width:100%;height:100%}
.kr-card .nameband{position:absolute;left:0;right:0;top:0;height:11%;
  display:flex;align-items:center;justify-content:flex-end;padding:0 4%;
  background:linear-gradient(180deg,rgba(10,8,24,.72),rgba(10,8,24,.45))}
.kr-card .nameband b{font-size:25.2px;color:#FFFFFF;
  -webkit-text-stroke:4.5px rgba(16,10,32,.9);paint-order:stroke fill}
.kr-card .rank{position:absolute;left:1.5%;top:.4%;font-size:50.4px;line-height:1;z-index:2;
  color:#9A3FD6;-webkit-text-stroke:6.75px #F0DBFF;paint-order:stroke fill;
  filter:drop-shadow(0 3.15px 0 #3C0854)}
/* 右に縦並びの操作ボタン（実測 x=39.4〜44.7%／上から y=22%,39%,56%） */
.kr-card .side{position:absolute;right:3.5%;top:19%;display:flex;flex-direction:column;gap:12.6px;z-index:2}
.kr-card .side b{width:57.6px;height:57.6px;border-radius:9px;display:grid;place-items:center;
  font-size:30.6px;cursor:pointer;
  background:linear-gradient(160deg,#FFF0C0,#E0662C 45%,#8A1414);
  border:2.7px solid #FFE6A8;box-shadow:0 3.6px 7.2px rgba(20,10,40,.5)}
.kr-card .side b.lock{background:linear-gradient(160deg,#FFD2C8,#D3211C 48%,#6B0A12)}
.kr-card .side b.gem{background:linear-gradient(160deg,#FFF8D8,#E9B03A 42%,#7A4A08)}
/* 下の大きな紫の星（実測 121×131px・カード右下を跨いで置く） */
.kr-star{position:absolute;right:-3%;bottom:-4%;width:34%;aspect-ratio:1;z-index:3;
  display:grid;place-items:center;font-size:108px;line-height:1;color:var(--kr-star2);
  -webkit-text-stroke:7.2px var(--kr-star3);paint-order:stroke fill;
  filter:drop-shadow(0 0 18px rgba(160,100,240,.85)) drop-shadow(0 5.4px 5.4px rgba(20,8,40,.6))}
/* カードの周りのイベント飾り（バレンタイン演出の位置に合わせた） */
.kr-deco{position:absolute;inset:0;pointer-events:none;z-index:1;font-size:37.8px;line-height:1}
.kr-deco span{position:absolute;filter:drop-shadow(0 3.6px 5.4px rgba(20,10,40,.45))}

/* カード下の3つのUI */
.kr-cardbar{position:static;flex:0 1 36%;max-width:340px;
  display:flex;flex-direction:column;align-items:stretch;gap:5.4px;
  max-height:92%;overflow:auto}
.kr-drop{flex:1;display:flex;align-items:center;gap:10.8px;height:58.5px;padding:0 12.6px;
  border-radius:9px;cursor:pointer;
  background:linear-gradient(180deg,var(--kr-btn-hi),var(--kr-btn));
  border:2.16px solid var(--kr-btn-line);box-shadow:0 2.7px 4.5px rgba(20,14,40,.35)}
.kr-drop .no{min-width:41.4px;text-align:center;padding:3.6px 0;border-radius:6.3px;font-size:18.9px;
  color:#F4F1FF;background:rgba(88,74,124,.55);border:1.8px solid rgba(240,235,255,.45)}
.kr-drop .nm{flex:1;font-size:21.6px;color:#FFFFFF;
  -webkit-text-stroke:3.6px rgba(52,42,86,.8);paint-order:stroke fill}
.kr-drop .ar{color:#8E9BE8;font-size:16.2px}
.kr-chip{display:flex;align-items:center;gap:7.2px;height:58.5px;padding:0 14.4px;border-radius:9px;
  cursor:pointer;background:linear-gradient(180deg,var(--kr-btn-hi),var(--kr-btn));
  border:2.16px solid var(--kr-btn-line);box-shadow:0 2.7px 4.5px rgba(20,14,40,.35)}
.kr-chip .ic{font-size:23.4px;line-height:1}
.kr-chip b{font-size:20.7px;color:#FFFFFF;-webkit-text-stroke:3.6px rgba(52,42,86,.8);paint-order:stroke fill}

/* ※ この .kr-* ブロックの寸法は元は vh（実画面の高さ基準）だった。
   ステージは 1600×900 固定を丸ごと拡大縮小する作りなので、vh を使うと
   端末の高さでステージ内の部品だけ勝手に伸び縮みする。
   実測: カード1枚の高さが PC(900px)で124px、iPhone横(390px)では40px と3.1倍ずれ、
   iPhoneでは指で押せない大きさになっていた。1vh=9px（900pxの1%）に固定した。 */
/* ══════ E. 右のカードグリッド ══════ */
.kr-right{grid-column:3;grid-row:2;display:flex;flex-direction:column;gap:8.1px;min-height:0;
  padding:8.1px 0 10.8px 8.1px;background:rgba(28,20,58,.30)}
.kr-tabs{display:flex;gap:2.7px}
.kr-tabs .tb{position:relative;flex:1;height:68.4px;display:grid;place-items:center;font-size:27px;
  border-radius:8.1px 8.1px 0 0;cursor:pointer;
  background:linear-gradient(180deg,rgba(120,110,180,.55),rgba(70,62,116,.55));
  border:1.8px solid rgba(190,182,244,.35);border-bottom:none;color:#EDEAFB}
.kr-tabs .tb.on{background:linear-gradient(180deg,#CFC8FA,#9C93E4);color:#2E2758}
.kr-tabs .tb.sort{flex:.85;background:linear-gradient(180deg,#EDEAFB,#B9B3E8);color:#3A3468}
.kr-tabs .tb .new{position:absolute;left:50%;top:-13.5px;transform:translateX(-50%);
  font-size:12.6px;font-weight:900;letter-spacing:.02em;padding:0.9px 6.3px;border-radius:4.5px;
  background:linear-gradient(180deg,#FFF3C0,#F3D24A);color:#B02010;border:1.8px solid #8A1408}
.kr-checks{display:flex;align-items:center;gap:14.4px;padding:3.6px 5.4px}
.kr-checks label{display:flex;align-items:center;gap:6.3px;font-size:20.7px;color:#EFEBFF;cursor:pointer;
  -webkit-text-stroke:3.6px rgba(38,30,70,.7);paint-order:stroke fill}
.kr-checks i{width:23.4px;height:23.4px;border-radius:4.5px;display:grid;place-items:center;
  font-style:normal;font-size:18px;color:#2E2758;
  background:rgba(60,52,104,.5);border:2.16px solid rgba(216,210,255,.6)}
.kr-checks input{display:none}
.kr-checks input:checked + i{background:linear-gradient(180deg,#D6CEFF,#A79BEE)}

.kr-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:1.6% .81%;
  grid-auto-rows:149.4px;align-content:start;overflow-y:auto;padding-right:1.8px;scrollbar-width:thin}
.kr-mini{position:relative;height:100%;border-radius:7.2px;overflow:hidden;cursor:pointer;
  border:3.06px solid #8A3FC8;background:#241A44;
  box-shadow:0 0 0 1.8px #2B0E4F, 0 2.7px 5.4px rgba(18,10,40,.45)}
.kr-mini canvas{display:block;width:100%;height:100%}
.kr-mini.on{border-color:var(--kr-sel);box-shadow:0 0 0 1.8px #2F5A0E,0 0 12.6px rgba(166,232,92,.6)}
.kr-mini.locked{filter:grayscale(1) brightness(.42)}
.kr-mini .nb{position:absolute;left:0;right:0;top:0;height:14.5%;display:flex;align-items:center;
  justify-content:flex-end;padding:0 4.5px;background:var(--kr-name)}
.kr-mini .nb span{font-size:13.5px;color:#FFFFFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  -webkit-text-stroke:2.88px rgba(12,8,26,.85);paint-order:stroke fill}
.kr-mini .rr{position:absolute;left:-1.8px;top:-3.6px;font-size:20.7px;line-height:1;color:#B349E8;
  -webkit-text-stroke:4.05px #F3E4FF;paint-order:stroke fill}
.kr-mini .st{position:absolute;right:1.8px;bottom:1.8px;font-size:30.6px;line-height:1;color:var(--kr-star2);
  -webkit-text-stroke:4.05px var(--kr-star3);paint-order:stroke fill;
  filter:drop-shadow(0 0 7.2px rgba(150,90,235,.8))}
.kr-mini .eq{position:absolute;left:1.8px;bottom:1.8px;font-size:12.6px;padding:0.9px 5.4px;border-radius:4.5px;
  background:linear-gradient(180deg,#FFF3C0,#F3D24A);color:#8A1408;border:1.8px solid #8A1408}

.kr-foot{display:flex;align-items:center;gap:8.1px;padding-right:5.4px}
.kr-foot .b{flex:1;height:55.8px;border-radius:8.1px;display:grid;place-items:center;font-size:20.7px;
  cursor:pointer;color:#FFFFFF;-webkit-text-stroke:3.6px rgba(52,42,86,.8);paint-order:stroke fill;
  background:linear-gradient(180deg,var(--kr-btn-hi),var(--kr-btn));
  border:2.16px solid var(--kr-btn-line);box-shadow:0 2.7px 4.5px rgba(20,14,40,.35)}
.kr-foot .cnt{display:flex;align-items:center;gap:2.7px;height:55.8px;padding:0 9px;border-radius:8.1px;
  background:var(--kr-slot);border:2.16px solid #14142A;font-variant-numeric:tabular-nums}
.kr-foot .cnt em{font-style:normal;font-size:21.6px;color:var(--kr-gold)}
.kr-foot .cnt span{font-size:18px;color:#B9B4D8}
.kr-foot .add{width:48.6px;height:55.8px;border-radius:8.1px;display:grid;place-items:center;font-size:27px;
  color:#2E5B12;background:linear-gradient(180deg,#D7F7A4,#7FCB3A);border:2.16px solid #3E7A14;
  cursor:pointer}

/* 縦長のときだけ左右を少し太らせる（本家も端末比で可変） */
@media (max-aspect-ratio:13/9){
  .kr-wrap{grid-template-columns:11% 1fr 34%}
  .kr-card{width:58%}
}


/* カード詳細の7ステータス（本家のカード画面はここが主役） */
.kr-stats{margin:6px 0 4px;padding:7px 10px;border-radius:10px;background:rgba(20,16,40,.55);
  border:1px solid rgba(190,170,255,.28)}
.kr-stats .strow{margin:1px 0}
.kr-skill{font-size:11.5px;line-height:1.45;color:#E6DEFF;padding:6px 10px;border-radius:10px;
  background:rgba(20,16,40,.5);border-left:3px solid var(--kr-star1,#C9A6F5)}
.kr-skill b{display:block;color:#FFE9B5;font-size:12.5px}
.kr-chiprow{display:flex;gap:8px;margin-top:6px}


/* ══════════════════════════════════════════════════════════════
   本家トレース — ホーム／待機部屋
   採寸元: 実画面のゲーム帯 2340×1320px を 0%,0%〜100%,100% として実測。
   1600×900 の固定ステージに % で置き直している（カード画面 .kr-* は対象外）。
   ══════════════════════════════════════════════════════════════ */
:root{
  --lz:#5C4939; --lz-hi:#6E5746; --lz-dk:#4B3626; --lz-dk2:#3A2A1E;
  --pf1:#D4D0CC; --pf2:#B4AAA5; --pf3:#8E837B;
  --pc1:#F3F0DE; --pc2:#E4E1CE; --pc3:#CFCCBA;
  --barf:#56381D; --barhi:#A57954; --barline:#2A1300;
  --gld:#E0B95C; --gld2:#9A7326;
}

/* ── 地：革／木のパネル ───────────────────────────── */
#home.meta{background:
  radial-gradient(138% 104% at 50% 40%, #6E5843 0%, #5F4B3A 34%, var(--lz) 52%,
                  var(--lz-dk) 84%, #33251A 100%)}
#home.meta::before{opacity:1;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 1px,rgba(0,0,0,.045) 1px 3px,transparent 3px 8px),
  repeating-linear-gradient(0deg,rgba(0,0,0,.055) 0 1px,transparent 1px 6px)}
.dk-stitch{position:absolute;top:0;bottom:9%;width:0;z-index:1;
  border-left:2px dashed rgba(255,226,190,.13)}
.dk-seam{position:absolute;left:55.3%;width:2.4%;top:0;bottom:9%;z-index:1;
  background:linear-gradient(90deg,rgba(0,0,0,.46) 0%,rgba(0,0,0,.3) 32%,
    rgba(170,124,88,.5) 62%,rgba(120,84,56,.22) 78%,rgba(0,0,0,.2) 100%)}

/* ── 左端の縦タブ「メニュー」（0〜4.4% / 37.5〜53%） ── */
.dk-menutab{position:absolute;left:0;top:37.5%;width:4.4%;height:15.5%;z-index:12;cursor:pointer;
  border-radius:0 12px 12px 0;border:3px solid #50280D;border-left:none;
  background:linear-gradient(180deg,#C57B2B 0%,#B36F28 28%,#A85F19 62%,#8E4E12 100%);
  box-shadow:inset 0 2px 0 rgba(255,220,170,.4),3px 4px 10px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;gap:3px}
.dk-menutab span{writing-mode:vertical-rl;font-family:var(--pop);font-size:17px;letter-spacing:.14em;
  color:#FFF0D8;-webkit-text-stroke:3px #7A3E08;paint-order:stroke fill}
.dk-menutab em{font-style:normal;font-size:15px;color:#FFE7BE;text-shadow:0 2px 0 #7A3E08}
.dk-menutab:hover{filter:brightness(1.08)}
.dk-menu{position:absolute;left:4.6%;top:26%;width:15%;z-index:14;display:none;
  flex-direction:column;gap:4px;padding:7px;border-radius:12px;
  background:linear-gradient(180deg,rgba(52,36,16,.97),rgba(26,17,7,.97));
  border:3px solid var(--gld);box-shadow:0 12px 30px rgba(0,0,0,.6)}
.dk-menu.on{display:flex}
.dk-menu .rb{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:9px;cursor:pointer;
  background:linear-gradient(#5A4220,#33230C);border:2px solid #7A5A2C;transition:.12s}
.dk-menu .rb:hover{border-color:#FFD24D;transform:translateX(3px)}
.dk-menu .rb .ic{font-size:18px}
.dk-menu .rb .tx{font-size:12.5px;font-weight:900;color:#F0DCA8}
.dk-menu .rb .n{margin-left:auto;width:17px;height:17px;line-height:17px;text-align:center;
  border-radius:50%;background:#D8467E;color:#fff;font-size:11px;font-weight:900}

/* ── 左上「FREE!! 招待でアイテムゲット！」 ─────────── */
.dk-free{position:absolute;left:5.3%;top:1.2%;z-index:6;display:flex;align-items:center;gap:7px}
.dk-free .gi{font-size:26px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.dk-free .t1{font-family:var(--pop);font-size:19px;color:#FF4536;
  -webkit-text-stroke:4px #FFF3D0;paint-order:stroke fill}
.dk-free .t2{font-family:var(--pop);font-size:15px;color:#FFE9A8;
  -webkit-text-stroke:3.5px #6A3406;paint-order:stroke fill}

/* ── 中央の羊皮紙パネル（5.55〜50.9% / 10.45〜69.5%） ── */
.dk-panel{position:absolute;left:5.55%;width:45.35%;top:10.45%;height:59.05%;z-index:4;
  border-radius:14px;padding:8px;
  background:linear-gradient(180deg,#E2DEDA 0%,var(--pf1) 10%,var(--pf2) 52%,#9B918A 100%);
  box-shadow:0 14px 34px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.6),
             inset 0 -3px 0 rgba(0,0,0,.22)}
.dk-panel .rail2{position:absolute;left:2.2%;right:2.2%;top:9px;height:9.5%;border-radius:7px;
  background:linear-gradient(180deg,#CFCAC5,#ADA49C);box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.dk-panel .pin{position:absolute;left:2.2%;right:2.2%;top:11.8%;bottom:1.3%;border-radius:9px;
  background:linear-gradient(180deg,#F6F3E4 0%,var(--pc1) 22%,var(--pc2) 74%,var(--pc3) 100%);
  border:1px solid #B9B4A2;box-shadow:inset 0 2px 5px rgba(120,110,80,.2)}
