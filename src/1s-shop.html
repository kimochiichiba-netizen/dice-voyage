<style>
/* ══════════════════════════════════════════════════════════════
   ダイスキングダム — ショップ・ミッション・出席簿（1s-shop.html / WP8）
   ・セレクタは #shop / #quest / #daily と .dks- だけ。
   ・動かすのは transform と opacity だけ。入場の 0% で opacity を下げない。
   ・1600×900 の実寸。横長スマホ（高さ560px未満）は最後の @media で文字と当たり判定を上げる。
   ══════════════════════════════════════════════════════════════ */

/* ══════════ 共通の小物 ══════════ */
.dks-ci{display:inline-block;width:.92em;height:.92em;vertical-align:-.12em;margin-right:.2em;flex:0 0 auto}
.dks-scr .dkbtn.dks-b{overflow:visible;display:inline-flex;align-items:center;justify-content:center;gap:.25em}
.dkbtn.dks-b::after{content:none;animation:none}
.dks-b .dks-sh{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.dks-b .dks-sh::after{content:"";position:absolute;top:0;bottom:0;width:38%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.5),transparent);
  transform:translateX(-160%)}
.dks-b:disabled .dks-sh,.dks-b.short .dks-sh,.dks-b.dim .dks-sh{display:none}
.dks-b.short{filter:saturate(.45) brightness(.86)}
.dks-b.dim{filter:saturate(.5) brightness(.82)}
.dkbtn.dks-wood{background:linear-gradient(180deg,#8A6A34 0 8%,#5A421C 40%,#3A2A10);border:3px solid #241604;color:#F7E7C4}
.dks-stamp{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;flex:0 0 auto;
  font-family:var(--pop);font-size:30px;font-style:normal;line-height:1;color:#D0302A;
  border:4px solid #D0302A;transform:rotate(-14deg);
  background:radial-gradient(circle,rgba(255,236,226,.6),rgba(255,236,226,.12) 72%);
  box-shadow:inset 0 0 0 3px rgba(255,240,230,.45),0 0 0 2px rgba(208,48,42,.22)}
.dks-stamp.new{animation:fxStamp 420ms cubic-bezier(.16,1,.3,1) both}
#daily .dks-day > .dks-today{position:absolute}
#daily .dks-day > .dks-stamp,#quest .dks-chestbox > .dks-stamp{background:radial-gradient(circle,rgba(255,236,226,.34),rgba(255,236,226,.06) 72%)}
#shop .dks-good.lim .pic{background-position:0 50%}
#shop .pic.saura{box-shadow:inset 0 0 34px 6px rgba(176,124,232,.75),inset 0 0 0 2px rgba(232,210,255,.6)}
#shop .pic.art.fan{background:radial-gradient(circle at 50% 44%,rgba(255,214,120,.34),transparent 56%),radial-gradient(circle at 50% 60%,#1E3A6E,#0A1430 80%)}
.dks-a.dks-a-fan{width:var(--s,64px);height:calc(var(--s,64px) * 1.1)}
#shop .dks-good .pic .dks-a.dks-a-fan{--s:170px}
/* むりょう：たまり具合・届くまでの日数・掘る前の岩 */
#shop .dks-meter{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;
  background:linear-gradient(180deg,rgba(0,0,0,.38),rgba(0,0,0,.16));border:1px solid rgba(196,150,70,.35)}
#shop .dks-meter .lb{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:900;color:#E6D4AE}
#shop .dks-meter .lb > b{font-family:var(--pop);font-weight:400;font-size:20px;color:#FFE9B5}
#shop .dks-meter .dkbar{height:22px}
#shop .dks-meter .dkbar i{overflow:hidden}
#shop .dks-pips{display:flex;gap:6px}
#shop .dks-pips > i{flex:1;height:20px;border-radius:10px;background:linear-gradient(180deg,#2A2118,#453A2E);box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
#shop .dks-pips > i.on{background:linear-gradient(180deg,#FFEDB0,#F2C230 55%,#C08A0E);box-shadow:0 0 8px rgba(255,200,80,.5)}
#shop .dks-rock.lock{filter:brightness(.55) grayscale(.4)}
#shop .dks-rock.lock > b{font-size:30px}
/* 両替所：ダイヤの使い道・今日の回数 */
#shop .dks-exuse{margin-top:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;
  background:rgba(120,86,34,.12);border:2px dashed rgba(140,106,54,.45)}
#shop .dks-exuse > span{font-size:18px;font-weight:900;color:#6E5A34}
#shop .dks-exuse > b{font-size:18px;font-weight:900;color:#5A3A0C;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.6);border:2px solid #C9A961}
#shop .dks-exinfo{display:flex;flex-direction:column;gap:6px;padding:10px 14px;border-radius:12px;
  background:rgba(255,255,255,.45);border:2px solid rgba(169,118,26,.4)}
#shop .dks-exinfo > div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:18px;font-weight:900;color:#6E5A34}
#shop .dks-exinfo > div > b{font-family:var(--pop);font-weight:400;font-size:22px;color:#8A2A1A}
/* 行商人の水晶玉 */
#shop .dks-orb{position:absolute;left:50%;top:410px;width:124px;height:124px;margin-left:-62px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#fff 0 6%,#F8D8F4 14%,#C86AC0 45%,#4A1244 78%,#240820);
  box-shadow:0 0 40px 10px rgba(230,120,210,.42),inset 0 -10px 20px rgba(0,0,0,.4)}
#shop .dks-orb > b{position:absolute;inset:12%;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 58%,rgba(255,255,255,.4) 70%,transparent 82%);animation:fxSpin 5s linear infinite}
#shop .dks-orbst{position:absolute;left:50%;top:548px;width:96px;height:30px;margin-left:-48px;border-radius:50% 50% 12px 12px;
  background:linear-gradient(180deg,#E0AE3A,#6B4408);box-shadow:0 6px 10px rgba(0,0,0,.5)}
.dks-a-fan > b{left:26%;top:6%;width:48%;height:80%;border-radius:10%;transform-origin:50% 100%;
  border:calc(var(--s,64px) * .03) solid #E0AE3A;box-shadow:0 5px 12px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,240,190,.3);
  background:radial-gradient(circle at 50% 50%,#FFE9A8 0 9%,transparent 10%),
             repeating-conic-gradient(from 0deg at 50% 50%,#23447E 0 15deg,#16305C 15deg 30deg)}
.dks-a-fan > b:nth-child(1){transform:rotate(-20deg) translateX(-8%)}
.dks-a-fan > b:nth-child(2){transform:rotate(0)}
.dks-a-fan > b:nth-child(3){transform:rotate(20deg) translateX(8%)}
.dks-a-fan > b::after{content:"";position:absolute;inset:30% 22%;
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  background:linear-gradient(180deg,#FFF3C8,#E0AE3A)}
#shop .dks-good .pic .dks-a-fan{--s:170px}
#quest .dks-q .rw{width:172px;justify-content:flex-end}
.dks-dot{position:absolute;right:-6px;top:-6px;z-index:5;width:22px;height:22px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#FF9A8E,#E8302A 55%,#9A1410);border:3px solid #FFF1D0;
  box-shadow:0 2px 4px rgba(0,0,0,.5)}
.dks-dot.big{width:32px;height:32px;right:-10px;top:-10px}
.dks-cd{font-family:var(--pop);font-variant-numeric:tabular-nums}
.dks-gl{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:2}
.dks-gl::after{content:"";position:absolute;top:-10%;bottom:-10%;width:30%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
  transform:translateX(-160%) skewX(-18deg)}
/* リボン見出し（赤・金・青） */
.dks-rib{position:relative;display:inline-flex;align-items:center;justify-content:center;height:50px;padding:0 44px;
  background:linear-gradient(180deg,#F0604A 0 10%,#C9302C 46%,#8E1410);
  clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%)}
.dks-rib::before{content:"";position:absolute;left:5%;right:5%;top:5px;height:2px;background:rgba(255,240,200,.55)}
.dks-rib > b{position:relative;font-family:var(--pop);font-size:25px;line-height:1;color:#FFF6E2;white-space:nowrap;
  -webkit-text-stroke:4px #5A1206;paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.dks-rib.gold{background:linear-gradient(180deg,#FFF3C8 0 10%,#F2C230 46%,#A9761A)}
.dks-rib.gold > b{color:#fff;-webkit-text-stroke-color:#7A4A06}
.dks-rib.blue{background:linear-gradient(180deg,#8FD2FF 0 10%,#2E8BE0 46%,#0B2C5E)}
.dks-rib.blue > b{-webkit-text-stroke-color:#0B2C5E}
.dks-scr .fx-claim::after{z-index:3}

/* ══════════ CSS で描く絵（--s が大きさ） ══════════ */
.dks-a{display:inline-block;position:relative;width:var(--s,64px);height:var(--s,64px);flex:0 0 auto;vertical-align:middle}
.dks-a > b,.dks-a > s,.dks-a > em{position:absolute;display:block}
.dks-a-coin{border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#FFF9D8 0 9%,#FFD95A 34%,#D69A14 72%,#8A5E06);
  border:calc(var(--s,64px) * .05) solid #7A5206;
  box-shadow:inset 0 0 0 calc(var(--s,64px) * .07) rgba(255,236,160,.55),0 3px 6px rgba(0,0,0,.45)}
.dks-a-coin > b{left:24%;right:24%;top:30%;bottom:30%;background:#A06A08;
  clip-path:polygon(0 100%,0 18%,25% 55%,50% 0,75% 55%,100% 18%,100% 100%)}
.dks-a-gem{filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.dks-a-gem > b{left:4%;right:4%;top:8%;bottom:6%;clip-path:polygon(24% 0,76% 0,100% 36%,50% 100%,0 36%);
  background:linear-gradient(160deg,#F2FBFF 0 16%,#8FD8FF 40%,#2E8BE0 70%,#0B3C74)}
.dks-a-gem::after{content:"";position:absolute;left:4%;right:4%;top:8%;bottom:6%;
  clip-path:polygon(24% 0,50% 36%,76% 0,62% 0,50% 22%,38% 0);background:rgba(255,255,255,.6)}
.dks-a-pend::before{content:"";position:absolute;left:31%;right:31%;top:0;height:34%;
  border:calc(var(--s,64px) * .06) solid #E0AE3A;border-bottom:0;border-radius:50% 50% 0 0}
.dks-a-pend > b{left:13%;right:13%;top:22%;bottom:2%;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:linear-gradient(160deg,#FFF3C8,#C8952F 50%,#6B4408);filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.dks-a-pend > b::after{content:"";position:absolute;inset:13%;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:radial-gradient(circle at 38% 30%,#fff 0 9%,var(--c,#B07CE8) 46%,#1A0A20 115%)}
.dks-a-pend > em{left:0;right:0;top:44%;text-align:center;font-style:normal;font-weight:900;
  font-size:calc(var(--s,64px) * .3);line-height:1;color:#fff;-webkit-text-stroke:2px rgba(0,0,0,.45);paint-order:stroke fill}
.dks-a-die{transform:rotate(-9deg)}
.dks-a-die > b{inset:8%;border-radius:22%;
  background:radial-gradient(circle,#2A1604 0 56%,transparent 62%) 50% 50%/20% 20% no-repeat,
             radial-gradient(circle,#2A1604 0 56%,transparent 62%) 24% 24%/20% 20% no-repeat,
             radial-gradient(circle,#2A1604 0 56%,transparent 62%) 76% 24%/20% 20% no-repeat,
             radial-gradient(circle,#2A1604 0 56%,transparent 62%) 24% 76%/20% 20% no-repeat,
             radial-gradient(circle,#2A1604 0 56%,transparent 62%) 76% 76%/20% 20% no-repeat,
             linear-gradient(145deg,#FFFFFF,var(--c,#E8EEF6) 46%,#5A4420 135%);
  box-shadow:inset 0 -6px 10px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.7),0 6px 0 rgba(0,0,0,.35),0 10px 16px rgba(0,0,0,.4)}
.dks-a-die > s{left:18%;top:13%;width:30%;height:14%;border-radius:50%;background:rgba(255,255,255,.6)}
.dks-a-card{width:calc(var(--s,64px) * .74)}
.dks-a-card > b{inset:0;border-radius:12%;border:calc(var(--s,64px) * .045) solid #E0AE3A;
  background:radial-gradient(circle at 50% 50%,rgba(255,233,168,.35) 0 22%,transparent 23%),
             repeating-conic-gradient(from 0deg at 50% 50%,#1E3A6E 0 15deg,#142A52 15deg 30deg);
  box-shadow:0 4px 8px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,240,190,.35)}
.dks-a-card > b::after{content:"";position:absolute;inset:27%;
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  background:linear-gradient(180deg,#FFF3C8,#E0AE3A)}
.dks-a-pot > b{left:14%;right:14%;top:36%;bottom:4%;border-radius:40% 40% 46% 46% / 34% 34% 60% 60%;
  background:radial-gradient(circle at 36% 30%,#E8A95A,#9A5A1E 55%,#4A2808);box-shadow:inset 0 -8px 14px rgba(0,0,0,.4)}
.dks-a-pot::before{content:"";position:absolute;left:9%;right:9%;top:30%;height:13%;border-radius:50%;z-index:1;
  background:linear-gradient(180deg,#E0A64A,#6B3A0C);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.dks-a-pot::after{content:"";position:absolute;left:16%;right:16%;top:6%;height:32%;z-index:2;
  background:radial-gradient(ellipse at 28% 72%,#FFE27A 0 17%,#B8800E 18% 21%,transparent 22%),
             radial-gradient(ellipse at 56% 52%,#FFE89A 0 19%,#B8800E 20% 23%,transparent 24%),
             radial-gradient(ellipse at 78% 76%,#F2C230 0 16%,#A06A08 17% 20%,transparent 21%),
             radial-gradient(ellipse at 46% 94%,#E0AE3A 0 22%,transparent 23%)}
.dks-a-mine > b{left:3%;right:3%;top:38%;bottom:4%;border-radius:50% 50% 12% 12% / 72% 72% 12% 12%;
  background:radial-gradient(circle at 40% 30%,#7E6E5A,#4A3E30 60%,#2A2118);box-shadow:inset 0 -6px 10px rgba(0,0,0,.45)}
.dks-a-mine::before,.dks-a-mine::after{content:"";position:absolute;z-index:1;
  clip-path:polygon(50% 0,100% 30%,80% 100%,20% 100%,0 30%);
  background:linear-gradient(160deg,#EAF8FF,#6FC6F5 45%,#1E7FD0)}
.dks-a-mine::before{left:26%;top:12%;width:24%;height:42%}
.dks-a-mine::after{left:54%;top:24%;width:18%;height:32%;transform:rotate(16deg)}
.dks-a-map > b{inset:12% 5%;transform:rotate(-6deg);border-radius:6px;
  background:radial-gradient(circle at 72% 62%,rgba(160,110,50,.25),transparent 50%),linear-gradient(180deg,#F7EDD6,#DCC79E);
  box-shadow:0 5px 10px rgba(0,0,0,.5),inset 0 0 0 3px rgba(140,106,54,.4)}
.dks-a-map > b::before{content:"";position:absolute;left:14%;top:22%;width:56%;height:48%;
  border:3px dashed #8A5A2A;border-right-color:transparent;border-bottom-color:transparent;border-radius:60% 0 0 0}
.dks-a-map > b::after{content:"✕";position:absolute;right:12%;bottom:12%;font-weight:900;line-height:1;
  font-size:calc(var(--s,64px) * .28);color:#C9302C}
.dks-a-lantern{width:calc(var(--s,64px) * .7)}
.dks-a-lantern > b{left:0;right:0;top:18%;bottom:14%;border-radius:46%;
  background:repeating-linear-gradient(90deg,rgba(120,20,10,.25) 0 2px,transparent 2px 22%),
             radial-gradient(circle at 50% 45%,#FFF3C8,#FFB23A 42%,#D0401A 82%);
  box-shadow:0 0 18px 6px rgba(255,160,60,.5)}
.dks-a-lantern::before,.dks-a-lantern::after{content:"";position:absolute;left:24%;right:24%;height:12%;border-radius:3px;
  background:linear-gradient(180deg,#5A3A10,#2A1604)}
.dks-a-lantern::before{top:8%} .dks-a-lantern::after{bottom:4%}
.dks-cpic{position:relative;display:block;width:108px;height:140px;border-radius:12px;background:center 12%/cover no-repeat #120B04;
  border:4px solid #E0AE3A;box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 16px rgba(0,0,0,.5)}
.dks-cpic.rA{border-color:#6FB8F5} .dks-cpic.rS{border-color:#B07CE8}
.dks-cpic > b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--pop);font-size:60px;color:rgba(255,220,150,.4)}
.dks-rr{position:absolute;left:10px;top:10px;z-index:4;min-width:44px;height:36px;padding:0 8px;border-radius:10px;
  display:grid;place-items:center;font-family:var(--caps);font-size:22px;line-height:1;color:#FFD44A;
  -webkit-text-stroke:4px #3A2405;paint-order:stroke fill;background:linear-gradient(180deg,#2A1C08,#120B03);border:2px solid #C8952F}
.rS > .dks-rr{color:#E8D2FF} .rA > .dks-rr{color:#CFE8FF}
.dks-gift{position:relative;display:inline-block;width:30px;height:28px;flex:0 0 auto;border-radius:4px;border:2px solid #5A0A08;
  background:linear-gradient(90deg,transparent 42%,#FFD44A 42% 58%,transparent 58%),linear-gradient(180deg,#E8483A,#A8210F)}
.dks-gift::before{content:"";position:absolute;left:50%;top:-10px;width:18px;height:10px;margin-left:-9px;
  border:3px solid #FFD44A;border-bottom:0;border-radius:50% 50% 0 0}

/* ══════════ ショップ ══════════ */
#shop .dks-shop{position:absolute;left:0;right:0;top:100px;bottom:0;z-index:4}
#shop .dks-shop.is-ped::before{content:"";position:absolute;left:0;right:0;top:-100px;bottom:0;pointer-events:none;z-index:-1;
  background:radial-gradient(60% 55% at 28% 36%,rgba(170,60,150,.34),transparent 72%),linear-gradient(180deg,rgba(46,8,40,.5),rgba(18,4,14,.72))}
#shop .dks-left{position:absolute;left:0;top:0;bottom:0;width:412px}
#shop .dks-sign{position:absolute;left:22px;top:26px;width:366px;height:132px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(180deg,#6E5326,#3E2C11 52%,#271A07) padding-box,var(--fx-gold-metal) border-box;border:4px solid transparent;
  box-shadow:0 8px 0 rgba(0,0,0,.35),0 14px 26px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,220,150,.25);
  transform-origin:50% -30px;animation:dksSway 6s ease-in-out infinite}
@keyframes dksSway{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}
#shop .dks-sign > b{font-family:var(--pop);font-size:40px;line-height:1;letter-spacing:.14em;color:#FFD44A;
  -webkit-text-stroke:5px #2A1604;paint-order:stroke fill;text-shadow:0 3px 0 #8A5A08}
#shop .dks-sign > span{font-size:18px;font-weight:900;color:#F0DCA8;white-space:nowrap}
#shop .dks-sign .dks-cd{color:#FFF3C8;font-size:21px}
#shop .dks-chain{position:absolute;top:-30px;width:8px;height:30px;border-radius:3px;
  background:repeating-linear-gradient(180deg,#E0AE3A 0 6px,#6B4408 6px 8px)}
#shop .dks-chain.l{left:48px} #shop .dks-chain.r{right:48px}
#shop .dks-clerk{position:absolute;left:6px;bottom:0;width:400px;height:614px;background:left top/100% 100% no-repeat;
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.55))}
#shop .dks-clerk.noimg{background:radial-gradient(circle at 50% 30%,rgba(255,200,120,.25),transparent 60%)}
/* 店員の絵に焼き込まれた「本日のおすすめ」を本物の日替わりで覆う */
#shop .dks-pick{position:absolute;left:10px;top:352px;width:186px;height:262px;border-radius:12px 12px 0 0;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 8px 10px;text-align:center;
  background:linear-gradient(180deg,#3E2C12,#1A1004) padding-box,var(--fx-gold-metal) border-box;border:4px solid transparent;border-bottom:0;
  box-shadow:0 0 0 2px rgba(0,0,0,.45),0 8px 20px rgba(0,0,0,.6),inset 0 0 22px rgba(0,0,0,.55)}
#shop .dks-pick .hd{display:flex;align-items:center;gap:8px;height:46px;flex:0 0 auto}
#shop .dks-pick .hd > b{font-size:17px;line-height:1.1;font-weight:900;text-align:left;color:#FFE9B5;
  -webkit-text-stroke:3px #241604;paint-order:stroke fill}
#shop .dks-pick .pa{width:100%;height:78px;flex:0 0 auto}
#shop .dks-pick .pa .pic{position:relative;height:100%;border-radius:8px;background:center 30%/cover no-repeat #1A1004;
  border:2px solid #7A5A22;display:grid;place-items:center;overflow:hidden}
#shop .dks-pick .pa .pic .dks-a{--s:64px}
#shop .dks-pick .pa .dks-pb{font-size:18px;padding:0 6px;right:4px;bottom:4px;-webkit-text-stroke:3px #3A2405}
#shop .dks-pick .pn{font-size:17px;line-height:1.2;font-weight:900;color:#FFF0CE}

.dks-a-tk{height:calc(var(--s,64px) * .62);filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}

  background:radial-gradient(circle at 0 50%,transparent calc(var(--s,64px) * .1),var(--c,#F2C230) calc(var(--s,64px) * .1 + 1px)) left/51% 100% no-repeat,
             radial-gradient(circle at 100% 50%,transparent calc(var(--s,64px) * .1),var(--c,#F2C230) calc(var(--s,64px) * .1 + 1px)) right/51% 100% no-repeat}
.dks-a-tk > b::before{content:"";position:absolute;left:14%;right:14%;top:8%;height:30%;border-radius:6px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
