<style>
/* ══════════════════════════════════════════════════════════════
   ダイスキングダム — ホームまわりの見た目（1t-home.html / WP9）
   ──────────────────────────────────────────────────────────────
   ・担当セレクタ：#home #news #mail #friends .wallet #online #olroom 設定モーダル .dkh-
     （ほかに、社長の指示で「ステージの外の帯」#viewport の背景だけ）。
   ・動かすのは transform と opacity だけ。入場 keyframe の 0% で opacity を下げない。
   ・1600×900 のステージ座標。横長スマホ（高さ560px未満）では主要な文字 26px・本文 22px 以上。
   ══════════════════════════════════════════════════════════════ */
:root{
  --dkh-ink:#FFF6E2; --dkh-edge:#2A1604; --dkh-gold:#FFD44A;
  --dkh-wood:linear-gradient(180deg,#4E3818 0%,#2C1D09 55%,#1A1004 100%);
  --dkh-wood2:linear-gradient(180deg,#6E5326 0%,#3E2C11 52%,#271A07 100%);
  --dkh-lacq:linear-gradient(180deg,#8E1A14 0%,#5E0E0A 55%,#3A0806 100%);
  --dkh-rimA:linear-gradient(160deg,#E6F5FF 0%,#7CC2F5 32%,#1B5A9E 62%,#A8DCFF 86%,#2A6AB0 100%);
  --dkh-rimS:linear-gradient(160deg,#F6EAFF 0%,#C39AF0 32%,#5E2E9E 62%,#E0C8FF 86%,#6A3AA8 100%);
  --dkh-rimSS:linear-gradient(152deg,#FFF7DC 0%,#F0CE72 14%,#C8952F 30%,#7C5410 46%,#A8752A 58%,#F3D583 76%,#8A6314 90%,#FFF3C8 100%);
}

/* ══════════ ステージの外（19.5:9 のスマホで左右に出る帯）＝王宮の木目と金の粒 ══════════ */
html,body{background-color:#140C05}
#viewport{background:
  radial-gradient(1.6px 1.6px at 18% 22%,rgba(255,220,140,.75),transparent 70%) 0 0/89px 97px,
  radial-gradient(1.2px 1.2px at 64% 71%,rgba(255,236,180,.6),transparent 70%) 0 0/131px 113px,
  radial-gradient(2px 2px at 41% 48%,rgba(255,200,90,.5),transparent 70%) 0 0/173px 151px,
  radial-gradient(70% 90% at 50% 50%,rgba(255,176,70,.16),transparent 62%),
  repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 2px,rgba(255,220,160,.035) 2px 5px,transparent 5px 19px),
  repeating-linear-gradient(90deg,transparent 0 61px,rgba(0,0,0,.18) 61px 63px,transparent 63px 97px),
  linear-gradient(180deg,#2E1C0A 0%,#1A1005 48%,#0C0702 100%)}

/* ══════════════════════════════════════════════════════════════
   ホーム（本家ロビー：左右の縦のボタン・首から下げたカード・右にランキング）
   常時アニメは8個まで（背景の光2・ロゴ・カードの光輪・カードの揺れ・入場するの光と呼吸）。光の筋は dkhGlint が1本ずつ
   ══════════════════════════════════════════════════════════════ */
#home.dkh-home::before{content:""!important;position:absolute;inset:0;z-index:0;pointer-events:none;animation:none;opacity:.55;
  background:radial-gradient(64% 70% at 50% 44%,rgba(0,0,0,0) 40%,rgba(10,5,0,.55) 100%),
             linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 16%,rgba(0,0,0,0) 80%,rgba(0,0,0,.45))}
#home::after,#news::after,#mail::after,#friends::after{animation:none}
/* 行ごとのボタン・木のボタンの光の筋は止める（並ぶ数だけ無限のアニメが増えるため） */
.dkh-ingo::after,.dkh-take::after,.dkbtn.dkh-wood::after{animation:none}
#home.dkh-home > *{z-index:2}
#home.dkh-home > .fx-amb{z-index:1}
#home > .fx-amb > .fx-ray{display:none}
/* 光の筋（ふだんは左の外に隠れている。dkhGlint が el.animate で1本ずつ流す） */
.dkh-gl{position:absolute;top:-10%;bottom:-10%;left:0;width:30%;z-index:2;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-140%) skewX(-16deg)}

/* ── 上段 ── */
.dkh-top{position:absolute;left:0;right:0;top:0;height:100px;z-index:6;pointer-events:none}
.dkh-top > *{pointer-events:auto}
.dkh-logo{position:absolute;left:18px;top:4px;width:368px;height:92px;background:center/contain no-repeat;pointer-events:none;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.7))}
.dkh-logo::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 36%,rgba(255,255,255,.6) 47%,transparent 58%);
  -webkit-mask:var(--dkh-logo) center/contain no-repeat;mask:var(--dkh-logo) center/contain no-repeat;
  animation:dkShine 5.2s ease-in-out infinite}
.dkh-logotx{display:flex;align-items:center}
.dkh-logotx b{font-family:var(--pop);font-size:44px;color:var(--dkh-gold);-webkit-text-stroke:6px var(--dkh-edge);paint-order:stroke fill}

.dkh-ev{position:absolute;left:402px;right:340px;top:15px;height:66px;cursor:pointer;overflow:hidden;
  display:flex;align-items:center;gap:14px;padding:0 20px 0 10px;border-radius:14px;
  background:var(--dkh-lacq) padding-box,var(--dkh-rimSS) border-box;border:3px solid transparent;
  box-shadow:0 5px 0 rgba(0,0,0,.4),0 10px 22px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,200,160,.35);
  transition:transform var(--fx-t-release) var(--fx-back)}
.dkh-home.dkh-hasped .dkh-ev{right:578px}
.dkh-ev:hover{transform:translateY(-2px)}
.dkh-ev:active{transform:translateY(2px) scale(.99);transition-duration:var(--fx-t-press)}
.dkh-evtag{flex:0 0 auto;padding:6px 14px;border-radius:10px;font-family:var(--pop);font-size:20px;line-height:1;color:#5A3A04;
  background:linear-gradient(180deg,#FFF3C8,#F2C230 55%,#C08A0E);border:2px solid #7A5206;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.dkh-evic{flex:0 0 auto;font-style:normal;font-size:34px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.dkh-evnm{flex:0 0 auto;font-family:var(--pop);font-size:28px;line-height:1;color:var(--dkh-gold);
  -webkit-text-stroke:5px #3A0806;paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.45)}
.dkh-evds{flex:1 1 auto;min-width:0;font-size:20px;font-weight:900;color:#FFE6D0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dkh-tr{position:absolute;right:16px;top:12px;display:flex;align-items:center;gap:14px}
/* 赤い「! お知らせ」 */
.dkh-oshi{position:relative;height:58px;display:flex;align-items:center;gap:8px;padding:0 20px 0 9px;border-radius:29px;cursor:pointer;
  background:linear-gradient(180deg,#FF8A74 0 10%,#D8321E 52%,#8E1410);border:3px solid #FFE0B0;
  box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.4);transition:transform var(--fx-t-release) var(--fx-back)}
.dkh-oshi > i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--pop);font-size:24px;line-height:1;
  color:#C9302C;background:#FFF6E2;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.dkh-oshi > b{font-size:22px;font-weight:900;line-height:1;color:#FFF6E2;-webkit-text-stroke:4px #5A0A08;paint-order:stroke fill;white-space:nowrap}
.dkh-oshi:hover{transform:translateY(-2px)} .dkh-oshi:active{transform:translateY(3px) scale(.96);transition-duration:var(--fx-t-press)}
.dkh-ic{position:relative;width:96px;height:76px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--dkh-wood2) padding-box,var(--dkh-rimSS) border-box;border:3px solid transparent;
  box-shadow:0 5px 0 rgba(0,0,0,.45),inset 0 2px 0 rgba(255,226,150,.35);transition:transform var(--fx-t-release) var(--fx-back)}
.dkh-ic svg{width:42px;height:42px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.dkh-ict{font-size:18px;font-weight:900;line-height:1;color:#FFF3D8;-webkit-text-stroke:3px var(--dkh-edge);paint-order:stroke fill}
.dkh-ic:hover{transform:translateY(-3px)} .dkh-ic:active{transform:translateY(3px) scale(.96);transition-duration:var(--fx-t-press)}
.dkh-dot,.dkh-badge{position:absolute;right:-9px;top:-10px;min-width:30px;height:30px;padding:0 7px;border-radius:15px;z-index:3;
  display:flex;align-items:center;justify-content:center;font-style:normal;font-size:18px;font-weight:900;color:#fff;line-height:1;
  background:linear-gradient(180deg,#FF6A5E,#C9302C);border:2px solid #FFF1D0;box-shadow:0 2px 4px rgba(0,0,0,.5);pointer-events:none}

/* ── 左右の縦のボタン（宝石のメダル＋金縁の木札。左5つ・右6つ） ── */
.dkh-rail{position:absolute;top:104px;width:168px;z-index:5;display:flex;flex-direction:column;gap:8px}
.dkh-rail.l{left:12px} .dkh-rail.r{right:12px}
.dkh-rb{position:relative;height:108px;border-radius:18px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:var(--dkh-wood) padding-box,linear-gradient(180deg,#C8952F,#6B4408 60%,#A8752A) border-box;border:3px solid transparent;
  box-shadow:0 5px 0 rgba(0,0,0,.5),0 10px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,220,150,.22),inset 0 -12px 18px rgba(0,0,0,.35);
  transition:transform var(--fx-t-release) var(--fx-back)}
.dkh-rail.l .dkh-rb{height:124px}
.dkh-rb:hover{transform:translateY(-4px)}
.dkh-rb:active{transform:translateY(3px) scale(.97);transition-duration:var(--fx-t-press);transition-timing-function:var(--fx-out)}
.dkh-med{position:relative;width:64px;height:64px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  border:3px solid #F3D583;box-shadow:0 0 0 3px #3A2405,0 4px 8px rgba(0,0,0,.6),inset 0 -8px 14px rgba(0,0,0,.35),inset 0 6px 10px rgba(255,255,255,.35)}
.dkh-med svg{position:relative;z-index:1;width:44px;height:44px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.45));transition:transform .3s var(--fx-back)}
.dkh-rb:hover .dkh-med svg{transform:scale(1.1) rotate(-6deg)}
.dkh-med::before{content:"";position:absolute;left:10%;right:10%;top:5%;height:42%;border-radius:50%;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
.dkh-med.ruby {background:radial-gradient(circle at 38% 30%,#FF9A86,#E0402E 45%,#8E1410 85%)}
.dkh-med.amber{background:radial-gradient(circle at 38% 30%,#FFE9A0,#F2A81C 45%,#9A5A04 85%)}
.dkh-med.emer {background:radial-gradient(circle at 38% 30%,#C6F59A,#4FB43A 45%,#1C5E10 85%)}
.dkh-med.sapph{background:radial-gradient(circle at 38% 30%,#BFE8FF,#2E8BE0 45%,#0B2C5E 85%)}
.dkh-med.amet {background:radial-gradient(circle at 38% 30%,#FFB0C8,#C23B6A 45%,#5E0A2C 85%)}
.dkh-med.wood {background:radial-gradient(circle at 38% 30%,#FFF1CC,#C8A064 45%,#5A3E18 85%)}
.dkh-rbt{font-size:20px;font-weight:900;line-height:1;text-align:center;color:#FFF3D8;-webkit-text-stroke:4px var(--dkh-edge);paint-order:stroke fill;letter-spacing:.02em}
.dkh-rbt.two{font-size:19px;line-height:1.08}

/* ── 首から下げたカード ── */
.dkh-cardcol{position:absolute;left:194px;top:96px;width:456px;bottom:88px;z-index:4;display:flex;flex-direction:column;gap:14px}
.dkh-badgewrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;padding-top:34px;
  animation:dkhSway 7s ease-in-out infinite;transform-origin:50% 0}
@keyframes dkhSway{0%,100%{transform:rotate(0)}50%{transform:rotate(.7deg) translateY(3px)}}
.dkh-strap{position:absolute;left:50%;top:-8px;width:76px;height:50px;margin-left:-38px;z-index:3;pointer-events:none}
.dkh-strap::before{content:"";position:absolute;left:14px;right:14px;top:0;height:30px;border-radius:0 0 6px 6px;
  background:repeating-linear-gradient(90deg,rgba(255,220,150,.45) 0 2px,transparent 2px 6px) center/100% 2px no-repeat,
             linear-gradient(90deg,#5E0E0A,#B0281E 30%,#D8463A 50%,#B0281E 70%,#5E0E0A);
  box-shadow:0 3px 4px rgba(0,0,0,.5)}
.dkh-strap i{position:absolute;left:50%;bottom:0;width:34px;height:34px;margin-left:-17px;border-radius:50%;
  border:6px solid #E8C878;box-shadow:0 0 0 2px #5A3A04,inset 0 0 0 2px #5A3A04,0 3px 5px rgba(0,0,0,.55)}
.dkh-card{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border-radius:22px;padding:6px;isolation:isolate;
  background:var(--dkh-rimA);box-shadow:0 10px 0 rgba(0,0,0,.3),0 18px 36px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.35)}
.dkh-card.rS{background:var(--dkh-rimS)}
.dkh-card.rSS{background:var(--dkh-rimSS)}
.dkh-card::after{content:"";position:absolute;inset:-4px;border-radius:26px;z-index:-1;pointer-events:none;
  box-shadow:0 0 30px 8px rgba(255,200,80,.55);opacity:.45}
.dkh-card.rA::after{box-shadow:0 0 28px 6px rgba(110,190,255,.5)}
.dkh-card.rS::after{box-shadow:0 0 28px 6px rgba(190,140,255,.5)}
.dkh-chd{flex:0 0 56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-radius:16px 16px 0 0;
  background:linear-gradient(180deg,#2E1E0A,#110A03)}
.dkh-rar{font-family:var(--caps);font-size:36px;line-height:1;color:var(--dkh-gold);-webkit-text-stroke:5px #3A2405;paint-order:stroke fill;
  text-shadow:0 3px 0 #C98A12}
.dkh-card.rA .dkh-rar{color:#CFEAFF;text-shadow:0 3px 0 #1B5A9E}
.dkh-card.rS .dkh-rar{color:#EAD8FF;text-shadow:0 3px 0 #5E2E9E}
.dkh-cnm{margin-left:auto;font-size:26px;font-weight:900;color:#FFF0CE;-webkit-text-stroke:4px var(--dkh-edge);paint-order:stroke fill;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkh-pic{position:relative;flex:1;min-height:0;overflow:hidden;isolation:isolate;
  background:radial-gradient(92% 80% at 50% 40%,#FFFCF0 0%,#FDEFC8 38%,#EBC274 64%,#A06C22 88%,#4A2E08 100%)}
.dkh-card.rA .dkh-pic{background:radial-gradient(90% 76% at 50% 40%,#FFFFFF 0%,#DDF1FF 30%,#8CC6F0 60%,#2A6AB0 88%,#0E2E5E 100%)}
.dkh-card.rS .dkh-pic{background:radial-gradient(90% 76% at 50% 40%,#FFFFFF 0%,#F2E4FF 30%,#C6A2F0 60%,#6A3AA8 88%,#2A0E4E 100%)}
.dkh-glow{position:absolute;left:50%;top:42%;width:900px;height:900px;margin:-450px 0 0 -450px;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,255,255,.34) 0 7deg,rgba(255,255,255,0) 7deg 19deg);
  -webkit-mask:radial-gradient(circle,#000 8%,transparent 46%);mask:radial-gradient(circle,#000 8%,transparent 46%);
  animation:fxSpin 46s linear infinite}
.dkh-art{position:absolute;inset:0;background-repeat:no-repeat;background-size:128% auto;background-position:50% 86%;mix-blend-mode:multiply}
.dkh-ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--pop);font-size:160px;color:rgba(90,58,4,.35)}
.dkh-pic > .dkh-gl{width:28%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent)}
.dkh-role{position:absolute;left:12px;bottom:12px;z-index:3;padding:6px 14px;border-radius:10px;font-size:20px;font-weight:900;color:#FFF3D8;
  background:rgba(26,14,4,.78);border:2px solid rgba(255,210,120,.55)}
.dkh-lv{position:absolute;right:12px;bottom:10px;z-index:3;width:76px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--pop);font-size:34px;line-height:.95;color:#fff;-webkit-text-stroke:5px #0C2A52;paint-order:stroke fill;
  background:linear-gradient(180deg,#9FD6FF,#2E8BE0 52%,#14559E);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.dkh-lv i{font-style:normal;font-size:18px;-webkit-text-stroke:3px #0C2A52}
.dkh-plate{flex:0 0 76px;display:flex;align-items:center;gap:12px;padding:0 12px 0 14px;border-radius:0 0 16px 16px;
  background:linear-gradient(180deg,#5A4220,#2A1C08)}
/* 名札の枠（G22・能力なしの飾り） */
.dkh-plate.fr-bronze{box-shadow:inset 0 0 0 4px #D08A4E,inset 0 0 0 7px #6B3A12}
.dkh-plate.fr-silver{box-shadow:inset 0 0 0 4px #EEF4FA,inset 0 0 0 7px #56657A,0 0 16px rgba(220,235,255,.45)}
.dkh-plate.fr-gold{box-shadow:inset 0 0 0 4px #FFD44A,inset 0 0 0 7px #8A5E06,0 0 22px rgba(255,210,90,.65)}
.dkh-ttl{flex:0 0 auto;max-width:150px;padding:5px 12px;border-radius:9px;font-size:18px;font-weight:900;line-height:1.1;color:#3A2405;
  background:linear-gradient(180deg,#FFF0BE,#E8B23A);border:2px solid #8A6206;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkh-ttl.none{color:#E8D6B0;background:rgba(0,0,0,.3);border-color:rgba(232,200,120,.35)}
.dkh-pnm{flex:1;min-width:0;font-size:26px;font-weight:900;color:#FFF0CE;-webkit-text-stroke:4px var(--dkh-edge);paint-order:stroke fill;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.dkh-sw{position:relative;flex:0 0 auto;width:58px;height:54px;border-radius:12px;cursor:pointer;display:grid;place-items:center;
  background:linear-gradient(180deg,#F4E7CC,#C5AC82 58%,#9B8460);border:2px solid #5B431F;box-shadow:0 3px 0 rgba(0,0,0,.4);
  transition:transform var(--fx-t-release) var(--fx-back)}
.dkh-sw svg{width:40px;height:40px}
.dkh-sw:hover svg{transform:rotate(180deg);transition:transform .5s var(--fx-out)}
.dkh-sw:active{transform:translateY(2px) scale(.95)}

/* 入場する（エメラルド＋金枠。光が流れる） */
.dkh-enter{position:relative;flex:0 0 104px;cursor:pointer;border-radius:22px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;gap:22px;
  background:linear-gradient(180deg,#D2F7A6 0%,#86DA55 16%,#46A626 56%,#1F5E0C 100%) padding-box,var(--dkh-rimSS) border-box;
  border:5px solid transparent;transition:transform var(--fx-t-release) var(--fx-back)}
.dkh-enter:hover{transform:translateY(-3px)}
.dkh-enter:hover .dkh-chev{transform:translateX(8px)}
.dkh-enter:active{transform:translateY(4px) scale(.98);transition-duration:var(--fx-t-press)}
.dkh-enter::after{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:22%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-150%) skewX(-18deg);
  animation:dkhSweep 3.6s ease-in-out infinite}
@keyframes dkhSweep{0%,70%{transform:translateX(-150%) skewX(-18deg)}100%{transform:translateX(520%) skewX(-18deg)}}
.dkh-entx{position:relative;font-family:var(--pop);font-size:50px;line-height:1;color:#fff;letter-spacing:.12em;
  -webkit-text-stroke:9px #123A06;paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.35)}
.dkh-chev{position:relative;display:flex;gap:4px;transition:transform .3s var(--fx-back)}
.dkh-chev b{width:26px;height:36px;background:#FFFBE8;clip-path:polygon(0 0,55% 0,100% 50%,55% 100%,0 100%,45% 50%);
  filter:drop-shadow(0 2px 0 #123A06)}
.dkh-chev b + b{opacity:.7}

/* ── 右：友だちランキング／全体ランキング ── */
.dkh-side{position:absolute;left:666px;right:194px;top:96px;bottom:88px;z-index:4;display:flex;flex-direction:column;gap:10px;
  padding:12px 14px 14px;border-radius:20px;
  background:linear-gradient(180deg,rgba(56,38,16,.96),rgba(22,13,4,.97)) padding-box,var(--dkh-rimSS) border-box;border:4px solid transparent;
  box-shadow:0 10px 0 rgba(0,0,0,.3),0 18px 36px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,220,150,.22),inset 0 0 40px rgba(0,0,0,.55)}
.dkh-rkh{flex:0 0 58px;display:flex;align-items:center;gap:10px}
.dkh-tabs{flex:1;min-width:0;height:58px;display:flex;gap:8px}
.dkh-tab{position:relative;flex:1;min-width:0;padding:0 8px;border:0;cursor:pointer;border-radius:14px 14px 4px 4px;white-space:nowrap;
  font-family:var(--pop);font-size:22px;line-height:1;color:#E6D4AE;-webkit-text-stroke:4px var(--dkh-edge);paint-order:stroke fill;
  background:linear-gradient(180deg,#5A4220,#2C1D09) padding-box,linear-gradient(180deg,#8A6A34,#4A3314) border-box;border:3px solid transparent;

.dkh-fcnm{font-size:24px;font-weight:900;color:#FFF0CE;-webkit-text-stroke:4px var(--dkh-edge);paint-order:stroke fill;white-space:nowrap}
.dkh-fcsub{font-size:18px;font-weight:900;color:#FFD44A}
.dkh-togacha{align-self:center;flex:0 0 auto;font-size:28px;padding:22px 26px;writing-mode:horizontal-tb}
.dkh-sched{flex:0 0 400px;display:flex;flex-direction:column;gap:10px;padding:22px 22px}
.dkh-schd{font-family:var(--pop);font-size:26px;color:var(--dkh-gold);-webkit-text-stroke:4px var(--dkh-edge);paint-order:stroke fill;text-align:center}
.dkh-sc{flex:1;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:12px;background:rgba(255,240,200,.07);border:1px solid rgba(196,150,70,.3)}
.dkh-sc.now{background:linear-gradient(90deg,rgba(201,48,44,.55),rgba(120,20,14,.3));border-color:#F2C230;box-shadow:0 0 14px rgba(255,160,80,.35)}
.dkh-scwhen{flex:0 0 76px;font-size:18px;font-weight:900;color:#F0DCA8}
.dkh-scic{flex:0 0 auto;font-style:normal;font-size:32px}
.dkh-scnm{flex:1;min-width:0;font-size:22px;font-weight:900;color:#FFF0CE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkh-scd{flex:0 0 auto;font-size:18px;font-weight:900;color:#E6D4AE}

/* ── お知らせ・遊び方 ── */
.dkh-info{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:18px 20px;overflow-y:auto}
.dkh-inrow{flex:1;min-height:118px;display:flex;align-items:center;gap:20px;padding:10px 16px;border-radius:14px;

  background:radial-gradient(circle at 38% 30%,#6E5326,#2A1C08);border:3px solid #F3D583;box-shadow:0 0 0 3px #3A2405,0 4px 8px rgba(0,0,0,.4)}
.dkh-inic svg{width:56px;height:56px}
.dkh-intx{flex:1;min-width:0}
.dkh-intx b{display:block;font-size:26px;font-weight:900;color:#42300F}
.dkh-intx p{margin-top:4px;font-size:19px;font-weight:700;line-height:1.45;color:#5A4424}
.dkh-ingo{flex:0 0 auto;font-size:22px;padding:14px 22px}
.dkh-tips{flex:1;min-height:0;padding:20px 26px;display:flex;flex-direction:column;overflow-y:auto}
.dkh-tiphd{text-align:center;margin-bottom:12px}
.dkh-tiphd b{font-family:var(--pop);font-size:32px;color:#5A3E12;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.dkh-tipl{list-style:none;columns:2;column-gap:36px;column-rule:2px dashed rgba(138,99,20,.35)}
.dkh-tipl li{break-inside:avoid;display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.dkh-tipl li i{flex:0 0 36px;height:36px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--pop);font-size:20px;color:#fff;
  -webkit-text-stroke:3px #5A3A04;paint-order:stroke fill;background:radial-gradient(circle at 35% 30%,#FFF3C8,#F2C230 55%,#A9761A);border:2px solid #5A3A04}
.dkh-tipl li span{font-size:20px;font-weight:700;line-height:1.5;color:#42300F}

/* ── 郵便箱 ── */
.dkh-mrow{flex:0 0 auto;min-height:92px;display:flex;align-items:center;gap:16px;padding:8px 14px;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.1));border:1px solid rgba(150,116,64,.35);
  transition:transform .3s var(--fx-out),opacity .3s}
.dkh-mrow.soon{border-color:#C9302C;box-shadow:inset 4px 0 0 #C9302C}
.dkh-mrow.dkh-taken{transform:translateX(40px);opacity:.35}
.dkh-mic{flex:0 0 68px;height:68px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:38px;line-height:1;
  background:radial-gradient(circle at 38% 30%,#FFF6D2,#E8C878 55%,#A9761A);border:3px solid #5A3A04;box-shadow:0 3px 6px rgba(0,0,0,.35)}
.dkh-mmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.dkh-mnm{font-size:24px;font-weight:900;color:#42300F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkh-mdate{font-size:18px;font-weight:700;color:#6E5A34}
.dkh-mdate em{font-style:normal;font-weight:900;color:#A8210F}
.dkh-mrw{flex:0 0 auto;display:flex;gap:8px}
.dkh-chip{display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-radius:11px;font-family:var(--pop);font-size:22px;color:#5A3E12;
  background:linear-gradient(180deg,#FFF6E0,#E6D2A8);border:2px solid #A9761A}
.dkh-chip .dkh-coin{width:28px;height:28px;border-width:2px} .dkh-chip .dkh-gem{width:28px;height:24px}
.dkh-chip.it{font-family:inherit;font-weight:900;font-size:18px}
.dkh-take{flex:0 0 auto;font-size:24px;padding:14px 20px}
.dkh-msic svg{width:150px;height:150px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)) drop-shadow(0 0 22px rgba(255,200,80,.45));animation:fxFloat 4s ease-in-out infinite}
.dkh-msic{font-style:normal}
.dkh-mst{font-family:var(--pop);font-size:28px;color:var(--dkh-gold);-webkit-text-stroke:4px var(--dkh-edge);paint-order:stroke fill}
.dkh-msum{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.dkh-msum span{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,210,120,.4)}
.dkh-msum b{font-family:var(--pop);font-size:32px;color:#FFF6E2;-webkit-text-stroke:5px #1A0F03;paint-order:stroke fill;font-variant-numeric:tabular-nums}
.dkh-msit{font-size:20px;font-weight:900;color:#F0DCA8}
.dkh-msoon{font-size:20px;font-weight:900;color:#FFE0D8;padding:6px 14px;border-radius:10px;background:rgba(201,48,44,.38);border:1px solid #FF6A5E}
.dkh-all{width:100%;height:84px;font-size:32px;margin-top:auto}
.dkh-mnote,.dkh-frnote{font-size:18px;font-weight:700;color:#E6D4AE;line-height:1.5}

/* ── ともだち ── */
.dkh-frrow{flex:0 0 auto;min-height:96px;display:flex;align-items:center;gap:16px;padding:8px 16px;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.1));border:1px solid rgba(150,116,64,.35)}
.dkh-frrow .dkh-face{flex-basis:72px;width:72px;height:72px;border-radius:14px}
.dkh-frmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dkh-frmid b{font-size:26px;font-weight:900;color:#42300F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkh-frmid span{font-size:18px;font-weight:700;color:#6E5A34}
.dkh-frlast{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.dkh-frlast span{font-size:16px;font-weight:700;color:#8A6A34}
.dkh-frlast b{font-family:var(--pop);font-size:24px;color:#5A3E12}
.dkh-globe{position:relative;width:190px;height:190px;display:grid;place-items:center}
.dkh-globe svg{position:relative;width:150px;height:150px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)) drop-shadow(0 0 22px rgba(90,180,255,.5))}
.dkh-orbit{position:absolute;inset:0;border-radius:50%;border:3px dashed rgba(255,214,110,.75);animation:fxSpin 16s linear infinite}
.dkh-orbit::after{content:"";position:absolute;left:50%;top:-9px;width:16px;height:16px;margin-left:-8px;border-radius:50%;
  background:radial-gradient(circle,#FFFBE8,#FFD44A 60%,#A9761A);box-shadow:0 0 12px 4px rgba(255,210,90,.8)}
.dkh-frst{font-family:var(--pop);font-size:32px;color:var(--dkh-gold);-webkit-text-stroke:5px var(--dkh-edge);paint-order:stroke fill}
.dkh-steps{list-style:none;width:100%;display:flex;flex-direction:column;gap:10px;text-align:left}
.dkh-steps li{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;background:rgba(255,240,200,.07);border:1px solid rgba(196,150,70,.3)}
.dkh-steps li i{flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--pop);font-size:22px;color:#fff;
  -webkit-text-stroke:3px #5A3A04;paint-order:stroke fill;background:radial-gradient(circle at 35% 30%,#FFF3C8,#F2C230 55%,#A9761A);border:2px solid #5A3A04}
.dkh-steps li span{font-size:19px;font-weight:900;color:#F4E3BD;line-height:1.35}
.dkh-olbtn{width:100%;height:84px;font-size:30px;margin-top:auto}

/* ══════════════════════════════════════════════════════════════
   モーダル（設定・ランキングの報酬・マイレージガチャ・名札の枠・昇格）
   ══════════════════════════════════════════════════════════════ */
.dkh-modal{position:relative;border-radius:22px;padding:66px 34px 26px;
  background:linear-gradient(180deg,rgba(58,40,18,.98),rgba(20,12,4,.99)) padding-box,var(--dkh-rimSS) border-box;border:5px solid transparent;
  box-shadow:0 10px 0 rgba(0,0,0,.35),0 24px 60px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,220,150,.25),inset 0 0 50px rgba(0,0,0,.5)}
.dkh-mhd{position:absolute;left:50%;top:-4px;transform:translateX(-50%);height:58px;padding:0 70px;display:flex;align-items:center;white-space:nowrap;
  background:linear-gradient(180deg,#F0604A 0 10%,#C9302C 45%,#8E1410);clip-path:polygon(0 0,100% 0,94% 100%,6% 100%)}
.dkh-mhd b{font-family:var(--pop);font-size:32px;color:#fff;-webkit-text-stroke:6px #5A1206;paint-order:stroke fill}
.dkh-mbtns{display:flex;justify-content:center;gap:18px;margin-top:22px}
.dkh-mbtns .dkbtn{min-width:220px;height:70px;font-size:28px}
.dkbtn.dkh-wood{background:var(--dkh-wood2);border:3px solid #A9761A;color:#FFF3D8;-webkit-text-stroke:4px var(--dkh-edge)}
.dkh-hnote{margin-top:14px;font-size:20px;font-weight:700;line-height:1.6;color:#E6D4AE;text-align:center}
.dkh-hnote b{color:var(--dkh-gold)}
/* 常設バーのゴールドの＋：ショップの無料の宝が受け取れる時の赤い印 */
.dkh-plus.dot::before{content:"";position:absolute;right:-6px;top:-6px;width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FF9A8E,#E8302A 55%,#9A1410);border:2px solid #FFF1D0;pointer-events:none}
.dkh-mwarn{margin-left:auto;font-style:normal;font-size:18px;font-weight:900;color:#B8200E}

.dkh-set{width:940px}
.dkh-srows{display:flex;flex-direction:column;gap:10px}
.dkh-srow{display:flex;align-items:center;gap:20px;min-height:72px;padding:6px 18px;border-radius:14px;background:rgba(255,240,200,.06);border:1px solid rgba(196,150,70,.3)}
.dkh-sl{flex:0 0 200px;font-size:24px;font-weight:900;color:#F4E3BD}
.dkh-sc{flex:1;min-width:0;display:flex;align-items:center;gap:18px}
.dkh-shint{font-size:18px;font-weight:700;color:#D8C49A;line-height:1.3}
.dkh-range{flex:1;-webkit-appearance:none;appearance:none;height:14px;border-radius:7px;cursor:pointer;
  background:linear-gradient(180deg,#1A1004,#3A2A14);border:2px solid #7A5A22;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.dkh-range::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#FFF6C8,#F2C230 50%,#A9761A);border:3px solid #3A2405;box-shadow:0 3px 6px rgba(0,0,0,.6)}
.dkh-range::-moz-range-thumb{width:36px;height:36px;border-radius:50%;background:#F2C230;border:3px solid #3A2405}
.dkh-rv{flex:0 0 64px;text-align:right;font-family:var(--pop);font-size:28px;color:var(--dkh-gold);-webkit-text-stroke:4px var(--dkh-edge);paint-order:stroke fill}
.dkh-seg button{flex:0 0 auto;min-width:128px;height:54px;padding:0 16px;font-size:22px;white-space:nowrap}

/* ？ ランキングの報酬 */
.dkh-help{width:1280px}
.dkh-hcols{display:flex;gap:26px}
.dkh-hcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.dkh-hcol:first-child{flex:0 0 440px}
.dkh-hsub{font-family:var(--pop);font-size:26px;color:var(--dkh-gold);-webkit-text-stroke:4px var(--dkh-edge);paint-order:stroke fill;text-align:center;margin-bottom:4px}
.dkh-hcol .dkh-hnote{margin-top:4px;font-size:18px;line-height:1.5}
.dkh-hrows{display:flex;flex-direction:column;gap:8px}
.dkh-hrow{position:relative;display:flex;align-items:center;gap:16px;height:66px;padding:0 18px;border-radius:14px;background:rgba(255,240,200,.06);
  border:1px solid rgba(196,150,70,.3)}
.dkh-hrow.on{background:linear-gradient(90deg,rgba(46,139,224,.45),rgba(46,139,224,.1));border:2px solid #8FD2FF}
.dkh-hrow .dkh-emb{width:46px;height:52px}
.dkh-hnm{flex:0 0 130px;font-size:26px;font-weight:900;color:#FFF0CE;-webkit-text-stroke:4px var(--dkh-edge);paint-order:stroke fill}
.dkh-hrange{flex:1;font-size:20px;font-weight:900;color:#F0DCA8;font-variant-numeric:tabular-nums;white-space:nowrap}
.dkh-hrw{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-family:var(--pop);font-size:22px;color:#FFF6E2}
.dkh-hrw em{font-style:normal;font-family:inherit;font-size:18px;color:#FFD9A0;margin-left:6px}
.dkh-hrw .dkh-coin{width:28px;height:28px;border-width:2px} .dkh-hrw .dkh-gem{width:28px;height:24px;margin-left:8px}
.dkh-now{position:absolute;left:-12px;top:-12px;font-style:normal;font-size:16px;font-weight:900;color:#fff;padding:3px 10px;border-radius:8px;
  background:linear-gradient(180deg,#FF6A5E,#C9302C);border:2px solid #FFF1D0}

/* マイレージガチャ（2つのガチャ→3つの箱） */
.dkh-mg{width:900px;display:flex;flex-direction:column;align-items:center;gap:16px}
.dkh-mgnote{font-size:22px;font-weight:900;line-height:1.5;color:#FFE9B5;text-align:center}
.dkh-mgnote span{display:block;font-size:20px;color:#F0DCA8}
.dkh-mgnote b{color:var(--dkh-gold)}
.dkh-mgos{display:flex;gap:28px}
.dkh-mgo{position:relative;width:350px;height:260px;border-radius:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:radial-gradient(70% 50% at 50% 38%,rgba(255,200,90,.3),transparent 70%),linear-gradient(180deg,rgba(90,64,28,.96),rgba(30,18,6,.98)) padding-box,var(--dkh-rimSS) border-box;
  border:4px solid transparent;box-shadow:0 8px 0 rgba(0,0,0,.35),0 14px 28px rgba(0,0,0,.5);transition:transform var(--fx-t-release) var(--fx-back)}
.dkh-mgo.j{background:radial-gradient(70% 50% at 50% 38%,rgba(120,200,255,.32),transparent 70%),linear-gradient(180deg,rgba(30,70,140,.96),rgba(8,20,48,.98)) padding-box,var(--dkh-rimA) border-box}
.dkh-mgo > b{font-family:var(--pop);font-size:32px;line-height:1;color:#fff;-webkit-text-stroke:6px var(--dkh-edge);paint-order:stroke fill}
.dkh-mgo.short{filter:saturate(.45) brightness(.78)}
.dkh-mgo:hover{transform:translateY(-4px)} .dkh-mgo:active{transform:translateY(3px) scale(.97)}
.dkh-mgk{display:flex;align-items:center;gap:4px;padding:4px 14px;border-radius:12px;background:rgba(0,0,0,.4)}
.dkh-mgk svg{width:34px;height:34px}
.dkh-mgk b{font-family:var(--pop);font-size:26px;color:var(--dkh-gold);-webkit-text-stroke:4px var(--dkh-edge);paint-order:stroke fill}
.dkh-chest{position:relative;display:block;width:124px;height:98px;border-radius:14px 14px 10px 10px;
  background:linear-gradient(180deg,transparent 34%,#E0AE3A 34% 42%,transparent 42%),linear-gradient(180deg,#9A5424,#4A2408);border:5px solid #E0AE3A;
  box-shadow:0 8px 0 rgba(0,0,0,.35),inset 0 0 18px rgba(0,0,0,.45),inset 0 3px 0 rgba(255,220,150,.4)}
.dkh-chest::before{content:"";position:absolute;left:50%;top:24%;width:26px;height:30px;margin-left:-13px;border-radius:6px;
  background:linear-gradient(180deg,#FFF3C8,#F2C230 55%,#8A5E06);border:2px solid #5A3A04}
.dkh-chest.j{background:linear-gradient(180deg,transparent 34%,#F2F6FF 34% 42%,transparent 42%),linear-gradient(180deg,#3C7AD8,#12306A);border-color:#BFE8FF;
  box-shadow:0 8px 0 rgba(0,0,0,.35),0 0 26px rgba(120,200,255,.55),inset 0 0 18px rgba(0,0,0,.45)}
.dkh-mgq{font-family:var(--pop);font-size:36px;line-height:1.2;color:var(--dkh-gold);-webkit-text-stroke:6px var(--dkh-edge);paint-order:stroke fill}
.dkh-boxes{display:flex;gap:28px}
.dkh-box{position:relative;width:240px;height:290px;border-radius:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;
  background:radial-gradient(60% 50% at 50% 45%,rgba(255,200,90,.3),transparent 70%),rgba(0,0,0,.35);border:3px solid rgba(255,210,120,.45);
  transition:transform var(--fx-t-release) var(--fx-back)}
.dkh-box > .fx-rays{opacity:.85}
.dkh-box .dkh-chest{transition:transform .3s var(--fx-back)}
.dkh-box:hover .dkh-chest{transform:translateY(-6px) rotate(-3deg)}
.dkh-box.open .dkh-chest{display:none}
.dkh-bin{display:none;position:relative;z-index:1;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 12px}
.dkh-box.open .dkh-bin{display:flex;animation:fxPop 420ms var(--fx-spring) both}
.dkh-box.dim{filter:grayscale(.55) brightness(.72)}
.dkh-box.open:not(.dim){border-color:#FFD44A;box-shadow:0 0 30px 8px rgba(255,210,90,.55)}
.dkh-bart{display:grid;place-items:center;width:112px;height:112px}
.dkh-bart .dkh-face{flex-basis:108px;width:108px;height:108px;border-radius:16px}
.dkh-bart .dkh-coin{width:86px;height:86px} .dkh-bart .dkh-gem{width:92px;height:80px}
.dkh-pem{font-style:normal;font-size:80px;line-height:1}
.dkh-tk{display:block;width:124px;height:76px;border-radius:10px;filter:drop-shadow(0 3px 0 #8A5E06);
  background:radial-gradient(circle at 0 50%,transparent 13px,#F2C230 14px) left/51% 100% no-repeat,
             radial-gradient(circle at 100% 50%,transparent 13px,#F2C230 14px) right/51% 100% no-repeat}
.dkh-bnm{font-size:24px;font-weight:900;line-height:1.2;color:#FFF0CE;-webkit-text-stroke:4px var(--dkh-edge);paint-order:stroke fill}
.dkh-bsub{font-size:20px;font-weight:900;color:#FFD9A0}

/* 名札の枠 */
.dkh-frm{width:940px}
.dkh-fros{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.dkh-fro{position:relative;height:124px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(180deg,rgba(90,66,32,.9),rgba(30,20,6,.95));border:3px solid rgba(196,150,70,.5);transition:transform var(--fx-t-release) var(--fx-back)}
.dkh-fro:active{transform:translateY(2px) scale(.98)}
.dkh-fro.on{border-color:#8FD2FF;box-shadow:0 0 0 3px rgba(143,210,255,.4),0 0 18px rgba(90,180,255,.5)}
.dkh-fro:disabled{filter:grayscale(.7) brightness(.7);cursor:default}
.dkh-frs{padding:8px 26px;border-radius:10px;font-size:24px;font-weight:900;color:#FFF0CE;background:linear-gradient(180deg,#5A4220,#2A1C08)}
.dkh-fro.fr-bronze .dkh-frs{box-shadow:inset 0 0 0 4px #D08A4E,inset 0 0 0 7px #6B3A12}
.dkh-fro.fr-silver .dkh-frs{box-shadow:inset 0 0 0 4px #EEF4FA,inset 0 0 0 7px #56657A}
.dkh-fro.fr-gold .dkh-frs{box-shadow:inset 0 0 0 4px #FFD44A,inset 0 0 0 7px #8A5E06,0 0 18px rgba(255,210,90,.6)}
.dkh-fro > b{font-size:22px;font-weight:900;color:#F4E3BD}

/* 昇格（等級が上がった時だけメダルが入れ替わる） */
.dkh-up{width:720px;display:flex;flex-direction:column;align-items:center;gap:12px}
.dkh-upst{position:relative;width:100%;height:230px;display:flex;align-items:center;justify-content:center;gap:40px;overflow:hidden;border-radius:16px;
  background:radial-gradient(60% 60% at 50% 50%,rgba(255,200,90,.3),transparent 70%)}
.dkh-upst > span{position:relative;z-index:1}
.dkh-upst .dkh-emb{width:130px;height:146px}
.dkh-upa{animation:dkhUpOut .6s var(--fx-out) both}
.dkh-upb{animation:dkhUpIn .7s var(--fx-spring) .25s both}
@keyframes dkhUpOut{to{transform:scale(.78);filter:grayscale(.6) brightness(.8)}}
@keyframes dkhUpIn{0%{transform:scale(.4) rotate(-20deg)}70%{transform:scale(1.15) rotate(4deg)}100%{transform:none}}
.dkh-uparr{position:relative;z-index:1;width:60px;height:40px;background:#FFD44A;clip-path:polygon(0 30%,60% 30%,60% 0,100% 50%,60% 100%,60% 70%,0 70%)}
.dkh-upnm{font-family:var(--pop);font-size:38px;color:var(--dkh-gold);-webkit-text-stroke:6px var(--dkh-edge);paint-order:stroke fill}
.dkh-upsub{font-size:22px;font-weight:900;color:#F0DCA8}
.dkh-tic{font-style:normal;font-size:26px;line-height:1}
#toastL .toast .ic svg,#toastR .toast .ic svg{width:34px;height:34px}

#online.dkh-online,#olroom.dkh-online{padding:0!important}

#online.dkh-online > div[style],#olroom.dkh-online > div[style]{position:absolute!important;left:50%!important;top:118px!important;
  transform:translateX(-50%);width:1040px!important;max-width:none!important;margin:0!important;z-index:2;border-radius:24px;

#online.dkh-online > div[style] > div[style*="margin:0 0 20px"]{grid-column:1 / 3;grid-row:3;margin:0!important;display:flex;align-items:center;justify-content:center;gap:18px;

#online.dkh-online > div[style] > div[style*="display:flex"]::before{content:"部屋をつくって、友だちを呼ぶ";font-size:22px;font-weight:900;color:#F4E3BD}
#online.dkh-online #olJoinBox{grid-column:2;grid-row:4;display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:12px;

#online.dkh-online label{font-size:24px!important;font-weight:900;color:#F4E3BD!important;margin:0!important}
#online.dkh-online #olName{width:340px!important;height:64px;font-size:28px!important;font-weight:900;padding:0 16px!important;border-radius:14px!important;
  color:#42300F!important;text-align:center;background:var(--fx-parch)!important;border:3px solid #A9761A!important;

#online.dkh-online #olCode{width:380px!important;height:92px;font-size:54px!important;letter-spacing:18px!important;padding:0 0 0 18px!important;border-radius:16px!important;

#online.dkh-online #olMsg{font-size:20px!important;color:#FFD9A0!important;font-weight:900;min-height:28px;margin:0!important;line-height:1.5}
#online.dkh-online .btn,#olroom.dkh-online .btn{position:relative;border-radius:14px!important;font-family:var(--pop)!important;line-height:1;
  -webkit-text-stroke:4px rgba(30,18,4,.85);paint-order:stroke fill;transition:transform var(--fx-t-release) var(--fx-back)}
#online.dkh-online .btn.gold,#olroom.dkh-online .btn.gold{min-width:300px;height:80px;font-size:30px!important;color:#5A3A04!important;

#olroom.dkh-online > div[style]{padding:30px 50px 30px!important;text-align:center!important}
#olroom.dkh-online div[style*="margin-bottom:4px"]{font-size:22px!important;color:#F4E3BD!important;font-weight:900;margin:0 0 8px!important}
#olroom.dkh-online div[style*="font-size:58px"]{display:inline-block;margin:0 0 10px!important;padding:10px 30px 10px 52px!important;border-radius:18px;

  text-shadow:0 5px 0 #8A5E06!important;background:linear-gradient(180deg,#FFF0BE 0 4%,#6B4408 5%,#2A1C08 40%,#140C04);

/* ══════════════════════════════════════════════════════════════
   お手本の絵に寄せる仕上げ（書き割りの地・金の彫り枠・宝石のメダル・金の大ボタン・
   羊皮紙のランキング・木目の常設バー）
   ──────────────────────────────────────────────────────────────
   ・地は静止の絵1枚（8b-skin.js の dkskApply が .sk-bg で敷く）。動く層は増やさない。
   ・金の彫り枠は素材 frame-gold の9分割＝--sk-frame（dkskApply が配る）。
     羊皮紙 --sk-paper・等級の台座 --sk-badge・金の飾り --sk-fleur も同じ。
     木目と宝石は 9j-home.js の dkhSkinVars が配る --dkh-wood-img / --dkh-candle-img / --dkh-gem-*。
   ・素材が無くても崩れない：絵はどれも第1レイヤーで、下に必ずグラデーションの下地を置く。
   ・足した常時アニメは主役のまわりのきらめき2個だけ（1画面8個まで）。
   ══════════════════════════════════════════════════════════════ */

/* ── 地：書き割りを見せる（焼き込みは四隅だけにする） ── */
#home.dkh-home::before{opacity:1;
  background:
    radial-gradient(66% 46% at 50% 2%,rgba(255,200,110,.26),transparent 74%),
    radial-gradient(88% 84% at 50% 42%,rgba(0,0,0,0) 44%,rgba(10,5,0,.5) 100%),
    linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,0) 15%,rgba(0,0,0,0) 79%,rgba(0,0,0,.4))}

/* ── 上段：告知帯・✉・⚙（お手本の右上は大きな金枠の四角が2つ） ── */
.dkh-ev{right:414px;padding-right:52px;border-radius:16px;border:4px solid transparent;
  background:radial-gradient(92% 150% at 18% 0%,rgba(255,152,92,.34),transparent 62%) padding-box,
             var(--dkh-lacq) padding-box,var(--dkh-rimSS) border-box;
  box-shadow:0 6px 0 rgba(0,0,0,.42),0 12px 24px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,200,160,.38)}
.dkh-home.dkh-hasped .dkh-ev{right:652px}
.dkh-ped{right:414px}
/* 右端の「＞」（お手本の告知帯の右にある山形） */
.dkh-ev::after{content:"";position:absolute;right:16px;top:50%;width:20px;height:28px;margin-top:-14px;z-index:3;pointer-events:none;
  background:#FFE9A8;clip-path:polygon(0 0,52% 0,100% 50%,52% 100%,0 100%,48% 50%);
  filter:drop-shadow(0 2px 0 rgba(58,8,6,.75))}
.dkh-tr{right:12px;top:7px;gap:14px}
.dkh-oshi{border:3px solid #FFE9A8;
  box-shadow:0 5px 0 rgba(0,0,0,.45),0 0 0 2px rgba(122,60,6,.5),inset 0 2px 0 rgba(255,255,255,.42)}
.dkh-ic{width:100px;height:86px;border-radius:18px;border:4px solid transparent;
  background:linear-gradient(180deg,#96733A,#4E3816 50%,#2A1C08) padding-box,var(--dkh-rimSS) border-box;
  box-shadow:0 6px 0 rgba(0,0,0,.45),0 10px 20px rgba(0,0,0,.42),inset 0 2px 0 rgba(255,236,180,.45)}
.dkh-ic svg{width:48px;height:48px}

/* ── 左右の縦レール：木目と金の縁の柱（頭に金の飾り・足もとにロウソク） ── */
.dkh-rail{top:100px;bottom:88px;width:176px;padding:12px 8px;gap:8px;border-radius:22px;
  border:4px solid transparent;
  background:
    linear-gradient(180deg,rgba(255,228,164,.14),rgba(0,0,0,.34)) padding-box,
    var(--dkh-wood-img,none) top left/100% auto repeat-y padding-box,
    var(--dkh-wood) padding-box,
    var(--dkh-rimSS) border-box;
  box-shadow:0 14px 28px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,226,160,.22),inset 0 -14px 22px rgba(0,0,0,.4)}
.dkh-rail.l{left:8px} .dkh-rail.r{right:8px}
.dkh-rail::before{content:"";position:absolute;left:50%;top:-15px;width:78px;height:34px;margin-left:-39px;z-index:2;pointer-events:none;
  background:var(--sk-fleur,none) center/contain no-repeat;filter:drop-shadow(0 3px 4px rgba(0,0,0,.65))}
.dkh-rail::after{content:"";flex:0 0 66px;min-height:0;pointer-events:none;
  background:var(--dkh-candle-img,none) center/contain no-repeat;
  filter:drop-shadow(0 0 16px rgba(255,172,64,.6)) drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.dkh-rb,.dkh-rail.l .dkh-rb{flex:1 1 0;height:auto;min-height:0;border-radius:16px;
  background:linear-gradient(180deg,#72562A,#32220C 56%,#1A1004) padding-box,
             linear-gradient(180deg,#F0CE72,#8A5E06 46%,#C8952F) border-box;
  border:3px solid transparent;
  box-shadow:0 4px 0 rgba(0,0,0,.5),0 8px 14px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,226,160,.28),inset 0 -12px 18px rgba(0,0,0,.4)}
/* 色分けした宝石のメダル（絵の明るさだけを重ねる＝色はそのまま・絵が無ければグラデーションだけ） */
.dkh-rb .dkh-med{width:76px;height:76px;isolation:isolate;
  background-size:cover,auto;background-position:center,center;background-repeat:no-repeat,no-repeat;
  background-blend-mode:luminosity,normal;
  border:3px solid #FFE9A8;
  box-shadow:0 0 0 3px #4A2E06,0 5px 9px rgba(0,0,0,.65),inset 0 -9px 15px rgba(0,0,0,.42),inset 0 7px 12px rgba(255,255,255,.42)}
.dkh-med.ruby {background-image:var(--dkh-gem-ruby,none),radial-gradient(circle at 38% 30%,#FF9A86,#E0402E 45%,#8E1410 85%)}
.dkh-med.amber{background-image:var(--dkh-gem-amber,none),radial-gradient(circle at 38% 30%,#FFE9A0,#F2A81C 45%,#9A5A04 85%)}
.dkh-med.emer {background-image:var(--dkh-gem-emer,none),radial-gradient(circle at 38% 30%,#C6F59A,#4FB43A 45%,#1C5E10 85%)}
.dkh-med.sapph{background-image:var(--dkh-gem-sapph,none),radial-gradient(circle at 38% 30%,#BFE8FF,#2E8BE0 45%,#0B2C5E 85%)}
.dkh-med.amet {background-image:var(--dkh-gem-amet,none),radial-gradient(circle at 38% 30%,#FFB0C8,#C23B6A 45%,#5E0A2C 85%)}
.dkh-med.wood {background-image:var(--dkh-gem-wood,none),radial-gradient(circle at 38% 30%,#FFF1CC,#C8A064 45%,#5A3E18 85%)}
.dkh-rb .dkh-med svg{width:52px;height:52px}
.dkh-rbt{font-size:21px;-webkit-text-stroke-width:4.6px;color:#FFF6E0}

/* ── 中央の大きなキャラカード（等級バッジ・金の彫り枠・金のLv） ── */
.dkh-card{padding:7px;border-radius:24px}
.dkh-chd{flex:0 0 64px;justify-content:center;padding:0 18px 0 104px;overflow:visible;
  background:linear-gradient(180deg,#3E2A11,#160D04)}
.dkh-cnm{margin-left:0;flex:1;text-align:center;font-size:28px}
/* 等級は大きな飾り文字（お手本は台座なしの立体文字。焼き込みの文字は使わない） */
.dkh-card .dkh-rar{position:absolute;left:10px;top:-8px;z-index:7;font-size:60px;line-height:1;
  -webkit-text-stroke:7px #3A2405;filter:drop-shadow(0 5px 7px rgba(0,0,0,.75))}
/* 主役は胸から上を大きく見せる（お手本の切り取り） */
.dkh-art{background-size:162% auto;background-position:50% 54%}
.dkh-pic::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;
  border:19px solid transparent;
  border-image-source:var(--sk-frame,none);border-image-slice:80;border-image-width:19px;border-image-repeat:stretch}
.dkh-role{left:22px;bottom:20px;z-index:5}
.dkh-lv{right:20px;bottom:18px;z-index:5;width:92px;height:100px;font-size:40px;color:#FFFCF0;-webkit-text-stroke:5px #5A3A04;
  background:linear-gradient(180deg,#FFF9E4 0 8%,#F8DA74 30%,#DCA62E 68%,#A6700F);
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.dkh-lv i{-webkit-text-stroke:3px #5A3A04}
.dkh-plate{flex:0 0 78px;background:linear-gradient(180deg,#6B4F22,#30200B 62%,#1C1205);
  box-shadow:inset 0 0 0 2px rgba(255,226,160,.32)}

/* ── 入場する（お手本は金の大ボタン） ── */
.dkh-enter{flex:0 0 108px;border:6px solid transparent;
  background:linear-gradient(180deg,#FFF9E4 0 7%,#F8DA74 26%,#E3AE31 58%,#A6700F 88%,#7A4E06 100%) padding-box,
             var(--dkh-rimSS) border-box;
  box-shadow:0 8px 0 rgba(0,0,0,.42),0 14px 26px rgba(0,0,0,.5),inset 0 3px 0 rgba(255,255,255,.6),0 0 26px rgba(255,200,80,.34)}
.dkh-entx{color:#FFFDF4;-webkit-text-stroke:9px #6B4406;text-shadow:0 5px 0 rgba(90,58,6,.45)}
.dkh-chev b{background:#FFF9E4;filter:drop-shadow(0 2px 0 #6B4406)}

/* ── 右：ランキング（お手本は羊皮紙の面に金の彫り枠） ── */
.dkh-side{padding:6px 8px 8px;gap:8px;border-radius:0;
  border:26px solid #8A6206;
  border-image-source:var(--sk-frame,none);border-image-slice:80;border-image-width:26px;border-image-repeat:stretch;
  background:
    var(--sk-paper,none) top left/auto 100% repeat-x,
    radial-gradient(130% 78% at 50% 0%,rgba(255,255,255,.5),transparent 56%),
    linear-gradient(180deg,#F8EEDA,#ECDBBC 48%,#D4BA8F);
  background-blend-mode:multiply,normal,normal;
  box-shadow:0 14px 32px rgba(0,0,0,.6)}
.dkh-tab{color:#6B4E1C;-webkit-text-stroke:4px rgba(255,250,232,.92);border-radius:15px 15px 6px 6px;
  background:linear-gradient(180deg,#FCF4E0,#E7D6B4 52%,#C9B187) padding-box,
             linear-gradient(180deg,#E3BE63,#8A6206 52%,#C8952F) border-box;
  border:3px solid transparent;
  box-shadow:0 3px 0 rgba(90,62,18,.35),inset 0 2px 0 rgba(255,255,255,.7)}
.dkh-tab.on{color:#5A3A04;-webkit-text-stroke-color:rgba(255,252,236,.95);
  background:linear-gradient(180deg,#FFF9E4 0 10%,#F8DA74 36%,#DCA62E 74%,#A6700F) padding-box,var(--dkh-rimSS) border-box;
  box-shadow:0 3px 0 rgba(90,62,18,.4),inset 0 2px 0 rgba(255,255,255,.6),0 0 18px rgba(255,200,90,.6)}
.dkh-q{color:#5A3A04;-webkit-text-stroke:4px rgba(255,250,230,.9);
  background:radial-gradient(circle at 38% 28%,#FFF9E4,#F3C433 52%,#A6700F) padding-box,var(--dkh-rimSS) border-box;
  box-shadow:0 4px 0 rgba(90,62,18,.45),inset 0 2px 0 rgba(255,255,255,.6)}
.dkh-left{color:#4E3610;background:linear-gradient(180deg,#E8DABA,#D2C099);
  border:2px solid #A9761A;box-shadow:inset 0 2px 5px rgba(90,62,18,.4)}
.dkh-list{border:3px solid #9A7526;box-shadow:inset 0 3px 9px rgba(90,62,18,.32),inset 0 0 0 2px rgba(255,255,255,.5)}
/* 行は面いっぱいに伸ばす（お手本は4〜5行で右の面が埋まる） */
.dkh-row{flex:1 1 0;min-height:62px;background:linear-gradient(180deg,rgba(255,255,255,.68),rgba(255,255,255,.14));
  border:1px solid rgba(140,106,54,.45);box-shadow:0 1px 0 rgba(255,255,255,.5)}
.dkh-row.top1{background:linear-gradient(180deg,#FFF9D8,#F6D97A 62%,#E9BE4C);border:2px solid #C8952F;

.dkh-me{flex:1.2 1 0;min-height:76px;background:linear-gradient(180deg,#FFFBE2,#F8DA74 62%,#E9BE4C);border:3px solid #C8952F}
/* 月桂冠のかわりに、1〜3位のメダルに小さな冠をのせる（お手本の順位メダル） */
.dkh-medal{position:relative;width:46px;height:46px;font-size:24px;overflow:visible}
.dkh-medal::after{content:"";position:absolute;left:50%;top:-13px;width:28px;height:15px;margin-left:-14px;
  background:linear-gradient(180deg,#FFF6C8,#F2C230 58%,#A9761A);
  clip-path:polygon(0 100%,0 32%,22% 62%,50% 0,78% 62%,100% 32%,100% 100%);
  filter:drop-shadow(0 1px 0 rgba(60,38,4,.6))}
.dkh-medal.m2::after{background:linear-gradient(180deg,#FFFFFF,#C9D3DE 58%,#7A8796)}
.dkh-medal.m3::after{background:linear-gradient(180deg,#FFE0C0,#D08A4E 58%,#7A4418)}
.dkh-list .dkh-face{flex-basis:54px;width:54px;height:54px;border:2px solid #7A5A22;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 2px 3px rgba(0,0,0,.3)}
.dkh-list .dkh-nm{font-size:24px}
.dkh-rpv{font-size:30px;color:#4E3610}
.dkh-cup{width:24px;height:26px}
.dkh-lg{background:linear-gradient(180deg,#4A3516,#1E1206);border:2px solid #A9761A;
  box-shadow:inset 0 2px 0 rgba(255,226,160,.22),0 2px 0 rgba(90,62,18,.3)}

/* ── マイレージ（金の縁の帯＋緑の塗り） ── */
.dkh-mile{flex:0 0 70px;border-radius:16px;border:3px solid transparent;
  background:linear-gradient(180deg,#3E2C12,#180F04) padding-box,var(--dkh-rimSS) border-box;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.65),0 3px 0 rgba(90,62,18,.3)}
.dkh-mbar{border:2px solid #5A4420;box-shadow:inset 0 3px 7px rgba(0,0,0,.72)}
.dkh-mfill{background:linear-gradient(180deg,#CBF8A2 0 24%,#68CC3E 52%,#2F8215)}
.dkh-mfill::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(104deg,transparent 32%,rgba(255,255,255,.42) 50%,transparent 68%)}

/* ── 常設バー（木目の下地＋金の縁） ── */
.wallet.dkh-wallet{padding:8px 26px 0;
  background:
    linear-gradient(180deg,#FFEFC0 0 3px,#B8821C 3px 6px,#6B4A1C 6px 9px,transparent 9px 100%) padding-box,
    linear-gradient(180deg,rgba(255,232,172,.09),rgba(0,0,0,.42)) padding-box,
    var(--dkh-wood-img,none) top left/100% auto repeat-y padding-box,
    linear-gradient(180deg,#5E441C,#32210B 62%,#1A1004) padding-box}
.dkh-wi{border:3px solid transparent;border-radius:15px;
  background:linear-gradient(180deg,#160E05,#2C1C08 58%,#180F04) padding-box,var(--dkh-rimSS) border-box;
  box-shadow:inset 0 3px 7px rgba(0,0,0,.72),0 2px 0 rgba(255,226,160,.18)}
.dkh-lvb{background:linear-gradient(180deg,#FFF9E4,#F3C433 50%,#A6700F);border:2px solid #5A3A04;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 2px 0 rgba(0,0,0,.35)}
.dkh-plus{border:2px solid transparent;
  background:linear-gradient(180deg,#FFF7DC,#E0C68E 56%,#A98F62) padding-box,
             linear-gradient(180deg,#E3BE63,#7A5514) border-box;
  box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.7)}

/* ══════════════════════════════════════════════════════════════

@media (max-height:560px){

  .dkh-evds,.dkh-lgs,.dkh-tbar em,.dkh-mbar em,.dkh-meta,.dkh-role,.dkh-ttl,.dkh-tier,.dkh-cpu,.dkh-you,.dkh-left,.dkh-ict,.dkh-new,
  .dkh-xp em,.dkh-lvb i,.dkh-rpu,.dkh-dot,.dkh-badge,.dkh-intx p,.dkh-tipl li span,.dkh-mdate,.dkh-mnote,.dkh-frnote,.dkh-frmid span,
  .dkh-frlast span,.dkh-steps li span,.dkh-empty span,.dkh-empty b,.dkh-lhd span,.dkh-msit,.dkh-fcsub,.dkh-fctag,.dkh-scwhen,.dkh-scd,
  .dkh-wkleft em,.dkh-wkleft span,.dkh-hrange,.dkh-hnote,.dkh-now,.dkh-chip.it,.dkh-ped b,.dkh-ped span,.dkh-lv i,.dkh-mwarn,.dkh-shint,
  .dkh-bsub,.dkh-mgnote,.dkh-mgnote span,.dkh-fro > b,.dkh-upsub,.dkh-hrw em,.dkh-rbt.two,
  #news .dklogo.dktext i,#mail .dklogo.dktext i,#friends .dklogo.dktext i{font-size:22px}
  /* ホーム：大きな字でもはみ出さない組み方 */
  .dkh-evds{display:none}
  .dkh-rbt{-webkit-text-stroke-width:5px} .dkh-rbt.two{line-height:1}
  .dkh-rb{gap:3px} .dkh-med{width:52px;height:52px} .dkh-med svg{width:36px;height:36px}
  .dkh-ttl{max-width:170px}
  .dkh-tier{display:none}
  .dkh-row,.dkh-me{gap:10px} .dkh-rpv{min-width:0}
  .dkh-no{flex-basis:40px}
  .dkh-left{padding:0 8px} .dkh-q{width:50px;height:50px} .dkh-tab{padding:0 6px}
  .dkh-lgs{display:none} .dkh-tnm{font-size:28px}
  .dkh-mile{gap:8px} .dkh-mbar em{padding-left:10px} .dkh-mbtn{padding-left:12px}
  .dkh-ic{width:100px} .dkh-oshi{padding-right:16px}
  .dkh-wi b{-webkit-text-stroke-width:5px}
  .dkh-wg b{min-width:170px} .dkh-wd b{min-width:80px} .dkh-wr b{min-width:70px}
  .dkh-xp{width:210px}
  .dkh-inrow{gap:14px} .dkh-inic{flex-basis:70px;height:70px} .dkh-inic svg{width:46px;height:46px}
  .dkh-intx p{line-height:1.3}
  /* ガイド：24項目を2段のまま1画面に収める（はみ出すと下の行の文字が切れるため） */
  .dkh-tips{padding:14px 22px}
  .dkh-tiphd{margin-bottom:8px} .dkh-tiphd b{font-size:26px}
  .dkh-tipl li{margin-bottom:6px} .dkh-tipl li span{line-height:1.2}
  .dkh-tipl li i{flex-basis:40px;height:40px;font-size:24px}
  #olroom.dkh-online div[style*="margin-top:16px"] .btn.ghost{font-size:26px!important;min-width:120px}
  .dkh-sl{flex-basis:230px} .dkh-shint{display:none}
  .dkh-seg button{min-width:150px;height:58px}
  .dkh-sched{flex-basis:380px} .dkh-scwhen{flex-basis:96px}
  .dkh-fc{flex-basis:230px}
  .dkh-steps li span{line-height:1.2}
  .dkh-mside,.dkh-frside{flex-basis:430px}
  .dkh-mwarn{display:none} #mail .dklogo.dktext b{font-size:30px}
  #online.dkh-online p,#online.dkh-online label,#online.dkh-online #olMsg,#online.dkh-online #olJoinBox > div:first-child,
  #olroom.dkh-online div[style*="margin-bottom:4px"],#olroom.dkh-online div[style*="margin-bottom:20px"],
  #olroom.dkh-online div[style*="margin-top:16px"],#olroom.dkh-online div[style*="margin-top:6px"],
  #olroom.dkh-online div[style*="margin-top:22px"] > span,#olroom.dkh-online div[style*="border-radius:10px"] b span,
  #olroom.dkh-online div[style*="border-radius:10px"] > span:last-child{font-size:22px!important}
  #online.dkh-online .btn.ghost,#olroom.dkh-online .btn.ghost,#olroom.dkh-online div[style*="border-radius:10px"] b{font-size:26px!important}
  #online.dkh-online p{line-height:1.35!important}
  .dkh-set{width:1080px} .dkh-help{width:1400px} .dkh-hcol:first-child{flex-basis:480px} .dkh-msoon{font-size:22px}
  .dkh-mg{width:1000px} .dkh-mgo{width:400px} .dkh-box{width:280px} .dkh-frm{width:1040px}
  #online.dkh-online > div[style] > div[style*="display:flex"]::before{font-size:22px}
  /* 押せる範囲（透明な当たり判定。見た目は変えない） */
  .dkh-ic::after,.dkh-sw::after,.dkh-plus::after,.dkh-q::after,.dkh-mbtn::after,.dkh-tab::after,.dkh-rb::after,.dkh-enter::before,
  .dkh-ev::before,.dkh-ped::before,.dkh-seg button::after,.dkh-take::before,.dkh-ingo::before,.dkh-oshi::after,.dkh-mailb::after{
    content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:calc(100% + var(--gx,0px) * 2);height:calc(100% + var(--gy,0px) * 2);background:transparent;border:0;z-index:1;pointer-events:auto}
  .dkh-ic::after{--gx:0px;--gy:10px}
  .dkh-sw::after{--gx:19px;--gy:21px}

  .dkh-tab::after{--gy:5px}
  .dkh-ev::before{--gy:6px}

}

/* ══════════ 控えめ・動きを減らす ══════════ */
html.fx-lite .dkh-glow,html.fx-lite .dkh-orbit,html.fx-lite .dkh-olring{display:none}
html.fx-lite .dkh-badgewrap,html.fx-lite .dkh-logo::after{animation:none}
@media (prefers-reduced-motion:reduce){
  .dkh-badgewrap,.dkh-glow,.dkh-enter::after,.dkh-orbit,.dkh-olring,.dkh-msic svg,.dkh-logo::after,.dkh-box .dkh-bin,.dkh-upa,.dkh-upb{animation:none!important}
}
/* スマホ（html.fx-mob）：大きな光輪・カードの揺れ・光のしまを止める（止まった絵）。
   iPhone の WebKit は動く要素とその上に重なる中身を CSS の大きさ×3×3 の画素の層で持つ（1k-fx.html の説明） */
html.fx-mob .dkh-badgewrap,html.fx-mob .dkh-glow,html.fx-mob .dkh-enter::after,html.fx-mob .dkh-orbit,html.fx-mob .dkh-olring,
html.fx-mob .dkh-msic svg,html.fx-mob .dkh-upa,html.fx-mob .dkh-upb,html.fx-mob .dkh-box .dkh-bin{animation:none!important}
html.fx-mob .dkh-logo::after,html.fx-mob .dkh-gl{display:none}

  /* 合流(Merge-r2): 漂う丸2つは止まった絵にする（常時アニメ1画面8個まで・H9）。
     ホーム 9→7、この画面を下に敷く運勢カードのモーダル（844）10→8。金の粒と光の筋はそのまま動かす */
  #home .fx-blob,#friends .fx-blob{animation:none}

/* ══════════════════════════════════════════════════════════════
   第2回・お手本寄せ（ホーム・イベント・郵便・友達・設定）
   ──────────────────────────────────────────────────────────────
   ・左右レール＝色分けの艶タイル＋太い金枠＋大きな絵（rail-tile-*／rail-icon-*）
   ・中央カード＝銀＋金の留め金つき写真額（frame-card-silver／deco-clamp）
   ・ランキング＝羊皮紙＋折り返しタブ＋行ごとの金枠
   ・郵便／友達＝紙の透かし（paper-crest）＋大きな絵＋机の小物で空白を埋める
   ・イベント＝赤帯を彫り枠のリボンに、予定のアイコンを描き絵に
   足すのは「止まった絵」だけ。常時アニメは1つも増やさない（1画面8個まで）。
   ══════════════════════════════════════════════════════════════ */

/* ── ① 左右のレール：色分けの艶タイル＋太い金枠＋大きな絵 ── */
.dkh-rail{padding:10px 7px;gap:7px}
.dkh-rail .dkh-rb.sk-rail,.dkh-rail.l .dkh-rb.sk-rail{
  overflow:visible;justify-content:flex-end;gap:2px;padding:8px 5px 6px;border-radius:17px;
  background:var(--sk-tile,linear-gradient(180deg,#72562A,#32220C 56%,#1A1004)) center/100% 100% no-repeat padding-box,
             linear-gradient(180deg,#FFF3C8,#E3BE63 17%,#8A6206 52%,#C8952F 80%,#FFEFBE) border-box;
  border:4px solid transparent;
  box-shadow:0 5px 0 rgba(38,22,4,.85),0 9px 15px rgba(0,0,0,.5),
             inset 0 2px 0 rgba(255,255,255,.4),inset 0 -11px 17px rgba(0,0,0,.3)}
/* 角飾りつきの彫り枠を重ねる（絵がある時だけ出る。::after は小さい画面の当たり判定が使う） */
.dkh-rail .dkh-rb.sk-rail::before{content:"";position:absolute;inset:-4px;z-index:3;pointer-events:none;
  border:13px solid transparent;
  border-image-source:var(--sk-f2,none);border-image-slice:36;border-image-width:13px;border-image-repeat:stretch}
/* 絵（丸い宝石メダル → タイルいっぱいの描き絵） */
.dkh-rail .dkh-rb.dkh-rion > .ic{width:100%;height:auto;flex:1 1 auto;min-height:38px;
  border:0;border-radius:0;box-shadow:none;
  background:var(--sk-ricon,none) center/contain no-repeat;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))}
.dkh-rail .dkh-rb.dkh-rion > .ic::before{display:none}
.dkh-rail .dkh-rb.dkh-rion > .ic > svg{display:none}
.dkh-rail .dkh-rb.sk-rail > .tx{flex:0 0 auto;font-size:21px;line-height:1.04;color:#FFF6E0;
  -webkit-text-stroke:4.6px rgba(30,16,2,.94);paint-order:stroke fill}
.dkh-rail .dkh-rb.sk-rail > .tx.two{font-size:19px;line-height:1.02}
.dkh-rail .dkh-rb.sk-rail > .dkh-badge{z-index:5}

/* ── ② 中央のキャラカード：銀＋金の留め金つき写真額 ── */
.dkh-strap.dkh-hid{display:none}
.dkh-badgewrap{padding-top:28px}
/* 光の輪は ::before へ移す（::after は写真額の枠が使う） */
.dkh-card::after,.dkh-card.rA::after,.dkh-card.rS::after{box-shadow:none}
.dkh-card::before{content:"";position:absolute;inset:-5px;border-radius:27px;z-index:-1;pointer-events:none;
  box-shadow:0 0 30px 8px rgba(255,200,80,.55);opacity:.5}
.dkh-card.rA::before{box-shadow:0 0 28px 6px rgba(110,190,255,.5)}
.dkh-card.rS::before{box-shadow:0 0 28px 6px rgba(190,140,255,.5)}
.dk .dkh-card.sk-fcard::after{inset:-17px;z-index:7;border-radius:0;
  border-width:42px;border-image-width:42px;border-image-slice:36;
  filter:drop-shadow(0 7px 11px rgba(0,0,0,.6))}
.dkh-badgewrap{padding-top:36px}
.dkh-card.sk-fcard{padding:9px}
.dkh-card .sk-clamp{width:126px;height:45px;top:-30px;z-index:8;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.6)) saturate(1.55) brightness(1.14)}
/* 等級の飾り文字は額縁より前に（お手本は枠の外・左上に大きく乗る） */
.dkh-card .dkh-rar{z-index:9;left:8px;top:-14px;font-size:62px}
/* 名札は金の縁に（お手本は枠つきの名札） */
.dkh-card .dkh-plate{border-radius:0 0 14px 14px;
  background:linear-gradient(180deg,#7C5C2A,#3C2811 58%,#1E1406);
  box-shadow:inset 0 0 0 2px rgba(255,230,168,.45),inset 0 2px 0 rgba(255,255,255,.26),0 -2px 0 rgba(0,0,0,.42)}
.dkh-card .dkh-ttl:not(.none){background:linear-gradient(180deg,#FFF6D2,#F0C64C 58%,#B8870E);border:2px solid #7A5206;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
/* 称号が無い時は暗い地のまま（金地に薄い文字だと読みにくい） */
.dkh-card .dkh-ttl.none{background:rgba(18,11,3,.6);border:2px solid rgba(232,200,120,.42);color:#E8D6B0}

/* ── ③ ランキング：折り返しタブ・行ごとの金枠・太いマイレージ ── */
.dkh-rkh{flex:0 0 62px;align-items:flex-end}
.dkh-tab{height:56px;border-radius:17px 17px 0 0;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.75),0 3px 0 rgba(90,62,18,.3)}
.dkh-tab.on{height:62px;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 0 18px rgba(255,200,90,.6)}
.dkh-list{gap:7px;padding:9px}
.dkh-row{border:2px solid rgba(176,134,58,.78);border-radius:12px;
  background:linear-gradient(180deg,#FFFDF3,#F4E8CD 58%,#E2D0AA);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.85),0 2px 0 rgba(120,86,26,.3)}
.dkh-row.top1{background:linear-gradient(180deg,#FFF9D8,#F6D97A 62%,#E9BE4C);
  border:3px solid #C8952F;box-shadow:inset 0 2px 0 rgba(255,255,255,.75),0 2px 0 rgba(120,86,26,.35),0 0 15px rgba(255,200,90,.45)}
.dkh-me{border:3px solid #C8952F;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.8),0 3px 0 rgba(120,86,26,.38),0 0 18px rgba(255,200,90,.5)}
.dkh-rpv{-webkit-text-stroke:4px rgba(255,252,236,.95);paint-order:stroke fill}
.dkh-no{-webkit-text-stroke:3.4px rgba(255,252,236,.9);paint-order:stroke fill}
.dkh-mile{flex:0 0 78px;gap:13px;padding:0 8px 0 12px}
.dkh-mile::before{content:"";flex:0 0 46px;height:40px;pointer-events:none;
  background:var(--dkh-ico-coins,none) center/contain no-repeat;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}
.dkh-mbar{height:48px;border-radius:13px}
.dkh-mbar em{font-size:21px;-webkit-text-stroke-width:4.4px;padding-left:16px}
.dkh-mbtn{height:60px;font-size:24px}

/* ── ④ 郵便・友達：紙の透かし＋大きな絵＋机の小物（空白を作らない） ── */
.dkh-mb,.dkh-fb{gap:26px}
.dkh-mside,.dkh-frside{flex:0 0 420px;gap:16px;padding:28px 24px}
.dkh-crest{position:relative}
/* 王冠の透かし＋四隅の金の飾り（紙の目。板の2割以上が無地にならないように） */
.dkh-crest::before{content:"";position:absolute;inset:8px;z-index:0;pointer-events:none;opacity:.26;
  background:
    var(--dkh-ico-crown,none) center 44%/auto 26% no-repeat,
    var(--sk-fleur,none) left 12px top 6px/72px auto no-repeat,
    var(--sk-fleur,none) right 12px top 6px/72px auto no-repeat,
    var(--sk-fleur,none) left 12px bottom 12px/72px auto no-repeat,
    var(--sk-fleur,none) right 12px bottom 12px/72px auto no-repeat,
    repeating-linear-gradient(42deg,rgba(150,112,48,.085) 0 2px,transparent 2px 12px)}
.dkh-crest > *{position:relative;z-index:1}
.dkh-empty{position:relative}
