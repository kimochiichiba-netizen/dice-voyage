<style>
/* ══════════════════════════════════════════════════════════════
   ダイスキングダム — ホームまわりの見た目（1t-home.html / WP9）
   ──────────────────────────────────────────────────────────────
   ・担当セレクタ：#home #news #mail #friends .wallet #online #olroom 設定モーダル .dkh-
     （ほかに、社長の指示で「ステージの外の帯」#viewport の背景だけ）。
   ・動かすのは transform と opacity だけ。入場 keyframe の 0% で opacity を下げない。
   ・1600×900 のステージ座標。横長スマホ（高さ560px未満）では主要な文字 26px・本文 22px 以上。
   ══════════════════════════════════════════════════════════════ */
:root{
  --dkh-ink:#FFF6E2; --dkh-edge:#2A1604; --dkh-gold:#FFD44A;
  --dkh-wood:linear-gradient(180deg,#4E3818 0%,#2C1D09 55%,#1A1004 100%);
  --dkh-wood2:linear-gradient(180deg,#6E5326 0%,#3E2C11 52%,#271A07 100%);
  --dkh-lacq:linear-gradient(180deg,#8E1A14 0%,#5E0E0A 55%,#3A0806 100%);
  --dkh-rimA:linear-gradient(160deg,#E6F5FF 0%,#7CC2F5 32%,#1B5A9E 62%,#A8DCFF 86%,#2A6AB0 100%);
  --dkh-rimS:linear-gradient(160deg,#F6EAFF 0%,#C39AF0 32%,#5E2E9E 62%,#E0C8FF 86%,#6A3AA8 100%);
  --dkh-rimSS:linear-gradient(152deg,#FFF7DC 0%,#F0CE72 14%,#C8952F 30%,#7C5410 46%,#A8752A 58%,#F3D583 76%,#8A6314 90%,#FFF3C8 100%);
}

/* ══════════ ステージの外（19.5:9 のスマホで左右に出る帯）＝王宮の木目と金の粒 ══════════ */
html,body{background-color:#140C05}
#viewport{background:
  radial-gradient(1.6px 1.6px at 18% 22%,rgba(255,220,140,.75),transparent 70%) 0 0/89px 97px,
  radial-gradient(1.2px 1.2px at 64% 71%,rgba(255,236,180,.6),transparent 70%) 0 0/131px 113px,
  radial-gradient(2px 2px at 41% 48%,rgba(255,200,90,.5),transparent 70%) 0 0/173px 151px,
  radial-gradient(70% 90% at 50% 50%,rgba(255,176,70,.16),transparent 62%),
  repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 2px,rgba(255,220,160,.035) 2px 5px,transparent 5px 19px),
  repeating-linear-gradient(90deg,transparent 0 61px,rgba(0,0,0,.18) 61px 63px,transparent 63px 97px),
  linear-gradient(180deg,#2E1C0A 0%,#1A1005 48%,#0C0702 100%)}

/* ══════════════════════════════════════════════════════════════
   ホーム
   ══════════════════════════════════════════════════════════════ */
#home.dkh-home::before{content:""!important;position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(64% 70% at 50% 44%,rgba(0,0,0,0) 40%,rgba(10,5,0,.55) 100%),
             linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 16%,rgba(0,0,0,0) 80%,rgba(0,0,0,.45))}
#home.dkh-home > *{z-index:2}
#home.dkh-home > .fx-amb{z-index:1}

/* ── 上段 ── */
.dkh-top{position:absolute;left:0;right:0;top:0;height:100px;z-index:6;pointer-events:none}
.dkh-top > *{pointer-events:auto}
.dkh-logo{position:absolute;left:18px;top:4px;width:368px;height:92px;background:center/contain no-repeat;pointer-events:none;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.7))}
.dkh-logo::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 36%,rgba(255,255,255,.6) 47%,transparent 58%);

  animation:dkShine 5.2s ease-in-out infinite}
.dkh-logotx{display:flex;align-items:center}

.dkh-ev{position:absolute;left:402px;right:192px;top:15px;height:66px;cursor:pointer;overflow:hidden;

  background:var(--dkh-lacq) padding-box,var(--dkh-rimSS) border-box;border:3px solid transparent;
  box-shadow:0 5px 0 rgba(0,0,0,.4),0 10px 22px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,200,160,.35);
  transition:transform var(--fx-t-release) var(--fx-back)}

.dkh-ev:hover{transform:translateY(-2px)}
.dkh-ev:active{transform:translateY(2px) scale(.99);transition-duration:var(--fx-t-press)}
.dkh-evtag{flex:0 0 auto;padding:6px 14px;border-radius:10px;font-family:var(--pop);font-size:20px;line-height:1;color:#5A3A04;

.dkh-evic{flex:0 0 auto;font-style:normal;font-size:34px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6));

@keyframes dkhRing{0%,82%,100%{transform:rotate(0)}87%{transform:rotate(-14deg)}92%{transform:rotate(12deg)}96%{transform:rotate(-5deg)}}
.dkh-evnm{flex:0 0 auto;font-family:var(--pop);font-size:28px;line-height:1;color:var(--dkh-gold);
  -webkit-text-stroke:5px #3A0806;paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.45)}
.dkh-evds{flex:1 1 auto;min-width:0;font-size:20px;font-weight:900;color:#FFE6D0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkh-evtime{flex:0 0 auto;font-size:20px;font-weight:900;color:#FFF3D8;padding:5px 12px;border-radius:9px;background:rgba(0,0,0,.35);

.dkh-evshine{position:absolute;top:0;bottom:0;left:0;width:26%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,236,200,.28),transparent);
  transform:translateX(-120%) skewX(-18deg);animation:dkhSweep 7s ease-in-out infinite}
@keyframes dkhSweep{0%,70%{transform:translateX(-120%) skewX(-18deg)}100%{transform:translateX(520%) skewX(-18deg)}}

.dkh-tr{position:absolute;right:18px;top:14px;display:flex;gap:14px}
.dkh-ic{position:relative;width:72px;height:68px;border-radius:16px;cursor:pointer;display:grid;place-items:center;
  background:var(--dkh-wood2) padding-box,var(--dkh-rimSS) border-box;border:3px solid transparent;
  box-shadow:0 5px 0 rgba(0,0,0,.45),inset 0 2px 0 rgba(255,226,150,.35);transition:transform var(--fx-t-release) var(--fx-back)}
.dkh-ic svg{width:46px;height:46px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.dkh-ic:hover{transform:translateY(-3px)} .dkh-ic:active{transform:translateY(3px) scale(.96);transition-duration:var(--fx-t-press)}
.dkh-ic[data-dkgo="settings"]:hover svg{transform:rotate(40deg);transition:transform .5s var(--fx-out)}
.dkh-dot,.dkh-badge{position:absolute;right:-9px;top:-10px;min-width:30px;height:30px;padding:0 7px;border-radius:15px;z-index:3;
  display:flex;align-items:center;justify-content:center;font-style:normal;font-size:18px;font-weight:900;color:#fff;line-height:1;
  background:linear-gradient(180deg,#FF6A5E,#C9302C);border:2px solid #FFF1D0;box-shadow:0 2px 4px rgba(0,0,0,.5);
  animation:dkBadge 1.6s ease-in-out infinite;pointer-events:none}

/* ── 左右のレール（宝石のメダル＋金縁の木札） ── */
.dkh-rail{position:absolute;top:108px;width:164px;z-index:5;display:flex;flex-direction:column;gap:10px}
.dkh-rail.l{left:14px} .dkh-rail.r{right:14px}
.dkh-rb{position:relative;height:128px;border-radius:20px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:var(--dkh-wood) padding-box,linear-gradient(180deg,#C8952F,#6B4408 60%,#A8752A) border-box;border:3px solid transparent;
  box-shadow:0 5px 0 rgba(0,0,0,.5),0 10px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,220,150,.22),inset 0 -12px 18px rgba(0,0,0,.35);
  transition:transform var(--fx-t-release) var(--fx-back)}
.dkh-rb:hover{transform:translateY(-4px)}
.dkh-rb:active{transform:translateY(3px) scale(.97);transition-duration:var(--fx-t-press);transition-timing-function:var(--fx-out)}
.dkh-med{position:relative;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  border:3px solid #F3D583;box-shadow:0 0 0 3px #3A2405,0 4px 8px rgba(0,0,0,.6),inset 0 -8px 14px rgba(0,0,0,.35),inset 0 6px 10px rgba(255,255,255,.35)}
.dkh-med svg{position:relative;z-index:1;width:54px;height:54px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.45));transition:transform .3s var(--fx-back)}
.dkh-rb:hover .dkh-med svg{transform:scale(1.1) rotate(-6deg)}
.dkh-med::before{content:"";position:absolute;left:10%;right:10%;top:5%;height:42%;border-radius:50%;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
.dkh-med::after{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:34%;z-index:2;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-140%) skewX(-16deg);
  animation:dkhSweep 6.4s ease-in-out infinite}
.dkh-rail .dkh-rb:nth-child(2) .dkh-med::after{animation-delay:.5s}
.dkh-rail .dkh-rb:nth-child(3) .dkh-med::after{animation-delay:1s}
.dkh-rail .dkh-rb:nth-child(4) .dkh-med::after{animation-delay:1.5s}
.dkh-rail .dkh-rb:nth-child(5) .dkh-med::after{animation-delay:2s}
.dkh-rail.r .dkh-rb .dkh-med::after{animation-duration:7.2s}
.dkh-med.ruby {background:radial-gradient(circle at 38% 30%,#FF9A86,#E0402E 45%,#8E1410 85%)}
.dkh-med.amber{background:radial-gradient(circle at 38% 30%,#FFE9A0,#F2A81C 45%,#9A5A04 85%)}
.dkh-med.emer {background:radial-gradient(circle at 38% 30%,#C6F59A,#4FB43A 45%,#1C5E10 85%)}
.dkh-med.sapph{background:radial-gradient(circle at 38% 30%,#BFE8FF,#2E8BE0 45%,#0B2C5E 85%)}
.dkh-med.amet {background:radial-gradient(circle at 38% 30%,#FFB0C8,#C23B6A 45%,#5E0A2C 85%)}
.dkh-rbt{font-size:20px;font-weight:900;line-height:1;color:#FFF3D8;-webkit-text-stroke:4px var(--dkh-edge);paint-order:stroke fill;letter-spacing:.03em}

/* ── 首から下げたカード ── */
.dkh-cardcol{position:absolute;left:194px;top:96px;width:456px;bottom:86px;z-index:4;display:flex;flex-direction:column;gap:14px}
.dkh-badgewrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;padding-top:34px;
  animation:dkhSway 7s ease-in-out infinite;transform-origin:50% 0}
@keyframes dkhSway{0%,100%{transform:rotate(0)}50%{transform:rotate(.7deg) translateY(3px)}}
.dkh-strap{position:absolute;left:50%;top:-8px;width:76px;height:50px;margin-left:-38px;z-index:3;pointer-events:none}
.dkh-strap::before{content:"";position:absolute;left:14px;right:14px;top:0;height:30px;border-radius:0 0 6px 6px;
  background:repeating-linear-gradient(90deg,rgba(255,220,150,.45) 0 2px,transparent 2px 6px) center/100% 2px no-repeat,
             linear-gradient(90deg,#5E0E0A,#B0281E 30%,#D8463A 50%,#B0281E 70%,#5E0E0A);
  box-shadow:0 3px 4px rgba(0,0,0,.5)}
.dkh-strap i{position:absolute;left:50%;bottom:0;width:34px;height:34px;margin-left:-17px;border-radius:50%;
  border:6px solid #E8C878;box-shadow:0 0 0 2px #5A3A04,inset 0 0 0 2px #5A3A04,0 3px 5px rgba(0,0,0,.55)}
.dkh-card{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border-radius:22px;padding:6px;isolation:isolate;
  background:var(--dkh-rimA);box-shadow:0 10px 0 rgba(0,0,0,.3),0 18px 36px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.35)}
.dkh-card.rS{background:var(--dkh-rimS)}
.dkh-card.rSS{background:var(--dkh-rimSS)}
.dkh-card::after{content:"";position:absolute;inset:-4px;border-radius:26px;z-index:-1;pointer-events:none;
  box-shadow:0 0 30px 8px rgba(255,200,80,.55);opacity:.35;animation:fxBreath 2.6s var(--fx-inout) infinite}
.dkh-card.rA::after{box-shadow:0 0 28px 6px rgba(110,190,255,.5)}
.dkh-card.rS::after{box-shadow:0 0 28px 6px rgba(190,140,255,.5)}
.dkh-chd{flex:0 0 56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-radius:16px 16px 0 0;
  background:linear-gradient(180deg,#2E1E0A,#110A03)}
.dkh-rar{font-family:var(--caps);font-size:36px;line-height:1;color:var(--dkh-gold);-webkit-text-stroke:5px #3A2405;paint-order:stroke fill;
  text-shadow:0 3px 0 #C98A12}
.dkh-card.rA .dkh-rar{color:#CFEAFF;text-shadow:0 3px 0 #1B5A9E}
.dkh-card.rS .dkh-rar{color:#EAD8FF;text-shadow:0 3px 0 #5E2E9E}
.dkh-cnm{margin-left:auto;font-size:26px;font-weight:900;color:#FFF0CE;-webkit-text-stroke:4px var(--dkh-edge);paint-order:stroke fill;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkh-pic{position:relative;flex:1;min-height:0;overflow:hidden;isolation:isolate;
  background:radial-gradient(92% 80% at 50% 40%,#FFFCF0 0%,#FDEFC8 38%,#EBC274 64%,#A06C22 88%,#4A2E08 100%)}
.dkh-card.rA .dkh-pic{background:radial-gradient(90% 76% at 50% 40%,#FFFFFF 0%,#DDF1FF 30%,#8CC6F0 60%,#2A6AB0 88%,#0E2E5E 100%)}
.dkh-card.rS .dkh-pic{background:radial-gradient(90% 76% at 50% 40%,#FFFFFF 0%,#F2E4FF 30%,#C6A2F0 60%,#6A3AA8 88%,#2A0E4E 100%)}
.dkh-glow{position:absolute;left:50%;top:42%;width:900px;height:900px;margin:-450px 0 0 -450px;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,255,255,.34) 0 7deg,rgba(255,255,255,0) 7deg 19deg);
  -webkit-mask:radial-gradient(circle,#000 8%,transparent 46%);mask:radial-gradient(circle,#000 8%,transparent 46%);
  animation:fxSpin 46s linear infinite}
.dkh-art{position:absolute;inset:0;background-repeat:no-repeat;background-size:128% auto;background-position:50% 86%;mix-blend-mode:multiply}
.dkh-ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--pop);font-size:160px;color:rgba(90,58,4,.35)}
.dkh-gloss{position:absolute;top:-10%;bottom:-10%;left:0;width:28%;pointer-events:none;z-index:2;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-150%) skewX(-16deg);
  animation:dkhSweep 5.6s ease-in-out 1.2s infinite}
.dkh-role{position:absolute;left:12px;bottom:12px;z-index:3;padding:6px 14px;border-radius:10px;font-size:20px;font-weight:900;color:#FFF3D8;
  background:rgba(26,14,4,.78);border:2px solid rgba(255,210,120,.55)}
.dkh-lv{position:absolute;right:12px;bottom:10px;z-index:3;width:76px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--pop);font-size:34px;line-height:.95;color:#fff;-webkit-text-stroke:5px #0C2A52;paint-order:stroke fill;
  background:linear-gradient(180deg,#9FD6FF,#2E8BE0 52%,#14559E);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.dkh-lv i{font-style:normal;font-size:18px;-webkit-text-stroke:3px #0C2A52}
.dkh-plate{flex:0 0 76px;display:flex;align-items:center;gap:12px;padding:0 12px 0 14px;border-radius:0 0 16px 16px;
  background:linear-gradient(180deg,#5A4220,#2A1C08)}
.dkh-ttl{flex:0 0 auto;max-width:150px;padding:5px 12px;border-radius:9px;font-size:18px;font-weight:900;line-height:1.1;color:#3A2405;
  background:linear-gradient(180deg,#FFF0BE,#E8B23A);border:2px solid #8A6206;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkh-ttl.none{color:#E8D6B0;background:rgba(0,0,0,.3);border-color:rgba(232,200,120,.35)}
.dkh-pnm{flex:1;min-width:0;font-size:26px;font-weight:900;color:#FFF0CE;-webkit-text-stroke:4px var(--dkh-edge);paint-order:stroke fill;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkh-sw{position:relative;flex:0 0 auto;width:58px;height:54px;border-radius:12px;cursor:pointer;display:grid;place-items:center;
  background:linear-gradient(180deg,#F4E7CC,#C5AC82 58%,#9B8460);border:2px solid #5B431F;box-shadow:0 3px 0 rgba(0,0,0,.4);
  transition:transform var(--fx-t-release) var(--fx-back)}
.dkh-sw svg{width:40px;height:40px}
.dkh-sw:hover svg{transform:rotate(180deg);transition:transform .5s var(--fx-out)}
.dkh-sw:active{transform:translateY(2px) scale(.95)}

/* 入場する（エメラルド＋金枠。矢印が流れる） */
.dkh-enter{position:relative;flex:0 0 104px;cursor:pointer;border-radius:22px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;gap:22px;
  background:linear-gradient(180deg,#D2F7A6 0%,#86DA55 16%,#46A626 56%,#1F5E0C 100%) padding-box,var(--dkh-rimSS) border-box;
  border:5px solid transparent;transition:transform var(--fx-t-release) var(--fx-back)}
.dkh-enter:hover{transform:translateY(-3px)}
.dkh-enter:active{transform:translateY(4px) scale(.98);transition-duration:var(--fx-t-press)}
.dkh-enter::after{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:22%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-150%) skewX(-18deg);
  animation:dkhSweep 3.6s ease-in-out infinite}
.dkh-entx{position:relative;font-family:var(--pop);font-size:50px;line-height:1;color:#fff;letter-spacing:.12em;

  background:linear-gradient(180deg,rgba(56,38,16,.96),rgba(22,13,4,.97)) padding-box,var(--dkh-rimSS) border-box;border:4px solid transparent;

.dkh-tnm{font-family:var(--pop);font-size:34px;line-height:1;color:var(--tc,#FFD44A);-webkit-text-stroke:6px var(--dkh-edge);paint-order:stroke fill;

.dkh-lgs{font-size:20px;font-weight:900;color:#EBD6AC}
.dkh-lgrp{display:flex;align-items:baseline;gap:6px}
.dkh-lgrp b{font-family:var(--pop);font-size:44px;line-height:1;color:var(--dkh-gold);-webkit-text-stroke:6px var(--dkh-edge);paint-order:stroke fill;
  font-variant-numeric:tabular-nums}
.dkh-lgrp i{font-style:normal;font-family:var(--caps);font-size:22px;color:#F0DCA8}
.dkh-q{position:relative;flex:0 0 auto;width:58px;height:58px;border-radius:50%;cursor:pointer;
  font-family:var(--pop);font-size:30px;line-height:1;color:#fff;-webkit-text-stroke:4px #0B2C5E;paint-order:stroke fill;
  background:radial-gradient(circle at 38% 30%,#BFE8FF,#2E8BE0 50%,#0B2C5E) padding-box,var(--dkh-rimSS) border-box;border:3px solid transparent;

.dkh-info{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:18px 20px;overflow-y:auto}
.dkh-inrow{flex:1;min-height:118px;display:flex;align-items:center;gap:20px;padding:10px 16px;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.08));border:1px solid rgba(150,116,64,.35)}
.dkh-inic{flex:0 0 84px;height:84px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 38% 30%,#6E5326,#2A1C08);border:3px solid #F3D583;box-shadow:0 0 0 3px #3A2405,0 4px 8px rgba(0,0,0,.4)}
.dkh-inic svg{width:56px;height:56px}
.dkh-intx{flex:1;min-width:0}
.dkh-intx b{display:block;font-size:26px;font-weight:900;color:#42300F}
.dkh-intx p{margin-top:4px;font-size:19px;font-weight:700;line-height:1.45;color:#5A4424}
.dkh-ingo{flex:0 0 auto;font-size:22px;padding:14px 22px}
.dkh-tips{flex:1;min-height:0;padding:20px 26px;display:flex;flex-direction:column;overflow-y:auto}
.dkh-tiphd{text-align:center;margin-bottom:12px}
.dkh-tiphd b{font-family:var(--pop);font-size:32px;color:#5A3E12;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.dkh-tipl{list-style:none;columns:2;column-gap:36px;column-rule:2px dashed rgba(138,99,20,.35)}
.dkh-tipl li{break-inside:avoid;display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.dkh-tipl li i{flex:0 0 36px;height:36px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--pop);font-size:20px;color:#fff;
  -webkit-text-stroke:3px #5A3A04;paint-order:stroke fill;background:radial-gradient(circle at 35% 30%,#FFF3C8,#F2C230 55%,#A9761A);border:2px solid #5A3A04}
.dkh-tipl li span{font-size:20px;font-weight:700;line-height:1.5;color:#42300F}

/* ── 郵便箱 ── */
.dkh-mrow{flex:0 0 auto;min-height:92px;display:flex;align-items:center;gap:16px;padding:8px 14px;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.1));border:1px solid rgba(150,116,64,.35);
  transition:transform .3s var(--fx-out),opacity .3s}
.dkh-mrow.soon{border-color:#C9302C;box-shadow:inset 4px 0 0 #C9302C}
.dkh-mrow.dkh-taken{transform:translateX(40px);opacity:.35}
.dkh-mic{flex:0 0 68px;height:68px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:38px;line-height:1;
  background:radial-gradient(circle at 38% 30%,#FFF6D2,#E8C878 55%,#A9761A);border:3px solid #5A3A04;box-shadow:0 3px 6px rgba(0,0,0,.35)}
.dkh-mmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.dkh-mnm{font-size:24px;font-weight:900;color:#42300F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkh-mdate{font-size:18px;font-weight:700;color:#6E5A34}
.dkh-mdate em{font-style:normal;font-weight:900;color:#A8210F}
.dkh-mrw{flex:0 0 auto;display:flex;gap:8px}
.dkh-chip{display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-radius:11px;font-family:var(--pop);font-size:22px;color:#5A3E12;
  background:linear-gradient(180deg,#FFF6E0,#E6D2A8);border:2px solid #A9761A}
.dkh-chip .dkh-coin{width:28px;height:28px;border-width:2px} .dkh-chip .dkh-gem{width:28px;height:24px}
.dkh-chip.it{font-family:inherit;font-weight:900;font-size:18px}
.dkh-take{flex:0 0 auto;font-size:24px;padding:14px 20px}
.dkh-msic svg{width:150px;height:150px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)) drop-shadow(0 0 22px rgba(255,200,80,.45));animation:fxFloat 4s ease-in-out infinite}
.dkh-msic{font-style:normal}
.dkh-mst{font-family:var(--pop);font-size:28px;color:var(--dkh-gold);-webkit-text-stroke:4px var(--dkh-edge);paint-order:stroke fill}
.dkh-msum{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.dkh-msum span{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,210,120,.4)}
.dkh-msum b{font-family:var(--pop);font-size:32px;color:#FFF6E2;-webkit-text-stroke:5px #1A0F03;paint-order:stroke fill;font-variant-numeric:tabular-nums}
.dkh-msit{font-size:20px;font-weight:900;color:#F0DCA8}
.dkh-msoon{font-size:20px;font-weight:900;color:#FFE0D8;padding:6px 14px;border-radius:10px;background:rgba(201,48,44,.38);border:1px solid #FF6A5E}
.dkh-all{width:100%;height:84px;font-size:32px;margin-top:auto}
.dkh-mnote,.dkh-frnote{font-size:18px;font-weight:700;color:#E6D4AE;line-height:1.5}

/* ── ともだち ── */
.dkh-frrow{flex:0 0 auto;min-height:96px;display:flex;align-items:center;gap:16px;padding:8px 16px;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.1));border:1px solid rgba(150,116,64,.35)}
.dkh-frrow .dkh-face{flex-basis:72px;width:72px;height:72px;border-radius:14px}
.dkh-frmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dkh-frmid b{font-size:26px;font-weight:900;color:#42300F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkh-frmid span{font-size:18px;font-weight:700;color:#6E5A34}
.dkh-frlast{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.dkh-frlast span{font-size:16px;font-weight:700;color:#8A6A34}
.dkh-frlast b{font-family:var(--pop);font-size:24px;color:#5A3E12}
.dkh-globe{position:relative;width:190px;height:190px;display:grid;place-items:center}
.dkh-globe svg{position:relative;width:150px;height:150px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)) drop-shadow(0 0 22px rgba(90,180,255,.5))}
.dkh-orbit{position:absolute;inset:0;border-radius:50%;border:3px dashed rgba(255,214,110,.75);animation:fxSpin 16s linear infinite}
.dkh-orbit::after{content:"";position:absolute;left:50%;top:-9px;width:16px;height:16px;margin-left:-8px;border-radius:50%;
  background:radial-gradient(circle,#FFFBE8,#FFD44A 60%,#A9761A);box-shadow:0 0 12px 4px rgba(255,210,90,.8)}
.dkh-frst{font-family:var(--pop);font-size:32px;color:var(--dkh-gold);-webkit-text-stroke:5px var(--dkh-edge);paint-order:stroke fill}
.dkh-steps{list-style:none;width:100%;display:flex;flex-direction:column;gap:10px;text-align:left}
.dkh-steps li{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;background:rgba(255,240,200,.07);border:1px solid rgba(196,150,70,.3)}
.dkh-steps li i{flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--pop);font-size:22px;color:#fff;
  -webkit-text-stroke:3px #5A3A04;paint-order:stroke fill;background:radial-gradient(circle at 35% 30%,#FFF3C8,#F2C230 55%,#A9761A);border:2px solid #5A3A04}
.dkh-steps li span{font-size:19px;font-weight:900;color:#F4E3BD;line-height:1.35}
.dkh-olbtn{width:100%;height:84px;font-size:30px;margin-top:auto}

/* ══════════════════════════════════════════════════════════════
   モーダル（設定・等級と報酬・マイレージキューブ）
   ══════════════════════════════════════════════════════════════ */
.dkh-modal{position:relative;border-radius:22px;padding:66px 34px 26px;
  background:linear-gradient(180deg,rgba(58,40,18,.98),rgba(20,12,4,.99)) padding-box,var(--dkh-rimSS) border-box;border:5px solid transparent;
  box-shadow:0 10px 0 rgba(0,0,0,.35),0 24px 60px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,220,150,.25),inset 0 0 50px rgba(0,0,0,.5)}
.dkh-mhd{position:absolute;left:50%;top:-4px;transform:translateX(-50%);height:58px;padding:0 70px;display:flex;align-items:center;white-space:nowrap;
  background:linear-gradient(180deg,#F0604A 0 10%,#C9302C 45%,#8E1410);clip-path:polygon(0 0,100% 0,94% 100%,6% 100%)}
.dkh-mhd b{font-family:var(--pop);font-size:32px;color:#fff;-webkit-text-stroke:6px #5A1206;paint-order:stroke fill}
.dkh-mbtns{display:flex;justify-content:center;gap:18px;margin-top:22px}
.dkh-mbtns .dkbtn{min-width:220px;height:70px;font-size:28px}
.dkbtn.dkh-wood{background:var(--dkh-wood2);border:3px solid #A9761A;color:#FFF3D8;-webkit-text-stroke:4px var(--dkh-edge)}

.dkh-set{width:900px}
.dkh-srows{display:flex;flex-direction:column;gap:12px}
.dkh-srow{display:flex;align-items:center;gap:20px;min-height:76px;padding:6px 18px;border-radius:14px;background:rgba(255,240,200,.06);border:1px solid rgba(196,150,70,.3)}
.dkh-sl{flex:0 0 200px;font-size:24px;font-weight:900;color:#F4E3BD}
.dkh-sc{flex:1;min-width:0;display:flex;align-items:center;gap:18px}
.dkh-range{flex:1;-webkit-appearance:none;appearance:none;height:14px;border-radius:7px;cursor:pointer;
  background:linear-gradient(180deg,#1A1004,#3A2A14);border:2px solid #7A5A22;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.dkh-range::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#FFF6C8,#F2C230 50%,#A9761A);border:3px solid #3A2405;box-shadow:0 3px 6px rgba(0,0,0,.6)}
.dkh-range::-moz-range-thumb{width:36px;height:36px;border-radius:50%;background:#F2C230;border:3px solid #3A2405}
.dkh-rv{flex:0 0 64px;text-align:right;font-family:var(--pop);font-size:28px;color:var(--dkh-gold);-webkit-text-stroke:4px var(--dkh-edge);paint-order:stroke fill}
.dkh-seg button{flex:0 0 auto;min-width:128px;height:54px;padding:0 16px;font-size:22px;white-space:nowrap}

.dkh-help{width:960px}
.dkh-hrows{display:flex;flex-direction:column;gap:8px}
.dkh-hrow{position:relative;display:flex;align-items:center;gap:18px;height:76px;padding:0 20px;border-radius:14px;background:rgba(255,240,200,.06);
  border:1px solid rgba(196,150,70,.3)}
.dkh-hrow.on{background:linear-gradient(90deg,rgba(46,139,224,.45),rgba(46,139,224,.1));border:2px solid #8FD2FF}
.dkh-hrow .dkh-emb{width:52px;height:59px}
.dkh-hnm{flex:0 0 150px;font-size:28px;font-weight:900;color:#FFF0CE;-webkit-text-stroke:4px var(--dkh-edge);paint-order:stroke fill}
.dkh-hrange{flex:1;font-size:22px;font-weight:900;color:#F0DCA8;font-variant-numeric:tabular-nums;white-space:nowrap}
.dkh-hrw{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-family:var(--pop);font-size:24px;color:#FFF6E2}
.dkh-hrw .dkh-coin{width:30px;height:30px;border-width:2px} .dkh-hrw .dkh-gem{width:30px;height:26px;margin-left:8px}
.dkh-now{position:absolute;left:-12px;top:-12px;font-style:normal;font-size:16px;font-weight:900;color:#fff;padding:3px 10px;border-radius:8px;
  background:linear-gradient(180deg,#FF6A5E,#C9302C);border:2px solid #FFF1D0}
.dkh-hnote{margin-top:16px;font-size:20px;font-weight:700;line-height:1.6;color:#E6D4AE;text-align:center}
.dkh-hnote b{color:var(--dkh-gold)}

.dkh-rev{width:640px;display:flex;flex-direction:column;align-items:center;gap:10px}
.dkh-revstage{position:relative;width:100%;height:380px;display:grid;place-items:center;overflow:hidden;border-radius:16px;
  background:radial-gradient(60% 60% at 50% 50%,rgba(255,200,90,.35),transparent 70%)}
.dkh-revstage .fx-rays{opacity:.9}
.dkh-revcard{position:relative;z-index:1;width:236px;height:330px;border-radius:18px;padding:6px;background:var(--dkh-rimS);
  box-shadow:0 10px 0 rgba(0,0,0,.35),0 0 40px 10px rgba(190,140,255,.55);animation:dkhRevIn .7s var(--fx-spring) both}
.dkh-revcard.rSS{background:var(--dkh-rimSS);box-shadow:0 10px 0 rgba(0,0,0,.35),0 0 50px 14px rgba(255,200,80,.7)}
@keyframes dkhRevIn{0%{transform:scale(.86) rotateY(90deg)}60%{transform:scale(1.08) rotateY(0)}}
.dkh-revpic{position:absolute;inset:6px;border-radius:13px;overflow:hidden;isolation:isolate;
  background:radial-gradient(92% 80% at 50% 40%,#FFFCF0 0%,#FDEFC8 38%,#EBC274 64%,#A06C22 88%,#4A2E08 100%)}
.dkh-revcard.rS .dkh-revpic{background:radial-gradient(90% 76% at 50% 40%,#FFFFFF 0%,#F2E4FF 30%,#C6A2F0 60%,#6A3AA8 88%,#2A0E4E 100%)}
.dkh-revart{position:absolute;inset:0;background-repeat:no-repeat;background-size:130% auto;background-position:50% 86%;mix-blend-mode:multiply}
.dkh-revcard .dkh-rar{position:absolute;left:14px;top:10px;z-index:2;font-size:34px}
.dkh-new{position:absolute;right:-14px;top:-14px;z-index:3;font-style:normal;padding:6px 14px;border-radius:12px;font-family:var(--caps);font-size:22px;color:#fff;
  background:linear-gradient(180deg,#FF6A5E,#C9302C);border:3px solid #FFF1D0;animation:fxPop 320ms var(--fx-spring) .5s both}
.dkh-revnm{font-family:var(--pop);font-size:38px;color:var(--dkh-gold);-webkit-text-stroke:6px var(--dkh-edge);paint-order:stroke fill}
.dkh-revsub{font-size:22px;font-weight:900;color:#F0DCA8}
.dkh-tic{font-style:normal;font-size:26px;line-height:1}
#toastL .toast .ic svg,#toastR .toast .ic svg{width:34px;height:34px}

/* ══════════════════════════════════════════════════════════════
   オンライン（入口 #online と部屋 #olroom）— 7-online.js のインライン style を王宮に
   ══════════════════════════════════════════════════════════════ */
#online.dkh-online,#olroom.dkh-online{padding:0!important}
.dkh-olcrest{position:absolute;left:50%;top:14px;width:120px;height:120px;margin-left:-60px;z-index:3;display:grid;place-items:center;pointer-events:none}
.dkh-olcrest svg{position:relative;width:96px;height:96px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6)) drop-shadow(0 0 20px rgba(90,180,255,.6))}
.dkh-olring{position:absolute;inset:0;border-radius:50%;border:3px dashed rgba(255,214,110,.8);animation:fxSpin 14s linear infinite}
#online.dkh-online > div[style],#olroom.dkh-online > div[style]{position:absolute!important;left:50%!important;top:118px!important;
  transform:translateX(-50%);width:1040px!important;max-width:none!important;margin:0!important;z-index:2;border-radius:24px;
  background:linear-gradient(180deg,rgba(58,40,18,.97),rgba(22,13,4,.98)) padding-box,var(--dkh-rimSS) border-box;border:5px solid transparent;
  box-shadow:0 10px 0 rgba(0,0,0,.35),0 24px 50px rgba(0,0,0,.65),inset 0 2px 0 rgba(255,220,150,.25),inset 0 0 50px rgba(0,0,0,.5)}
/* 入口：2列（左＝部屋をつくる／右＝あいことばで入る） */
#online.dkh-online > div[style]{display:grid!important;grid-template-columns:1fr 1fr;column-gap:36px;row-gap:18px;
  padding:54px 46px 30px!important;text-align:center!important}
#online.dkh-online h2{grid-column:1 / 3;justify-self:center;position:relative;margin:-84px 0 0!important;height:64px;padding:0 80px;display:flex;align-items:center;
  font-family:var(--pop)!important;font-size:36px!important;color:#fff!important;-webkit-text-stroke:6px #0B2C5E;paint-order:stroke fill;
  background:linear-gradient(180deg,#8FD2FF 0 10%,#2E8BE0 45%,#0B2C5E);clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%)}
#online.dkh-online p{grid-column:1 / 3;margin:0!important;font-size:22px!important;line-height:1.6!important;color:#F4E3BD!important;font-weight:700}
.dkh-olent .dkh-olcrest{display:none}
#online.dkh-online > div[style] > div[style*="margin:0 0 20px"]{grid-column:1 / 3;grid-row:3;margin:0!important;display:flex;align-items:center;justify-content:center;gap:18px;
  padding:12px 20px;border-radius:18px;background:rgba(255,240,200,.06);border:1px solid rgba(196,150,70,.35)}
#online.dkh-online > div[style] > div[style*="display:flex"]{grid-column:1;grid-row:4;display:flex!important;flex-direction:column;align-items:center;justify-content:center!important;
  gap:18px!important;padding:22px 20px;border-radius:18px;background:rgba(255,240,200,.06);border:1px solid rgba(196,150,70,.35)}
#online.dkh-online > div[style] > div[style*="display:flex"]::before{content:"部屋をつくって、友だちを呼ぶ";font-size:22px;font-weight:900;color:#F4E3BD}
#online.dkh-online #olJoinBox{grid-column:2;grid-row:4;display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  margin:0!important;padding:20px;border-radius:18px;background:rgba(255,240,200,.06);border:1px solid rgba(196,150,70,.35)}
#online.dkh-online #olJoinBox > div:first-child{font-size:22px!important;color:#F4E3BD!important;font-weight:900;margin:0!important}
#online.dkh-online #olJoin{display:none!important}
#online.dkh-online > div[style] > div[style*="margin-top:26px"]{grid-column:1 / 3;margin:0!important}
#online.dkh-online label{font-size:24px!important;font-weight:900;color:#F4E3BD!important;margin:0!important}
#online.dkh-online #olName{width:340px!important;height:64px;font-size:28px!important;font-weight:900;padding:0 16px!important;border-radius:14px!important;
  color:#42300F!important;text-align:center;background:var(--fx-parch)!important;border:3px solid #A9761A!important;
  box-shadow:inset 0 3px 8px rgba(120,80,20,.45),0 2px 0 rgba(255,230,170,.3)}
#online.dkh-online #olCode{width:380px!important;height:92px;font-size:54px!important;letter-spacing:18px!important;padding:0 0 0 18px!important;border-radius:16px!important;
  color:#FFD44A!important;-webkit-text-stroke:3px #3A2405;background:linear-gradient(180deg,#2A1C08,#0F0A03)!important;
  border:4px solid #C8952F!important;box-shadow:inset 0 4px 10px rgba(0,0,0,.7),0 0 18px rgba(255,200,80,.35)}
#online.dkh-online #olCode::placeholder{color:rgba(255,212,74,.35)}
#online.dkh-online #olMsg{font-size:20px!important;color:#FFD9A0!important;font-weight:900;min-height:28px;margin:0!important;line-height:1.5}
#online.dkh-online .btn,#olroom.dkh-online .btn{position:relative;border-radius:14px!important;font-family:var(--pop)!important;line-height:1;
  -webkit-text-stroke:4px rgba(30,18,4,.85);paint-order:stroke fill;transition:transform var(--fx-t-release) var(--fx-back)}
#online.dkh-online .btn.gold,#olroom.dkh-online .btn.gold{min-width:300px;height:80px;font-size:30px!important;color:#5A3A04!important;
  -webkit-text-stroke:4px rgba(255,246,214,.85);
  background-image:linear-gradient(180deg,var(--dk-g1) 0 8%,var(--dk-g2) 30%,var(--dk-g3) 70%,var(--dk-g4))!important;
  border:3px solid #7A5206!important;box-shadow:0 6px 0 rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.5),0 0 18px rgba(255,200,80,.4)!important}
#online.dkh-online .btn.ghost,#olroom.dkh-online .btn.ghost{min-width:220px;height:66px;font-size:26px!important;color:#FFF3D8!important;
  background-image:var(--dkh-wood2)!important;border:3px solid #A9761A!important;box-shadow:0 5px 0 rgba(0,0,0,.45)!important}
#online.dkh-online #olGo{min-width:240px}
/* 部屋：あいことばは金の札、席は木札 */
#olroom.dkh-online > div[style]{padding:30px 50px 30px!important;text-align:center!important}
#olroom.dkh-online div[style*="margin-bottom:4px"]{font-size:22px!important;color:#F4E3BD!important;font-weight:900;margin:0 0 8px!important}
#olroom.dkh-online div[style*="font-size:58px"]{display:inline-block;margin:0 0 10px!important;padding:10px 30px 10px 52px!important;border-radius:18px;
  font-size:72px!important;letter-spacing:30px!important;color:#FFD44A!important;-webkit-text-stroke:6px #3A2405;paint-order:stroke fill;
  text-shadow:0 5px 0 #8A5E06!important;background:linear-gradient(180deg,#FFF0BE 0 4%,#6B4408 5%,#2A1C08 40%,#140C04);
  border:4px solid #F2C230;box-shadow:inset 0 4px 12px rgba(0,0,0,.7),0 0 26px rgba(255,200,80,.5);animation:fxPop 420ms var(--fx-spring) both}
