<style>
/* ══════════════════════════════════════════════════════════════
   ダイスボヤージュ — 質感レイヤー
   「安っぽさ」の正体は ①平坦なグラデ ②押した手応えのないボタン
   ③画面が一瞬で切り替わる ④文字と枠が硬い、の4つ。ここで潰す。
   ══════════════════════════════════════════════════════════════ */

/* ── ① 面に手ざわりを出す ───────────────────────────── */
/* 金の枠：単純な2色グラデをやめ、ハイライト線を通した6段のグラデにする */
.gild,.heroPic,.cardDetail,.reward,.deedcard,.pan{
  background:linear-gradient(152deg,
    #FFF7DC 0%, #F0CE72 14%, #C8952F 30%, #7C5410 46%,
    #A8752A 58%, #F3D583 76%, #8A6314 90%, #FFF3C8 100%) !important}
.gild::after,.pan::after{content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(255,255,255,0) 34%)}

/* 羊皮紙：紙の繊維を細かい斜線で表現 */
.pan > .in,.cardDetail .in,.reward .in,.chcard .body,.deedcard .body,#loading .tip{
  position:relative;overflow:hidden}
.pan > .in::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.055;
  background:
    repeating-linear-gradient(52deg,#4A3418 0 1px,transparent 1px 4px),
    repeating-linear-gradient(-38deg,#4A3418 0 1px,transparent 1px 6px);
  z-index:0}

/* 木目：暗い面に縦の木目を薄く通す */
.tabs,.wallet{position:relative;overflow:hidden}
.tabs::after,.wallet::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;
  background:repeating-linear-gradient(90deg,
    rgba(0,0,0,.55) 0 1px, rgba(255,255,255,.05) 1px 3px, transparent 3px 13px)}

/* ── ② ボタンに押した手応えを出す ───────────────────── */
.btn{position:relative;overflow:hidden;
  border-top:1px solid rgba(255,255,255,.55);
  border-bottom:1px solid rgba(0,0,0,.28);
  transition:transform .07s cubic-bezier(.3,1.4,.5,1), box-shadow .07s, filter .14s}
.btn::after{content:"";position:absolute;left:0;right:0;top:0;height:46%;pointer-events:none;
  border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0))}
.btn:hover{filter:brightness(1.09)}
.btn:active{transform:translateY(4px) scale(.985)}
/* 押した瞬間の波紋 */
.btn::before{content:"";position:absolute;left:50%;top:50%;width:0;height:0;border-radius:50%;
  background:rgba(255,255,255,.5);transform:translate(-50%,-50%);pointer-events:none}
.btn:active::before{animation:ripple .45s ease-out}
@keyframes ripple{from{width:0;height:0;opacity:.55}to{width:260%;height:260%;opacity:0}}

.modebtn,.tab,.minicard,.pend,.mapcard,.chcard,.slot,.mgstake,.mgarrow,.mgstop,.bcard{
  transition:transform .15s cubic-bezier(.3,1.3,.5,1), box-shadow .15s, filter .15s}
.modebtn:active,.minicard:active,.pend:active,.mapcard:active,.bcard:active{
  transform:translateY(2px) scale(.985)}

/* 押せる場所は必ず指カーソル＋キーボードでも光る */
.tab,.modebtn,.minicard,.pend,.mapcard,.chcard,.slot,.ocard{cursor:pointer}
button:focus-visible,.tab:focus-visible,.modebtn:focus-visible,.minicard:focus-visible{
  outline:3px solid #FFE9A8;outline-offset:2px}

/* ── ③ 画面の切り替えに「間」を作る ─────────────────── */
#wipe{position:absolute;inset:0;z-index:400;pointer-events:none;display:none}
#wipe.on{display:block}
#wipe i{position:absolute;top:-20%;bottom:-20%;width:26%;
  background:linear-gradient(180deg,#F5A623,#8A3E02);
  box-shadow:0 0 40px rgba(245,166,35,.6);transform:skewX(-14deg)}
#wipe i:nth-child(1){left:-30%}
#wipe i:nth-child(2){left:-30%;background:linear-gradient(180deg,#2A1C0A,#0C0703);opacity:.96}
#wipe.go i:nth-child(1){animation:wipeA .58s cubic-bezier(.7,0,.2,1) both}
#wipe.go i:nth-child(2){animation:wipeA .58s cubic-bezier(.7,0,.2,1) .07s both}
@keyframes wipeA{
  0%{left:-30%;width:26%}
  42%{left:0%;width:150%}
  58%{left:0%;width:150%}
  100%{left:130%;width:26%}}

/* 画面が出てくるときは、中身が少し遅れて浮き上がる */
.screen.on > .inner,.screen.on > .wrap{animation:screenIn .38s cubic-bezier(.2,.9,.3,1) both}
@keyframes screenIn{from{transform:translateY(14px)}to{transform:none}}
.screen.on .tabs{animation:tabsIn .3s cubic-bezier(.2,.9,.3,1) both}
@keyframes tabsIn{from{transform:translateY(-16px)}to{transform:none}}
.screen.on .wallet{animation:wallIn .3s cubic-bezier(.2,.9,.3,1) both}
@keyframes wallIn{from{transform:translateY(16px)}to{transform:none}}

/* カードは1枚ずつ順に現れる */
.cardgrid .minicard{animation:popIn .3s cubic-bezier(.2,1.5,.4,1) both}
.cardgrid .minicard:nth-child(n){animation-delay:calc(var(--i,0) * 22ms)}
.pendgrid .pend{animation:popIn .3s cubic-bezier(.2,1.5,.4,1) both}
#pick .grid .chcard{animation:popIn .42s cubic-bezier(.2,1.4,.4,1) both}
#pick .grid .chcard:nth-child(1){animation-delay:0ms}
#pick .grid .chcard:nth-child(2){animation-delay:70ms}
#pick .grid .chcard:nth-child(3){animation-delay:140ms}
#pick .grid .chcard:nth-child(4){animation-delay:210ms}
#pick .grid .chcard:nth-child(5){animation-delay:280ms}
@keyframes popIn{from{transform:scale(.86) translateY(10px)}to{transform:none}}

/* ── ④ 文字と枠をやわらかくする ─────────────────────── */
.metahd h2,#pick h2,.mghd{letter-spacing:.02em}
.pan > .in h3,.cardDetail h3{letter-spacing:.03em}
.strow .l{letter-spacing:.02em}
.modebtn .nm,.tab{letter-spacing:.03em}

/* 中の凹み（バー・入力欄・グリッド枠） */
.strow .bar,.wallet .xp,.hud .gauge,#loading .bar,.cardgrid{
  box-shadow:inset 0 2px 4px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.18)}
.strow .bar i,.wallet .xp i,#loading .bar i,.hud .gauge i{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}

/* 数字はぜんぶ等幅にして桁が踊らないようにする */
.hud .big,.hud .sub,#plate .bd,.strow .v,.wallet .cur b,.mgbig,.minicard .b .l{
  font-variant-numeric:tabular-nums}

/* スクロールバーもゲームの色に */
.cardgrid::-webkit-scrollbar{width:10px}
.cardgrid::-webkit-scrollbar-track{background:#241708;border-radius:6px}
.cardgrid::-webkit-scrollbar-thumb{background:linear-gradient(#C8952F,#7C5410);border-radius:6px;
  border:2px solid #241708}

/* ── ⑤ 盤面のフロートUIに厚みを ─────────────────────── */
#push{box-shadow:
  0 10px 0 #7d0f45,
  0 18px 30px rgba(0,0,0,.6),
  inset 0 -10px 22px rgba(0,0,0,.32),
  inset 0 10px 20px rgba(255,255,255,.34)}
#push:active{box-shadow:0 3px 0 #7d0f45,0 7px 14px rgba(0,0,0,.5),
  inset 0 -6px 16px rgba(0,0,0,.3),inset 0 6px 14px rgba(255,255,255,.3)}
.oddeven{box-shadow:0 6px 0 rgba(0,0,0,.42),inset 0 6px 12px rgba(255,255,255,.22),
  inset 0 -5px 10px rgba(0,0,0,.28)}
.oddeven:active{box-shadow:0 2px 0 rgba(0,0,0,.42)}

/* ── ⑥ 音量つまみ ───────────────────────────────────── */
#audiobar{position:absolute;left:1%;bottom:2.5%;z-index:86;display:flex;align-items:center;gap:8px;
  padding:7px 12px;border-radius:12px;
  background:linear-gradient(#3B2A18,#1B1207);border:2px solid #6B4E28;
  box-shadow:0 4px 0 rgba(0,0,0,.45)}
#audiobar button{width:34px;height:34px;border-radius:9px;border:2px solid #8A6A3C;cursor:pointer;
  background:linear-gradient(#5E4526,#31210D);font-size:16px;display:grid;place-items:center}
#audiobar button.off{opacity:.42}
#audiobar input[type=range]{width:76px;accent-color:#F5A623}

@media (prefers-reduced-motion:reduce){
  #wipe.go i{animation-duration:.01ms !important}
}
</style>
