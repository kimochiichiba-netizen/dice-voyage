<style>
/* マップの仕掛けのパネル（1u-maps.html / WP12b）。.dkg-* だけ。入場は transform だけ、常時アニメは STOP の光だけ（スマホは止める）。
   ルーレットの回転は 9k-maps.js が style.transform を書く（CSS アニメにしない） */
.dkg-cry,.dkg-rl{position:relative;border-radius:30px;padding:0 0 22px;color:#23324A;border:7px solid transparent;
  box-shadow:0 26px 70px rgba(0,0,0,.72),inset 0 2px 0 rgba(255,255,255,.7)}
.dkg-cry{width:860px;
  background:radial-gradient(90% 60% at 50% 0%,rgba(190,236,255,.55),transparent 70%) padding-box,
             linear-gradient(180deg,#F7FCFF,#E1EFF9 70%,#D3E7F5) padding-box,
             linear-gradient(155deg,#E6FAFF 0%,#8FD3F2 16%,#3F8EC4 36%,#1C4B7C 56%,#5FB2E0 76%,#DDF6FF 100%) border-box}
.dkg-rl{width:920px;
  background:radial-gradient(90% 60% at 50% 0%,rgba(255,226,170,.55),transparent 70%) padding-box,
             linear-gradient(180deg,#FFF9EC,#F7E8CB 70%,#F0DCB4) padding-box,
             linear-gradient(155deg,#FFF1C8 0%,#EBC26E 16%,#B8742C 36%,#6E3C14 56%,#D69A48 76%,#FFF0C8 100%) border-box}
.dkg-hd{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;height:76px;margin:0 0 18px;
  border-radius:22px 22px 0 0;
  background:linear-gradient(180deg,#7E90EC 0,#4556C0 52%,#2B368C 100%);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.42)}
.dkg-hd::after{content:"";position:absolute;left:6%;right:6%;top:6px;height:24px;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0));pointer-events:none}
.dkg-hd b{position:relative;z-index:1;font-family:var(--pop);font-weight:400;font-size:36px;color:#FFFFFF;letter-spacing:.06em;
  -webkit-text-stroke:6px #1B2266;paint-order:stroke fill}
.dkg-hd .dkg-hic{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#FFFFFF 0,#BFF1FF 26%,#4FB6EA 60%,#1F5E9E 100%);
  box-shadow:0 0 0 3px rgba(255,255,255,.7),0 4px 0 rgba(0,0,0,.25)}
.dkg-rl .dkg-hd{background:linear-gradient(180deg,#F5936A 0,#D2502E 52%,#8E2A16 100%)}
.dkg-rl .dkg-hd b{-webkit-text-stroke-color:#5A1606}
.dkg-rl .dkg-hd .dkg-hic{display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1;color:#C8452A;
  background:radial-gradient(circle at 36% 30%,#FFFFFF 0,#FFF3D8 40%,#F2C88A 100%)}

.dkg-opts{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:0 26px}
.dkg-opt{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 14px 18px;border-radius:22px;
  background:linear-gradient(180deg,#FFFFFF,#EAF5FC);border:3px solid #BFDDF0;box-shadow:0 5px 0 #9CC4DD,inset 0 1px 0 #fff}
.dkg-opt.dkg-no{filter:grayscale(.85);opacity:.78}
.dkg-art{position:relative;width:100%;height:172px;border-radius:16px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 100%,#CFEFFF,#6FB8E6 58%,#2C6AA8);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.dkg-art canvas{display:block;width:100%;height:100%}
.dkg-ot{font-size:32px;font-weight:900;line-height:1;color:#1E4E86;letter-spacing:.08em}
.dkg-opt p{flex:1;margin:0;min-height:58px;font-size:20px;font-weight:700;line-height:1.45;color:#4A6480;text-align:center}
.dkg-btn{position:relative;width:100%;height:68px;border-radius:18px;border:3px solid #A8531A;cursor:pointer;padding:0;
  font-family:var(--jp);font-size:28px;font-weight:900;color:#FFFFFF;letter-spacing:.06em;
  -webkit-text-stroke:5px rgba(120,48,6,.85);paint-order:stroke fill;
  background:linear-gradient(180deg,#FFE3A0 0,#FFB54A 30%,#F2851E 66%,#D2600E 100%);
  box-shadow:0 5px 0 #8E4212,inset 0 2px 0 rgba(255,255,255,.65);transition:transform .09s}
.dkg-btn.dkg-blue{border-color:#1E5A8E;-webkit-text-stroke-color:rgba(12,52,96,.85);
  background:linear-gradient(180deg,#DDF6FF 0,#7FD0F4 30%,#3E98D6 66%,#2466A8 100%);box-shadow:0 5px 0 #17466E,inset 0 2px 0 rgba(255,255,255,.7)}
.dkg-btn:active{transform:translateY(4px)}
.dkg-btn:disabled{cursor:default;transform:none;filter:grayscale(1) brightness(.86)}
.dkg-cancel{display:block;margin:20px auto 0;min-width:240px;height:60px;padding:0 30px;border-radius:16px;cursor:pointer;
  border:3px solid #56626F;font-family:var(--jp);font-size:24px;font-weight:900;color:#FFFFFF;
  background:linear-gradient(180deg,#B7C2CE,#7E8C9B 60%,#5F6C7A);box-shadow:0 4px 0 #3E4852,inset 0 2px 0 rgba(255,255,255,.5)}
.dkg-cancel:active{transform:translateY(3px)}

.dkg-rlb{display:grid;grid-template-columns:452px 1fr;gap:22px;align-items:center;padding:0 26px}
.dkg-wh{position:relative;width:440px;height:440px;margin:6px auto 0}
.dkg-ring{position:absolute;border-radius:50%}
.dkg-r0{inset:0;box-shadow:inset 0 0 0 7px #7A4A1E,inset 0 0 0 10px #F2C88A,0 7px 0 #5A3412,0 12px 26px rgba(0,0,0,.35)}
.dkg-r1{inset:86px;box-shadow:inset 0 0 0 6px #7A4A1E,0 0 0 4px rgba(255,240,200,.8),0 4px 10px rgba(0,0,0,.3)}
.dkg-ring i{position:absolute;left:50%;top:0;width:0;height:50%;transform-origin:0 100%;font-style:normal}
.dkg-ring i b{position:absolute;left:0;top:26px;transform:translateX(-50%);white-space:nowrap;font-size:22px;font-weight:900;line-height:1;
  color:#FFFFFF;-webkit-text-stroke:5px rgba(58,26,8,.78);paint-order:stroke fill}
.dkg-r1 i b{top:20px;font-size:20px;color:#5A3412;-webkit-text-stroke:3px rgba(255,250,236,.9)}
.dkg-hub{position:absolute;left:50%;top:50%;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 38% 30%,#FFFFFF 0,#FFF1D0 30%,#E8B462 72%,#9A5A1E 100%);
  box-shadow:0 0 0 6px #7A4A1E,0 0 0 9px #F2C88A,0 6px 14px rgba(0,0,0,.4)}
.dkg-hub b{font-size:58px;line-height:1;color:#C8452A;text-shadow:0 2px 0 #fff}
.dkg-ptr{position:absolute;left:50%;top:-20px;width:48px;height:58px;margin-left:-24px;z-index:2;
  background:linear-gradient(180deg,#FFF6D0,#F2B233 55%,#B8680E);clip-path:polygon(0 0,100% 0,50% 100%);
  filter:drop-shadow(0 4px 0 rgba(60,24,4,.45))}
.dkg-rlside{display:flex;flex-direction:column;gap:14px}
.dkg-step{display:grid;grid-template-columns:44px 88px 1fr;align-items:center;gap:6px;height:76px;padding:0 16px;border-radius:18px;
  background:#FFFDF6;border:3px solid #E8CFA0;box-shadow:0 4px 0 #D8B880}
.dkg-step.on{border-color:#E8753A;box-shadow:0 4px 0 #C8602A,0 0 0 4px rgba(232,117,58,.22)}
.dkg-step span{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:900;color:#FFFFFF;background:linear-gradient(180deg,#E8753A,#B8401C)}
.dkg-step b{font-size:24px;font-weight:900;color:#6B3A12}
.dkg-step em{font-style:normal;font-size:28px;font-weight:900;color:#C8452A;text-align:right;white-space:nowrap}
.dkg-step.dkg-set em{animation:dkgPop .34s cubic-bezier(.3,1.6,.5,1) both}
.dkg-rlnote{margin:0;min-height:58px;font-size:20px;font-weight:700;color:#7A5A3A;line-height:1.45}
.dkg-stop{height:96px;font-family:var(--caps);font-size:44px;font-weight:400;letter-spacing:.08em;
  -webkit-text-stroke:6px rgba(120,32,6,.85);
  background:linear-gradient(180deg,#FFD0A8 0,#FF8A4A 32%,#E2461E 68%,#B02A0E 100%);border-color:#7E1E06;box-shadow:0 6px 0 #6A1A06,inset 0 2px 0 rgba(255,255,255,.6)}
.dkg-stop::after{content:"";position:absolute;inset:-6px;border-radius:22px;border:3px solid rgba(255,190,110,.9);pointer-events:none;
  animation:dkgRing 1.1s ease-out infinite}
.dkg-stop:disabled::after{display:none}

.dkg-spec{position:absolute;left:50%;top:50%;z-index:330;width:380px;height:420px;margin:-236px 0 0 -190px;border-radius:28px;pointer-events:none;
  border:6px solid transparent;
  background:linear-gradient(180deg,#FFF9EC,#F4E2BE) padding-box,linear-gradient(155deg,#FFF1C8,#B8742C 40%,#6E3C14 62%,#E8B860) border-box;
  box-shadow:0 20px 56px rgba(0,0,0,.62);animation:dkgIn .24s cubic-bezier(.3,1.5,.5,1) both}
.dkg-spec.dkg-out{animation:dkgOut .22s ease-in both}
.dkg-spec .dkg-spwho{height:48px;margin:0 0 6px;border-radius:22px 22px 0 0;display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:900;color:#FFFFFF;background:linear-gradient(180deg,#F5936A,#C8452A 60%,#8E2A16);
  -webkit-text-stroke:4px rgba(90,22,6,.8);paint-order:stroke fill;box-shadow:inset 0 -4px 0 var(--dkg-pc,#3E8FE0)}
.dkg-spec .dkg-wh{margin:0 auto;transform:scale(.7);transform-origin:50% 0}
.dkg-spec .dkg-spres{position:absolute;left:12px;right:12px;bottom:14px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:900;color:#8E2A16;background:#FFFDF6;border:3px solid #E8CFA0}

@keyframes dkgIn{from{transform:scale(.86)}to{transform:none}}
@keyframes dkgOut{to{transform:scale(.9);opacity:0}}
@keyframes dkgPop{from{transform:scale(1.5)}to{transform:none}}
@keyframes dkgRing{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.08,1.22);opacity:0}}

@media (max-height:560px){
  .dkg-hd b{font-size:40px}
  .dkg-ot{font-size:36px}
  .dkg-opt p{font-size:23px;line-height:1.35}
  .dkg-art{height:150px}
  .dkg-btn{height:82px;font-size:32px}
  .dkg-cancel{height:76px;font-size:28px}
  .dkg-ring i b{font-size:25px}
  .dkg-r1 i b{font-size:22px}
  .dkg-step{height:84px}
  .dkg-step b{font-size:28px}
  .dkg-step em{font-size:32px}
  .dkg-rlnote{font-size:23px}
  .dkg-stop{height:104px;font-size:48px}
  .dkg-spec .dkg-spwho,.dkg-spec .dkg-spres{font-size:26px}
}
html.fx-mob .dkg-stop::after{animation:none;display:none}
html.fx-mob .dkg-spec,html.fx-mob .dkg-step.dkg-set em{animation:none}
html.fx-lite .dkg-stop::after{animation:none;display:none}
</style>
